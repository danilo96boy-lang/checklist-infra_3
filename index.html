<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFRA CORE | Gestão Integrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .dark { background-color: #020617; color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @media print { .no-print { display: none !important; } #receipt-area { display: block !important; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const Icons = {
            Dashboard: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            Checklist: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Stock: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Settings: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        };

        // --- COMPONENTES UI ---
        const Card = ({ children, title, icon }) => (
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm">
                {(title || icon) && (
                    <div className="flex items-center gap-2 mb-4 border-b border-slate-100 dark:border-slate-800 pb-2">
                        <span className="text-blue-500">{icon}</span>
                        <h3 className="font-bold text-sm uppercase tracking-wider text-slate-600 dark:text-slate-400">{title}</h3>
                    </div>
                )}
                {children}
            </div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [darkMode, setDarkMode] = useState(true);
            const [user, setUser] = useState({ name: "Inácio", role: "Coordenador Infra" });

            // Simulação de dados do Estoque (Original StockPro)
            const [estoque, setEstoque] = useState(() => {
                const saved = localStorage.getItem('stockpro_estoque');
                return saved ? JSON.parse(saved) : [
                    { codigo: 'MN001', nome: 'Monitor Dell 24"', qtd: 5, min: 2, cat: 'Monitor' },
                    { codigo: 'TC002', nome: 'Teclado Logitech', qtd: 12, min: 5, cat: 'Periférico' }
                ];
            });

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50 dark:bg-slate-950">
                    {/* SIDEBAR */}
                    <aside className="w-64 bg-slate-900 text-slate-400 flex flex-col border-r border-slate-800 no-print">
                        <div className="p-6 text-white font-bold text-xl flex items-center gap-3">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-xs">IC</div>
                            INFRA CORE
                        </div>
                        
                        <nav className="flex-1 px-4 space-y-2 mt-4">
                            {[
                                { id: 'dashboard', label: 'Dashboard', icon: Icons.Dashboard },
                                { id: 'checklist', label: 'Manutenções', icon: Icons.Checklist },
                                { id: 'stock', label: 'Estoque T.I', icon: Icons.Stock },
                                { id: 'settings', label: 'Configurações', icon: Icons.Settings },
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all ${activeTab === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/40' : 'hover:bg-slate-800'}`}
                                >
                                    {item.icon} <span className="text-sm font-medium">{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 border-t border-slate-800">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold">{user.name[0]}</div>
                                <div>
                                    <p className="text-sm text-white font-bold">{user.name}</p>
                                    <p className="text-[10px] uppercase tracking-tighter">{user.role}</p>
                                </div>
                            </div>
                            <button onClick={() => setDarkMode(!darkMode)} className="w-full py-2 bg-slate-800 rounded-lg text-xs hover:bg-slate-700 transition-colors">
                                {darkMode ? '☀️ MODO CLARO' : '🌙 MODO ESCURO'}
                            </button>
                        </div>
                    </aside>

                    {/* CONTEÚDO PRINCIPAL */}
                    <main className="flex-1 overflow-y-auto custom-scroll p-8">
                        
                        {/* VIEW: DASHBOARD UNIFICADO */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-in fade-in">
                                <header>
                                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white">Olá, {user.name}</h2>
                                    <p className="text-slate-500 text-sm">Resumo operacional de hoje.</p>
                                </header>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <Card title="Alertas Estoque" icon={Icons.Stock}>
                                        <div className="text-3xl font-bold text-red-500">
                                            {estoque.filter(i => i.qtd <= i.min).length}
                                        </div>
                                        <p className="text-[10px] text-slate-400">ITENS ABAIXO DO MÍNIMO</p>
                                    </Card>
                                    <Card title="Manutenções" icon={Icons.Checklist}>
                                        <div className="text-3xl font-bold text-blue-500">08</div>
                                        <p className="text-[10px] text-slate-400">REALIZADAS ESTE MÊS</p>
                                    </Card>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <Card title="Últimas Atividades">
                                        <div className="space-y-3">
                                            <div className="flex items-center justify-between text-sm border-l-2 border-green-500 pl-3">
                                                <span>Entrada: Teclado Logitech</span>
                                                <span className="text-[10px] text-slate-500">10:45</span>
                                            </div>
                                            <div className="flex items-center justify-between text-sm border-l-2 border-blue-500 pl-3">
                                                <span>Checklist: F-1002 (Inácio)</span>
                                                <span className="text-[10px] text-slate-500">09:15</span>
                                            </div>
                                        </div>
                                    </Card>
                                </div>
                            </div>
                        )}

                        {/* VIEW: ESTOQUE (INTEGRADO DO STOCKPRO) */}
                        {activeTab === 'stock' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold dark:text-white">Controle de Inventário</h2>
                                    <button className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">+ NOVO ITEM</button>
                                </div>

                                <Card>
                                    <table className="w-full text-left text-sm">
                                        <thead>
                                            <tr className="text-slate-400 uppercase text-[10px] border-b border-slate-100 dark:border-slate-800">
                                                <th className="py-3">Código</th>
                                                <th>Item</th>
                                                <th>Qtd</th>
                                                <th>Status</th>
                                                <th className="text-right">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50 dark:divide-slate-800">
                                            {estoque.map(item => (
                                                <tr key={item.codigo} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                                                    <td className="py-4 font-mono font-bold text-blue-500">{item.codigo}</td>
                                                    <td className="dark:text-slate-300">{item.nome}</td>
                                                    <td className="font-bold">{item.qtd}</td>
                                                    <td>
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${item.qtd <= item.min ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                                            {item.qtd <= item.min ? 'REPOR' : 'OK'}
                                                        </span>
                                                    </td>
                                                    <td className="text-right">
                                                        <button className="text-blue-500 hover:underline">Movimentar</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </Card>
                            </div>
                        )}

                        {/* VIEW: CHECKLIST (INTEGRADO DO INFRA CHECK) */}
                        {activeTab === 'checklist' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold dark:text-white">Manutenções & Preventivas</h2>
                                    <div className="flex gap-2">
                                        <button className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">NOVA FORMATAÇÃO</button>
                                        <button className="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-bold">MANUT. ZEBRA</button>
                                    </div>
                                </div>
                                <Card title="Fila de Atendimento">
                                    <div className="text-center py-10 text-slate-500 italic">
                                        Nenhum chamado ativo. Inicie uma nova manutenção acima.
                                    </div>
                                </Card>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCKPRO & INFRA CHECKLIST | Enterprise</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-print-color-adjust: exact; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        @media print {
            .no-print { display: none !important; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect, useRef } = React;

        const EMAIL_DESTINO = "infra@cobrecom.com.br";

        // --- ICONS ---
        const Icons = {
            Layout: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            Stock: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Check: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Cart: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            Trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        };

        // --- TEMPLATES ---
        const getChecklistTemplate = (type, user) => ({
            meta: { tecnico: user, data: new Date().toISOString().split('T')[0], maquina: '', ativo: '' },
            items: type === 'formatacao' ? {
                prev: { title: "Preventivas", icon: "Stock", tasks: [{id: 'f1', label: 'Limpeza Interna', checked: false}, {id: 'f2', label: 'Pasta Térmica', checked: false}] },
                sis: { title: "Sistema", icon: "Stock", tasks: [{id: 'f3', label: 'Drivers', checked: false}, {id: 'f4', label: 'Domínio', checked: false}] }
            } : {
                insp: { title: "Inspeção", icon: "Check", tasks: [{id: 'z1', label: 'Cabeça Impressão', checked: false}, {id: 'z2', label: 'Rolete', checked: false}] }
            }
        });

        // --- COMPONENTES ---
        const Card = ({ children, className = "" }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-sm ${className}`}>{children}</div>;
        const Button = ({ children, onClick, variant = "primary", disabled }) => {
            const styles = variant === "primary" ? "bg-brand-600 text-white hover:bg-brand-700" : "bg-slate-200 text-slate-700 hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-200";
            return <button onClick={onClick} disabled={disabled} className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 disabled:opacity-50 ${styles}`}>{children}</button>;
        };

        // --- APP PRINCIPAL ---
        const App = () => {
            const [view, setView] = useState('login'); // login, stock, checklist, compras, dashboard
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTickets, setActiveTickets] = useState([]);
            const [estoque, setEstoque] = useState([]);
            const [currentTicket, setCurrentTicket] = useState(null);

            useEffect(() => {
                const unsub = db.collection('tickets').onSnapshot(s => setActiveTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubStock = db.collection('estoque').onSnapshot(s => setEstoque(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsub(); unsubStock(); };
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const id = e.target.id.value;
                if(id === "01001071") { setCurrentUser("Inacio"); setView('dashboard'); }
                else alert("ID inválido");
            };

            const createTicket = async (type) => {
                const doc = await db.collection('tickets').add({
                    visualId: `${type === 'formatacao' ? 'F' : 'Z'}-${Math.floor(1000 + Math.random() * 9000)}`,
                    type,
                    data: getChecklistTemplate(type, currentUser),
                    createdAt: new Date().toISOString()
                });
                setCurrentTicket({id: doc.id, type, data: getChecklistTemplate(type, currentUser)});
                setView('active-check');
            };

            const toggleTask = (section, taskId) => {
                const newData = {...currentTicket.data};
                newData.items[section].tasks = newData.items[section].tasks.map(t => t.id === taskId ? {...t, checked: !t.checked} : t);
                setCurrentTicket({...currentTicket, data: newData});
                db.collection('tickets').doc(currentTicket.id).update({ data: newData });
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900">
                    <Card className="w-80 text-center">
                        <h1 className="text-xl font-bold mb-6">STOCKPRO LOGIN</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input name="id" placeholder="ID Matrícula" className="w-full p-2 border rounded dark:bg-slate-800" required />
                            <Button className="w-full">Entrar</Button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className="w-64 bg-slate-900 text-slate-400 p-4 space-y-2 no-print">
                        <div className="text-white font-bold text-xl mb-8 px-2">STOCKPRO</div>
                        {[
                            {id: 'dashboard', label: 'Dashboard', icon: Icons.Layout},
                            {id: 'stock', label: 'Estoque', icon: Icons.Stock},
                            {id: 'checklist', label: 'Checklist', icon: Icons.Check},
                            {id: 'compras', label: 'Compras', icon: Icons.Cart}
                        ].map(item => (
                            <button key={item.id} onClick={() => setView(item.id)} className={`w-full flex items-center gap-3 p-3 rounded-lg transition-all ${view === item.id ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-slate-800'}`}>
                                {item.icon} {item.label}
                            </button>
                        ))}
                    </aside>

                    {/* CONTEÚDO */}
                    <main className="flex-1 overflow-auto bg-slate-50 dark:bg-slate-950 p-8">
                        
                        {/* VIEW: ESTOQUE (Como na imagem) */}
                        {view === 'stock' && (
                            <div className="fade-in">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold">Inventário</h2>
                                    <Button onClick={() => alert('Abrir modal cadastro')}>+ Novo Item</Button>
                                </div>
                                <Card noPadding>
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase font-bold text-slate-500">
                                            <tr>
                                                <th className="p-4">Código</th>
                                                <th className="p-4">Item</th>
                                                <th className="p-4">Qtd</th>
                                                <th className="p-4">Status</th>
                                                <th className="p-4">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y dark:divide-slate-800">
                                            {estoque.map(i => (
                                                <tr key={i.id}>
                                                    <td className="p-4 font-mono text-sm">{i.cod}</td>
                                                    <td className="p-4 font-medium">{i.nome}</td>
                                                    <td className="p-4">{i.qtd}</td>
                                                    <td className="p-4"><span className={`px-2 py-1 rounded text-xs ${i.qtd < 5 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                        {i.qtd < 5 ? 'Crítico' : 'OK'}
                                                    </span></td>
                                                    <td className="p-4"><button className="text-slate-400 hover:text-red-500">{Icons.Trash}</button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </Card>
                            </div>
                        )}

                        {/* VIEW: CHECKLIST (Interface de Tickets) */}
                        {view === 'checklist' && (
                            <div className="fade-in space-y-6">
                                <div className="flex gap-4">
                                    <button onClick={() => createTicket('formatacao')} className="flex-1 p-6 bg-brand-600 text-white rounded-xl shadow-lg hover:scale-[1.02] transition-all text-left">
                                        <div className="mb-4">{Icons.Stock}</div>
                                        <h3 className="font-bold">Nova Formatação</h3>
                                        <p className="text-xs opacity-80">Checklist completo para PCs/Notebooks</p>
                                    </button>
                                    <button onClick={() => createTicket('zebra')} className="flex-1 p-6 bg-white dark:bg-slate-900 border rounded-xl shadow-sm hover:scale-[1.02] transition-all text-left">
                                        <div className="mb-4 text-brand-600">{Icons.Check}</div>
                                        <h3 className="font-bold">Manutenção Zebra</h3>
                                        <p className="text-xs text-slate-500">Limpeza e calibração de impressoras</p>
                                    </button>
                                </div>
                                
                                <h3 className="font-bold text-lg mt-8">Chamados em Aberto</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeTickets.map(t => (
                                        <Card key={t.id} className="relative group cursor-pointer hover:border-brand-500" onClick={() => {setCurrentTicket(t); setView('active-check');}}>
                                            <div className="flex justify-between items-start mb-2">
                                                <span className="text-xs font-bold text-brand-600">#{t.visualId}</span>
                                                <button onClick={(e) => {e.stopPropagation(); db.collection('tickets').doc(t.id).delete();}} className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500">{Icons.Trash}</button>
                                            </div>
                                            <h4 className="font-bold truncate">{t.data.meta.maquina || "Ativo Pendente"}</h4>
                                            <p className="text-xs text-slate-500 mt-1">{new Date(t.createdAt).toLocaleDateString()}</p>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VIEW: ACTIVE CHECKLIST (Executando o checklist) */}
                        {view === 'active-check' && currentTicket && (
                            <div className="fade-in max-w-4xl mx-auto space-y-6 pb-20">
                                <Button variant="secondary" onClick={() => setView('checklist')}>← Voltar</Button>
                                <Card>
                                    <h2 className="text-xl font-bold mb-4">Executando Checklist {currentTicket.visualId}</h2>
                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <input placeholder="Nome da Máquina" value={currentTicket.data.meta.maquina} onChange={(e) => {
                                            const d = {...currentTicket.data}; d.meta.maquina = e.target.value;
                                            setCurrentTicket({...currentTicket, data: d});
                                            db.collection('tickets').doc(currentTicket.id).update({data: d});
                                        }} className="p-2 border rounded dark:bg-slate-800" />
                                        <input placeholder="Patrimônio/Ativo" className="p-2 border rounded dark:bg-slate-800" />
                                    </div>

                                    {Object.entries(currentTicket.data.items).map(([key, section]) => (
                                        <div key={key} className="mb-6">
                                            <h4 className="text-xs font-bold uppercase text-slate-500 mb-2">{section.title}</h4>
                                            <div className="space-y-2">
                                                {section.tasks.map(task => (
                                                    <label key={task.id} className="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                                                        <input type="checkbox" checked={task.checked} onChange={() => toggleTask(key, task.id)} className="w-5 h-5 rounded text-brand-600" />
                                                        <span className={task.checked ? 'line-through text-slate-400' : ''}>{task.label}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <Button className="w-full mt-8" onClick={() => window.print()}>Gerar Relatório / Imprimir</Button>
                                </Card>
                            </div>
                        )}
                        
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCKPRO & INFRA CHECKLIST | Enterprise Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-print-color-adjust: exact; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        @media print {
            .no-print { display: none !important; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect } = React;

        // --- ICONS ---
        const Icons = {
            Dashboard: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            Stock: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Checklist: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Plus: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        };

        // --- TEMPLATE CHECKLIST COMPLETO ---
        const getCheckTemplate = (type, user) => ({
            meta: { tecnico: user, data: new Date().toISOString().split('T')[0], maquina: '', ativo: '' },
            items: type === 'formatacao' ? {
                preventivas: { title: "Preventivas", icon: "Server", tasks: [
                    { id: 'f1', label: 'Limpeza interna', checked: false }, { id: 'f2', label: 'Pasta térmica', checked: false }, { id: 'f3', label: 'Limpeza memórias', checked: false }
                ]},
                backup: { title: "Backup & Preparação", icon: "Server", tasks: [
                    { id: 'b1', label: 'Backup Perfil Usuário', checked: false }, { id: 'b2', label: 'Backup Outlook (PST)', checked: false }, { id: 'b3', label: 'Favoritos/Senhas Navegador', checked: false }
                ]},
                sistema: { title: "Sistema & Rede", icon: "Server", tasks: [
                    { id: 's1', label: 'Domínio', checked: false }, { id: 's2', label: 'Proxy/DNS', checked: false }, { id: 's3', label: 'IP Fixo (MAC)', checked: false }, { id: 's4', label: 'WINS/Hosts', checked: false }, { id: 's5', label: 'Drivers Oficiais', checked: false }
                ]},
                seguranca: { title: "Segurança", icon: "Server", tasks: [
                    { id: 'sec1', label: 'Wazuh Agent', checked: false }, { id: 'sec2', label: 'ESET Antivirus', checked: false }, { id: 'sec3', label: 'VNC + Firewall', checked: false }
                ]},
                softwares: { title: "Aplicações", icon: "Server", tasks: [
                    { id: 'sw1', label: 'Ativar Office 365', checked: false }, { id: 'sw2', label: 'TOTVS Protheus/MES', checked: false }, { id: 'sw3', label: 'Spark', checked: false }
                ]}
            } : {
                manutencao: { title: "Manutenção Zebra", icon: "Stock", tasks: [
                    { id: 'z1', label: 'Limpeza Cabeça', checked: false }, { id: 'z2', label: 'Limpeza Rolete', checked: false }, { id: 'z3', label: 'Calibração Sensor', checked: false }
                ]}
            }
        });

        // --- COMPONENTES ---
        const Card = ({ children, className = "" }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 shadow-sm ${className}`}>{children}</div>;
        
        const App = () => {
            const [view, setView] = useState('login'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [stock, setStock] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [activeTicket, setActiveTicket] = useState(null);

            useEffect(() => {
                const unsubStock = db.collection('estoque').onSnapshot(s => setStock(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubCheck = db.collection('tickets').onSnapshot(s => setTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubStock(); unsubCheck(); };
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if(e.target.id.value === "01001071") { setCurrentUser("Inacio"); setView('stock'); }
                else alert("Acesso negado");
            };

            const createTicket = async (type) => {
                const visualId = `${type[0].toUpperCase()}-${Math.floor(1000 + Math.random() * 9000)}`;
                const doc = await db.collection('tickets').add({ visualId, type, data: getCheckTemplate(type, currentUser), createdAt: new Date().toISOString() });
                setActiveTicket({id: doc.id, visualId, type, data: getCheckTemplate(type, currentUser)});
                setView('check-exec');
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900">
                    <Card className="w-80 text-center space-y-6">
                        <h1 className="text-2xl font-bold text-brand-600">INFRA STOCK</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input name="id" placeholder="Matrícula" className="w-full p-3 rounded-lg border dark:bg-slate-800" required />
                            <button className="w-full bg-brand-600 text-white p-3 rounded-lg font-bold">Entrar</button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className="w-64 bg-slate-900 text-slate-400 p-4 space-y-2 no-print shrink-0">
                        <div className="text-white font-bold text-xl mb-10 px-2 tracking-tighter italic">STOCKPRO V2</div>
                        {[
                            {id: 'stock', label: 'Estoque', icon: Icons.Stock},
                            {id: 'checklist-home', label: 'Checklists', icon: Icons.Checklist}
                        ].map(m => (
                            <button key={m.id} onClick={() => setView(m.id)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all ${view === m.id ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/40' : 'hover:bg-slate-800'}`}>
                                {m.icon} {m.label}
                            </button>
                        ))}
                    </aside>

                    <main className="flex-1 overflow-auto bg-slate-50 dark:bg-slate-950 p-6 md:p-10">
                        
                        {/* TELA DE ESTOQUE (Baseada na sua imagem) */}
                        {view === 'stock' && (
                            <div className="fade-in max-w-6xl mx-auto">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-3xl font-bold">Inventário</h2>
                                    <button onClick={() => {
                                        const nome = prompt("Nome do item:");
                                        const cod = prompt("Código:");
                                        if(nome && cod) db.collection('estoque').add({nome, cod, qtd: 0});
                                    }} className="bg-brand-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-bold text-sm">
                                        {Icons.Plus} Novo Item
                                    </button>
                                </div>
                                <Card noPadding className="overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase font-bold text-slate-500 tracking-widest border-b dark:border-slate-700">
                                            <tr>
                                                <th className="p-4">CÓDIGO</th>
                                                <th className="p-4">ITEM</th>
                                                <th className="p-4">QTD</th>
                                                <th className="p-4">STATUS</th>
                                                <th className="p-4 text-right">AÇÃO</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y dark:divide-slate-800">
                                            {stock.map(i => (
                                                <tr key={i.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                                    <td className="p-4 font-mono text-xs">{i.cod}</td>
                                                    <td className="p-4 font-medium">{i.nome}</td>
                                                    <td className="p-4 font-bold">{i.qtd}</td>
                                                    <td className="p-4">
                                                        <span className={`px-2 py-1 rounded text-[10px] font-black uppercase ${i.qtd < 5 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                                            {i.qtd < 5 ? 'Crítico' : 'OK'}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        <button onClick={() => {
                                                            const n = prompt("Nova Qtd:", i.qtd);
                                                            if(n !== null) db.collection('estoque').doc(i.id).update({qtd: parseInt(n)});
                                                        }} className="text-brand-500 mr-4 font-bold text-xs">Editar</button>
                                                        <button onClick={() => confirm("Remover?") && db.collection('estoque').doc(i.id).delete()} className="text-slate-400 hover:text-red-500">{Icons.Trash}</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </Card>
                            </div>
                        )}

                        {/* TELA INICIAL CHECKLIST */}
                        {view === 'checklist-home' && (
                            <div className="fade-in max-w-5xl mx-auto space-y-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <button onClick={() => createTicket('formatacao')} className="p-8 bg-brand-600 text-white rounded-2xl shadow-xl hover:scale-[1.02] transition-all text-left">
                                        <h3 className="text-xl font-bold mb-1">💻 Nova Formatação</h3>
                                        <p className="text-xs opacity-70">Checklist completo de infraestrutura</p>
                                    </button>
                                    <button onClick={() => createTicket('zebra')} className="p-8 bg-slate-800 text-white rounded-2xl shadow-xl hover:scale-[1.02] transition-all text-left">
                                        <h3 className="text-xl font-bold mb-1">🖨️ Manutenção Zebra</h3>
                                        <p className="text-xs opacity-70">Limpeza e calibração de sensores</p>
                                    </button>
                                </div>

                                <h3 className="font-bold text-slate-500 uppercase text-xs tracking-widest">Chamados Ativos</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {tickets.map(t => (
                                        <Card key={t.id} onClick={() => {setActiveTicket(t); setView('check-exec');}} className="cursor-pointer hover:border-brand-500 transition-all relative group">
                                            <div className="flex justify-between mb-4"><span className="bg-brand-50 text-brand-700 px-2 py-1 rounded text-[10px] font-bold tracking-tighter">#{t.visualId}</span></div>
                                            <h4 className="font-bold truncate">{t.data.meta.maquina || "Ativo Pendente"}</h4>
                                            <p className="text-[10px] text-slate-400 mt-2 uppercase">{new Date(t.createdAt).toLocaleDateString()}</p>
                                            <button onClick={(e) => {e.stopPropagation(); db.collection('tickets').doc(t.id).delete();}} className="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100">{Icons.Trash}</button>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* EXECUÇÃO CHECKLIST */}
                        {view === 'check-exec' && activeTicket && (
                            <div className="fade-in max-w-4xl mx-auto space-y-6 pb-20">
                                <button onClick={() => setView('checklist-home')} className="font-bold text-brand-600 flex items-center gap-2">← VOLTAR</button>
                                <Card className="space-y-8">
                                    <div className="grid grid-cols-2 gap-6 border-b pb-6 dark:border-slate-800">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Máquina</label>
                                            <input value={activeTicket.data.meta.maquina} onChange={(e) => {
                                                const d = {...activeTicket.data}; d.meta.maquina = e.target.value;
                                                db.collection('tickets').doc(activeTicket.id).update({data: d});
                                                setActiveTicket({...activeTicket, data: d});
                                            }} className="w-full bg-transparent border-b p-1 outline-none focus:border-brand-500 font-bold" placeholder="NB-TI-01" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-400 uppercase">Patrimônio</label>
                                            <input value={activeTicket.data.meta.ativo} onChange={(e) => {
                                                const d = {...activeTicket.data}; d.meta.ativo = e.target.value;
                                                db.collection('tickets').doc(activeTicket.id).update({data: d});
                                                setActiveTicket({...activeTicket, data: d});
                                            }} className="w-full bg-transparent border-b p-1 outline-none focus:border-brand-500 font-bold" placeholder="005432" />
                                        </div>
                                    </div>

                                    {Object.entries(activeTicket.data.items).map(([key, sec]) => (
                                        <div key={key}>
                                            <div className="flex justify-between items-center mb-4">
                                                <h4 className="text-xs font-bold text-brand-600 uppercase tracking-widest">{sec.title}</h4>
                                                <button onClick={() => {
                                                    const d = {...activeTicket.data};
                                                    const allChecked = d.items[key].tasks.every(t => t.checked);
                                                    d.items[key].tasks = d.items[key].tasks.map(t => ({...t, checked: !allChecked}));
                                                    db.collection('tickets').doc(activeTicket.id).update({data: d});
                                                    setActiveTicket({...activeTicket, data: d});
                                                }} className="text-[9px] bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded font-bold">MARCAR TUDO</button>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {sec.tasks.map(t => (
                                                    <label key={t.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 cursor-pointer transition-colors">
                                                        <input type="checkbox" checked={t.checked} onChange={() => {
                                                            const d = {...activeTicket.data};
                                                            d.items[key].tasks = d.items[key].tasks.map(x => x.id === t.id ? {...x, checked: !x.checked} : x);
                                                            db.collection('tickets').doc(activeTicket.id).update({data: d});
                                                            setActiveTicket({...activeTicket, data: d});
                                                        }} className="w-5 h-5 rounded text-brand-600" />
                                                        <span className={`text-sm ${t.checked ? 'text-slate-400 line-through' : 'font-medium'}`}>{t.label}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => window.print()} className="w-full bg-brand-600 text-white p-4 rounded-xl font-bold shadow-lg">FINALIZAR E IMPRIMIR</button>
                                </Card>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

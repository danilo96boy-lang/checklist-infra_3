<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INFRA SYS | Enterprise Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-print-color-adjust: exact; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        @media print {
            .no-print { display: none !important; }
            #receipt-area { visibility: visible !important; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased font-sans transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect, useRef } = React;
        const EMAIL_DESTINO = "infra@cobrecom.com.br";

        const Icons = {
            Layout: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            History: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/></svg>,
            Package: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Plus: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Alert: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            TrendingUp: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            Logout: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        };

        const Card = ({ children, className = "" }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 shadow-sm ${className}`}>{children}</div>;
        const Input = (props) => <input {...props} className={`w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm transition-all focus:ring-2 focus:ring-brand-500/20 outline-none ${props.className}`} />;
        const Button = ({ children, variant = 'primary', ...props }) => {
            const styles = {
                primary: 'bg-brand-600 text-white hover:bg-brand-700',
                secondary: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200 hover:bg-slate-200',
                danger: 'bg-red-50 text-red-600 hover:bg-red-100 border border-red-200'
            };
            return <button {...props} className={`px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 ${styles[variant]} ${props.className}`}>{children}</button>;
        };

        // --- COMPONENTE DE ESTOQUE COMPLETO ---
        const InventoryModule = ({ currentUser }) => {
            const [products, setProducts] = useState([]);
            const [showAdd, setShowAdd] = useState(false);
            const [newP, setNewP] = useState({ name: '', min: 0, initial: 0 });
            const [move, setMove] = useState({ prodId: '', type: 'SAIDA', qty: 1, user: '', badge: '' });

            useEffect(() => {
                const unsub = db.collection('inventory_official').onSnapshot(s => {
                    setProducts(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, []);

            const addProduct = async (e) => {
                e.preventDefault();
                await db.collection('inventory_official').add({
                    name: newP.name,
                    minQuantity: Number(newP.min),
                    currentQuantity: Number(newP.initial)
                });
                setShowAdd(false); setNewP({ name: '', min: 0, initial: 0 });
            };

            const deleteProduct = async (id) => {
                if(confirm("Deseja remover este item permanentemente?")) await db.collection('inventory_official').doc(id).delete();
            };

            const handleMove = async (e) => {
                e.preventDefault();
                const p = products.find(x => x.id === move.prodId);
                const newQty = move.type === 'ENTRADA' ? p.currentQuantity + Number(move.qty) : p.currentQuantity - Number(move.qty);
                if (newQty < 0) return alert("Estoque insuficiente!");

                await db.collection('inventory_official').doc(p.id).update({ currentQuantity: newQty });
                
                if (move.type === 'SAIDA') {
                    const subject = `[ESTOQUE] Saída: ${p.name}`;
                    const body = `REQUISIÇÃO DE TI\n----------------\nITEM: ${p.name}\nQUANTIDADE: ${move.qty}\n----------------\nDESTINO: ${move.user}\nCRACHÁ: ${move.badge}\nTÉCNICO: ${currentUser.name}`;
                    window.location.href = `mailto:${EMAIL_DESTINO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                }
                setMove({ prodId: '', type: 'SAIDA', qty: 1, user: '', badge: '' });
                alert("Lançamento efetuado!");
            };

            // Dashboard Metrics
            const totalItems = products.length;
            const belowMin = products.filter(p => p.currentQuantity <= p.minQuantity).length;

            return (
                <div className="p-6 md:p-10 space-y-8 fade-in">
                    <header className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold">Gestão de Estoque</h2>
                        <Button onClick={() => setShowAdd(true)}>{Icons.Plus} Novo Produto</Button>
                    </header>

                    {/* DASHBOARDS DE ESTOQUE */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <Card className="flex justify-between items-center border-l-4 border-brand-500">
                            <div><p className="text-xs font-bold text-slate-500 uppercase">Itens Cadastrados</p><h3 className="text-3xl font-bold">{totalItems}</h3></div>
                            <div className="text-brand-500">{Icons.Package}</div>
                        </Card>
                        <Card className="flex justify-between items-center border-l-4 border-red-500">
                            <div><p className="text-xs font-bold text-slate-500 uppercase">Abaixo do Mínimo</p><h3 className="text-3xl font-bold">{belowMin}</h3></div>
                            <div className="text-red-500">{Icons.Alert}</div>
                        </Card>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                        {/* TABELA DE SALDOS */}
                        <Card className="md:col-span-2 overflow-auto" noPadding>
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 dark:bg-slate-800 border-b">
                                    <tr>
                                        <th className="p-4">Produto</th>
                                        <th className="p-4 text-center">Mín.</th>
                                        <th className="p-4 text-right">Saldo</th>
                                        <th className="p-4 text-center">Ações</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y dark:divide-slate-800">
                                    {products.map(p => (
                                        <tr key={p.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                            <td className="p-4 font-medium">{p.name}</td>
                                            <td className="p-4 text-center text-slate-400">{p.minQuantity}</td>
                                            <td className={`p-4 text-right font-bold ${p.currentQuantity <= p.minQuantity ? 'text-red-500' : 'text-emerald-500'}`}>{p.currentQuantity}</td>
                                            <td className="p-4 text-center">
                                                <button onClick={() => deleteProduct(p.id)} className="text-slate-400 hover:text-red-500">{Icons.Trash}</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </Card>

                        {/* FORMULÁRIO DE LANÇAMENTO */}
                        <Card>
                            <h3 className="font-bold mb-4 uppercase text-xs text-slate-400">Novo Lançamento</h3>
                            <form onSubmit={handleMove} className="space-y-4">
                                <select className="w-full h-10 border rounded-lg bg-white dark:bg-slate-950 px-2" value={move.prodId} onChange={e=>setMove({...move, prodId: e.target.value})} required>
                                    <option value="">Selecionar Item...</option>
                                    {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                                <div className="grid grid-cols-2 gap-2">
                                    <select className="h-10 border rounded-lg bg-white dark:bg-slate-950" value={move.type} onChange={e=>setMove({...move, type: e.target.value})}>
                                        <option value="SAIDA">SAÍDA</option><option value="ENTRADA">ENTRADA</option>
                                    </select>
                                    <Input type="number" value={move.qty} onChange={e=>setMove({...move, qty: e.target.value})} />
                                </div>
                                {move.type === 'SAIDA' && (
                                    <>
                                        <Input placeholder="Nome do Destino" value={move.user} onChange={e=>setMove({...move, user: e.target.value})} required />
                                        <Input placeholder="Nº Crachá" value={move.badge} onChange={e=>setMove({...move, badge: e.target.value})} required />
                                    </>
                                )}
                                <Button type="submit" className="w-full">Confirmar Baixa</Button>
                            </form>
                        </Card>
                    </div>

                    {/* MODAL ADICIONAR PRODUTO */}
                    {showAdd && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
                            <Card className="w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold mb-4">Cadastrar Item</h3>
                                <form onSubmit={addProduct} className="space-y-4">
                                    <Input placeholder="Nome do Item (Ex: Mouse)" value={newP.name} onChange={e=>setNewP({...newP, name: e.target.value})} required />
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[10px] font-bold uppercase text-slate-400">Saldo Inicial</label><Input type="number" value={newP.initial} onChange={e=>setNewP({...newP, initial: e.target.value})} /></div>
                                        <div><label className="text-[10px] font-bold uppercase text-slate-400">Estoque Mín.</label><Input type="number" value={newP.min} onChange={e=>setNewP({...newP, min: e.target.value})} /></div>
                                    </div>
                                    <Button className="w-full">Salvar Produto</Button>
                                    <Button type="button" variant="secondary" className="w-full" onClick={()=>setShowAdd(false)}>Cancelar</Button>
                                </form>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTickets, setActiveTickets] = useState([]);
            const [users, setUsers] = useState([]);

            useEffect(() => {
                db.collection('users').onSnapshot(s => setUsers(s.docs.map(d => ({id: d.id, ...d.data()}))));
                db.collection('tickets').onSnapshot(s => setActiveTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
            }, []);

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950 p-4">
                    <Card className="w-full max-w-sm">
                        <div className="text-center mb-6"><h1 className="text-2xl font-bold">INFRA CHECK</h1></div>
                        <form onSubmit={(e) => { e.preventDefault(); const u = users.find(u => u.id === e.target.id.value); if(u) {setCurrentUser(u); setView('dashboard');} else alert("Erro!"); }} className="space-y-4">
                            <Input name="id" placeholder="Matrícula" required />
                            <Button className="w-full">Acessar</Button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen bg-slate-100 dark:bg-slate-950 overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-slate-400 flex flex-col border-r border-slate-800">
                        <div className="p-6 text-white font-bold border-b border-slate-800">INFRA SYSTEM</div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setView('dashboard')} className={`w-full flex p-3 rounded-lg ${view === 'dashboard' ? 'bg-brand-600 text-white' : ''}`}>{Icons.Layout} Dashboard</button>
                            <button onClick={() => setView('history')} className={`w-full flex p-3 rounded-lg ${view === 'history' ? 'bg-brand-600 text-white' : ''}`}>{Icons.History} Histórico</button>
                            <button onClick={() => setView('inventory')} className={`w-full flex p-3 rounded-lg ${view === 'inventory' ? 'bg-brand-600 text-white' : ''}`}>{Icons.Package} Estoque</button>
                        </nav>
                        <div className="p-4 border-t border-slate-800 flex justify-between">
                            <span className="text-xs truncate">{currentUser.name}</span>
                            <button onClick={() => setView('login')} className="text-red-400">{Icons.Logout}</button>
                        </div>
                    </aside>
                    <main className="flex-1 overflow-auto">
                        {view === 'dashboard' && (
                            <div className="p-10 grid grid-cols-2 gap-4">
                                <Card className="p-10 cursor-pointer hover:border-brand-500" onClick={() => alert("Checklist Original Ativado")}>Novo Checklist</Card>
                            </div>
                        )}
                        {view === 'inventory' && <InventoryModule currentUser={currentUser} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

                                { id: 'z_1', label: 'Rolete', checked: false, manual: 'Verificar alinhamento e desgastes mecânicos no rolete de borracha de tração.' },
                                { id: 'z_2', label: 'Cabeça Impressão', checked: false, manual: 'Inspecionar visualmente se há riscos ou pontos queimados na linha térmica.' },
                                { id: 'z_3', label: 'Suporte Etiqueta', checked: false, manual: 'Verificar o travamento do suporte do rolo de etiqueta e tensão do ribbon.' },
                                { id: 'z_4', label: 'Qualidade Inicial', checked: false, manual: 'Imprimir página inicial de diagnóstico para análise de falhas de queima.' }
                            ]
                        },
                        manutencao: {
                            title: "2. MANUTENÇÃO",
                            icon: "Server",
                            tasks: [
                                { id: 'z_5', label: 'Limpeza Rolete', checked: false, manual: 'Descontaminar rolete com álcool isopropílico girando manualmente para retirar resíduos de cola.' },
                                { id: 'z_6', label: 'Limpeza Cabeça', checked: false, manual: 'Limpar a cabeça de impressão utilizando caneta térmica apropriada ou swab com álcool.' },
                                { id: 'z_7', label: 'Limpeza Suporte', checked: false, manual: 'Remover poeiras internas, cola residual e fiapos de papel dos eixos de sustentação.' },
                                { id: 'z_8', label: 'Limpeza Geral', checked: false, manual: 'Higienização geral da carcaça e remoção de poeira ótica na área do sensor de mídia/GAP.' }
                            ]
                        },
                        teste: {
                            title: "3. VALIDAÇÃO",
                            icon: "Printer",
                            tasks: [
                                { id: 'z_9', label: 'Teste Final', checked: false, manual: 'Efetuar calibração de GAP e imprimir etiquetas para conferência de código de barras com leitor laser.' }
                            ]
                        }
                    };
                } else if (type === 'diario') {
                    let t = customTitulos || {
                        col1: "1. KAUAN (FÍSICO E ACESSOS)",
                        col2: "2. LUI (DADOS E CONECTIVIDADE)",
                        col3: "3. INÁCIO (SEGURANÇA E ENDPOINTS)"
                    };
                    tmpl.items = {
                        coluna1: {
                            title: t.col1,
                            icon: "Check",
                            tasks: [
                                { id: 'd_aux_1', label: 'Verificação Visual No-Breaks', checked: false, manual: 'Inspeção visual direta no display dos no-breaks do CPD para certificar ausência de falhas ativas.' },
                                { id: 'd_aux_2', label: 'Verificação Log No-Breaks (Web Interface)', checked: false, manual: 'Acesso à interface web de gerência para checar alertas de bateria e rede elétrica.' },
                                { id: 'd_aux_3', label: 'Verificação Visual MikroTiks', checked: false, manual: 'Checar conectividade física e status das luzes (LEDs) nas portas WAN/LAN ativas.' },
                                { id: 'd_aux_4', label: 'Verificação Server Portal ( 15.3 )', checked: false, manual: 'Confirmar disponibilidade e latência do portal principal no IP local da rede.' },
                                { id: 'd_aux_5', label: 'Verificação Status Portal Web (15.3:8200)', checked: false, manual: 'Testar acesso e login na porta 8200.' },
                                { id: 'd_aux_6', label: 'Verificação Consumo SMTP (Skymail)', checked: false, manual: 'Acessar painel do Skymail para certificar limite e volume de disparos transacionais.' }
                            ]
                        },
                        coluna2: {
                            title: t.col2,
                            icon: "Server",
                            tasks: [
                                { id: 'd_ple_1', label: 'Verificação Backups Veeam', checked: false, manual: 'Validar jobs de backup noturnos no Veeam. Garantir que não existem rotinas falhas ou pendentes.' },
                                { id: 'd_ple_2', label: 'Status Pool Storage (FreeNAS 7TB e 13TB)', checked: false, manual: 'Acessar a interface do TrueNAS/FreeNAS para checar integridade do array ZFS e limites de capacidade.' },
                                { id: 'd_ple_3', label: 'Verificação MPLS / VPN (TL e Pouso Alegre)', checked: false, manual: 'Ping e teste de acesso direto para validar estabilidade da malha de rede com as filiais.' },
                                { id: 'd_ple_4', label: 'Verificação Log OpenVPN', checked: false, manual: 'Revisar tentativas anormais de login ou quedas persistentes nos clientes de VPN externa.' },
                                { id: 'd_ple_5', label: 'Verificação Unifi Server', checked: false, manual: 'Checar status de adoção dos Access Points e integridade geral do mapa do WiFi no controller.' },
                                { id: 'd_ple_6', label: 'Verificação PABX (Itu, TL e Pouso Alegre)', checked: false, manual: 'Certificar registros SIP e disponibilidade de troncos entre as plantas.' }
                            ]
                        },
                        coluna3: {
                            title: t.col3,
                            icon: "Search",
                            tasks: [
                                { id: 'd_sen_1', label: 'Verificação Log Wazuh', checked: false, manual: 'Analisar eventos críticos (nível 12+) de correlação no dashboard SIEM. Analisar falhas de integridade em servidores.' },
                                { id: 'd_sen_2', label: 'Verificação Log pfSense', checked: false, manual: 'Checar consumo excessivo de links, bloqueios massivos no Suricata/pfBlocker ou anomalias no gateway.' },
                                { id: 'd_sen_3', label: 'Verificação ECA ESET', checked: false, manual: 'Validar máquinas desatualizadas, módulos inativos ou infecções detectadas via console de gerência ESET.' },
                                { id: 'd_sen_4', label: 'Verificação CrowdStrike', checked: false, manual: 'Revisar painel da plataforma Falcon para identificação de ameaças ou sensores desconectados no parque ativo.' }
                            ]
                        }
                    };
                } else if (type === 'rack') {
                    tmpl.items = {
                        fisica: {
                            title: "1. LIMPEZA E ESTRUTURA",
                            icon: "Server",
                            tasks: [
                                { id: 'r_1', label: 'Limpeza Externa e Filtros', checked: false, manual: 'Remover acúmulo de poeira da porta perfurada e limpar filtros de ar do rack (pincel ou pano seco). A poeira de cobre/plástico causa superaquecimento.' },
                                { id: 'r_2', label: 'Ventilação (Exaustores)', checked: false, manual: 'Verificar se o kit de ventilação no teto está ligado e operante. Escutar ruídos de rolamento gasto.' },
                                { id: 'r_3', label: 'Vedação e Trancas', checked: false, manual: 'Garantir que as portas e painéis laterais estão devidamente fechados e trancados para evitar oxidação precoce.' }
                            ]
                        },
                        energia: {
                            title: "2. ENERGIA E CLIMATIZAÇÃO",
                            icon: "Check",
                            tasks: [
                                { id: 'r_4', label: 'Status No-Break (UPS)', checked: false, manual: 'Inspecionar painel do no-break interno. Verificar se há LED vermelho de bateria viciada ou alarme sonoro.' },
                                { id: 'r_5', label: 'Régua de Tomadas (PDU)', checked: false, manual: 'Garantir que as fontes dos switches e conversores de mídia estão bem fixadas, sem cabos elétricos tensionados.' },
                                { id: 'r_6', label: 'Temperatura Interna', checked: false, manual: 'Verificar a sensação térmica dentro do rack. Garantir a ausência de bolsões de ar quente presos no topo.' }
                            ]
                        },
                        ativos: {
                            title: "3. CABEAMENTO E SWITCHES",
                            icon: "Layout",
                            tasks: [
                                { id: 'r_7', label: 'LEDs de Erro (Switches)', checked: false, manual: 'Inspecionar painel frontal. Validar alertas de falha de hardware (SYS/ALM) e portas piscando laranja de forma constante (erro de negociação).' },
                                { id: 'r_8', label: 'Proteção de Portas Ociosas', checked: false, manual: 'Verificar se as portas RJ45 não utilizadas estão cobertas com Dust Covers (tampões) para não oxidar com os vapores da fábrica.' },
                                { id: 'r_9', label: 'Guias e Patch Cords', checked: false, manual: 'Verificar patch cords soltos, forçados nas pontas ou obstruindo a saída de ar frontal dos equipamentos. Reacomodar nos guias de cabos.' },
                                { id: 'r_10', label: 'Fibras e Uplinks', checked: false, manual: 'Inspecionar cordões ópticos e cordões de manobra para garantir que não há estrangulamento ou curvatura excessiva.' }
                            ]
                        }
                    };
                }
                return tmpl;
            };

            var Button = (props) => {
                var variant = props.variant || 'primary';
                var variants = {
                    primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow border border-transparent',
                    secondary: 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700',
                    danger: 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 dark:bg-red-900/20 dark:border-red-900/40 dark:text-red-400',
                    ghost: 'bg-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                };
                var cls = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 " + (variants[variant] || variants.primary) + " " + (props.className || '');
                return <button {...props} className={cls}>{props.children}</button>;
            };

            var Card = (props) => {
                var pad = props.noPadding ? '' : 'p-6';
                var cls = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm " + pad + " " + (props.className || '');
                return <div className={cls}>{props.children}</div>;
            };

            var Input = (props) => {
                var cls = "w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all " + (props.className || '');
                return <input {...props} className={cls} />;
            };

            var Badge = (props) => {
                var color = props.color || 'slate';
                var colors = {
                    slate: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400',
                    blue: 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',
                    green: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
                    amber: 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
                    indigo: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300'
                };
                return <span className={"px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider " + (colors[color] || colors.slate)}>{props.children}</span>;
            };

            var calcProgress = (items) => {
                if (!items || typeof items !== 'object') return 0;
                let total = 0, done = 0;
                Object.keys(items).forEach((k) => {
                    let group = items[k];
                    if (group && Array.isArray(group.tasks)) {
                        group.tasks.forEach((t) => {
                            total++;
                            if (t && t.checked) done++;
                        });
                    }
                });
                return total === 0 ? 0 : Math.round((done / total) * 100);
            };
            
            var InlineEdit = (props) => {
                var [val, setVal] = useState(props.value || '');
                useEffect(() => { setVal(props.value || ''); }, [props.value]);

                return (
                    <input 
                        value={val}
                        onChange={(e) => setVal(e.target.value)}
                        onBlur={() => { if(val !== props.value) props.onSave(val); }}
                        className={"bg-transparent focus:outline-none w-full text-ellipsis " + (props.className || '')}
                        title="Clique para editar este título"
                    />
                );
            };

            var TaskItem = (props) => {
                var { task, onToggle } = props;
                var [isOpen, setIsOpen] = useState(false);
                var [copied, setCopied] = useState(false);

                var copyToClipboard = (e, text) => {
                    e.stopPropagation();
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text);
                        setCopied(true);
                        setTimeout(() => setCopied(false), 1500);
                    }
                };

                return (
                    <div className="p-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors select-none">
                        <div className="flex items-start gap-3">
                            <div 
                                onClick={onToggle}
                                className={"mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 cursor-pointer transition-all duration-200 " + (task.checked ? 'bg-brand-600 border-brand-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800')}
                            >
                                {task.checked && <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path d="M5 13l4 4L19 7" /></svg>}
                            </div>

                            <div className="flex-1">
                                <div className="flex items-center justify-between gap-2">
                                    <span 
                                        onClick={onToggle}
                                        className={"text-sm font-semibold cursor-pointer " + (task.checked ? 'text-slate-400 line-through' : 'text-slate-800 dark:text-slate-200')}
                                    >
                                        {task.label}
                                    </span>
                                    
                                    {task.manual && (
                                        <button 
                                            type="button"
                                            onClick={() => setIsOpen(!isOpen)} 
                                            className={"text-[11px] font-medium flex items-center gap-1 px-2 py-0.5 rounded transition-colors " + (isOpen ? "bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300" : "bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-600")}
                                        >
                                            {Icons.BookOpen} <span>{isOpen ? 'Fechar' : 'Manual'}</span>
                                        </button>
                                    )}
                                </div>

                                {isOpen && task.manual && (
                                    <div className="mt-2.5 p-3 rounded-lg bg-blue-50/70 dark:bg-slate-950/70 border border-blue-100 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 fade-in">
                                        <div className="flex items-start gap-2">
                                            <div className="text-brand-500 shrink-0 mt-0.5 font-bold">ℹ</div>
                                            <div className="space-y-2 flex-1">
                                                <p className="leading-relaxed whitespace-pre-line font-sans">{task.manual}</p>
                                                
                                                {task.copyText && (
                                                    <div className="pt-1 flex items-center gap-2">
                                                        <span className="text-[10px] uppercase font-bold text-slate-400">Comando / Parâmetro:</span>
                                                        <button 
                                                            type="button"
                                                            onClick={(e) => copyToClipboard(e, task.copyText)}
                                                            className="px-2 py-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded text-[11px] font-mono font-bold text-brand-600 dark:text-brand-400 hover:border-brand-500 flex items-center gap-1.5 transition-all shadow-sm"
                                                        >
                                                            {Icons.Copy}
                                                            <span>{task.copyText}</span>
                                                            {copied && <span className="text-[9px] text-emerald-600 font-sans">✓ Copiado!</span>}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            var ActiveChecklist = (props) => {
                var { ticket, onUpdate, onBack, onForceSave, onRequestFinish } = props;

                if (!ticket || !ticket.data) return null;
                var data = ticket.data;
                var meta = data.meta || {};
                var items = data.items || {};

                var handleMeta = (field, value) => {
                    var newMeta = Object.assign({}, meta, { [field]: value });
                    onUpdate(Object.assign({}, data, { meta: newMeta }));
                };

                var handleCheck = (section, taskId) => {
                    var newData = Object.assign({}, data);
                    var sec = newData.items && newData.items[section];
                    if (!sec || !Array.isArray(sec.tasks)) return;
                    sec.tasks = sec.tasks.map((t) => {
                        return t.id === taskId ? Object.assign({}, t, { checked: !t.checked }) : t;
                    });
                    onUpdate(newData);
                };

                var progress = calcProgress(items);
                var leftKeys = ['preventivas', 'preparacao', 'sistema'];
                var rightKeys = ['configuracao', 'apps', 'seguranca', 'entrega'];

                var renderCategoryCard = (key) => {
                    var group = items[key];
                    if (!group) return null;
                    return (
                        <Card key={key} noPadding className="overflow-hidden h-fit">
                            <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex items-center gap-2">
                                <div className="text-brand-500">{Icons[group.icon] || Icons.Server}</div>
                                <InlineEdit 
                                    value={group.title}
                                    onSave={(newVal) => {
                                        var newData = Object.assign({}, data);
                                        if(newData.items[key]) {
                                            newData.items[key].title = newVal;
                                            onUpdate(newData);
                                            if (ticket.type === 'diario' && props.onGlobalTitleChange) {
                                                props.onGlobalTitleChange(key, newVal);
                                            }
                                        }
                                    }}
                                    className="font-bold text-slate-700 dark:text-slate-200 text-xs uppercase tracking-wider border-b border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-brand-500 transition-colors"
                                />
                            </div>
                            <div className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                {(group.tasks || []).map((task) => (
                                    <TaskItem 
                                        key={task.id} 
                                        task={task} 
                                        onToggle={() => handleCheck(key, task.id)} 
                                    />
                                ))}
                            </div>
                        </Card>
                    );
                };

                return (
                    <div className="flex flex-col h-full overflow-hidden bg-slate-100 dark:bg-slate-950 relative">
                        <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-sm z-10 shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={onBack} className="p-2 -ml-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500">{Icons.ChevronLeft}</button>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h2 className="text-lg font-bold text-slate-800 dark:text-white leading-none">#{ticket.visualId}</h2>
                                        <Badge color={ticket.type === 'formatacao' ? 'blue' : ticket.type === 'diario' ? 'green' : ticket.type === 'rack' ? 'indigo' : 'amber'}>
                                            {ticket.type === 'formatacao' ? 'Formatação PC' : ticket.type === 'diario' ? 'Check Diário' : ticket.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                        </Badge>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1">Registrado em {new Date(ticket.createdAt || Date.now()).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="text-right hidden sm:block">
                                    <span className="text-xs font-bold text-brand-600 block">{progress}% Completo</span>
                                    <div className="w-32 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full mt-1 overflow-hidden">
                                        <div className={"h-full transition-all duration-500 " + (progress === 100 ? "bg-emerald-500" : "bg-brand-600")} style={{width: progress + '%'}}></div>
                                    </div>
                                </div>
                                <Button onClick={onForceSave} variant="secondary" className="text-xs sm:text-sm">
                                    {Icons.Save} Salvar e Voltar
                                </Button>
                                <Button onClick={onRequestFinish} variant="primary" className="text-xs sm:text-sm">
                                    {progress === 100 ? 'Finalizar' : 'Revisar'}
                                </Button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                            <Card className="grid grid-cols-1 md:grid-cols-3 gap-6" noPadding>
                                <div className="p-6 col-span-full grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">DATA</label>
                                        <Input type="date" value={meta.data || ''} onChange={(e) => handleMeta('data', e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">ATIVO / DEPARTAMENTO</label>
                                        <Input placeholder="Ex: PAT-01020" value={meta.ativo || ''} onChange={(e) => handleMeta('ativo', e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">MÁQUINA / FINALIDADE</label>
                                        <Input placeholder="Ex: CORP-PC-01" value={meta.maquina || ''} onChange={(e) => handleMeta('maquina', e.target.value)} />
                                    </div>
                                </div>
                            </Card>

                            {ticket.type === 'formatacao' ? (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-12">
                                    <div className="space-y-6">{leftKeys.map(renderCategoryCard)}</div>
                                    <div className="space-y-6">{rightKeys.map(renderCategoryCard)}</div>
                                </div>
                            ) : (
                                <div className={"grid gap-6 pb-12 " + (Object.keys(items).length >= 3 ? "grid-cols-1 lg:grid-cols-3" : "grid-cols-1 md:grid-cols-2")}>
                                    {Object.keys(items).map(renderCategoryCard)}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            var ReceiptView = (props) => {
                var { ticket, onBack, onArchive, logo } = props;
                var [obs, setObs] = useState('');

                if (!ticket || !ticket.data) return null;
                var meta = ticket.data.meta || {};
                var items = ticket.data.items || {};
                var identificador = meta.maquina || meta.ativo || "N/A";
                
                var totalTasks = 0, checkedTasks = 0;
                var pendingList = [];
                var categorySummary = Object.keys(items).map((k) => {
                    var group = items[k];
                    var tasks = group.tasks || [];
                    var total = tasks.length;
                    var checked = tasks.filter((t) => t.checked).length;
                    tasks.forEach((t) => { if (!t.checked) pendingList.push("- [" + group.title + "] " + t.label); });
                    totalTasks += total;
                    checkedTasks += checked;
                    return { title: group.title, status: checked === total ? "OK" : "PENDENTE" };
                });
                var percent = totalTasks === 0 ? 0 : Math.round((checkedTasks / totalTasks) * 100);
                var statusGlobal = percent === 100 ? "CONCLUÍDO" : "PARCIAL";

                var handleSendOutlook = () => {
                    var subject = "[" + statusGlobal + "] Registo #" + ticket.visualId + " - " + identificador;
                    var body = "RELATÓRIO TÉCNICO\n----------------------------------------\nID: #" + ticket.visualId + "\nATIVO: " + (meta.ativo || 'N/A') + "\nMÁQUINA: " + identificador + "\nSTATUS: " + statusGlobal + "\nTÉCNICO: " + (meta.tecnico || 'N/A') + "\nDATA: " + new Date().toLocaleDateString() + "\n----------------------------------------\nRESUMO:\n" + categorySummary.map((c) => "[" + c.status + "] " + c.title).join('\n') + "\n----------------------------------------\nOBSERVAÇÕES:\n" + (obs || "Sem observações.") + "\n\nGerado via InfraChecklist Cobrecom";
                    window.location.href = "mailto:" + EMAIL_DESTINO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
                    setTimeout(() => {
                        if (confirm("E-mail aberto? Clique OK para arquivar.")) onArchive(ticket);
                    }, 1000);
                };

                return (
                    <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-950 overflow-auto p-4 md:p-8">
                        <div className="max-w-4xl mx-auto w-full space-y-6 fade-in no-print">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2 text-slate-500 hover:text-slate-700 cursor-pointer" onClick={onBack}>
                                    {Icons.ChevronLeft} <span className="font-bold text-sm">Voltar à Edição</span>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white">Revisão & Entrega</h1>
                            </div>

                            <Card className="grid md:grid-cols-2 gap-6">
                                <div className="space-y-4">
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Observações Finais</label>
                                    <textarea value={obs} onChange={(e) => setObs(e.target.value)} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm h-32 resize-none focus:ring-2 focus:ring-brand-500/20 outline-none" placeholder="Detalhes adicionais, peças trocadas, etc..."></textarea>
                                </div>
                                <div className="flex flex-col justify-center gap-3 border-l border-slate-100 dark:border-slate-800 pl-6">
                                    <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300">Ações de Encerramento</h3>
                                    <Button className="w-full justify-start" onClick={() => window.print()} variant="secondary">{Icons.Printer} Imprimir Relatório</Button>
                                    <Button className="w-full justify-start" onClick={handleSendOutlook}>{Icons.Mail} Enviar E-mail & Arquivar</Button>
                                </div>
                            </Card>
                        </div>

                        <div id="receipt-area" className="hidden bg-white text-black font-sans text-xs border border-gray-300 p-0">
                            <div className="flex justify-between items-center p-6 border-b-2 border-black">
                                <div className="flex items-center gap-4">{logo && <img src={logo} className="h-10 object-contain" />}<div><h1 className="text-xl font-bold tracking-tighter uppercase">Relatório Técnico</h1><p className="text-[10px] uppercase tracking-widest text-gray-500">Departamento de TI • Infraestrutura</p></div></div>
                                <div className="text-right"><div className="text-2xl font-mono font-bold">#{ticket.visualId || 'PEND'}</div><div className="text-[10px] font-bold">{new Date().toLocaleDateString()}</div></div>
                            </div>
                            <div className="grid grid-cols-4 border-b border-black">
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Ativo</span><span className="font-bold text-sm block truncate">{meta.ativo || 'N/A'}</span></div>
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Máquina</span><span className="font-bold text-sm block truncate">{identificador}</span></div>
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Técnico</span><span className="font-bold uppercase truncate">{meta.tecnico}</span></div>
                                <div className={"p-3 text-center flex flex-col justify-center " + (percent === 100 ? 'bg-gray-100' : 'bg-gray-200')}><span className="block text-[9px] font-bold uppercase text-gray-500">Status</span><span className="font-bold text-sm">{statusGlobal}</span></div>
                            </div>
                            <div className="p-6 flex gap-8">
                                <div className="w-1/2"><h3 className="font-bold uppercase text-[10px] mb-2 border-b border-black pb-1">Checklist</h3><table className="w-full text-left border-collapse"><tbody>{categorySummary.map((cat, i) => (<tr key={i} className="border-b border-dotted border-gray-400"><td className="py-1.5 font-medium">{cat.title}</td><td className="py-1.5 text-right font-mono font-bold">{cat.status === 'OK' ? 'OK' : '⚠'}</td></tr>))}</tbody></table></div>
                                <div className="w-1/2 flex flex-col gap-4">
                                    {pendingList.length > 0 && (<div className="border border-black p-2 bg-gray-50"><h3 className="font-bold uppercase text-[9px] mb-1">Pendências</h3><ul className="list-disc list-inside text-[10px] space-y-0.5">{pendingList.map((p, i) => <li key={i} className="truncate">{p.replace('- ', '')}</li>)}</ul></div>)}
                                    <div><h3 className="font-bold uppercase text-[10px] mb-1 border-b border-black pb-1">Observações</h3><p className="text-[10px] leading-relaxed italic h-16">{obs || "Sem observações adicionais."}</p></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            var Dashboard = (props) => {
                var { activeTickets, onOpenTicket, onDeleteTicket, historyCount } = props;
                var formatCount = activeTickets.filter((t) => t.type === 'formatacao').length;

                return (
                    <div className="p-6 md:p-10 space-y-8 fade-in">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Visão Geral</h2>
                            <p className="text-slate-500 text-sm">Monitoramento de atividades de infraestrutura em tempo real.</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-brand-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Registos Ativos</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{activeTickets.length}</h3></div>
                                <div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-xl text-brand-600">{Icons.Layout}</div>
                            </Card>
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-emerald-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Total de Operações</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{historyCount}</h3></div>
                                <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl text-emerald-600">{Icons.History}</div>
                            </Card>
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-indigo-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Formatações PC</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{formatCount}</h3></div>
                                <div className="bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl text-indigo-600">{Icons.Server}</div>
                            </Card>
                        </div>

                        <div>
                            <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">{Icons.Server} Painel de Execução</h3>
                            {activeTickets.length === 0 ? (
                                <div className="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-12 text-center">
                                    <p className="text-slate-400 font-medium">Nenhum checklist em andamento.</p>
                                    <p className="text-xs text-slate-500 mt-1">Utilize o menu lateral para iniciar uma atividade.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeTickets.map((ticket) => {
                                        var meta = (ticket.data && ticket.data.meta) || {};
                                        var pct = calcProgress(ticket.data && ticket.data.items);
                                        var nomeAtivo = meta.maquina || meta.ativo || "Sem Identificação";
                                        
                                        return (
                                            <div key={ticket.id} onClick={() => onOpenTicket(ticket.id)} className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 hover:shadow-lg hover:border-brand-400 dark:hover:border-brand-500 transition-all cursor-pointer relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div className="flex items-center gap-2">
                                                        <Badge color={ticket.type === 'formatacao' ? 'blue' : ticket.type === 'diario' ? 'green' : ticket.type === 'rack' ? 'indigo' : 'amber'}>
                                                            {ticket.type === 'formatacao' ? 'Formatação' : ticket.type === 'diario' ? 'Diário' : ticket.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                                        </Badge>
                                                        <span className="text-[9px] font-bold uppercase text-slate-400 flex items-center gap-1">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span> Em Execução
                                                        </span>
                                                    </div>
                                                    <span className="text-xs font-mono font-bold text-slate-400">#{ticket.visualId}</span>
                                                </div>
                                                <h4 className="font-bold text-slate-800 dark:text-white text-lg truncate mb-1">{nomeAtivo}</h4>
                                                <p className="text-xs text-slate-500 mb-4 flex items-center gap-1">{Icons.User} {meta.tecnico || 'Técnico'}</p>
                                                
                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                        <div className={"h-full " + (pct === 100 ? "bg-emerald-500" : "bg-brand-500")} style={{width: pct + '%'}}></div>
                                                    </div>
                                                    <span className="text-xs font-bold text-brand-600">{pct}%</span>
                                                </div>
                                                <button onClick={(e) => onDeleteTicket(e, ticket.id)} className="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition-colors opacity-0 group-hover:opacity-100" title="Excluir registo">{Icons.Trash}</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            var HistoryView = (props) => {
                var { history } = props;
                var [search, setSearch] = useState('');

                var filtered = history.filter((h) => {
                    var s = search.toLowerCase();
                    var at = (h.ativo || '').toLowerCase();
                    var tc = (h.tecnico || '').toLowerCase();
                    var vid = (h.visualId || '').toLowerCase();
                    return at.indexOf(s) !== -1 || tc.indexOf(s) !== -1 || vid.indexOf(s) !== -1;
                });

                return (
                    <div className="p-6 md:p-10 h-full flex flex-col fade-in">
                        <div className="flex justify-between items-end mb-6">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Histórico de Operações</h2>
                                <p className="text-slate-500 text-sm">Registro auditável de todas as atividades concluídas.</p>
                            </div>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">{Icons.Search}</div>
                                <Input placeholder="Buscar por ID, Ativo..." value={search} onChange={(e) => setSearch(e.target.value)} className="pl-10 w-64" />
                            </div>
                        </div>
                        
                        <Card className="flex-1 overflow-hidden flex flex-col" noPadding>
                            <div className="overflow-auto flex-1">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-slate-50 dark:bg-slate-800 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                                        <tr>
                                            <th className="px-6 py-3">ID</th>
                                            <th className="px-6 py-3">Data</th>
                                            <th className="px-6 py-3">Tipo</th>
                                            <th className="px-6 py-3">Ativo</th>
                                            <th className="px-6 py-3">Técnico</th>
                                            <th className="px-6 py-3 text-right">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {filtered.map((h, i) => (
                                            <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                <td className="px-6 py-3 font-mono text-xs font-bold text-slate-500">#{h.visualId}</td>
                                                <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{new Date(h.date || Date.now()).toLocaleDateString()}</td>
                                                <td className="px-6 py-3">
                                                    <Badge color={h.type === 'formatacao' ? 'blue' : h.type === 'diario' ? 'green' : h.type === 'rack' ? 'indigo' : 'amber'}>
                                                        {h.type === 'formatacao' ? 'Formatação' : h.type === 'diario' ? 'Diário' : h.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                                    </Badge>
                                                </td>
                                                <td className="px-6 py-3 font-medium text-slate-800 dark:text-white">{h.ativo || 'N/A'}</td>
                                                <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{h.tecnico || 'N/A'}</td>
                                                <td className="px-6 py-3 text-right"><span className="text-emerald-600 dark:text-emerald-400 text-xs font-bold bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-full">Concluído</span></td>
                                            </tr>
                                        ))}
                                        {filtered.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-slate-400">Nenhum registro encontrado.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    </div>
                );
            };

            var KanbanView = (props) => {
                var { tasks, users, onSaveTask, onDeleteTask, onMoveTask } = props;
                var [isModalOpen, setIsModalOpen] = useState(false);
                var [form, setForm] = useState({ title: '', assignee: users[0] ? users[0].name : 'Inacio', priority: 'Média', status: 'a_fazer' });

                var handleCreate = (e) => {
                    e.preventDefault();
                    if (!form.title.trim()) return;
                    var seq = Math.floor(100 + Math.random() * 900);
                    var newTask = {
                        code: 'SCRUM-' + seq,
                        title: form.title.trim(),
                        assignee: form.assignee,
                        priority: form.priority,
                        status: form.status,
                        createdAt: new Date().toISOString()
                    };
                    onSaveTask(newTask);
                    setForm({ title: '', assignee: users[0] ? users[0].name : 'Inacio', priority: 'Média', status: 'a_fazer' });
                    setIsModalOpen(false);
                };

                var columns = [
                    { id: 'a_fazer', title: 'A Fazer', color: 'border-l-4 border-l-slate-400' },
                    { id: 'em_andamento', title: 'Em Andamento', color: 'border-l-4 border-l-brand-500' },
                    { id: 'impedimentos', title: 'Impedimentos', color: 'border-l-4 border-l-amber-500' },
                    { id: 'concluido', title: 'Concluído', color: 'border-l-4 border-l-emerald-500' }
                ];

                return (
                    <div className="p-6 md:p-10 h-full flex flex-col fade-in overflow-x-auto">
                        <div className="flex justify-between items-end mb-6 shrink-0">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Quadro Kanban (Tarefas TI)</h2>
                                <p className="text-slate-500 text-sm">Gestão de demandas e chamados internos da equipe[cite: 15, 16].</p>
                            </div>
                            <Button onClick={() => setIsModalOpen(true)}>{Icons.Plus} Novo Cartão</Button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1 pb-4 min-w-[900px]">
                            {columns.map((col) => {
                                var colTasks = tasks.filter((t) => t.status === col.id);
                                return (
                                    <div key={col.id} className="bg-slate-200/60 dark:bg-slate-900/60 rounded-xl p-4 flex flex-col border border-slate-200 dark:border-slate-800 h-full max-h-[calc(100vh-200px)]">
                                        <div className="flex justify-between items-center mb-3 shrink-0">
                                            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">{col.title}</h3>
                                            <span className="bg-slate-300 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded-full text-xs font-mono font-bold">{colTasks.length}</span>
                                        </div>

                                        <div className="space-y-3 overflow-y-auto flex-1 pr-1">
                                            {colTasks.map((task) => {
                                                var initials = (task.assignee || 'TI').substring(0, 2).toUpperCase();
                                                var priorityColor = task.priority === 'Alta' ? 'bg-red-50 text-red-600 dark:bg-red-950/30 dark:text-red-400' : task.priority === 'Média' ? 'bg-amber-50 text-amber-600 dark:bg-amber-950/30 dark:text-amber-400' : 'bg-blue-50 text-blue-600 dark:bg-blue-950/30 dark:text-blue-400';
                                                
                                                return (
                                                    <div key={task.id} className={"bg-white dark:bg-slate-800 p-4 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 relative group flex flex-col gap-2 " + col.color}>
                                                        <div className="flex justify-between items-start">
                                                            <span className="text-[10px] font-mono font-bold text-slate-400">{task.code}</span>
                                                            <div className="flex items-center gap-1">
                                                                <span className={"text-[9px] font-bold px-1.5 py-0.5 rounded " + priorityColor}>{task.priority}</span>
                                                                <button onClick={() => onDeleteTask(task.id)} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-0.5" title="Excluir">{Icons.Trash}</button>
                                                            </div>
                                                        </div>

                                                        <h4 className="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug">{task.title}</h4>

                                                        <div className="flex justify-between items-center mt-2 pt-2 border-t border-slate-100 dark:border-slate-700/60">
                                                            <div className="flex items-center gap-1.5" title={"Responsável: " + task.assignee}>
                                                                <div className="w-6 h-6 rounded-full bg-brand-600 text-white text-[10px] font-bold flex items-center justify-center shadow">{initials}</div>
                                                                <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">{task.assignee}</span>
                                                            </div>

                                                            <div className="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                                                {col.id !== 'a_fazer' && (
                                                                    <button onClick={() => {
                                                                        var prev = col.id === 'em_andamento' ? 'a_fazer' : col.id === 'impedimentos' ? 'em_andamento' : 'impedimentos';
                                                                        onMoveTask(task.id, prev);
                                                                    }} className="p-1 rounded bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-300" title="Mover para trás">{Icons.ArrowLeft}</button>
                                                                )}
                                                                {col.id !== 'concluido' && (
                                                                    <button onClick={() => {
                                                                        var next = col.id === 'a_fazer' ? 'em_andamento' : col.id === 'em_andamento' ? 'impedimentos' : 'concluido';
                                                                        onMoveTask(task.id, next);
                                                                    }} className="p-1 rounded bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-300" title="Avançar">{Icons.ArrowRight}</button>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {colTasks.length === 0 && <div className="text-center py-6 text-xs text-slate-400 italic">Nenhum cartão</div>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {isModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                                <Card className="w-full max-w-md" noPadding>
                                    <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                                        <h3 className="font-bold text-slate-700 dark:text-slate-200 text-sm">Criar Novo Cartão (Kanban)</h3>
                                        <button onClick={() => setIsModalOpen(false)} className="text-2xl leading-none text-slate-400 hover:text-slate-600">&times;</button>
                                    </div>
                                    <form onSubmit={handleCreate} className="p-6 space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Título da Tarefa</label>
                                            <Input value={form.title} onChange={(e) => setForm(Object.assign({}, form, { title: e.target.value }))} placeholder="Ex: Substituir switch rack 02" autoFocus />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Responsável</label>
                                                <select value={form.assignee} onChange={(e) => setForm(Object.assign({}, form, { assignee: e.target.value }))} className="w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 focus:outline-none">
                                                    {users.map((u) => <option key={u.id} value={u.name}>{u.name}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Prioridade</label>
                                                <select value={form.priority} onChange={(e) => setForm(Object.assign({}, form, { priority: e.target.value }))} className="w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 focus:outline-none">
                                                    <option value="Baixa">Baixa</option>
                                                    <option value="Média">Média</option>
                                                    <option value="Alta">Alta</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Coluna Inicial</label>
                                            <select value={form.status} onChange={(e) => setForm(Object.assign({}, form, { status: e.target.value }))} className="w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 focus:outline-none">
                                                <option value="a_fazer">A Fazer</option>
                                                <option value="em_andamento">Em Andamento</option>
                                                <option value="impedimentos">Impedimentos</option>
                                            </select>
                                        </div>
                                        <div className="pt-2 flex justify-end gap-2">
                                            <Button type="button" variant="secondary" onClick={() => setIsModalOpen(false)}>Cancelar</Button>
                                            <Button type="submit">Adicionar Cartão</Button>
                                        </div>
                                    </form>
                                </Card>
                            </div>
                        )}
                    </div>
                );
            };

            var App = () => {
                var isSavingDraftRef = useRef(false);
                var [draftTicket, setDraftTicket] = useState(null);

                var [view, setView] = useState('login');
                var [currentUser, setCurrentUser] = useState(null);
                var [users, setUsers] = useState(DEFAULT_TEAM);
                var [activeTickets, setActiveTickets] = useState([]);
                var [history, setHistory] = useState([]);
                var [kanbanTasks, setKanbanTasks] = useState([]);
                var [logo, setLogo] = useState('');
                var [currentTicketId, setCurrentTicketId] = useState(null);
                var [darkMode, setDarkMode] = useState(true);
                
                var [showConfig, setShowConfig] = useState(false);
                var [openFolders, setOpenFolders] = useState({ checklists: false });
                var [customFolders, setCustomFolders] = useState([]);
                
                var fileInputRef = useRef(null);

                var [globalTitulos, setGlobalTitulos] = useState({
                    col1: "1. KAUAN (FÍSICO E ACESSOS)",
                    col2: "2. LUI (DADOS E CONECTIVIDADE)",
                    col3: "3. INÁCIO (SEGURANÇA E ENDPOINTS)"
                });

                useEffect(() => {
                    try {
                        var savedTheme = localStorage.getItem('sa_theme'); 
                        if (savedTheme !== null) setDarkMode(JSON.parse(savedTheme));
                        var savedLogo = localStorage.getItem('sa_logo'); 
                        if (savedLogo) setLogo(savedLogo);
                        var savedUser = localStorage.getItem('sa_user_session'); 
                        if (savedUser) { 
                            var parsed = JSON.parse(savedUser);
                            if (parsed && parsed.id) {
                                setCurrentUser(parsed); 
                                setView('dashboard'); 
                            }
                        }
                    } catch(e) {
                        localStorage.removeItem('sa_user_session');
                    }

                    var unsubConfig = db.collection('settings').doc('titulos').onSnapshot((snap) => {
                        if (snap.exists) setGlobalTitulos(snap.data());
                        else db.collection('settings').doc('titulos').set(globalTitulos);
                    });

                    var unsubFolders = db.collection('settings').doc('sidebar_modules').onSnapshot((snap) => {
                        if (snap.exists && snap.data() && Array.isArray(snap.data().folders)) {
                            setCustomFolders(snap.data().folders);
                        } else {
                            db.collection('settings').doc('sidebar_modules').set({ folders: [] });
                        }
                    });

                    var unsubKanban = db.collection('kanban_tasks').onSnapshot((snap) => {
                        var list = snap.docs.map((doc) => Object.assign({ id: doc.id }, doc.data()));
                        setKanbanTasks(list);
                    });

                    var unsubTickets = db.collection('tickets').onSnapshot((snap) => {
                        var list = snap.docs.map((doc) => Object.assign({ id: doc.id }, doc.data())).filter((t) => t && t.data && t.data.items);
                        list.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                        setActiveTickets(list);
                    });

                    var unsubHistory = db.collection('history').orderBy('date', 'desc').limit(50).onSnapshot((snap) => {
                        setHistory(snap.docs.map((doc) => Object.assign({ id: doc.id }, doc.data())));
                    });

                    var unsubUsers = db.collection('users').onSnapshot((snap) => {
                        if (snap.empty) {
                            DEFAULT_TEAM.forEach((u) => db.collection('users').add(u));
                        } else {
                            setUsers(snap.docs.map((doc) => Object.assign({ docId: doc.id }, doc.data())));
                        }
                    });

                    return () => { unsubTickets(); unsubHistory(); unsubUsers(); unsubConfig(); unsubFolders(); unsubKanban(); };
                }, []);

                useEffect(() => { 
                    if (darkMode) document.documentElement.classList.add('dark'); 
                    else document.documentElement.classList.remove('dark'); 
                    localStorage.setItem('sa_theme', JSON.stringify(darkMode)); 
                }, [darkMode]);

                var handleLogin = (user) => { 
                    setCurrentUser(user); 
                    localStorage.setItem('sa_user_session', JSON.stringify(user)); 
                    setView('dashboard'); 
                };

                var handleLogout = () => { 
                    setCurrentUser(null); 
                    localStorage.removeItem('sa_user_session'); 
                    setView('login'); 
                };

                var toggleFolder = (id) => {
                    var nextState = Object.assign({}, openFolders, { [id]: !openFolders[id] });
                    setOpenFolders(nextState);
                };

                var handleAddFolder = () => {
                    var title = prompt("Nome da nova pasta (ex: Firewall, Roteadores):");
                    if (!title || !title.trim()) return;
                    var newFolder = { id: 'f_' + Date.now(), title: title.trim(), links: [] };
                    var updated = customFolders.concat([newFolder]);
                    db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                    setOpenFolders(Object.assign({}, openFolders, { [newFolder.id]: true }));
                };

                var handleDeleteFolder = (e, folderId) => {
                    e.stopPropagation();
                    if (confirm("Excluir esta pasta e seus links?")) {
                        var updated = customFolders.filter((f) => f.id !== folderId);
                        db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                    }
                };

                var handleAddLink = (folderId) => {
                    var label = prompt("Nome do acesso (ex: pfSense Matriz):");
                    if (!label || !label.trim()) return;
                    var url = prompt("Endereço IP ou URL (ex: 192.168.1.1):");
                    if (!url || !url.trim()) return;

                    var updated = customFolders.map((f) => {
                        if (f.id === folderId) {
                            var existing = f.links || [];
                            var newLink = { id: 'l_' + Date.now(), label: label.trim(), url: url.trim() };
                            return Object.assign({}, f, { links: existing.concat([newLink]) });
                        }
                        return f;
                    });
                    db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                };

                var handleDeleteLink = (e, folderId, linkId) => {
                    e.stopPropagation();
                    if (confirm("Remover este acesso?")) {
                        var updated = customFolders.map((f) => {
                            if (f.id === folderId) {
                                var filtered = (f.links || []).filter((l) => l.id !== linkId);
                                return Object.assign({}, f, { links: filtered });
                            }
                            return f;
                        });
                        db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                    }
                };

                var handleOpenLink = (url) => {
                    if (!url) return;
                    var target = url.startsWith('http://') || url.startsWith('https://') ? url : 'http://' + url;
                    window.open(target, '_blank');
                };
                
                var handleCreateTicket = (type) => {
                    var prefix = type === 'formatacao' ? 'F' : type === 'zebra' ? 'Z' : type === 'rack' ? 'R' : 'D';
                    var seq = Math.floor(1000 + Math.random() * 9000);
                    var newTicket = {
                        id: 'draft',
                        visualId: prefix + '-' + seq,
                        type: type,
                        data: getTemplate(type, currentUser ? currentUser.name : '', globalTitulos),
                        createdAt: new Date().toISOString()
                    };
                    setDraftTicket(newTicket);
                    setCurrentTicketId('draft');
                    setView('checklist');
                };

                var handleUpdateTicket = (newData) => { 
                    if (currentTicketId === 'draft') {
                        var pct = calcProgress(newData.items);
                        var updatedDraft = Object.assign({}, draftTicket, { data: newData });
                        
                        if (pct >= 10 && !isSavingDraftRef.current) {
                            isSavingDraftRef.current = true;
                            var ticketToSave = Object.assign({}, updatedDraft);
                            delete ticketToSave.id;
                            db.collection('tickets').add(ticketToSave).then((docRef) => {
                                setCurrentTicketId(docRef.id);
                                setDraftTicket(null);
                                isSavingDraftRef.current = false;
                            }).catch(() => { isSavingDraftRef.current = false; });
                        } else {
                            setDraftTicket(updatedDraft);
                        }
                    } else if (currentTicketId && currentTicketId !== 'draft') {
                        db.collection('tickets').doc(currentTicketId).update({ data: newData }); 
                    }
                };
                
                var handleBackFromChecklist = () => {
                    if (currentTicketId === 'draft') {
                        setDraftTicket(null);
                        setCurrentTicketId(null);
                    }
                    setView('dashboard');
                };

                var handleForceSaveChecklist = () => {
                    if (currentTicketId === 'draft') {
                        isSavingDraftRef.current = true;
                        var ticketToSave = Object.assign({}, draftTicket);
                        delete ticketToSave.id;
                        db.collection('tickets').add(ticketToSave).then(() => {
                            setCurrentTicketId(null);
                            setDraftTicket(null);
                            isSavingDraftRef.current = false;
                            setView('dashboard');
                        });
                    } else {
                        setView('dashboard');
                    }
                };

                var handleRequestFinish = () => {
                    if (currentTicketId === 'draft') {
                        isSavingDraftRef.current = true;
                        var ticketToSave = Object.assign({}, draftTicket);
                        delete ticketToSave.id;
                        db.collection('tickets').add(ticketToSave).then((docRef) => {
                            setCurrentTicketId(docRef.id);
                            setDraftTicket(null);
                            isSavingDraftRef.current = false;
                            setView('receipt');
                        });
                    } else {
                        setView('receipt');
                    }
                };

                var handleGlobalTitleChange = (colKey, newVal) => {
                    var map = { coluna1: 'col1', coluna2: 'col2', coluna3: 'col3' };
                    var gKey = map[colKey];
                    if (gKey) {
                        var newTitulos = Object.assign({}, globalTitulos, { [gKey]: newVal });
                        db.collection('settings').doc('titulos').set(newTitulos);
                    }
                };
                
                var handleArchive = (ticket) => {
                    if (!ticket) return;
                    var meta = (ticket.data && ticket.data.meta) || {};
                    db.collection('history').add({ 
                        visualId: ticket.visualId, 
                        type: ticket.type, 
                        date: new Date().toISOString(), 
                        tecnico: meta.tecnico || 'N/A', 
                        ativo: meta.ativo || meta.maquina || "N/A", 
                        data: ticket.data 
                    }).then(() => {
                        return db.collection('tickets').doc(ticket.id).delete();
                    }).then(() => {
                        setCurrentTicketId(null);
                        setView('dashboard');
                    });
                };
                
                var handleDeleteActive = (e, id) => { 
                    e.stopPropagation(); 
                    if (confirm("Cancelar este registro?")) db.collection('tickets').doc(id).delete(); 
                };

                var handleLogoUpload = (e) => { 
                    var f = e.target.files && e.target.files[0]; 
                    if (f) { 
                        var r = new FileReader(); 
                        r.onloadend = () => { 
                            setLogo(r.result); 
                            localStorage.setItem('sa_logo', r.result); 
                        }; 
                        r.readAsDataURL(f); 
                    }
                };

                var handleSaveKanbanTask = (task) => {
                    db.collection('kanban_tasks').add(task);
                };

                var handleDeleteKanbanTask = (taskId) => {
                    if (confirm("Excluir este cartão do Kanban?")) {
                        db.collection('kanban_tasks').doc(taskId).delete();
                    }
                };

                var handleMoveKanbanTask = (taskId, newStatus) => {
                    db.collection('kanban_tasks').doc(taskId).update({ status: newStatus });
                };

                var currentTicketData = currentTicketId === 'draft' ? draftTicket : activeTickets.find((t) => t.id === currentTicketId);

                if (view === 'login') return <LoginScreen onLogin={handleLogin} users={users} />;

                return (
                    <div className="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200">
                        <aside className="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col border-r border-slate-800 z-20 shrink-0">
                            <div className="h-16 flex items-center gap-3 px-6 font-bold text-white tracking-wide border-b border-slate-800 shrink-0">
                                <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                </div>
                                INFRA CHECK
                            </div>
                            
                            <div className="flex-1 overflow-y-auto py-6">
                                <div className="px-6 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Principal</div>
                                <nav className="px-3 space-y-1 mb-8">
                                    <button onClick={() => setView('dashboard')} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'dashboard' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.Layout} Dashboard
                                    </button>
                                    <button onClick={() => setView('kanban')} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'kanban' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.Kanban} Kanban TI
                                    </button>
                                    <button onClick={() => setView('history')} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'history' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.History} Histórico
                                    </button>
                                </nav>

                                <div className="flex items-center justify-between px-6 mb-2">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos</span>
                                    <button onClick={handleAddFolder} className="text-slate-400 hover:text-brand-400 text-xs flex items-center gap-1 font-semibold" title="Criar nova pasta">{Icons.Plus} <span className="text-[10px]">Pasta</span></button>
                                </div>

                                <nav className="px-3 space-y-1">
                                    <div className="space-y-1 mb-2">
                                        <div onClick={() => toggleFolder('checklists')} className={"w-full flex items-center justify-between px-3 py-2 rounded-lg transition-colors font-medium text-xs text-slate-300 hover:bg-slate-800 cursor-pointer " + (openFolders.checklists ? 'bg-slate-800/60 text-white' : '')}>
                                            <div className="flex items-center gap-2.5 truncate">
                                                <span className={openFolders.checklists ? "text-brand-400" : "text-slate-500"}>{Icons.Folder}</span> 
                                                <span className="truncate font-semibold">Checklists de TI</span>
                                            </div>
                                            <div className={"transition-transform duration-200 text-slate-500 " + (openFolders.checklists ? 'rotate-180' : '')}>

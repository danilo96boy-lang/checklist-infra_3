                            { id: 'f_prep_2', label: 'Backup Arquivos', checked: false, manual: 'HABILITAR ITENS OCULTOS & APPDATA:\n1. No Explorador de Arquivos: clique na aba superior "Exibir" e marque a caixa "Itens ocultos".\n2. Pressione Win+R, digite %appdata% e copie a pasta AppData inteira do usuário (contém configurações, Spark e dados de navegadores).\n3. Salvar as pastas Documentos, Desktop, Downloads e Imagens.\n4. Para ferramentas de setup: Win+R > \\\\pdc-cobrecom\\manutencao (Login: admin) > pasta "m.kauan" > copiar "Formatação w10".', copyText: '%appdata%' },

                            { id: 'd_sen_3', label: 'Verificação ECA ESET', checked: false, manual: 'Validar máquinas desatualizadas, módulos inativos ou infecções detectadas via console de gerência ESET.' },
                            { id: 'd_sen_4', label: 'Verificação CrowdStrike', checked: false, manual: 'Revisar painel da plataforma Falcon para identificação de ameaças ou sensores desconectados no parque ativo.' }

                    }
                };
            } else if (type === 'rack') {
                tmpl.items = {
                    fisica: {
                        title: "1. LIMPEZA E ESTRUTURA",

                        tasks: [
                            { id: 'r_1', label: 'Limpeza Externa e Filtros', checked: false, manual: 'Remover acúmulo de poeira da porta perfurada e limpar filtros de ar do rack (pincel ou pano seco). A poeira de cobre/plástico causa superaquecimento.' },
                            { id: 'r_2', label: 'Ventilação (Exaustores)', checked: false, manual: 'Verificar se o kit de ventilação no teto está ligado e operante. Escutar ruídos de rolamento gasto.' },
                            { id: 'r_3', label: 'Vedação e Trancas', checked: false, manual: 'Garantir que as portas e painéis laterais estão devidamente fechados e trancados para evitar oxidação precoce.' }

                    },
                    energia: {

                            { id: 'r_4', label: 'Status No-Break (UPS)', checked: false, manual: 'Inspecionar painel do no-break interno. Verificar se há LED vermelho de bateria viciada ou alarme sonoro.' },
                            { id: 'r_5', label: 'Régua de Tomadas (PDU)', checked: false, manual: 'Garantir que as fontes dos switches e conversores de mídia estão bem fixadas, sem cabos elétricos tensionados.' },

                            { id: 'r_8', label: 'Proteção de Portas Ociosas', checked: false, manual: 'Verificar se as portas RJ45 não utilizadas estão cobertas com Dust Covers (tampões) para não oxidar com os vapores da fábrica.' },
                            { id: 'r_9', label: 'Guias e Patch Cords', checked: false, manual: 'Verificar patch cords soltos, forçados nas pontas ou obstruindo a saída de ar frontal dos equipamentos. Reacomodar nos guias de cabos.' },
                            { id: 'r_10', label: 'Fibras e Uplinks', checked: false, manual: 'Inspecionar cordões ópticos e cordões de manobra para garantir que não há estrangulamento ou curvatura excessiva.' }

        var Button = function(props) {
            var variant = props.variant || 'primary';
            var variants = {
                primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow border border-transparent',
                secondary: 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700',
                danger: 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 dark:bg-red-900/20 dark:border-red-900/40 dark:text-red-400',
                ghost: 'bg-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
            };
            var cls = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 " + (variants[variant] || variants.primary) + " " + (props.className || '');
            return <button {...props} className={cls}>{props.children}</button>;
        };

        var Card = function(props) {
            var pad = props.noPadding ? '' : 'p-6';
            var cls = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm " + pad + " " + (props.className || '');
            return <div className={cls}>{props.children}</div>;
        };

        var Input = function(props) {
            var cls = "w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all " + (props.className || '');
            return <input {...props} className={cls} />;
        };

        var Badge = function(props) {
            var color = props.color || 'slate';
            var colors = {
                slate: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400',
                blue: 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',
                green: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
                amber: 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
                indigo: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300'
            };
            return <span className={"px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider " + (colors[color] || colors.slate)}>{props.children}</span>;
        };

        var calcProgress = function(items) {
            if (!items || typeof items !== 'object') return 0;
            var total = 0, done = 0;
            Object.keys(items).forEach(function(k) {
                var group = items[k];
                if (group && Array.isArray(group.tasks)) {
                    group.tasks.forEach(function(t) {
                        total++;
                        if (t && t.checked) done++;
                    });
                }
            });
            return total === 0 ? 0 : Math.round((done / total) * 100);
        };
        
        var InlineEdit = function(props) {
            var valState = useState(props.value || '');
            var val = valState[0], setVal = valState[1];
            
            useEffect(function() { setVal(props.value || ''); }, [props.value]);

            return (
                <input 
                    value={val}
                    onChange={function(e) { setVal(e.target.value); }}
                    onBlur={function() { if(val !== props.value) props.onSave(val); }}
                    className={"bg-transparent focus:outline-none w-full text-ellipsis " + (props.className || '')}
                    title="Clique para editar e atualizar este título para toda a equipe"
                />
            );
        };

        var LinksView = function(props) {
            var folders = props.folders || [];
            var onSave = props.onSave;

            var handleAddFolder = function() {
                var title = prompt("Digite o nome da nova pasta (ex: Roteadores, Manuais, ERP):");
                if (!title) return;
                var newFolders = [...folders, { id: 'f_' + Date.now(), title: title, items: [] }];
                onSave(newFolders);
            };

            var handleAddLink = function(folderId) {
                var label = prompt("Nome do acesso (ex: MikroTik Matriz):");
                if (!label) return;
                var url = prompt("URL de acesso (ex: http://192.168.1.1):");
                if (!url) return;
                
                var newFolders = folders.map(function(f) {
                    if (f.id === folderId) {
                        return Object.assign({}, f, { items: [...(f.items||[]), { id: 'l_' + Date.now(), label: label, url: url }] });
                    }
                    return f;
                });
                onSave(newFolders);
            };

            var handleDeleteFolder = function(folderId) {
                if (confirm("Excluir esta pasta e todos os seus links?")) {
                    var newFolders = folders.filter(function(f) { return f.id !== folderId; });
                    onSave(newFolders);
                }
            };

            var handleDeleteLink = function(folderId, linkId) {
                if (confirm("Remover este acesso?")) {
                    var newFolders = folders.map(function(f) {
                        if (f.id === folderId) {
                            return Object.assign({}, f, { items: f.items.filter(function(l) { return l.id !== linkId; }) });
                        }
                        return f;
                    });
                    onSave(newFolders);
                }
            };

            return (
                <div className="p-6 md:p-10 h-full flex flex-col fade-in overflow-y-auto">
                    <div className="flex justify-between items-end mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Acessos Rápidos</h2>
                            <p className="text-slate-500 text-sm">Hub centralizado de painéis, roteadores e sistemas da Cobrecom.</p>
                        </div>
                        <Button onClick={handleAddFolder}>{Icons.Plus} Nova Pasta</Button>
                    </div>

                    {folders.length === 0 ? (
                        <div className="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-12 text-center mt-4">
                            <p className="text-slate-400 font-medium">Nenhuma pasta criada.</p>
                            <p className="text-xs text-slate-500 mt-1">Crie pastas para organizar seus links de acesso rápido.</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12">
                            {folders.map(function(f) {
                                return (
                                    <Card key={f.id} noPadding className="flex flex-col h-fit">
                                        <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center">
                                            <h3 className="font-bold text-slate-700 dark:text-slate-200 text-xs uppercase tracking-wider flex items-center gap-2">
                                                <span className="text-brand-500">{Icons.Folder}</span> {f.title}
                                            </h3>
                                            <button onClick={function(){handleDeleteFolder(f.id);}} className="text-slate-400 hover:text-red-500 transition-colors" title="Excluir Pasta">{Icons.Trash}</button>
                                        </div>
                                        <div className="p-4 flex-1 flex flex-col">
                                            <div className="space-y-2 mb-4 flex-1">
                                                {(f.items || []).map(function(item) {
                                                    var href = item.url.startsWith('http') ? item.url : 'http://' + item.url;
                                                    return (
                                                        <div key={item.id} className="flex items-center justify-between group p-2 hover:bg-slate-50 dark:hover:bg-slate-800/50 rounded border border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition-all">
                                                            <a href={href} target="_blank" rel="noreferrer" className="flex items-center gap-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 truncate flex-1" title={item.url}>
                                                                <span className="text-slate-400 shrink-0">{Icons.ExternalLink}</span>
                                                                <span className="truncate">{item.label}</span>
                                                            </a>
                                                            <button onClick={function(){handleDeleteLink(f.id, item.id);}} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-1 shrink-0">{Icons.Trash}</button>
                                                        </div>
                                                    );
                                                })}
                                                {(!f.items || f.items.length === 0) && <p className="text-xs text-slate-400 italic px-2">Nenhum link nesta pasta.</p>}
                                            </div>
                                            <button onClick={function(){handleAddLink(f.id);}} className="w-full py-2 border border-dashed border-slate-300 dark:border-slate-700 rounded text-xs font-bold text-slate-500 hover:text-brand-500 hover:border-brand-500 hover:bg-brand-50 dark:hover:bg-brand-900/20 transition-colors flex items-center justify-center gap-2 mt-auto">
                                                {Icons.Plus} Adicionar Acesso
                                            </button>
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        var LoginScreen = function(props) {
            var onLogin = props.onLogin;
            var users = props.users || [];
            var idState = useState('');
            var id = idState[0], setId = idState[1];
            var passState = useState('');
            var pass = passState[0], setPass = passState[1];
            var errState = useState('');
            var error = errState[0], setError = errState[1];

            var handleSubmit = function(e) {
                e.preventDefault();
                var cleanId = (id || '').trim();
                var cleanPass = (pass || '').trim();
                var found = users.find(function(u) { return u.id === cleanId && u.pass === cleanPass; });
                if (found) onLogin(found);
                else setError('Credenciais inválidas. Verifique matrícula e senha.');
            };

                <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950 p-4">
                    <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden fade-in">
                        <div className="p-8 pb-6 text-center border-b border-slate-100 dark:border-slate-800">
                            <div className="w-12 h-12 bg-brand-600 rounded-xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg shadow-brand-500/30">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <h1 className="text-xl font-bold text-slate-900 dark:text-white">Infra Checklist</h1>

                        <form onSubmit={handleSubmit} className="p-8 space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5 ml-1">Matrícula / ID</label>
                                <Input value={id} onChange={function(e) { setId(e.target.value); }} placeholder="0100xxxx" autoFocus />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5 ml-1">Senha</label>
                                <Input type="password" value={pass} onChange={function(e) { setPass(e.target.value); }} placeholder="••••" />
                            </div>
                            {error && <div className="text-red-500 text-xs font-medium text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg">{error}</div>}
                            <Button type="submit" className="w-full h-11 text-base mt-2">Acessar Painel</Button>
                        </form>
                        <div className="bg-slate-50 dark:bg-slate-950/50 p-4 text-center border-t border-slate-100 dark:border-slate-800">
                            <p className="text-[10px] text-slate-400 font-mono">TI COBRECOM</p>
                        </div>
                    </div>
                </div>
            );

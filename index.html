<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INFRA CENTRAL | Full Stack Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-print-color-adjust: exact; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        input, select, textarea { 
            background-color: transparent;
            outline: none;
        }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Layout: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            Stock: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Check: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Cart: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            Trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            History: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
            Edit: <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        };

        const CATEGORIAS = [
            "Teclado/Mouse", "Monitor / Suporte", "Memória / Processador / Placa Mãe",
            "SSD / HD", "Fontes", "Impressora / Zebra", "Nobreaks / Baterias",
            "Redes / Switches", "Cabos / Adaptadores", "Outros"
        ];

        const Card = ({ children, className = "", noPadding = false }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm ${noPadding ? '' : 'p-6'} ${className}`}>{children}</div>;

        const App = () => {
            const [view, setView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [stock, setStock] = useState([]);
            const [history, setHistory] = useState([]);
            const [darkMode, setDarkMode] = useState(true);
            const [showModal, setShowModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);

            useEffect(() => {
                const unsubStock = db.collection('estoque').onSnapshot(s => setStock(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubHist = db.collection('historico_estoque').orderBy('data', 'desc').limit(30).onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubStock(); unsubHist(); };
            }, []);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);

            const handleLogin = (e) => {
                e.preventDefault();
                if(e.target.id.value === "01001071") { setCurrentUser({ name: "Inacio", id: "01001071" }); setView('stock'); }
                else alert("Matrícula inválida");
            };

            const saveItem = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const itemData = {
                    cod: formData.get('cod'),
                    nome: formData.get('nome'),
                    categoria: formData.get('categoria'),
                    valor: parseFloat(formData.get('valor')) || 0,
                    qtd: parseInt(formData.get('qtd')) || 0,
                    min: parseInt(formData.get('min')) || 0,
                    max: parseInt(formData.get('max')) || 0,
                    obs: formData.get('obs')
                };

                if(editingItem) {
                    await db.collection('estoque').doc(editingItem.id).update(itemData);
                } else {
                    await db.collection('estoque').add(itemData);
                }
                setShowModal(false);
                setEditingItem(null);
            };

            const deleteItem = async (id) => {
                if(confirm("Deseja realmente excluir este item?")) await db.collection('estoque').doc(id).delete();
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900 px-4">
                    <Card className="w-full max-w-sm text-center space-y-6">
                        <h1 className="text-2xl font-bold text-brand-600 tracking-tighter">INFRA CENTRAL</h1>
                        <form onSubmit={handleLogin} className="space-y-4 text-left">
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Acesso por Matrícula</label>
                                <input name="id" placeholder="000000" className="w-full p-3 rounded-lg border dark:border-slate-700 dark:bg-slate-800 mt-1" required />
                            </div>
                            <button className="w-full bg-brand-600 text-white p-3 rounded-lg font-bold shadow-lg shadow-brand-900/40 hover:bg-brand-700 transition-all">Entrar no Sistema</button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className="w-64 bg-slate-900 text-slate-400 p-4 space-y-2 no-print shrink-0 border-r border-slate-800 flex flex-col">
                        <div className="text-white font-bold text-xl mb-10 px-2 tracking-tighter italic">STOCKPRO V2</div>
                        <nav className="flex-1 space-y-1">
                            {[
                                {id: 'stock', label: 'Inventário', icon: Icons.Stock},
                                {id: 'compras', label: 'Reposição', icon: Icons.Cart},
                                {id: 'history', label: 'Log de Estoque', icon: Icons.History},
                                {id: 'checklist', label: 'Checklist Infra', icon: Icons.Check}
                            ].map(m => (
                                <button key={m.id} onClick={() => setView(m.id)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all font-medium text-sm ${view === m.id ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'}`}>
                                    {m.icon} {m.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-2 border-t border-slate-800 text-[10px] flex justify-between items-center font-bold">
                            <span>{currentUser.name.toUpperCase()}</span>
                            <button onClick={() => setDarkMode(!darkMode)} className="p-1 hover:text-white transition-colors">{darkMode ? "🌙 MODO DARK" : "☀️ MODO LIGHT"}</button>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-auto bg-slate-50 dark:bg-slate-950 p-4 md:p-8">
                        
                        {/* VIEW: INVENTÁRIO COMPLETO */}
                        {view === 'stock' && (
                            <div className="fade-in max-w-7xl mx-auto space-y-6">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold tracking-tight">Controle de Estoque</h2>
                                        <p className="text-slate-500 text-xs mt-1">Gerenciamento detalhado de insumos e ativos T.I</p>
                                    </div>
                                    <button onClick={() => { setEditingItem(null); setShowModal(true); }} className="bg-brand-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-bold text-sm shadow-lg shadow-brand-900/20 hover:bg-brand-700 transition-all">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                        Cadastrar Item
                                    </button>
                                </div>

                                <Card noPadding className="overflow-hidden border-slate-200 dark:border-slate-800">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead className="bg-slate-50 dark:bg-slate-800/50 text-[10px] uppercase font-black text-slate-400 tracking-widest border-b dark:border-slate-700">
                                                <tr>
                                                    <th className="p-4">Código</th>
                                                    <th className="p-4">Descrição</th>
                                                    <th className="p-4">Categoria</th>
                                                    <th className="p-4">Valor</th>
                                                    <th className="p-4 text-center">Saldo</th>
                                                    <th className="p-4">Status</th>
                                                    <th className="p-4 text-right">Ação</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y dark:divide-slate-800">
                                                {stock.map(item => (
                                                    <tr key={item.id} className="hover:bg-slate-50 dark:hover:bg-slate-900/50 transition-colors group">
                                                        <td className="p-4 font-mono font-bold text-brand-600 dark:text-brand-400">{item.cod}</td>
                                                        <td className="p-4">
                                                            <div className="font-bold text-slate-800 dark:text-slate-200">{item.nome}</div>
                                                            <div className="text-[10px] text-slate-400 truncate max-w-[200px]">{item.obs || 'Sem observações'}</div>
                                                        </td>
                                                        <td className="p-4 text-slate-500">{item.categoria}</td>
                                                        <td className="p-4 font-medium text-slate-600 dark:text-slate-400">R$ {item.valor?.toFixed(2)}</td>
                                                        <td className="p-4 text-center">
                                                            <span className="text-sm font-black">{item.qtd}</span>
                                                            <div className="text-[9px] text-slate-400 uppercase">Min: {item.min} / Max: {item.max}</div>
                                                        </td>
                                                        <td className="p-4">
                                                            <Badge color={item.qtd <= item.min ? 'red' : 'green'}>
                                                                {item.qtd <= item.min ? 'Necessita Reposição' : 'Estoque OK'}
                                                            </Badge>
                                                        </td>
                                                        <td className="p-4 text-right space-x-2 whitespace-nowrap">
                                                            <button onClick={() => { setEditingItem(item); setShowModal(true); }} className="p-2 text-slate-400 hover:text-brand-500 transition-colors">{Icons.Edit}</button>
                                                            <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-400 hover:text-red-500 transition-colors">{Icons.Trash}</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {/* OUTRAS VIEWS SIMPLIFICADAS PARA INTEGRAÇÃO */}
                        {view === 'compras' && <div className="text-center py-20"><h2 className="text-2xl font-bold">Módulo Reposição</h2><p className="text-slate-500">Itens abaixo do mínimo aparecerão aqui para gerar SC.</p></div>}
                        {view === 'history' && <div className="text-center py-20"><h2 className="text-2xl font-bold">Módulo Log</h2><p className="text-slate-500">Rastreabilidade de entradas e saídas.</p></div>}
                        {view === 'checklist' && <div className="text-center py-20"><h2 className="text-2xl font-bold">Módulo Checklist</h2><p className="text-slate-500 text-sm mb-6">Redirecionando para o InfraCheck...</p><button onClick={() => window.open('checkinfra-ok.html', '_blank')} className="bg-brand-600 text-white px-6 py-2 rounded-lg font-bold">Abrir em Nova Aba</button></div>}
                        
                    </main>
                </div>
            );

            {/* MODAL DE CADASTRO COM TODOS OS CAMPOS */}
            {showModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm fade-in">
                    <Card className="w-full max-w-lg shadow-2xl border-brand-500/20">
                        <div className="flex justify-between items-center mb-6 border-b dark:border-slate-800 pb-4">
                            <h3 className="text-lg font-bold">{editingItem ? 'Editar Registro' : 'Novo Item de Estoque'}</h3>
                            <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white">&times;</button>
                        </div>
                        <form onSubmit={saveItem} className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Código</label>
                                    <input name="cod" defaultValue={editingItem?.cod} placeholder="Ex: PRD001" className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1" required />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Categoria</label>
                                    <select name="categoria" defaultValue={editingItem?.categoria} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1">
                                        {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Descrição do Item</label>
                                <input name="nome" defaultValue={editingItem?.nome} placeholder="Ex: Monitor Dell 24 pol" className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1" required />
                            </div>
                            <div className="grid grid-cols-4 gap-4">
                                <div className="col-span-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Valor Un.</label>
                                    <input name="valor" step="0.01" type="number" defaultValue={editingItem?.valor} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1" />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Qtd Atual</label>
                                    <input name="qtd" type="number" defaultValue={editingItem?.qtd} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1" required />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Qtd Mín</label>
                                    <input name="min" type="number" defaultValue={editingItem?.min} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1" required />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Qtd Máx</label>
                                    <input name="max" type="number" defaultValue={editingItem?.max} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1" />
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase">Observações / Localização</label>
                                <textarea name="obs" defaultValue={editingItem?.obs} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-700 mt-1 h-20 resize-none" placeholder="Prateleira A, Armário 2..."></textarea>
                            </div>
                            <div className="flex gap-2 pt-4">
                                <button type="button" onClick={() => setShowModal(false)} className="flex-1 p-3 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400">CANCELAR</button>
                                <button type="submit" className="flex-1 p-3 rounded-lg font-bold text-xs bg-brand-600 text-white shadow-lg shadow-brand-900/30">SALVAR REGISTRO</button>
                            </div>
                        </form>
                    </Card>
                </div>
            )}
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

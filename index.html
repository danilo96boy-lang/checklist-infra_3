<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Gestão de Estoque T.I</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --danger: #ef4444;
            --success: #10b981; --bg: #f3f4f6; --bg-card: #ffffff;
            --text-main: #111827; --text-muted: #6b7280; --border: #e5e7eb;
            --radius: 8px; --transition: all 0.2s ease-in-out;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 500; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .sidebar { width: 260px; background: #09090b; color: white; display: flex; flex-direction: column; }
        .nav-item { padding: 1rem 1.5rem; cursor: pointer; color: #a1a1aa; display: flex; align-items: center; gap: 0.75rem; transition: 0.2s; }
        .nav-item.active { background: rgba(59, 130, 246, 0.1); color: white; border-left: 3px solid var(--primary); }
        .main-content { flex: 1; overflow-y: auto; padding: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f9fafb; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal { background: white; padding: 2rem; border-radius: var(--radius); width: 90%; max-width: 500px; }
        .chart-container { height: 250px; position: relative; }
        input, select, textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; margin-top: 0.25rem; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 99px; font-size: 0.7rem; font-weight: bold; }
        .badge-danger { background: #fee2e2; color: #b91c1c; }
        .badge-success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

    <div id="login-view" style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #09090b;">
        <div class="modal" style="text-align: center;">
            <h2 style="margin-bottom: 1.5rem;">Gestão de Estoque T.I</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Usuário" required style="margin-bottom: 1rem;">
                <input type="password" id="password" placeholder="Senha" required style="margin-bottom: 1rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <div id="app-view" class="hidden" style="display: flex; height: 100vh;">
        <aside class="sidebar">
            <div style="padding: 1.5rem; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #1e1e2e;">STOCKPRO</div>
            <nav style="flex: 1; margin-top: 1rem;">
                <div class="nav-item active" onclick="switchTab('dashboard-section', this)">📊 Dashboard</div>
                <div class="nav-item" onclick="switchTab('estoque-section', this)">📦 Estoque</div>
                <div class="nav-item" onclick="switchTab('compras-section', this)">🛒 Compras</div>
            </nav>
            <div style="padding: 1rem; border-top: 1px solid #1e1e2e;">
                <span id="user-display" style="font-size: 0.8rem; color: #a1a1aa;"></span>
                <button onclick="location.reload()" class="btn btn-outline" style="width: 100%; margin-top: 0.5rem; color: white;">Sair</button>
            </div>
        </aside>

        <main class="main-content">
            <section id="dashboard-section" class="tab-content">
                <h2>Resumo Geral</h2>
                <div class="card" style="margin-top: 1rem;">
                    <div class="chart-container"><canvas id="saidasChart"></canvas></div>
                </div>
                <div class="card">
                    <h3>Últimas Movimentações</h3>
                    <table id="table-dash-hist">
                        <thead><tr><th>Data</th><th>Item</th><th>Tipo</th><th>Qtd</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section id="estoque-section" class="tab-content hidden">
                <div class="flex justify-between items-center">
                    <h2>Controle de Inventário</h2>
                    <button class="btn btn-primary" onclick="openModal('modal-cadastro')">+ Novo Item</button>
                </div>
                <div class="card" style="margin-top: 1rem;">
                    <table id="table-estoque">
                        <thead><tr><th>Código</th><th>Item</th><th>Qtd</th><th>Mín</th><th>Status</th><th>Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section id="compras-section" class="tab-content hidden">
                <h2>Necessidade de Reposição</h2>
                <div class="card" style="margin-top: 1rem;">
                    <table id="table-compras">
                        <thead><tr><th>Código</th><th>Item</th><th>Atual</th><th>Necessário</th><th>Ação</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-cadastro" class="modal-overlay">
        <div class="modal">
            <h3>Cadastrar/Editar Item</h3>
            <form id="form-item">
                <input type="text" id="item-cod" placeholder="Código (Ex: PRD001)" required>
                <input type="text" id="item-nome" placeholder="Nome do Item" required>
                <input type="number" id="item-qtd" placeholder="Qtd Inicial" required>
                <input type="number" id="item-min" placeholder="Qtd Mínima" required>
                <div class="flex gap-2" style="margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('modal-cadastro')">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-mov" class="modal-overlay">
        <div class="modal">
            <h3 id="mov-title">Movimentar</h3>
            <p id="mov-item-name" style="color: var(--text-muted); margin-bottom: 1rem;"></p>
            <form id="form-mov">
                <input type="hidden" id="mov-cod">
                <select id="mov-tipo">
                    <option value="Entrada">Entrada (+)</option>
                    <option value="Saída">Saída (-)</option>
                </select>
                <input type="number" id="mov-qtd" placeholder="Quantidade" required min="1">
                <input type="text" id="mov-obs" placeholder="Motivo / Responsável">
                <div class="flex gap-2" style="margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('modal-mov')">Cancelar</button>
                    <button type="submit" class="btn btn-success" style="flex: 1;">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ESTADO DA APLICAÇÃO
        let estoque = JSON.parse(localStorage.getItem('stock_data')) || [];
        let historico = JSON.parse(localStorage.getItem('stock_hist')) || [];
        let chartInstance = null;

        // LOGIN
        document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('user-display').innerText = "Logado como: " + document.getElementById('username').value;
            renderAll();
        };

        // NAVEGAÇÃO
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            el.classList.add('active');
            if(tabId === 'dashboard-section') renderChart();
        }

        // MODAIS
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // CRUD ESTOQUE
        document.getElementById('form-item').onsubmit = (e) => {
            e.preventDefault();
            const novo = {
                cod: document.getElementById('item-cod').value,
                nome: document.getElementById('item-nome').value,
                qtd: parseInt(document.getElementById('item-qtd').value),
                min: parseInt(document.getElementById('item-min').value)
            };
            const idx = estoque.findIndex(i => i.cod === novo.cod);
            if(idx > -1) estoque[idx] = novo; else estoque.push(novo);
            save();
            closeModal('modal-cadastro');
            renderAll();
        };

        // MOVIMENTAÇÃO
        function openMov(cod) {
            const item = estoque.find(i => i.cod === cod);
            document.getElementById('mov-cod').value = cod;
            document.getElementById('mov-item-name').innerText = item.nome;
            openModal('modal-mov');
        }

        document.getElementById('form-mov').onsubmit = (e) => {
            e.preventDefault();
            const cod = document.getElementById('mov-cod').value;
            const qtd = parseInt(document.getElementById('mov-qtd').value);
            const tipo = document.getElementById('mov-tipo').value;
            const item = estoque.find(i => i.cod === cod);

            if(tipo === 'Saída' && item.qtd < qtd) return alert('Estoque insuficiente!');
            
            item.qtd = tipo === 'Entrada' ? item.qtd + qtd : item.qtd - qtd;
            historico.push({ date: new Date().toLocaleString(), item: item.nome, tipo, qtd });
            
            save();
            closeModal('modal-mov');
            renderAll();
        };

        // RENDERIZAÇÃO
        function save() {
            localStorage.setItem('stock_data', JSON.stringify(estoque));
            localStorage.setItem('stock_hist', JSON.stringify(historico));
        }

        function renderAll() {
            const tEstoque = document.querySelector('#table-estoque tbody');
            const tCompras = document.querySelector('#table-compras tbody');
            const tDash = document.querySelector('#table-dash-hist tbody');

            tEstoque.innerHTML = estoque.map(i => `
                <tr>
                    <td>${i.cod}</td>
                    <td>${i.nome}</td>
                    <td><b>${i.qtd}</b></td>
                    <td>${i.min}</td>
                    <td><span class="badge ${i.qtd <= i.min ? 'badge-danger' : 'badge-success'}">${i.qtd <= i.min ? 'Repor' : 'OK'}</span></td>
                    <td><button class="btn btn-outline" onclick="openMov('${i.cod}')">Movimentar</button></td>
                </tr>
            `).join('');

            tCompras.innerHTML = estoque.filter(i => i.qtd <= i.min).map(i => `
                <tr>
                    <td>${i.cod}</td>
                    <td>${i.nome}</td>
                    <td>${i.qtd}</td>
                    <td style="color:red">${i.min + 5}</td>
                    <td><button class="btn btn-primary" onclick="openMov('${i.cod}')">Entrada</button></td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center">Nenhuma reposição necessária</td></tr>';

            tDash.innerHTML = historico.slice(-5).reverse().map(h => `
                <tr><td>${h.date}</td><td>${h.item}</td><td>${h.tipo}</td><td>${h.qtd}</td></tr>
            `).join('');

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('saidasChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            
            const labels = estoque.map(i => i.nome);
            const data = estoque.map(i => i.qtd);

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{ label: 'Qtd em Estoque', data, backgroundColor: '#2563eb' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Início
        renderAll();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INFRA CENTRAL | Stock & Checklist</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-print-color-adjust: exact; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const Icons = {
            Dashboard: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            Stock: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Check: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Cart: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            Trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Plus: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            History: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        };

        // --- COMPONENTES ---
        const Card = ({ children, className = "", noPadding = false }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm ${noPadding ? '' : 'p-6'} ${className}`}>{children}</div>;
        
        const Badge = ({ children, color = 'green' }) => {
            const colors = {
                red: "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400",
                green: "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400",
                yellow: "bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400"
            };
            return <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${colors[color]}`}>{children}</span>;
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [currentUser, setCurrentUser] = useState(null);
            const [stock, setStock] = useState([]);
            const [tickets, setTickets] = useState([]);
            const [history, setHistory] = useState([]);
            const [selectedItems, setSelectedItems] = useState([]);

            // Monitorar dados do Firebase
            useEffect(() => {
                const unsubStock = db.collection('estoque').onSnapshot(s => setStock(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubCheck = db.collection('tickets').onSnapshot(s => setTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubHist = db.collection('historico_estoque').orderBy('data', 'desc').limit(20).onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubStock(); unsubCheck(); unsubHist(); };
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const id = e.target.id.value;
                if(id === "01001071") { setCurrentUser({ name: "Inacio", id }); setView('stock'); }
                else alert("Matrícula não autorizada");
            };

            const toggleSelectItem = (id) => {
                setSelectedItems(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const registrarMovimentacao = async (itemId, tipo, qtd, motivo) => {
                const itemRef = db.collection('estoque').doc(itemId);
                const item = stock.find(i => i.id === itemId);
                const novaQtd = tipo === 'Entrada' ? item.qtd + qtd : item.qtd - qtd;

                if(novaQtd < 0) return alert("Estoque insuficiente");

                await itemRef.update({ qtd: novaQtd });
                await db.collection('historico_estoque').add({
                    itemId,
                    nome: item.nome,
                    tipo,
                    qtd,
                    data: new Date().toISOString(),
                    usuario: currentUser.name,
                    motivo
                });
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900">
                    <Card className="w-80 text-center space-y-6">
                        <h1 className="text-2xl font-bold text-brand-600 tracking-tighter">INFRA CENTRAL</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input name="id" placeholder="Matrícula" className="w-full p-3 rounded-lg border dark:bg-slate-800 outline-none focus:ring-2 focus:ring-brand-500" required />
                            <button className="w-full bg-brand-600 text-white p-3 rounded-lg font-bold shadow-lg shadow-brand-900/40">Acessar Painel</button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR GLOBAL */}
                    <aside className="w-64 bg-slate-900 text-slate-400 p-4 space-y-2 no-print shrink-0 border-r border-slate-800">
                        <div className="text-white font-bold text-xl mb-10 px-2 tracking-tighter italic">STOCKPRO+</div>
                        {[
                            {id: 'stock', label: 'Inventário', icon: Icons.Stock},
                            {id: 'compras', label: 'Reposição', icon: Icons.Cart},
                            {id: 'history_stock', label: 'Log de Estoque', icon: Icons.History},
                            {id: 'checklist_global', label: 'Checklists Infra', icon: Icons.Check},
                        ].map(m => (
                            <button key={m.id} onClick={() => setView(m.id)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all ${view === m.id ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'}`}>
                                {m.icon} {m.label}
                            </button>
                        ))}
                    </aside>

                    <main className="flex-1 overflow-auto bg-slate-50 dark:bg-slate-950 p-6 md:p-10">
                        
                        {/* VIEW: INVENTÁRIO (ESTOQUE) */}
                        {view === 'stock' && (
                            <div className="fade-in max-w-6xl mx-auto">
                                <div className="flex justify-between items-center mb-8">
                                    <div>
                                        <h2 className="text-3xl font-bold tracking-tight">Estoque T.I</h2>
                                        <p className="text-slate-500 text-sm">Controle de ativos e insumos</p>
                                    </div>
                                    <button onClick={() => {
                                        const nome = prompt("Descrição do item:");
                                        const cod = prompt("Código:");
                                        const min = prompt("Qtd Mínima:");
                                        if(nome && cod) db.collection('estoque').add({nome, cod, qtd: 0, min: parseInt(min) || 5});
                                    }} className="bg-brand-600 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 font-bold text-sm shadow-lg shadow-brand-900/20">
                                        {Icons.Plus} Novo Registro
                                    </button>
                                </div>
                                <Card noPadding className="overflow-hidden">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase font-black text-slate-400 tracking-widest border-b dark:border-slate-700">
                                            <tr>
                                                <th className="p-4">Cód</th>
                                                <th className="p-4">Item</th>
                                                <th className="p-4 text-center">Saldo</th>
                                                <th className="p-4">Status</th>
                                                <th className="p-4 text-right">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y dark:divide-slate-800">
                                            {stock.map(i => (
                                                <tr key={i.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                                    <td className="p-4 font-mono text-xs text-slate-500">{i.cod}</td>
                                                    <td className="p-4 font-semibold">{i.nome}</td>
                                                    <td className="p-4 text-center font-bold text-lg">{i.qtd}</td>
                                                    <td className="p-4">
                                                        <Badge color={i.qtd <= i.min ? 'red' : 'green'}>{i.qtd <= i.min ? 'Repor' : 'OK'}</Badge>
                                                    </td>
                                                    <td className="p-4 text-right space-x-2">
                                                        <button onClick={() => registrarMovimentacao(i.id, 'Entrada', 1, 'Ajuste manual')} className="p-2 bg-emerald-50 text-emerald-600 rounded-lg hover:bg-emerald-100 font-bold text-xs">+</button>
                                                        <button onClick={() => registrarMovimentacao(i.id, 'Saída', 1, 'Ajuste manual')} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 font-bold text-xs">-</button>
                                                        <button onClick={() => confirm("Apagar item?") && db.collection('estoque').doc(i.id).delete()} className="p-2 text-slate-300 hover:text-red-500 transition-colors">{Icons.Trash}</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </Card>
                            </div>
                        )}

                        {/* VIEW: REPOSIÇÃO (COMPRAS) */}
                        {view === 'compras' && (
                            <div className="fade-in max-w-5xl mx-auto">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="text-3xl font-bold">Necessidade de Compra</h2>
                                    <button 
                                        disabled={selectedItems.length === 0}
                                        className="bg-brand-600 text-white px-6 py-3 rounded-xl font-bold disabled:opacity-30 shadow-lg"
                                        onClick={() => alert(`SC Gerada para ${selectedItems.length} itens.`)}
                                    >🛒 Gerar Solicitação ({selectedItems.length})</button>
                                </div>
                                <div className="grid gap-4">
                                    {stock.filter(i => i.qtd <= i.min).map(i => (
                                        <div key={i.id} onClick={() => toggleSelectItem(i.id)} className={`p-5 rounded-2xl border cursor-pointer transition-all flex items-center justify-between ${selectedItems.includes(i.id) ? 'border-brand-500 bg-brand-50/50 ring-2 ring-brand-500/20' : 'bg-white dark:bg-slate-900 border-slate-200'}`}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-6 h-6 rounded-full border flex items-center justify-center ${selectedItems.includes(i.id) ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300'}`}>
                                                    {selectedItems.includes(i.id) && "✓"}
                                                </div>
                                                <div>
                                                    <h4 className="font-bold">{i.nome}</h4>
                                                    <p className="text-xs text-slate-500">Saldo atual: {i.qtd} | Mínimo: {i.min}</p>
                                                </div>
                                            </div>
                                            <Badge color="red">Crítico</Badge>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* VIEW: HISTÓRICO ESTOQUE */}
                        {view === 'history_stock' && (
                            <div className="fade-in max-w-5xl mx-auto">
                                <h2 className="text-3xl font-bold mb-8 text-slate-400">Log de Movimentações</h2>
                                <Card noPadding>
                                    <div className="divide-y dark:divide-slate-800">
                                        {history.map(h => (
                                            <div key={h.id} className="p-4 flex items-center justify-between">
                                                <div className="flex gap-4 items-center">
                                                    <span className={`w-2 h-2 rounded-full ${h.tipo === 'Entrada' ? 'bg-emerald-500' : 'bg-red-500'}`}></span>
                                                    <div>
                                                        <div className="font-bold text-sm">{h.nome}</div>
                                                        <div className="text-[10px] text-slate-500 font-mono">{new Date(h.data).toLocaleString()}</div>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className={`font-black ${h.tipo === 'Entrada' ? 'text-emerald-600' : 'text-red-600'}`}>{h.tipo === 'Entrada' ? '+' : '-'}{h.qtd}</div>
                                                    <div className="text-[10px] uppercase text-slate-500">{h.usuario}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </Card>
                            </div>
                        )}

                        {/* VIEW: CHECKLISTS (INTEGRADO) */}
                        {view === 'checklist_global' && (
                            <div className="fade-in max-w-5xl mx-auto text-center py-20">
                                <h2 className="text-4xl font-black mb-4">Acesso ao InfraCheck</h2>
                                <p className="text-slate-500 mb-10">Módulo de checklists técnicos e relatórios de formatação.</p>
                                <button onClick={() => window.open('checkinfra-ok.html', '_blank')} className="bg-brand-600 text-white px-10 py-4 rounded-2xl font-bold shadow-2xl">Abrir Módulo Checklist</button>
                            </div>
                        )}
                        
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

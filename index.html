                var ticket = props.ticket;
                var onBack = props.onBack;
                var onArchive = props.onArchive;
                var onRevertHistory = props.onRevertHistory;
                var logo = props.logo;
                var isHistory = props.isHistory;
                var obsState = useState(ticket && ticket.data && ticket.data.obs ? ticket.data.obs : (ticket && ticket.obs ? ticket.obs : ''));
                var obs = obsState[0], setObs = obsState[1];

                if (!ticket || !ticket.data) return null;
                var meta = ticket.data.meta || {};
                var items = ticket.data.items || {};
                var identificador = meta.maquina || meta.ativo || "N/A";
                var mainTecnico = ticket.type === 'diario' ? 'EQUIPE' : meta.tecnico;
                
                var totalTasks = 0, checkedTasks = 0;
                var pendingList = [];
                var itemObsList = [];

                var categorySummary = Object.keys(items).map(function(k) {
                    var group = items[k];
                    var tasks = group.tasks || [];
                    var total = tasks.length;
                    var checked = tasks.filter(function(t) { return t.checked; }).length;
                    tasks.forEach(function(t) { 
                        if (!t.checked) pendingList.push("- [" + group.title + "] " + t.label); 
                        if (t.obs && t.obs.trim() !== '') itemObsList.push("- [" + t.label + "]: " + t.obs);
                    });
                    totalTasks += total;
                    checkedTasks += checked;
                    return { title: group.title, status: checked === total ? "OK" : "PENDENTE" };
                });
                var percent = totalTasks === 0 ? 0 : Math.round((checkedTasks / totalTasks) * 100);
                var statusGlobal = percent === 100 ? "CONCLUÍDO" : "PARCIAL";

                var handleSendOutlook = function() {
                    var checklistFormatted = Object.keys(items).map(function(k) {
                        var group = items[k];
                        var tasksText = (group.tasks || []).map(function(t) {
                            var whoDidIt = (t.checked && t.checkedBy) ? " (Feito por: " + t.checkedBy.split(' ')[0] + ")" : "";
                            var obsText = (t.obs && t.obs.trim() !== '') ? "\n        -> OBS: " + t.obs : "";
                            return "    " + (t.checked ? "[X]" : "[ ]") + " " + t.label + whoDidIt + obsText;
                        }).join("\n");
                        return "• " + group.title + "\n" + tasksText;
                    }).join("\n\n");

                    var pendingFormatted = pendingList.length > 0 ? pendingList.join("\n") : "Nenhuma pendência.";

                    var subject = "[" + statusGlobal + "] Relatório Técnico #" + ticket.visualId + " - " + identificador;
                    var body = 
                        "========================================\n" +
                        "             RELATÓRIO TÉCNICO - INFRA HUB\n" +
                        "========================================\n\n" +
                        "ID DO REGISTRO: #" + ticket.visualId + "\n" +
                        "DATA: " + new Date(ticket.createdAt || ticket.date || Date.now()).toLocaleDateString() + "\n" +
                        "TÉCNICO RESPONSÁVEL: " + (ticket.type === 'diario' ? 'MÚLTIPLOS (VER ITEM A ITEM)' : (meta.tecnico || 'N/A')) + "\n" +
                        "ATIVO / DEPARTAMENTO: " + (meta.ativo || 'N/A') + "\n" +
                        "MÁQUINA / FINALIDADE: " + identificador + "\n" +
                        "STATUS GLOBAL: " + statusGlobal + " (" + percent + "% CONCLUÍDO)\n\n" +
                        "----------------------------------------\n" +
                        "DETALHAMENTO DO CHECKLIST:\n" +
                        "----------------------------------------\n\n" +
                        checklistFormatted + "\n\n" +
                        "----------------------------------------\n" +
                        "PENDÊNCIAS:\n" +
                        "----------------------------------------\n" +
                        pendingFormatted + "\n\n" +
                        "----------------------------------------\n" +
                        "OBSERVAÇÕES FINAIS:\n" +
                        "----------------------------------------\n" +
                        (obs || "Sem observações adicionais.") + "\n\n" +
                        "========================================\n" +
                        "Gerado automaticamente via Infra Hub Cobrecom";

                    window.location.href = "mailto:" + EMAIL_DESTINO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
                    setTimeout(function() {
                        if (confirm("E-mail aberto? Clique OK para arquivar.")) onArchive(Object.assign({}, ticket, { data: Object.assign({}, ticket.data, { obs: obs }) }));
                    }, 1000);
                };

                return (
                    <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-950 overflow-auto p-4 md:p-8">
                        <div className="max-w-4xl mx-auto w-full space-y-6 fade-in no-print">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2 text-slate-500 hover:text-slate-700 cursor-pointer" onClick={onBack}>
                                    {Icons.ChevronLeft} <span className="font-bold text-sm">Voltar</span>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white">{isHistory ? 'Visualização do Relatório' : 'Revisão & Entrega'}</h1>
                            </div>

                            <Card className="grid md:grid-cols-2 gap-6">
                                <div className="space-y-4">
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Observações Finais Globais</label>
                                    <textarea readOnly={isHistory} value={obs} onChange={function(e) { setObs(e.target.value.toUpperCase()); }} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm h-32 resize-none focus:ring-2 focus:ring-brand-500/20 outline-none uppercase" placeholder="DETALHES ADICIONAIS, PEÇAS TROCADAS, ETC..."></textarea>
                                </div>
                                <div className="flex flex-col justify-center gap-3 md:border-l border-slate-100 dark:border-slate-800 md:pl-6">
                                    <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300">Ações {isHistory ? 'do Relatório' : 'de Encerramento'}</h3>
                                    <Button className="w-full justify-start" onClick={function() { window.print(); }} variant="secondary">{Icons.Printer} Imprimir Relatório</Button>
                                    {isHistory ? (
                                        <Button className="w-full justify-start bg-amber-600 hover:bg-amber-700 text-white" onClick={function() { if(onRevertHistory) onRevertHistory(ticket); }}>{Icons.Refresh} Retornar para Ativos</Button>
                                    ) : (
                                        <Button className="w-full justify-start" onClick={handleSendOutlook}>{Icons.Mail} Enviar E-mail & Arquivar</Button>
                                    )}
                                </div>
                            </Card>
                        </div>

                        <div id="receipt-area" className="hidden print:block bg-white text-black font-sans text-xs border border-gray-300 p-0">
                            <div className="flex justify-between items-center p-6 border-b-2 border-black">
                                <div className="flex items-center gap-4">{logo && <img src={logo} className="h-10 object-contain" />}<div><h1 className="text-xl font-bold tracking-tighter uppercase">Relatório Técnico</h1><p className="text-[10px] uppercase tracking-widest text-gray-500">Departamento de TI • Infraestrutura</p></div></div>
                                <div className="text-right"><div className="text-2xl font-mono font-bold">#{ticket.visualId || 'PEND'}</div><div className="text-[10px] font-bold">{new Date(ticket.createdAt || ticket.date || Date.now()).toLocaleDateString()}</div></div>
                            </div>
                            <div className="grid grid-cols-4 border-b border-black">
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Ativo</span><span className="font-bold text-sm block truncate uppercase">{meta.ativo || 'N/A'}</span></div>
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Máquina</span><span className="font-bold text-sm block truncate uppercase">{identificador}</span></div>
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Técnico</span><span className="font-bold uppercase truncate">{mainTecnico}</span></div>
                                <div className={"p-3 text-center flex flex-col justify-center " + (percent === 100 ? 'bg-gray-100' : 'bg-gray-200')}><span className="block text-[9px] font-bold uppercase text-gray-500">Status</span><span className="font-bold text-sm">{statusGlobal}</span></div>
                            </div>
                            <div className="p-6 flex gap-8">
                                <div className="w-1/2"><h3 className="font-bold uppercase text-[10px] mb-2 border-b border-black pb-1">Checklist</h3><table className="w-full text-left border-collapse"><tbody>{categorySummary.map(function(cat, i) { return (<tr key={i} className="border-b border-dotted border-gray-400"><td className="py-1.5 font-medium uppercase">{cat.title}</td><td className="py-1.5 text-right font-mono font-bold">{cat.status === 'OK' ? 'OK' : '⚠'}</td></tr>); })}</tbody></table></div>
                                <div className="w-1/2 flex flex-col gap-4">
                                    {pendingList.length > 0 && (<div className="border border-black p-2 bg-gray-50"><h3 className="font-bold uppercase text-[9px] mb-1">Pendências</h3><ul className="list-disc list-inside text-[10px] space-y-0.5">{pendingList.map(function(p, i) { return <li key={i} className="truncate uppercase">{p.replace('- ', '')}</li>; })}</ul></div>)}
                                    {itemObsList.length > 0 && (<div className="border border-black p-2 bg-gray-50"><h3 className="font-bold uppercase text-[9px] mb-1">Obs. dos Itens</h3><ul className="list-disc list-inside text-[10px] space-y-0.5">{itemObsList.map(function(o, i) { return <li key={i} className="uppercase">{o}</li>; })}</ul></div>)}
                                    <div><h3 className="font-bold uppercase text-[10px] mb-1 border-b border-black pb-1">Observações Globais</h3><p className="text-[10px] leading-relaxed italic h-16 uppercase">{obs || "Sem observações adicionais."}</p></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            var Dashboard = function(props) {
                var activeTickets = props.activeTickets || [];
                var onOpenTicket = props.onOpenTicket;
                var onDeleteTicket = props.onDeleteTicket;
                var historyCount = props.historyCount || 0;
                var formatCount = activeTickets.filter(function(t) { return t.type === 'formatacao'; }).length;

                return (
                    <div className="p-6 md:p-10 space-y-8 fade-in">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Visão Geral</h2>
                            <p className="text-slate-500 text-sm">Monitoramento de atividades de infraestrutura em tempo real.</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-brand-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Registos Ativos</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{activeTickets.length}</h3></div>
                                <div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-xl text-brand-600">{Icons.Layout}</div>
                            </Card>
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-emerald-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Total de Operações</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{historyCount}</h3></div>
                                <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl text-emerald-600">{Icons.History}</div>
                            </Card>
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-indigo-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Formatações PC</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{formatCount}</h3></div>
                                <div className="bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl text-indigo-600">{Icons.Server}</div>
                            </Card>
                        </div>

                        <div>
                            <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">{Icons.Server} Painel de Execução</h3>
                            {activeTickets.length === 0 ? (
                                <div className="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-12 text-center">
                                    <p className="text-slate-400 font-medium">Nenhum checklist em andamento.</p>
                                    <p className="text-xs text-slate-500 mt-1">Utilize o menu lateral para iniciar uma atividade.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeTickets.map(function(ticket) {
                                        var meta = (ticket.data && ticket.data.meta) || {};
                                        var pct = calcProgress(ticket.data && ticket.data.items);
                                        var nomeAtivo = (meta.maquina || meta.ativo || "Sem Identificação").toUpperCase();
                                        
                                        return (
                                            <div key={ticket.id} onClick={function() { onOpenTicket(ticket.id); }} className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 hover:shadow-lg hover:border-brand-400 dark:hover:border-brand-500 transition-all cursor-pointer relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div className="flex items-center gap-2">
                                                        <Badge color={ticket.type === 'formatacao' ? 'blue' : ticket.type === 'diario' ? 'green' : ticket.type === 'rack' ? 'indigo' : 'amber'}>
                                                            {ticket.type === 'formatacao' ? 'Formatação' : ticket.type === 'diario' ? 'Diário' : ticket.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                                        </Badge>
                                                        <span className="text-[9px] font-bold uppercase text-slate-400 flex items-center gap-1">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span> Em Execução
                                                        </span>
                                                    </div>
                                                    <span className="text-xs font-mono font-bold text-slate-400">#{ticket.visualId}</span>
                                                </div>
                                                <h4 className="font-bold text-slate-800 dark:text-white text-lg truncate mb-1 uppercase">{nomeAtivo}</h4>
                                                <p className="text-xs text-slate-500 mb-4 flex items-center gap-1 uppercase">{Icons.User} {ticket.type === 'diario' ? 'EQUIPE' : (meta.tecnico || 'Técnico')}</p>
                                                
                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                        <div className={"h-full " + (pct === 100 ? "bg-emerald-500" : "bg-brand-500")} style={{width: pct + '%'}}></div>
                                                    </div>
                                                    <span className="text-xs font-bold text-brand-600">{pct}%</span>
                                                </div>
                                                <button onClick={function(e) { onDeleteTicket(e, ticket.id); }} className="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition-colors opacity-0 md:group-hover:opacity-100" title="Excluir registo">{Icons.Trash}</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

var AnalyticsView = function(props) {
                var history = props.history || [];
                var activeTickets = props.activeTickets || [];
                var kanbanTasks = props.kanbanTasks || [];
                var desktops = props.desktops || [];

                var periodState = useState('all'); // '7d', '30d', 'month', 'all'
                var period = periodState[0], setPeriod = periodState[1];

                var chartTypeRef = useRef(null);
                var chartTechRef = useRef(null);
                var chartTrendRef = useRef(null);
                var chartSectorRef = useRef(null);

                var canvasType = useRef(null);
                var canvasTech = useRef(null);
                var canvasTrend = useRef(null);
                var canvasSector = useRef(null);

                // Filtrar histórico por período selecionado
                var now = new Date();
                var filteredHistory = history.filter(function(h) {
                    if (period === 'all') return true;
                    var hDate = new Date(h.date || Date.now());
                    var diffDays = (now - hDate) / (1000 * 60 * 60 * 24);
                    if (period === '7d') return diffDays <= 7;
                    if (period === '30d') return diffDays <= 30;
                    if (period === 'month') {
                        return hDate.getMonth() === now.getMonth() && hDate.getFullYear() === now.getFullYear();
                    }
                    return true;
                });

                useEffect(function() {
                    var isDark = document.documentElement.classList.contains('dark');
                    var textColor = isDark ? '#94a3b8' : '#64748b';
                    var gridColor = isDark ? 'rgba(148, 163, 184, 0.08)' : 'rgba(100, 116, 139, 0.1)';

                    // 1. Dados: Categorias e Técnicos
                    var typeCounts = { formatacao: 0, diario: 0, rack: 0, zebra: 0 };
                    var techCounts = {};
                    var trendMap = {};

                    var daysToTrack = period === '7d' ? 7 : 14;
                    for (var i = daysToTrack - 1; i >= 0; i--) {
                        var d = new Date();
                        d.setDate(d.getDate() - i);
                        var dayStr = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                        trendMap[dayStr] = 0;
                    }

                    filteredHistory.forEach(function(h) {
                        if (typeCounts[h.type] !== undefined) typeCounts[h.type]++;
                        
                        // Se for check diário, contabiliza também quem marcou os itens internos
                        if (h.type === 'diario' && h.data && h.data.items) {
                            var countedInDaily = {};
                            Object.keys(h.data.items).forEach(function(k) {
                                var tasks = h.data.items[k].tasks || [];
                                tasks.forEach(function(t) {
                                    if (t.checked && t.checkedBy) {
                                        var shortName = t.checkedBy.trim().toUpperCase();
                                        countedInDaily[shortName] = true;
                                    }
                                });
                            });
                            var participants = Object.keys(countedInDaily);
                            if (participants.length > 0) {
                                participants.forEach(function(p) { techCounts[p] = (techCounts[p] || 0) + 1; });
                            } else {
                                techCounts['EQUIPE TI'] = (techCounts['EQUIPE TI'] || 0) + 1;
                            }
                        } else {
                            var tech = (h.tecnico || 'N/A').trim().toUpperCase();
                            techCounts[tech] = (techCounts[tech] || 0) + 1;
                        }

                        var hDate = new Date(h.date || Date.now());
                        var hDayStr = hDate.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                        if (trendMap[hDayStr] !== undefined) {
                            trendMap[hDayStr]++;
                        }
                    });

                    // Gráfico 1: Categorias (Doughnut)
                    if (chartTypeRef.current) chartTypeRef.current.destroy();
                    if (canvasType.current && filteredHistory.length > 0) {
                        chartTypeRef.current = new Chart(canvasType.current, {
                            type: 'doughnut',
                            data: {
                                labels: ['Formatação PC', 'Check Diário', 'Rack / Switch', 'Manut. Zebra'],
                                datasets: [{
                                    data: [typeCounts.formatacao, typeCounts.diario, typeCounts.rack, typeCounts.zebra],
                                    backgroundColor: ['#3b82f6', '#10b981', '#6366f1', '#f59e0b'],
                                    borderWidth: 0,
                                    hoverOffset: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                cutout: '72%',
                                plugins: {
                                    legend: { position: 'bottom', labels: { color: textColor, padding: 16, font: { family: 'Inter', size: 11, weight: '600' } } }
                                }
                            }
                        });
                    }

                    // Gráfico 2: Produtividade por Técnico (Barras)
                    if (chartTechRef.current) chartTechRef.current.destroy();
                    if (canvasTech.current && filteredHistory.length > 0) {
                        var sortedTechs = Object.keys(techCounts).sort(function(a, b) { return techCounts[b] - techCounts[a]; });
                        chartTechRef.current = new Chart(canvasTech.current, {
                            type: 'bar',
                            data: {
                                labels: sortedTechs,
                                datasets: [{
                                    label: 'Participações / Concluídos',
                                    data: sortedTechs.map(function(k) { return techCounts[k]; }),
                                    backgroundColor: ['#3b82f6', '#6366f1', '#10b981', '#f59e0b', '#ec4899'],
                                    borderRadius: 6,
                                    maxBarThickness: 42
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: { beginAtZero: true, ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } },
                                    x: { ticks: { color: textColor, font: { weight: 'bold', size: 10 } }, grid: { display: false } }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    }

                    // Gráfico 3: Curva de Execução (Linha)
                    if (chartTrendRef.current) chartTrendRef.current.destroy();
                    if (canvasTrend.current && filteredHistory.length > 0) {
                        var ctx = canvasTrend.current.getContext('2d');
                        var grad = ctx.createLinearGradient(0, 0, 0, 260);
                        grad.addColorStop(0, 'rgba(59, 130, 246, 0.35)');
                        grad.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

                        chartTrendRef.current = new Chart(canvasTrend.current, {
                            type: 'line',
                            data: {
                                labels: Object.keys(trendMap),
                                datasets: [{
                                    label: 'Checklists Finalizados',
                                    data: Object.values(trendMap),
                                    borderColor: '#3b82f6',
                                    backgroundColor: grad,
                                    borderWidth: 2.5,
                                    pointBackgroundColor: '#3b82f6',
                                    pointRadius: 4,
                                    fill: true,
                                    tension: 0.35
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: { beginAtZero: true, ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } },
                                    x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    }

                    // Gráfico 4: Desktops por Setor (Top 6 Setores)
                    if (chartSectorRef.current) chartSectorRef.current.destroy();
                    if (canvasSector.current && desktops.length > 0) {
                        var secMap = {};
                        desktops.forEach(function(d) {
                            var s = (d.setor || 'SEM SETOR').trim().toUpperCase();
                            secMap[s] = (secMap[s] || 0) + 1;
                        });
                        var topSectors = Object.keys(secMap).sort(function(a, b) { return secMap[b] - secMap[a]; }).slice(0, 6);

                        chartSectorRef.current = new Chart(canvasSector.current, {
                            type: 'bar',
                            data: {
                                labels: topSectors,
                                datasets: [{
                                    label: 'Máquinas Catalogadas',
                                    data: topSectors.map(function(s) { return secMap[s]; }),
                                    backgroundColor: '#10b981',
                                    borderRadius: 6,
                                    maxBarThickness: 32
                                }]
                            },
                            options: {
                                indexAxis: 'y',
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    x: { beginAtZero: true, ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } },
                                    y: { ticks: { color: textColor, font: { weight: 'bold', size: 10 } }, grid: { display: false } }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    }

                    return function() {
                        if (chartTypeRef.current) chartTypeRef.current.destroy();
                        if (chartTechRef.current) chartTechRef.current.destroy();
                        if (chartTrendRef.current) chartTrendRef.current.destroy();
                        if (chartSectorRef.current) chartSectorRef.current.destroy();
                    };
                }, [filteredHistory, desktops, period]);

                // Cálculos de KPIs
                var todayStr = new Date().toLocaleDateString('pt-BR');
                var todayOps = history.filter(function(h) {
                    return new Date(h.date || Date.now()).toLocaleDateString('pt-BR') === todayStr;
                }).length;

                var activeKanban = kanbanTasks.filter(function(t) { return !t.archived && t.status !== 'concluido'; }).length;
                var impedimentosKanban = kanbanTasks.filter(function(t) { return !t.archived && t.status === 'impedimentos'; }).length;

                return (
                    <div className="p-4 md:p-10 h-full flex flex-col fade-in overflow-auto">
                        <div className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-brand-600 rounded-xl text-white shadow-lg shadow-brand-500/20">{Icons.BarChart}</div>
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Dashboard Analítico</h2>
                                    <p className="text-slate-500 text-sm">Indicadores consolidados de Checklists, Kanban e Parque de Máquinas.</p>
                                </div>
                            </div>

                            {/* Filtro de Período */}
                            <div className="flex items-center bg-white dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-800 self-start sm:self-auto">
                                {[
                                    { id: '7d', label: '7 Dias' },
                                    { id: '30d', label: '30 Dias' },
                                    { id: 'month', label: 'Este Mês' },
                                    { id: 'all', label: 'Tudo' }
                                ].map(function(btn) {
                                    return (
                                        <button
                                            key={btn.id}
                                            onClick={function() { setPeriod(btn.id); }}
                                            className={"px-3 py-1.5 rounded-lg text-xs font-bold transition-all " + (period === btn.id ? "bg-brand-600 text-white shadow-sm" : "text-slate-500 hover:text-slate-800 dark:hover:text-white")}
                                        >
                                            {btn.label}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Linha de KPIs (4 Cards) */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            <Card className="p-5 border-l-4 border-l-brand-500">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-[11px] font-bold uppercase text-slate-400 tracking-wider">Checklists Concluídos</p>
                                        <h3 className="text-3xl font-black text-slate-800 dark:text-white mt-1">{filteredHistory.length}</h3>
                                    </div>
                                    <div className="p-2.5 rounded-lg bg-brand-50 dark:bg-brand-900/20 text-brand-500">{Icons.Check}</div>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">{todayOps} finalizado(s) hoje • {activeTickets.length} em aberto</p>
                            </Card>

                            <Card className="p-5 border-l-4 border-l-emerald-500">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-[11px] font-bold uppercase text-slate-400 tracking-wider">Parque Catalogado</p>
                                        <h3 className="text-3xl font-black text-slate-800 dark:text-white mt-1">{desktops.length}</h3>
                                    </div>
                                    <div className="p-2.5 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 text-emerald-500">{Icons.Monitor}</div>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">Desktops com QR Code / MAC</p>
                            </Card>

                            <Card className="p-5 border-l-4 border-l-indigo-500">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-[11px] font-bold uppercase text-slate-400 tracking-wider">Pendências Kanban</p>
                                        <h3 className="text-3xl font-black text-slate-800 dark:text-white mt-1">{activeKanban}</h3>
                                    </div>
                                    <div className="p-2.5 rounded-lg bg-indigo-50 dark:bg-indigo-900/20 text-indigo-500">{Icons.Kanban}</div>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">
                                    {impedimentosKanban > 0 ? <span className="text-red-400 font-bold">{impedimentosKanban} com impedimento!</span> : 'Nenhum impedimento ativo'}
                                </p>
                            </Card>

                            <Card className="p-5 border-l-4 border-l-amber-500">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-[11px] font-bold uppercase text-slate-400 tracking-wider">Formatações no Período</p>
                                        <h3 className="text-3xl font-black text-slate-800 dark:text-white mt-1">
                                            {filteredHistory.filter(function(h) { return h.type === 'formatacao'; }).length}
                                        </h3>
                                    </div>
                                    <div className="p-2.5 rounded-lg bg-amber-50 dark:bg-amber-900/20 text-amber-500">{Icons.Server}</div>
                                </div>
                                <p className="text-xs text-slate-400 mt-3">Máquinas entregues padronizadas</p>
                            </Card>
                        </div>

                        {filteredHistory.length === 0 && desktops.length === 0 ? (
                            <div className="text-center p-16 border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl">
                                <p className="text-slate-500 font-medium">Sem registros no período selecionado.</p>
                                <p className="text-xs text-slate-400 mt-1">Altere o filtro no topo ou conclua checklists para alimentar os gráficos.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-10">
                                <Card className="flex flex-col h-[340px]">
                                    <h3 className="font-bold text-xs text-slate-500 dark:text-slate-400 mb-4 uppercase tracking-wider">Ritmo de Operações Concluídas</h3>
                                    <div className="flex-1 relative w-full h-full"><canvas ref={canvasTrend}></canvas></div>
                                </Card>

                                <Card className="flex flex-col h-[340px]">
                                    <h3 className="font-bold text-xs text-slate-500 dark:text-slate-400 mb-4 uppercase tracking-wider">Distribuição por Tipo de Rotina</h3>
                                    <div className="flex-1 relative w-full h-full"><canvas ref={canvasType}></canvas></div>
                                </Card>

                                <Card className="flex flex-col h-[340px]">
                                    <h3 className="font-bold text-xs text-slate-500 dark:text-slate-400 mb-4 uppercase tracking-wider">Participação por Técnico (Inclui Check Diário)</h3>
                                    <div className="flex-1 relative w-full h-full"><canvas ref={canvasTech}></canvas></div>
                                </Card>

                                <Card className="flex flex-col h-[340px]">
                                    <h3 className="font-bold text-xs text-slate-500 dark:text-slate-400 mb-4 uppercase tracking-wider">Top 6 Setores com Mais Desktops</h3>
                                    <div className="flex-1 relative w-full h-full">
                                        {desktops.length > 0 ? <canvas ref={canvasSector}></canvas> : <div className="h-full flex items-center justify-center text-xs text-slate-500">Nenhum desktop cadastrado</div>}
                                    </div>
                                </Card>
                            </div>
                        )}
                    </div>
                );
            };

            var HistoryView = function(props) {
                var history = props.history || [];
                var onOpenHistory = props.onOpenHistory;
                var searchState = useState('');
                var search = searchState[0], setSearch = searchState[1];

                var filtered = history.filter(function(h) {
                    var s = search.toLowerCase();
                    var at = (h.ativo || '').toLowerCase();
                    var tc = (h.tecnico || '').toLowerCase();
                    var vid = (h.visualId || '').toLowerCase();
                    return at.indexOf(s) !== -1 || tc.indexOf(s) !== -1 || vid.indexOf(s) !== -1;
                });

                return (
                    <div className="p-4 md:p-10 h-full flex flex-col fade-in">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-6">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Histórico de Operações</h2>
                                <p className="text-slate-500 text-sm">Registro auditável de todas as atividades concluídas.</p>
                            </div>
                            <div className="relative w-full md:w-auto">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">{Icons.Search}</div>
                                <Input placeholder="Buscar por ID, Ativo..." value={search} onChange={function(e) { setSearch(e.target.value); }} className="pl-10 w-full md:w-64" />
                            </div>
                        </div>
                        
                        <Card className="flex-1 overflow-hidden flex flex-col" noPadding>
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-sm text-left min-w-[600px]">
                                    <thead className="bg-slate-50 dark:bg-slate-800 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                                        <tr>
                                            <th className="px-6 py-3">ID</th>
                                            <th className="px-6 py-3">Data</th>
                                            <th className="px-6 py-3">Tipo</th>
                                            <th className="px-6 py-3">Ativo</th>
                                            <th className="px-6 py-3">Técnico</th>
                                            <th className="px-6 py-3 text-right">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {filtered.map(function(h, i) {
                                            return (
                                                <tr key={i} onClick={function() { if (onOpenHistory) onOpenHistory(h); }} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer">
                                                    <td className="px-6 py-3 font-mono text-xs font-bold text-slate-500">#{h.visualId}</td>
                                                    <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{new Date(h.date || Date.now()).toLocaleDateString()}</td>
                                                    <td className="px-6 py-3">
                                                        <Badge color={h.type === 'formatacao' ? 'blue' : h.type === 'diario' ? 'green' : h.type === 'rack' ? 'indigo' : 'amber'}>
                                                            {h.type === 'formatacao' ? 'Formatação' : h.type === 'diario' ? 'Diário' : h.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                                        </Badge>
                                                    </td>
                                                    <td className="px-6 py-3 font-medium text-slate-800 dark:text-white uppercase">{h.ativo || 'N/A'}</td>
                                                    <td className="px-6 py-3 text-slate-600 dark:text-slate-400 uppercase">{h.type === 'diario' ? 'EQUIPE' : (h.tecnico || 'N/A')}</td>
                                                    <td className="px-6 py-3 text-right"><span className="text-emerald-600 dark:text-emerald-400 text-xs font-bold bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-full">Concluído</span></td>
                                                </tr>
                                            );
                                        })}
                                        {filtered.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-slate-400">Nenhum registro encontrado.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    </div>
                );
            };

            var KanbanView = function(props) {
                var allTasks = props.tasks || [];
                var users = [
                    { id: '1', name: 'DANILO INACIO' },
                    { id: '2', name: 'KAUAN FERNANDES' },
                    { id: '3', name: 'PAULO OLIVEIRA' },
                    { id: '4', name: 'EQUIPE INFRA' }
                ];
                var currentUser = props.currentUser;
                var onSaveTask = props.onSaveTask;
                var onDeleteTask = props.onDeleteTask;
                var onMoveTask = props.onMoveTask;
                var onUpdateTask = props.onUpdateTask;
                var onReorderTask = props.onReorderTask;

                var tasks = allTasks.filter(function(t) { return t.archived !== true; });
                var archivedTasks = allTasks.filter(function(t) { return t.archived === true; });

                var modalState = useState(false);
                var isModalOpen = modalState[0], setIsModalOpen = modalState[1];
                
                var archiveModalState = useState(false);
                var isArchiveModalOpen = archiveModalState[0], setIsArchiveModalOpen = archiveModalState[1];

                var formState = useState({ title: '', assignee: 'DANILO INACIO', priority: 'Média', status: 'a_fazer', dueDate: '', tag: 'INFRAESTRUTURA' });
                var form = formState[0], setForm = formState[1];

                var editState = useState(null);
                var editingTask = editState[0], setEditingTask = editState[1];
                
                var commentState = useState('');
                var newComment = commentState[0], setNewComment = commentState[1];

                var isUploadState = useState(false);
                var isUploading = isUploadState[0], setIsUploading = isUploadState[1];

                var handleDropOnCol = function(e, colId) {
                    e.preventDefault();
                    var draggedId = e.dataTransfer.getData('taskId');
                    if (draggedId) {
                        onReorderTask(draggedId, null, colId);
                    }
                };

                var handleCreate = function(e) {
                    e.preventDefault();
                    if (!form.title.trim()) return;
                    var seq = Math.floor(100 + Math.random() * 900);
                    var newTask = {
                        code: 'SCRUM-' + seq,
                        title: form.title.trim().toUpperCase(),
                        description: '',
                        assignee: (form.assignee || 'DANILO INACIO').toUpperCase(),
                        priority: form.priority || 'Média',
                        status: form.status || 'a_fazer',
                        dueDate: form.dueDate || '',
                        tag: form.tag || 'INFRAESTRUTURA',
                        comments: [],
                        attachments: [],
                        createdAt: new Date().toISOString()
                    };
                    onSaveTask(newTask);
                    setForm({ title: '', assignee: 'DANILO INACIO', priority: 'Média', status: 'a_fazer', dueDate: '', tag: 'INFRAESTRUTURA' });
                    setIsModalOpen(false);
                };

                var handleCloseSprint = function() {
                    var completed = tasks.filter(function(t) { return t.status === 'concluido'; });
                    if (completed.length === 0) {
                        return alert("Não há tarefas na coluna 'Concluído' para arquivar.");
                    }
                    
                    if (confirm("Encerrar Sprint atual?\n\nIsto limpará o quadro e arquivará " + completed.length + " tarefa(s) concluída(s).")) {
                        var batch = db.batch();
                        completed.forEach(function(t) {
                            var ref = db.collection('kanban_tasks').doc(t.id);
                            batch.update(ref, { archived: true, archivedAt: new Date().toISOString() });
                        });
                        batch.commit().catch(function(err) {
                            alert("Erro ao arquivar: " + err.message);
                        });
                    }
                };

                var handleUploadAttachment = function(e) {
                    var file = e.target.files[0];
                    if (!file || !editingTask) return;

                    if (!file.type.startsWith('image/') && file.size > 500 * 1024) {
                        alert("Ficheiros que não sejam imagens devem ter no máximo 500KB.");
                        e.target.value = '';
                        return;
                    }

                    setIsUploading(true);
                    var reader = new FileReader();

                    reader.onload = function(event) {
                        var dataUrl = event.target.result;

                        var saveToFirestore = function(finalDataUrl) {
                            var newAttachment = { name: file.name, url: finalDataUrl, uploadedAt: new Date().toISOString() };
                            var updatedAttachments = (editingTask.attachments || []).concat([newAttachment]);
                            var updatedTask = Object.assign({}, editingTask, { attachments: updatedAttachments });
                            
                            setEditingTask(updatedTask);
                            onUpdateTask(updatedTask.id, { attachments: updatedAttachments });
                            setIsUploading(false);
                            e.target.value = '';
                        };

                        if (file.type.startsWith('image/')) {
                            var img = new Image();
                            img.onload = function() {
                                var canvas = document.createElement('canvas');
                                var ctx = canvas.getContext('2d');
                                
                                var maxWidth = 1024;
                                var scaleSize = img.width > maxWidth ? (maxWidth / img.width) : 1;
                                canvas.width = img.width * scaleSize;
                                canvas.height = img.height * scaleSize;
                                
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                
                                var compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                                saveToFirestore(compressedDataUrl);
                            };
                            img.src = dataUrl;
                        } else {
                            saveToFirestore(dataUrl);
                        }
                    };
                    
                    reader.readAsDataURL(file);
                };

                var handleRemoveAttachment = function(index) {
                    if (!confirm("Remover este anexo?")) return;
                    var updatedAttachments = [].concat(editingTask.attachments || []);
                    updatedAttachments.splice(index, 1);
                    var updatedTask = Object.assign({}, editingTask, { attachments: updatedAttachments });
                    setEditingTask(updatedTask);
                    onUpdateTask(updatedTask.id, { attachments: updatedAttachments });
                };

                var columns = [
                    { id: 'a_fazer', title: 'A Fazer' },
                    { id: 'em_andamento', title: 'Em Andamento' },
                    { id: 'impedimentos', title: 'Impedimentos' },
                    { id: 'concluido', title: 'Concluído' }
                ];
                
                var tagOptions = ['INFRAESTRUTURA', 'REDES', 'SERVIDORES', 'MANUTENÇÃO', 'COMPRAS', 'SISTEMAS'];
                var tagColors = {
                    'INFRAESTRUTURA': 'bg-slate-700 text-slate-300',
                    'REDES': 'bg-blue-900/50 text-blue-300',
                    'SERVIDORES': 'bg-indigo-900/50 text-indigo-300',
                    'MANUTENÇÃO': 'bg-amber-900/50 text-amber-300',
                    'COMPRAS': 'bg-emerald-900/50 text-emerald-300',
                    'SISTEMAS': 'bg-purple-900/50 text-purple-300'
                };

                return (
                    <div className="p-4 md:p-10 h-full flex flex-col fade-in overflow-x-auto bg-jira-bg">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 shrink-0">
                            <div>
                                <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                    {Icons.Kanban} Quadro Kanban (Tarefas TI)
                                </h2>
                            </div>
                            <div className="flex gap-2 w-full md:w-auto">
                                <Button onClick={function(){ setIsArchiveModalOpen(true); }} variant="secondary" className="flex-1 md:flex-none bg-transparent border-slate-700 text-slate-300 hover:bg-slate-800 text-xs sm:text-sm">
                                    {Icons.List} Ver Arquivados
                                </Button>
                                <Button onClick={handleCloseSprint} className="flex-1 md:flex-none bg-brand-600 hover:bg-brand-500 text-xs sm:text-sm shadow-lg shadow-brand-500/20">
                                    {Icons.Archive} Encerrar Sprint
                                </Button>
                            </div>
                        </div>

                        <div className="flex gap-4 flex-1 pb-4 w-max min-w-full">
                            {columns.map(function(col) {
                                var colTasks = tasks.filter(function(t) { return t.status === col.id; });
                                return (
                                    <div key={col.id} 
                                         onDragOver={function(e) { e.preventDefault(); }}
                                         onDrop={function(e) { handleDropOnCol(e, col.id); }}
                                         className="bg-jira-col rounded-xl p-3 flex flex-col w-[85vw] sm:w-[280px] max-w-[280px] h-full max-h-[calc(100vh-180px)] border border-slate-800/50">
                                        <div className="flex items-center gap-3 mb-4 shrink-0 px-1 pt-1">
                                            <h3 className="text-xs font-bold uppercase tracking-wider text-jira-subtext">{col.title}</h3>
                                            <span className="bg-jira-card text-jira-text px-2 py-0.5 rounded text-[10px] font-bold">{colTasks.length}</span>
                                        </div>

                                        <div className="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                                            {colTasks.map(function(task) {
                                                var initials = '';
                                                var avatarBg = 'bg-slate-600 text-white';
                                                
                                                if (!task.assignee || task.assignee.trim() === '') {
                                                    avatarBg = 'bg-transparent border border-slate-500 text-slate-500';
                                                    initials = <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
                                                } else {
                                                    var nameUpper = task.assignee.toUpperCase();
                                                    if (nameUpper.indexOf('DANILO') !== -1) { initials = 'DI'; avatarBg = 'bg-orange-600 text-white'; }
                                                    else if (nameUpper.indexOf('KAUAN') !== -1) { initials = 'KF'; avatarBg = 'bg-blue-600 text-white'; }
                                                    else if (nameUpper.indexOf('PAULO') !== -1) { initials = 'PO'; avatarBg = 'bg-indigo-600 text-white'; }
                                                    else if (nameUpper.indexOf('EQUIPE') !== -1) { initials = 'EQ'; avatarBg = 'bg-emerald-600 text-white'; }
                                                    else { initials = task.assignee.substring(0, 2).toUpperCase(); avatarBg = 'bg-purple-600 text-white'; }
                                                }

                                                var priorityIcon = null;
                                                if (task.priority === 'Alta') {
                                                    priorityIcon = <div className="text-red-500 font-black text-lg leading-none" title="Alta">=</div>;
                                                } else if (task.priority === 'Média') {
                                                    priorityIcon = <div className="text-orange-500 font-black text-lg leading-none" title="Média">=</div>;
                                                } else {
                                                    priorityIcon = <div className="text-blue-500 font-black text-lg leading-none" title="Baixa">-</div>;
                                                }
                                                
                                                var isOverdue = false;
                                                var isDueSoon = false;
                                                if (task.dueDate && task.status !== 'concluido') {
                                                    var due = new Date(task.dueDate + 'T23:59:59');
                                                    var now = new Date();
                                                    var diff = due - now;
                                                    if (diff < 0) isOverdue = true;
                                                    else if (diff < 86400000 * 2) isDueSoon = true;
                                                }
                                                
                                                var commentCount = task.comments ? task.comments.length : 0;
                                                var attachmentCount = task.attachments ? task.attachments.length : 0;
                                                var tagClass = tagColors[task.tag] || 'bg-slate-700 text-slate-300';
                                                
                                                return (
                                                    <div key={task.id} 
                                                         draggable={true}
                                                         onDragStart={function(e) { 
                                                             e.dataTransfer.setData('taskId', task.id); 
                                                             e.stopPropagation(); 
                                                         }}
                                                         onDragOver={function(e) { 
                                                             e.preventDefault(); 
                                                             e.stopPropagation(); 
                                                             e.currentTarget.style.borderTop = '2px solid #3b82f6';
                                                         }}
                                                         onDragLeave={function(e) { 
                                                             e.currentTarget.style.borderTop = '';
                                                         }}
                                                         onDrop={function(e) {
                                                             e.preventDefault();
                                                             e.stopPropagation();
                                                             e.currentTarget.style.borderTop = '';
                                                             var draggedId = e.dataTransfer.getData('taskId');
                                                             if (draggedId && draggedId !== task.id) {
                                                                 onReorderTask(draggedId, task.id, col.id);
                                                             }
                                                         }}
                                                         onClick={function() { setEditingTask(task); }} 
                                                         className="bg-jira-card hover:bg-jira-cardHover transition-colors p-3 rounded-lg shadow-sm group flex flex-col gap-3 relative cursor-grab active:cursor-grabbing border border-transparent">
                                                        
                                                        <div className="flex justify-between items-start">
                                                            <span className={"text-[9px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1 uppercase " + tagClass}>{Icons.Tag} {task.tag || 'INFRAESTRUTURA'}</span>
                                                            {task.dueDate && (
                                                                <span className={"text-[10px] font-bold flex items-center gap-1 " + (isOverdue ? "text-red-400" : isDueSoon ? "text-amber-400" : "text-slate-500")}>
                                                                    {Icons.Clock}
                                                                    {task.dueDate.split('-').reverse().join('/')}
                                                                </span>
                                                            )}
                                                        </div>
                                                        
                                                        <h4 className="text-[13px] text-jira-text leading-snug uppercase">{task.title}</h4>

                                                        <div className="flex justify-between items-center mt-1">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-4 h-4 bg-blue-600 rounded flex items-center justify-center">
                                                                    <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path d="M5 13l4 4L19 7" /></svg>
                                                                </div>
                                                                <span className="text-[11px] font-bold text-jira-subtext">{task.code}</span>
                                                                {commentCount > 0 && (
                                                                    <div className="flex items-center gap-1 text-slate-500 ml-1" title="Comentários">
                                                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                                                        <span className="text-[10px] font-bold">{commentCount}</span>
                                                                    </div>
                                                                )}
                                                                {attachmentCount > 0 && (
                                                                    <div className="flex items-center gap-1 text-slate-500 ml-2" title="Anexos">
                                                                        {Icons.Paperclip}
                                                                        <span className="text-[10px] font-bold">{attachmentCount}</span>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            <div className="flex items-center gap-2">
                                                                {priorityIcon}
                                                                <div className={"w-6 h-6 rounded-full flex items-center justify-center text-[9px] font-bold shadow-sm " + avatarBg} title={task.assignee || 'Não atribuído'}>
                                                                    {initials}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="absolute top-2 right-2 flex items-center gap-1 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity bg-jira-cardHover rounded shadow-sm p-1">
                                                            {col.id !== 'a_fazer' && (
                                                                <button onClick={function(e) {
                                                                    e.stopPropagation();
                                                                    var prev = col.id === 'em_andamento' ? 'a_fazer' : col.id === 'impedimentos' ? 'em_andamento' : 'impedimentos';
                                                                    onMoveTask(task.id, prev);
                                                                }} className="p-1 hover:bg-slate-700 text-slate-400 hover:text-white rounded" title="Recuar">{Icons.ArrowLeft}</button>
                                                            )}
                                                            {col.id !== 'concluido' && (
                                                                <button onClick={function(e) {
                                                                    e.stopPropagation();
                                                                    var next = col.id === 'a_fazer' ? 'em_andamento' : col.id === 'em_andamento' ? 'impedimentos' : 'concluido';
                                                                    onMoveTask(task.id, next);
                                                                }} className="p-1 hover:bg-slate-700 text-slate-400 hover:text-white rounded" title="Avançar">{Icons.ArrowRight}</button>
                                                            )}
                                                            <button onClick={function(e) { e.stopPropagation(); onDeleteTask(task.id); }} className="p-1 hover:bg-red-900/50 text-slate-400 hover:text-red-400 rounded" title="Excluir">{Icons.Trash}</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="mt-2 pt-2 shrink-0">
                                            <button onClick={function() { setForm(Object.assign({}, form, {status: col.id})); setIsModalOpen(true); }} className="flex items-center gap-2 text-jira-subtext hover:text-white hover:bg-jira-cardHover w-full px-2 py-1.5 rounded transition-colors text-xs font-semibold">
                                                {Icons.Plus} <span>Criar</span>
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {isArchiveModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
                                <Card className="w-full max-w-4xl bg-jira-bg border-slate-700 flex flex-col max-h-[90vh]" noPadding>
                                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-jira-col shrink-0">
                                        <h3 className="font-bold text-slate-200 text-sm flex items-center gap-2">{Icons.Archive} Tarefas Arquivadas</h3>
                                        <button onClick={function() { setIsArchiveModalOpen(false); }} className="text-2xl leading-none text-slate-400 hover:text-white">&times;</button>
                                    </div>
                                    <div className="flex-1 overflow-auto p-0 md:p-4 custom-scrollbar">
                                        {archivedTasks.length === 0 ? (
                                            <p className="text-slate-500 text-center py-8">Nenhuma tarefa arquivada.</p>
                                        ) : (
                                            <table className="w-full text-sm text-left text-slate-300 min-w-[500px]">
                                                <thead className="text-xs uppercase bg-[#161A1D] text-slate-500 sticky top-0">
                                                    <tr>
                                                        <th className="px-4 py-3">Código</th>
                                                        <th className="px-4 py-3">Título</th>
                                                        <th className="px-4 py-3">Responsável</th>
                                                        <th className="px-4 py-3">Arquivado em</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {archivedTasks.sort(function(a, b) { return new Date(b.archivedAt || 0) - new Date(a.archivedAt || 0); }).map(function(t) {
                                                        return (
                                                            <tr key={t.id} className="hover:bg-slate-800/50">
                                                                <td className="px-4 py-3 font-mono text-xs font-bold text-brand-400">{t.code}</td>
                                                                <td className="px-4 py-3 font-semibold uppercase">{t.title}</td>
                                                                <td className="px-4 py-3 uppercase">{t.assignee || 'N/A'}</td>
                                                                <td className="px-4 py-3 text-xs text-slate-500">{new Date(t.archivedAt || t.createdAt).toLocaleDateString()}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </Card>
                            </div>
                        )}

                        {isModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
                                <Card className="w-full max-w-md bg-jira-bg border-slate-700" noPadding>
                                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-jira-col">
                                        <h3 className="font-bold text-slate-200 text-sm">Criar Tarefa</h3>
                                        <button onClick={function() { setIsModalOpen(false); }} className="text-2xl leading-none text-slate-400 hover:text-white">&times;</button>
                                    </div>
                                    <form onSubmit={handleCreate} className="p-6 space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Título da Tarefa</label>
                                            <Input value={form.title} onChange={function(e) { setForm(Object.assign({}, form, { title: e.target.value.toUpperCase() })); }} placeholder="EX: SUBSTITUIR SWITCH RACK 02" className="bg-jira-card border-slate-700 text-white uppercase" autoFocus />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Data Limite (Prazo)</label>
                                                <Input type="date" value={form.dueDate} onChange={function(e) { setForm(Object.assign({}, form, { dueDate: e.target.value })); }} className="bg-jira-card border-slate-700 text-white uppercase text-xs" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Etiqueta (Tag)</label>
                                                <select value={form.tag} onChange={function(e) { setForm(Object.assign({}, form, { tag: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500 uppercase">
                                                    {tagOptions.map(function(opt) { return <option key={opt} value={opt}>{opt}</option>; })}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Responsável</label>
                                                <select value={form.assignee} onChange={function(e) { setForm(Object.assign({}, form, { assignee: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500 uppercase">
                                                    {users.map(function(u) { return <option key={u.id} value={u.name}>{u.name}</option>; })}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Prioridade</label>
                                                <select value={form.priority} onChange={function(e) { setForm(Object.assign({}, form, { priority: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500">
                                                    <option value="Baixa">Baixa</option>
                                                    <option value="Média">Média</option>
                                                    <option value="Alta">Alta</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Coluna Inicial</label>
                                            <select value={form.status} onChange={function(e) { setForm(Object.assign({}, form, { status: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500">
                                                <option value="a_fazer">A Fazer</option>
                                                <option value="em_andamento">Em Andamento</option>
                                                <option value="impedimentos">Impedimentos</option>
                                                <option value="concluido">Concluído</option>
                                            </select>
                                        </div>
                                        <div className="pt-2 flex justify-end gap-2">
                                            <Button type="button" variant="secondary" onClick={function() { setIsModalOpen(false); }} className="bg-transparent border-none text-slate-400 hover:bg-slate-800">Cancelar</Button>
                                            <Button type="submit" className="bg-brand-600 hover:bg-brand-500">Criar</Button>

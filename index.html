<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFRA SYS | Checklist & Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURAÇÃO ---
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect } = React;
        const EMAIL_DESTINO = "infra@cobrecom.com.br";

        // --- ICONS ---
        const Icons = {
            Box: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>,
            Check: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>,
            Home: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        };

        // --- TEMPLATE ENGINE ---
        const createTicket = (type, tech) => ({
            type, tech, 
            meta: { maquina: '', ativo: '', data: new Date().toLocaleDateString() },
            items: type === 'formatacao' ? {
                "Preventivas": ["Limpeza interna", "Pasta térmica", "Limpeza memórias", "Limpa contato"],
                "Backup": ["Partições", "Arquivos", "Chave Office", "Navegador", "Outlook/Spark"],
                "Sistema": ["Formatação", "Domínio", "Proxy/DNS", "WINS/Hosts", "Drivers"],
                "Segurança": ["Wazuh", "ESET", "VNC/FW", "GPEDIT"],
                "Configuração": ["Ativar Win/Off", "Energia", "Email", "Impressoras", "IP Fixo"],
                "Apps": ["TOTVS", "TOTVS-MES"],
                "Entrega": ["Restore Dados", "Etiqueta", "Desempenho"]
            } : {
                "Inspeção": ["Rolete", "Cabeça", "Suporte"],
                "Limpeza": ["Limpeza Geral", "Limpeza Cabeça"],
                "Teste": ["Teste de Impressão"]
            }
        });

        // --- COMPONENTES COMPACTOS ---
        const Card = ({ title, children }) => (
            <div className="bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-xl overflow-hidden shadow-sm">
                {title && <div className="bg-slate-50 dark:bg-slate-800 px-4 py-2 text-xs font-bold uppercase border-b dark:border-slate-700">{title}</div>}
                <div className="p-4">{children}</div>
            </div>
        );

        // --- VIEW: ESTOQUE ---
        const Inventory = ({ user }) => {
            const [prods, setProds] = useState([]);
            const [form, setForm] = useState({ id: '', type: 'SAIDA', qty: 1, name: '', badge: '' });

            useEffect(() => db.collection('inventory').onSnapshot(s => setProds(s.docs.map(d => ({id: d.id, ...d.data()})))), []);

            const submit = async (e) => {
                e.preventDefault();
                const p = prods.find(x => x.id === form.id);
                const newQty = form.type === 'ENTRADA' ? p.quantity + Number(form.qty) : p.quantity - Number(form.qty);
                if (newQty < 0) return alert("Sem saldo!");

                await db.collection('inventory').doc(p.id).update({ quantity: newQty });
                if (form.type === 'SAIDA') {
                    const body = `SAÍDA: ${p.name}\nQTD: ${form.qty}\nPARA: ${form.name}\nCRACHÁ: ${form.badge}\nTÉCNICO: ${user}`;
                    window.location.href = `mailto:${EMAIL_DESTINO}?subject=SAIDA_ESTOQUE_${p.name}&body=${encodeURIComponent(body)}`;
                }
                alert("OK!");
            };

            return (
                <div className="grid md:grid-cols-2 gap-6 fade-in">
                    <Card title="Saldo">
                        {prods.map(p => (
                            <div key={p.id} className="flex justify-between py-2 border-b dark:border-slate-800">
                                <span>{p.name}</span><span className="font-bold">{p.quantity}</span>
                            </div>
                        ))}
                        <button className="text-brand-500 text-xs mt-4" onClick={() => {const n=prompt("Item:"); n && db.collection('inventory').add({name:n, quantity:0})}}>+ Adicionar Item</button>
                    </Card>
                    <Card title="Movimentação">
                        <form onSubmit={submit} className="space-y-3">
                            <select className="w-full p-2 rounded border dark:bg-slate-950" onChange={e=>setForm({...form, id: e.target.value})} required>
                                <option value="">Item...</option>
                                {prods.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                            </select>
                            <div className="flex gap-2">
                                <select className="flex-1 p-2 rounded border dark:bg-slate-950" onChange={e=>setForm({...form, type: e.target.value})}>
                                    <option value="SAIDA">Saída</option><option value="ENTRADA">Entrada</option>
                                </select>
                                <input type="number" className="w-20 p-2 rounded border dark:bg-slate-950" value={form.qty} onChange={e=>setForm({...form, qty: e.target.value})} />
                            </div>
                            {form.type === 'SAIDA' && (
                                <div className="space-y-2">
                                    <input placeholder="Usuário" className="w-full p-2 rounded border dark:bg-slate-950" onChange={e=>setForm({...form, name: e.target.value})} required />
                                    <input placeholder="Crachá" className="w-full p-2 rounded border dark:bg-slate-950" onChange={e=>setForm({...form, badge: e.target.value})} required />
                                </div>
                            )}
                            <button className="w-full bg-brand-600 text-white p-2 rounded font-bold">Registrar</button>
                        </form>
                    </Card>
                </div>
            );
        };

        // --- VIEW: DASHBOARD ---
        const Dashboard = ({ tickets, onSelect, onNew }) => (
            <div className="space-y-6 fade-in">
                <div className="grid grid-cols-2 gap-4">
                    <button onClick={()=>onNew('formatacao')} className="bg-brand-600 text-white p-6 rounded-2xl font-bold shadow-lg shadow-brand-500/20">Nova Formatação</button>
                    <button onClick={()=>onNew('zebra')} className="bg-white dark:bg-slate-900 border p-6 rounded-2xl font-bold">Manutenção Zebra</button>
                </div>
                <div className="grid md:grid-cols-3 gap-4">
                    {tickets.map(t => (
                        <div key={t.id} onClick={()=>onSelect(t.id)} className="bg-white dark:bg-slate-900 p-4 rounded-xl border hover:border-brand-500 cursor-pointer transition-all">
                            <div className="text-[10px] font-bold text-brand-500 uppercase">{t.type}</div>
                            <div className="font-bold text-lg">#{t.visualId}</div>
                            <div className="text-xs text-slate-500">{t.meta.maquina || 'Sem ID'}</div>
                        </div>
                    ))}
                </div>
            </div>
        );

        // --- APP ENGINE ---
        const App = () => {
            const [view, setView] = useState('login');
            const [user, setUser] = useState('');
            const [tickets, setTickets] = useState([]);
            const [activeTid, setActiveTid] = useState(null);

            useEffect(() => {
                const unsub = db.collection('tickets').onSnapshot(s => setTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return unsub;
            }, []);

            const handleNew = async (type) => {
                const data = createTicket(type, user);
                const ref = await db.collection('tickets').add(data);
                setActiveTid(ref.id); setView('checklist');
            };

            const updateMeta = (key, val) => {
                const t = tickets.find(x => x.id === activeTid);
                t.meta[key] = val;
                db.collection('tickets').doc(activeTid).update({ meta: t.meta });
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-xs space-y-4">
                        <h1 className="text-2xl font-bold text-center">INFRA SYS</h1>
                        <input className="w-full p-3 rounded-lg border dark:bg-slate-900" placeholder="Matrícula" onChange={e=>setUser(e.target.value)} />
                        <button className="w-full bg-brand-600 text-white p-3 rounded-lg font-bold" onClick={()=>user && setView('dash')}>Entrar</button>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    <aside className="w-16 md:w-64 bg-slate-900 text-slate-400 flex flex-col border-r border-slate-800">
                        <div className="p-4 text-white font-bold text-center border-b border-slate-800 hidden md:block">INFRA SYSTEM</div>
                        <nav className="flex-1 p-2 space-y-2">
                            <button onClick={()=>setView('dash')} className={`w-full flex items-center gap-3 p-3 rounded-lg ${view === 'dash' ? 'bg-brand-600 text-white' : ''}`}>{Icons.Home} <span className="hidden md:block">Início</span></button>
                            <button onClick={()=>setView('stock')} className={`w-full flex items-center gap-3 p-3 rounded-lg ${view === 'stock' ? 'bg-brand-600 text-white' : ''}`}>{Icons.Box} <span className="hidden md:block">Estoque</span></button>
                        </nav>
                        <button onClick={()=>setView('login')} className="p-4 border-t border-slate-800 text-xs text-center">Sair</button>
                    </aside>

                    <main className="flex-1 overflow-auto p-4 md:p-8">
                        {view === 'dash' && <Dashboard tickets={tickets} onSelect={(id)=>{setActiveTid(id); setView('checklist')}} onNew={handleNew} />}
                        {view === 'stock' && <Inventory user={user} />}
                        {view === 'checklist' && activeTid && (
                            <div className="max-w-4xl mx-auto space-y-6 fade-in">
                                <div className="flex justify-between items-center">
                                    <button className="text-sm font-bold" onClick={()=>setView('dash')}>← Voltar</button>
                                    <button className="bg-emerald-600 text-white px-4 py-2 rounded font-bold" onClick={()=>{
                                        const t = tickets.find(x => x.id === activeTid);
                                        window.location.href = `mailto:${EMAIL_DESTINO}?subject=Checklist_${t.visualId}_${t.meta.maquina}&body=Finalizado`;
                                    }}>Enviar Relatório</button>
                                </div>
                                <Card title="Dados">
                                    <div className="grid grid-cols-2 gap-4">
                                        <input className="p-2 border rounded dark:bg-slate-800" placeholder="Máquina" value={tickets.find(x=>x.id===activeTid).meta.maquina} onChange={e=>updateMeta('maquina', e.target.value)} />
                                        <input className="p-2 border rounded dark:bg-slate-800" placeholder="Ativo" value={tickets.find(x=>x.id===activeTid).meta.ativo} onChange={e=>updateMeta('ativo', e.target.value)} />
                                    </div>
                                </Card>
                                <div className="grid md:grid-cols-2 gap-4 pb-10">
                                    {Object.entries(tickets.find(x=>x.id===activeTid).items).map(([cat, tasks]) => (
                                        <Card key={cat} title={cat}>
                                            <div className="space-y-2">
                                                {tasks.map((t, i) => (
                                                    <label key={i} className="flex items-center gap-3 text-sm cursor-pointer">
                                                        <input type="checkbox" className="w-4 h-4" /> {t}
                                                    </label>
                                                ))}
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                        <Card className="w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden" noPadding>
                            <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                                <h2 className="font-bold flex items-center gap-2 text-slate-700 dark:text-slate-200">{Icons.Settings} Configurações do Sistema</h2>
                                <button onClick={onClose} className="text-2xl leading-none text-slate-400 hover:text-slate-600">&times;</button>
                            </div>
                            <div className="p-6 overflow-y-auto">
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div>
                                        <h3 className="text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider">Novo Técnico</h3>
                                        <form onSubmit={handleAddUser} className="space-y-3">
                                            <Input placeholder="Matrícula / ID" value={newUser.id} onChange={function(e) { setNewUser(Object.assign({}, newUser, { id: e.target.value })); }} />
                                            <Input placeholder="Nome Completo" value={newUser.name} onChange={function(e) { setNewUser(Object.assign({}, newUser, { name: e.target.value.toUpperCase() })); }} className="uppercase" />
                                            <Button type="submit" disabled={saving} className="w-full">{Icons.Plus} Cadastrar</Button>
                                        </form>
                                    </div>
                                    <div>
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-xs font-bold uppercase text-slate-500 tracking-wider">Técnicos Habilitados</h3>
                                            <input placeholder="Buscar..." value={filter} onChange={function(e) { setFilter(e.target.value); }} className="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 outline-none w-28 uppercase" />
                                        </div>
                                        <div className="space-y-2 max-h-[200px] overflow-y-auto pr-1">
                                            {list.map(function(u) {
                                                var isMe = currentUser && u.id === currentUser.id;
                                                return (
                                                    <div key={u.docId || u.id} className="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">
                                                        <div>
                                                            <div className="font-semibold text-sm text-slate-700 dark:text-slate-200 uppercase">{u.name}</div>
                                                            <div className="text-[10px] text-slate-400 font-mono">{u.id}</div>
                                                        </div>
                                                        {!isMe && (
                                                            <button onClick={function() { handleDeleteUser(u); }} className="text-slate-400 hover:text-red-500 transition-colors p-1">{Icons.Trash}</button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="border-t border-slate-100 dark:border-slate-800 pt-6 mt-6">
                                    <h3 className="text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider">Títulos Padrão (Check Diário)</h3>
                                    <form onSubmit={handleSaveTitulos} className="space-y-4">
                                        <div className="grid md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Coluna 1</label>
                                                <Input value={titulos.col1 || ''} onChange={function(e){ setTitulos(Object.assign({}, titulos, {col1: e.target.value.toUpperCase()})); }} className="uppercase" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Coluna 2</label>
                                                <Input value={titulos.col2 || ''} onChange={function(e){ setTitulos(Object.assign({}, titulos, {col2: e.target.value.toUpperCase()})); }} className="uppercase" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 ml-1">Coluna 3</label>
                                                <Input value={titulos.col3 || ''} onChange={function(e){ setTitulos(Object.assign({}, titulos, {col3: e.target.value.toUpperCase()})); }} className="uppercase" />
                                            </div>
                                        </div>
                                        <div className="flex justify-end">
                                            <Button type="submit" disabled={saving}>{Icons.Check} Salvar Títulos Globais</Button>
                                        </div>
                                    </form>
                                </div>
                                
                            </div>
                        </Card>
                    </div>
                );
            };

            var LoginScreen = function(props) {
                var onLogin = props.onLogin;
                var errState = useState('');
                var error = errState[0], setError = errState[1];

                var handleGoogleLogin = function() {
                    var provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider).then(function(result) {
                        var user = result.user;
                        var email = (user.email || '').toLowerCase();
                        
                        if (ALLOWED_GMAILS.indexOf(email) !== -1) {
                            onLogin({
                                id: user.uid,
                                name: (user.displayName || email.split('@')[0]).toUpperCase(),
                                email: email
                            });
                        } else {
                            auth.signOut();
                            setError('Acesso negado. Esta conta do Google não está autorizada.');
                        }
                    }).catch(function(err) {
                        setError('Erro no login com Google: ' + err.message);
                    });
                };

                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950 p-4">
                        <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden fade-in">
                            <div className="p-8 pb-6 text-center border-b border-slate-100 dark:border-slate-800">
                                <div className="w-12 h-12 bg-brand-600 rounded-xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg shadow-brand-500/30">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                </div>
                                <h1 className="text-xl font-bold text-slate-900 dark:text-white">Infra Hub</h1>
                                <p className="text-sm text-slate-500 mt-1">Gestão de Rotinas • Cobrecom</p>
                            </div>
                            <div className="p-8 space-y-4">
                                {error && <div className="text-red-500 text-xs font-medium text-center bg-red-50 dark:bg-red-900/20 py-2.5 rounded-lg border border-red-200 dark:border-red-900/40">{error}</div>}
                                <Button variant="google" onClick={handleGoogleLogin} className="w-full h-12 text-sm font-semibold flex items-center justify-center gap-3">
                                    {Icons.Google} Entrar com Conta Google
                                </Button>
                            </div>
                            <div className="bg-slate-50 dark:bg-slate-950/50 p-4 text-center border-t border-slate-100 dark:border-slate-800">
                                <p className="text-[10px] text-slate-400 font-mono uppercase">Acesso restrito à TI Cobrecom</p>
                            </div>
                        </div>
                    </div>
                );
            };

            var App = function() {
                var isSavingDraftRef = useRef(false);
                var draftState = useState(null);
                var draftTicket = draftState[0], setDraftTicket = draftState[1];

                var viewState = useState('login');
                var view = viewState[0], setView = viewState[1];
                var userState = useState(null);
                var currentUser = userState[0], setCurrentUser = userState[1];
                var usersState = useState(DEFAULT_TEAM);
                var users = usersState[0], setUsers = usersState[1];
                var ticketsState = useState([]);
                var activeTickets = ticketsState[0], setActiveTickets = ticketsState[1];
                var historyState = useState([]);
                var history = historyState[0], setHistory = historyState[1];
                var kanbanState = useState([]);
                var kanbanTasks = kanbanState[0], setKanbanTasks = kanbanState[1];
                var logoState = useState('');
                var logo = logoState[0], setLogo = logoState[1];
                var curTicketState = useState(null);
                var currentTicketId = curTicketState[0], setCurrentTicketId = curTicketState[1];
                var darkState = useState(true);
                var darkMode = darkState[0], setDarkMode = darkState[1];
                
                var cfgState = useState(false);
                var showConfig = cfgState[0], setShowConfig = cfgState[1];
                
                var openFoldersState = useState({ checklists: false });
                var openFolders = openFoldersState[0], setOpenFolders = openFoldersState[1];

                var customFoldersState = useState([]);
                var customFolders = customFoldersState[0], setCustomFolders = customFoldersState[1];

                var selectedHistState = useState(null);
                var selectedHistoryTicket = selectedHistState[0], setSelectedHistoryTicket = selectedHistState[1];
                
                var fileInputRef = useRef(null);

                var titlesState = useState({
                    col1: "1. FÍSICO E ACESSOS",
                    col2: "2. DADOS E CONECTIVIDADE",
                    col3: "3. SEGURANÇA E ENDPOINTS"
                });
                var globalTitulos = titlesState[0], setGlobalTitulos = titlesState[1];

                useEffect(function() {
                    try {
                        var savedTheme = localStorage.getItem('sa_theme'); 
                        if (savedTheme !== null) setDarkMode(JSON.parse(savedTheme));
                        var savedLogo = localStorage.getItem('sa_logo'); 
                        if (savedLogo) setLogo(savedLogo);
                    } catch(e) {}

                    var unsubAuth = auth.onAuthStateChanged(function(user) {
                        if (user && user.email) {
                            var email = user.email.toLowerCase();
                            if (ALLOWED_GMAILS.indexOf(email) !== -1) {
                                var sessionUser = {
                                    id: user.uid,
                                    name: (user.displayName || email.split('@')[0]).toUpperCase(),
                                    email: email
                                };
                                setCurrentUser(sessionUser);
                                setView('dashboard');
                            } else {
                                auth.signOut();
                                setView('login');
                            }
                        } else {
                            setView('login');
                        }
                    });

                    var unsubConfig = db.collection('settings').doc('titulos').onSnapshot(function(snap) {
                        if (snap.exists) setGlobalTitulos(snap.data());
                        else db.collection('settings').doc('titulos').set(globalTitulos);
                    });

                    var unsubFolders = db.collection('settings').doc('sidebar_modules').onSnapshot(function(snap) {
                        if (snap.exists && snap.data() && Array.isArray(snap.data().folders)) {
                            setCustomFolders(snap.data().folders);
                        } else {
                            db.collection('settings').doc('sidebar_modules').set({ folders: [] });
                        }
                    });

                    var unsubKanban = db.collection('kanban_tasks').onSnapshot(function(snap) {
                        if (!snap.empty) {
                            var list = snap.docs.map(function(doc) {
                                return Object.assign({ id: doc.id }, doc.data());
                            }).filter(function(t) { 
                                return t.archived !== true; 
                            });
                            list.sort(function(a, b) { 
                                var valA = a.order !== undefined ? a.order : new Date(a.createdAt).getTime();
                                var valB = b.order !== undefined ? b.order : new Date(b.createdAt).getTime();
                                return valA - valB; 
                            });
                            setKanbanTasks(list);
                        }
                    });

                    var unsubTickets = db.collection('tickets').onSnapshot(function(snap) {
                        var list = snap.docs.map(function(doc) {
                            return Object.assign({ id: doc.id }, doc.data());
                        }).filter(function(t) {
                            return t && t.data && t.data.items;
                        });
                        list.sort(function(a,b) { return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); });
                        setActiveTickets(list);
                    });

                    var unsubHistory = db.collection('history').orderBy('date', 'desc').onSnapshot(function(snap) {
                        setHistory(snap.docs.map(function(doc) { return Object.assign({ id: doc.id }, doc.data()); }));
                    });

                    var unsubUsers = db.collection('users').onSnapshot(function(snap) {
                        if (snap.empty) {
                            DEFAULT_TEAM.forEach(function(u) { db.collection('users').add(u); });
                        } else {
                            setUsers(snap.docs.map(function(doc) { return Object.assign({ docId: doc.id }, doc.data()); }));
                        }
                    });

                    return function() { unsubAuth(); unsubTickets(); unsubHistory(); unsubUsers(); unsubConfig(); unsubFolders(); unsubKanban(); };
                }, []);

                useEffect(function() { 
                    if (darkMode) document.documentElement.classList.add('dark'); 
                    else document.documentElement.classList.remove('dark'); 
                    localStorage.setItem('sa_theme', JSON.stringify(darkMode)); 
                }, [darkMode]);

                var handleLogin = function(user) { 
                    setCurrentUser(user); 
                    setView('dashboard'); 
                };

                var handleLogout = function() { 
                    auth.signOut().then(function() {
                        setCurrentUser(null); 
                        setView('login'); 
                    });
                };

                var toggleFolder = function(id) {
                    var nextState = Object.assign({}, openFolders);
                    nextState[id] = !nextState[id];
                    setOpenFolders(nextState);
                };

                var handleAddFolder = function() {
                    var title = prompt("NOME DA NOVA PASTA (EX: FIREWALL, ROTEADORES):");
                    if (!title || !title.trim()) return;
                    var newFolder = { id: 'f_' + Date.now(), title: title.trim().toUpperCase(), links: [] };
                    var updated = customFolders.concat([newFolder]);
                    db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                    
                    var nextOpen = Object.assign({}, openFolders);
                    nextOpen[newFolder.id] = true;
                    setOpenFolders(nextOpen);
                };

                var handleDeleteFolder = function(e, folderId) {
                    e.stopPropagation();
                    if (confirm("DESEJA REALMENTE EXCLUIR ESTA PASTA E SEUS LINKS?")) {
                        var updated = customFolders.filter(function(f) { return f.id !== folderId; });
                        db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                    }
                };

                var handleAddLink = function(folderId) {
                    var label = prompt("NOME DO ACESSO (EX: PFSENSE MATRIZ):");
                    if (!label || !label.trim()) return;
                    var url = prompt("ENDEREÇO IP OU URL (EX: 192.168.1.1):");
                    if (!url || !url.trim()) return;

                    var updated = customFolders.map(function(f) {
                        if (f.id === folderId) {
                            var existing = f.links || [];
                            var newLink = { id: 'l_' + Date.now(), label: label.trim().toUpperCase(), url: url.trim() };
                            return Object.assign({}, f, { links: existing.concat([newLink]) });
                        }
                        return f;
                    });
                    db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                };

                var handleDeleteLink = function(e, folderId, linkId) {
                    e.stopPropagation();
                    if (confirm("REMOVER ESTE ACESSO?")) {
                        var updated = customFolders.map(function(f) {
                            if (f.id === folderId) {
                                var filtered = (f.links || []).filter(function(l) { return l.id !== linkId; });
                                return Object.assign({}, f, { links: filtered });
                            }
                            return f;
                        });
                        db.collection('settings').doc('sidebar_modules').set({ folders: updated });
                    }
                };

                var handleOpenLink = function(url) {
                    if (!url) return;
                    var target = url.startsWith('http://') || url.startsWith('https://') ? url : 'http://' + url;
                    window.open(target, '_blank');
                };
                
                var handleCreateTicket = function(type) {
                    var prefix = type === 'formatacao' ? 'F' : type === 'zebra' ? 'Z' : type === 'rack' ? 'R' : 'D';
                    var seq = Math.floor(1000 + Math.random() * 9000);
                    var newTicket = {
                        id: 'draft',
                        visualId: prefix + '-' + seq,
                        type: type,
                        data: getTemplate(type, currentUser ? currentUser.name : '', globalTitulos),
                        createdAt: new Date().toISOString()
                    };
                    setDraftTicket(newTicket);
                    setCurrentTicketId('draft');
                    setView('checklist');
                };

                var handleUpdateTicket = function(newData) { 
                    if (currentTicketId === 'draft') {
                        var pct = calcProgress(newData.items);
                        var updatedDraft = Object.assign({}, draftTicket, { data: newData });
                        
                        if (pct >= 10 && !isSavingDraftRef.current) {
                            isSavingDraftRef.current = true;
                            var ticketToSave = Object.assign({}, updatedDraft);
                            delete ticketToSave.id;
                            db.collection('tickets').add(ticketToSave).then(function(docRef) {
                                setCurrentTicketId(docRef.id);
                                setDraftTicket(null);
                                isSavingDraftRef.current = false;
                            }).catch(function() { isSavingDraftRef.current = false; });
                        } else {
                            setDraftTicket(updatedDraft);
                        }
                    } else if (currentTicketId && currentTicketId !== 'draft') {
                        db.collection('tickets').doc(currentTicketId).update({ data: newData }); 
                    }
                };
                
                var handleBackFromChecklist = function() {
                    if (currentTicketId === 'draft') {
                        setDraftTicket(null);
                        setCurrentTicketId(null);
                    }
                    setView('dashboard');
                };

                var handleForceSaveChecklist = function() {
                    if (currentTicketId === 'draft') {
                        isSavingDraftRef.current = true;
                        var ticketToSave = Object.assign({}, draftTicket);
                        delete ticketToSave.id;
                        db.collection('tickets').add(ticketToSave).then(function() {
                            setCurrentTicketId(null);
                            setDraftTicket(null);
                            isSavingDraftRef.current = false;
                            setView('dashboard');
                        });
                    } else {
                        setView('dashboard');
                    }
                };

                var handleRequestFinish = function() {
                    if (currentTicketId === 'draft') {
                        isSavingDraftRef.current = true;
                        var ticketToSave = Object.assign({}, draftTicket);
                        delete ticketToSave.id;
                        db.collection('tickets').add(ticketToSave).then(function(docRef) {
                            setCurrentTicketId(docRef.id);
                            setDraftTicket(null);
                            isSavingDraftRef.current = false;
                            setView('receipt');
                        });
                    } else {
                        setView('receipt');
                    }
                };

                var handleGlobalTitleChange = function(colKey, newVal) {
                    var map = { coluna1: 'col1', coluna2: 'col2', coluna3: 'col3' };
                    var gKey = map[colKey];
                    if (gKey) {
                        var newTitulos = Object.assign({}, globalTitulos, { [gKey]: newVal.toUpperCase() });
                        db.collection('settings').doc('titulos').set(newTitulos);
                    }
                };
                
                var handleArchive = function(ticket) {
                    if (!ticket) return;
                    var meta = (ticket.data && ticket.data.meta) || {};
                    db.collection('history').add({ 
                        visualId: ticket.visualId, 
                        type: ticket.type, 
                        date: new Date().toISOString(), 
                        tecnico: (meta.tecnico || 'N/A').toUpperCase(), 
                        ativo: (meta.ativo || meta.maquina || "N/A").toUpperCase(), 
                        data: ticket.data 
                    }).then(function() {
                        if(ticket.id && ticket.id !== 'draft') {
                            return db.collection('tickets').doc(ticket.id).delete();
                        }
                    }).then(function() {
                        setCurrentTicketId(null);
                        setView('dashboard');
                    });
                };

                var handleRevertHistory = function(historyItem) {
                    if (!historyItem) return;
                    if (confirm("DESEJA RETORNAR ESTE CHECKLIST PARA OS ATIVOS EM ANDAMENTO?")) {
                        var restoredTicket = {
                            visualId: historyItem.visualId,
                            type: historyItem.type || 'formatacao',
                            createdAt: historyItem.date || new Date().toISOString(),
                            data: historyItem.data
                        };
                        db.collection('tickets').add(restoredTicket).then(function() {
                            if (historyItem.id) {
                                return db.collection('history').doc(historyItem.id).delete();
                            }
                        }).then(function() {
                            setSelectedHistoryTicket(null);
                            setView('dashboard');
                        });
                    }
                };
                
                var handleDeleteActive = function(e, id) { 
                    e.stopPropagation(); 
                    if (confirm("CANCELAR ESTE REGISTRO?")) db.collection('tickets').doc(id).delete(); 
                };

                var handleLogoUpload = function(e) { 
                    var f = e.target.files && e.target.files[0]; 
                    if (f) { 
                        var r = new FileReader(); 
                        r.onloadend = function() { 
                            setLogo(r.result); 
                            localStorage.setItem('sa_logo', r.result); 
                        }; 
                        r.readAsDataURL(f); 
                    }
                };

                var handleSaveKanbanTask = function(task) {
                    var maxOrder = kanbanTasks.length;
                    db.collection('kanban_tasks').add(Object.assign({}, task, { title: task.title.toUpperCase(), order: maxOrder }));
                };

                var handleDeleteKanbanTask = function(taskId) {
                    if (confirm("EXCLUIR ESTE CARTÃO DO KANBAN?")) {
                        db.collection('kanban_tasks').doc(taskId).delete();
                    }
                };

                var handleMoveKanbanTask = function(taskId, newStatus) {
                    db.collection('kanban_tasks').doc(taskId).update({ status: newStatus });
                };

                var handleUpdateKanbanTask = function(taskId, updates) {
                    if (updates.title) updates.title = updates.title.toUpperCase();
                    if (updates.description) updates.description = updates.description.toUpperCase();
                    db.collection('kanban_tasks').doc(taskId).update(updates);
                };

                var handleReorderKanbanTask = function(draggedId, targetId, newStatus) {
                    var draggedTask = kanbanTasks.find(function(t) { return t.id === draggedId; });
                    if (!draggedTask) return;

                    var colTasks = kanbanTasks.filter(function(t) { return t.status === newStatus && t.id !== draggedId; });
                    
                    if (targetId) {
                        var targetIndex = colTasks.findIndex(function(t) { return t.id === targetId; });
                        if (targetIndex !== -1) {
                            colTasks.splice(targetIndex, 0, draggedTask);
                        } else {
                            colTasks.push(draggedTask);
                        }
                    } else {
                        colTasks.push(draggedTask);
                    }

                    var batch = db.batch();
                    colTasks.forEach(function(t, i) {
                        var ref = db.collection('kanban_tasks').doc(t.id);
                        batch.update(ref, { status: newStatus, order: i });
                    });
                    batch.commit();
                };

                var handleDragStartFolder = function(e, folderId) {
                    e.dataTransfer.setData('folderId', folderId);
                };

                var handleDropFolder = function(e, targetFolderId) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.currentTarget.style.borderTop = ''; 
                    
                    var draggedId = e.dataTransfer.getData('folderId');
                    if (draggedId && draggedId !== targetFolderId) {
                        var currentFolders = [].concat(customFolders); 
                        var draggedIndex = currentFolders.findIndex(function(f) { return f.id === draggedId; });
                        var targetIndex = currentFolders.findIndex(function(f) { return f.id === targetFolderId; });

                        if (draggedIndex > -1 && targetIndex > -1) {
                            var draggedItem = currentFolders.splice(draggedIndex, 1)[0];
                            currentFolders.splice(targetIndex, 0, draggedItem);
                            
                            setCustomFolders(currentFolders);
                            db.collection('settings').doc('sidebar_modules').set({ folders: currentFolders });
                        }
                    }
                };

                var currentTicketData = currentTicketId === 'draft' ? draftTicket : activeTickets.find(function(t) { return t.id === currentTicketId; });

                if (view === 'login') return <LoginScreen onLogin={handleLogin} users={users} />;

                return (
                    <div className="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200">
                        <aside className="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col border-r border-slate-800 z-20 shrink-0">
                            <div className="h-16 flex items-center gap-3 px-6 font-bold text-white tracking-wide border-b border-slate-800 shrink-0">
                                <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                                </div>
                                INFRA HUB
                            </div>
                            
                            <div className="flex-1 overflow-y-auto py-6">
                                <div className="px-6 mb-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Principal</div>
                                <nav className="px-3 space-y-1 mb-8">
                                    <button onClick={function() { setView('dashboard'); }} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'dashboard' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.Layout} Dashboard
                                    </button>
                                    <button onClick={function() { setView('kanban'); }} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'kanban' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.Kanban} Kanban TI
                                    </button>
                                    <button onClick={function() { setView('sistema176'); }} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'sistema176' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.Globe} Controle de Estoque T.I
                                    </button>
                                    <button onClick={function() { setView('history'); }} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'history' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                        {Icons.History} Histórico
                                    </button>
                                </nav>

                                <div className="flex items-center justify-between px-6 mb-2">
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Módulos</span>
                                    <button onClick={handleAddFolder} className="text-slate-400 hover:text-brand-400 text-xs flex items-center gap-1 font-semibold" title="Criar nova pasta">{Icons.Plus} <span className="text-[10px]">Pasta</span></button>
                                </div>

                                <nav className="px-3 space-y-1">
                                    <div className="space-y-1 mb-2">
                                        <div onClick={function() { toggleFolder('checklists'); }} className={"w-full flex items-center justify-between px-3 py-2 rounded-lg transition-colors font-medium text-xs text-slate-300 hover:bg-slate-800 cursor-pointer " + (openFolders.checklists ? 'bg-slate-800/60 text-white' : '')}>
                                            <div className="flex items-center gap-2.5 truncate">
                                                <span className={openFolders.checklists ? "text-brand-400" : "text-slate-500"}>{Icons.Folder}</span> 
                                                <span className="truncate font-semibold">Checklists de TI</span>
                                            </div>
                                            <div className={"transition-transform duration-200 text-slate-500 " + (openFolders.checklists ? 'rotate-180' : '')}>
                                                {Icons.ChevronDown}
                                            </div>
                                        </div>
                                        
                                        {openFolders.checklists && (
                                            <div className="mt-1 ml-4 pl-2 border-l border-slate-800 space-y-0.5 fade-in">
                                                <button onClick={function() { handleCreateTicket('diario'); }} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-emerald-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-emerald-500/50 group-hover:text-emerald-400">{Icons.Check}</span> Check Diário
                                                </button>
                                                <button onClick={function() { handleCreateTicket('rack'); }} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-indigo-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-indigo-500/50 group-hover:text-indigo-400">{Icons.Server}</span> Rack Fábrica
                                                </button>
                                                <button onClick={function() { handleCreateTicket('formatacao'); }} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-brand-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-brand-500/50 group-hover:text-brand-400">{Icons.Copy}</span> Formatação PC
                                                </button>
                                                <button onClick={function() { handleCreateTicket('zebra'); }} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-amber-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-amber-500/50 group-hover:text-amber-400">{Icons.Printer}</span> Manutenção Zebra
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {customFolders.map(function(f) {
                                        var isOpen = !!openFolders[f.id];
                                        return (
                                            <div key={f.id} className="space-y-1 mb-1"
                                                 draggable={true}
                                                 onDragStart={function(e) { handleDragStartFolder(e, f.id); }}
                                                 onDragOver={function(e) { e.preventDefault(); e.currentTarget.style.borderTop = '2px solid #3b82f6'; }}
                                                 onDragLeave={function(e) { e.currentTarget.style.borderTop = ''; }}
                                                 onDrop={function(e) { handleDropFolder(e, f.id); }}
                                            >
                                                <div onClick={function() { toggleFolder(f.id); }} className={"w-full flex items-center justify-between px-3 py-2 rounded-lg transition-colors font-medium text-xs text-slate-300 hover:bg-slate-800 cursor-grab active:cursor-grabbing group " + (isOpen ? 'bg-slate-800/60 text-white' : '')}>
                                                    <div className="flex items-center gap-2.5 truncate pointer-events-none">
                                                        <span className={isOpen ? "text-amber-400" : "text-slate-500"}>{Icons.Folder}</span> 
                                                        <span className="truncate font-semibold uppercase">{f.title}</span>
                                                    </div>
                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <button onClick={function(e){ handleDeleteFolder(e, f.id); }} className="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-0.5" title="Excluir Pasta">{Icons.Trash}</button>
                                                        <div className={"transition-transform duration-200 text-slate-500 " + (isOpen ? 'rotate-180' : '')}>{Icons.ChevronDown}</div>
                                                    </div>
                                                </div>
                                                
                                                {isOpen && (
                                                    <div className="mt-1 ml-4 pl-2 border-l border-slate-800 space-y-0.5 fade-in">
                                                        {(f.links || []).map(function(l) {
                                                            return (
                                                                <div key={l.id} className="flex items-center justify-between group px-2 py-1 rounded text-[11px] text-slate-400 hover:text-white hover:bg-slate-800/50">
                                                                    <div onClick={function() { handleOpenLink(l.url); }} className="flex items-center gap-2 truncate cursor-pointer flex-1" title={l.url}>
                                                                        <span className="text-slate-500 group-hover:text-brand-400">{Icons.ExternalLink}</span>
                                                                        <span className="truncate uppercase">{l.label}</span>
                                                                    </div>
                                                                    <button onClick={function(e) { handleDeleteLink(e, f.id, l.id); }} className="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-0.5 shrink-0" title="Remover link">{Icons.Trash}</button>
                                                                </div>
                                                            );
                                                        })}
                                                        <button onClick={function() { handleAddLink(f.id); }} className="w-full text-left flex items-center gap-1.5 px-2 py-1 text-[10px] text-slate-500 hover:text-brand-400 font-semibold">
                                                            {Icons.Plus} <span>ADICIONAR LINK</span>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </nav>
                            </div>

                            <div className="p-4 border-t border-slate-800 shrink-0">
                                <div className="flex items-center gap-3 mb-4 px-2">
                                    <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white shrink-0">
                                        {currentUser && currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U'}
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="text-sm font-bold text-white truncate uppercase">{currentUser ? currentUser.name : ''}</p>
                                        <p className="text-xs text-slate-500 font-mono">GOOGLE AUTH</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-2">
                                    <button title="Alternar tema" onClick={function() { setDarkMode(!darkMode); }} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-yellow-400 transition-colors flex justify-center">{darkMode ? Icons.Sun : Icons.Moon}</button>
                                    <button title="Configurações" onClick={function() { setShowConfig(true); }} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors flex justify-center">{Icons.Settings}</button>
                                    <button title="Sair" onClick={handleLogout} className="p-2 rounded bg-red-900/20 hover:bg-red-900/40 text-red-400 transition-colors flex justify-center">{Icons.LogOut}</button>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-800 text-center">
                                    <p className="text-[10px] text-slate-600 cursor-pointer hover:text-slate-400 uppercase" onClick={function() { if (fileInputRef.current) fileInputRef.current.click(); }}>Alterar Logo</p>
                                    <input type="file" ref={fileInputRef} onChange={handleLogoUpload} className="hidden" accept="image/*" />
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 flex flex-col min-w-0 bg-slate-100 dark:bg-slate-950 relative">
                            <div className="md:hidden h-16 bg-slate-900 text-white flex items-center justify-between px-4 shrink-0 border-b border-slate-800">
                                <span className="font-bold">INFRA HUB</span>
                                <div className="flex gap-2">
                                    <button onClick={function() { setShowConfig(true); }} className="p-2">{Icons.Settings}</button>
                                    <button onClick={function() { setView('dashboard'); }} className="p-2">{Icons.Layout}</button>
                                    <button onClick={handleLogout} className="p-2">{Icons.LogOut}</button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-auto relative">
                                {showConfig && <ConfigModal onClose={function() { setShowConfig(false); }} users={users} currentUser={currentUser} globalTitulos={globalTitulos} />}
                                {view === 'dashboard' && <Dashboard activeTickets={activeTickets} onOpenTicket={function(id) { setCurrentTicketId(id); setView('checklist'); }} onDeleteTicket={handleDeleteActive} historyCount={history.length} />}
                                {view === 'kanban' && <KanbanView tasks={kanbanTasks} users={users} currentUser={currentUser} onSaveTask={handleSaveKanbanTask} onDeleteTask={handleDeleteKanbanTask} onMoveTask={handleMoveKanbanTask} onReorderTask={handleReorderKanbanTask} onUpdateTask={handleUpdateKanbanTask} />}
                                {view === 'sistema176' && (
                                    <div className="h-full w-full bg-slate-100 dark:bg-slate-950 flex flex-col">
                                        <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center shrink-0 bg-white dark:bg-slate-900 shadow-sm z-10">
                                            <h2 className="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2 uppercase">
                                                {Icons.Globe} Controle de Estoque T.I
                                            </h2>
                                            <Button onClick={function(){ window.open(APP_CONFIG.ESTOQUE_URL, '_blank'); }} variant="secondary" className="text-xs">
                                                {Icons.ExternalLink} Abrir em nova guia
                                            </Button>
                                        </div>
                                        <div className="flex-1 w-full relative">
                                            <iframe src={APP_CONFIG.ESTOQUE_URL} className="absolute inset-0 w-full h-full border-none" title="Controle de Estoque T.I" />
                                        </div>
                                    </div>
                                )}
                                {view === 'checklist' && <ActiveChecklist ticket={currentTicketData} onUpdate={handleUpdateTicket} onBack={handleBackFromChecklist} onForceSave={handleForceSaveChecklist} onRequestFinish={handleRequestFinish} onGlobalTitleChange={handleGlobalTitleChange} />}
                                {view === 'receipt' && <ReceiptView ticket={currentTicketData} onBack={function() { setView('checklist'); }} onArchive={handleArchive} logo={logo} />}
                                {view === 'history' && <HistoryView history={history} onOpenHistory={function(h) { setSelectedHistoryTicket(h); setView('history_receipt'); }} />}
                                {view === 'history_receipt' && <ReceiptView ticket={selectedHistoryTicket} isHistory={true} onBack={function() { setView('history'); setSelectedHistoryTicket(null); }} logo={logo} onArchive={null} onRevertHistory={handleRevertHistory} />}
                            </div>
                        </main>
                    </div>
                );
            };

            var root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            
        } catch (err) {
            document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444;font-family:sans-serif;"><h3>Falha Fatal de Inicialização</h3><pre>' + err.message + '</pre></div>';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCKPRO & INFRA CHECKLIST | Full Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect } = React;

        // --- TEMPLATE COMPLETO COM TODOS OS ITENS SOLICITADOS ---
        const getFullTemplate = (type, user) => {
            const meta = { tecnico: user, data: new Date().toISOString().split('T')[0], maquina: '', ativo: '' };
            
            if (type === 'formatacao') {
                return {
                    meta,
                    items: {
                        preventiva: { title: "Manutenção Preventiva", tasks: [
                            {id: 'p1', label: 'Limpeza Interna (Ar comprimido)', checked: false},
                            {id: 'p2', label: 'Troca de Pasta Térmica', checked: false},
                            {id: 'p3', label: 'Limpeza de Memórias (Borracha/Limpa Contato)', checked: false}
                        ]},
                        backup: { title: "Backup & Preparação", tasks: [
                            {id: 'b1', label: 'Backup de Arquivos (User Profile)', checked: false},
                            {id: 'b2', label: 'Backup de Favoritos/Senhas Navegador', checked: false},
                            {id: 'b3', label: 'Backup Outlook (PST/Assinaturas)', checked: false},
                            {id: 'b4', label: 'Verificar Chave Office/Windows', checked: false}
                        ]},
                        sistema: { title: "Sistema Operacional & Rede", tasks: [
                            {id: 's1', label: 'Instalação Windows Pro (Versão Recente)', checked: false},
                            {id: 's2', label: 'Ingressar no Domínio', checked: false},
                            {id: 's3', label: 'Configurar Proxy/DNS Automático', checked: false},
                            {id: 's4', label: 'Configurar WINS/Hosts (se necessário)', checked: false},
                            {id: 's5', label: 'Instalação de Drivers Originais', checked: false}
                        ]},
                        seguranca: { title: "Segurança & Monitoramento", tasks: [
                            {id: 'sec1', label: 'Instalar Wazuh Agent', checked: false},
                            {id: 'sec2', label: 'Instalar ESET Endpoint Antivirus', checked: false},
                            {id: 'sec3', label: 'Configurar VNC + Exceção Firewall', checked: false},
                            {id: 'sec4', label: 'Aplicar GPO (Políticas de Grupo)', checked: false}
                        ]},
                        softwares: { title: "Aplicações & Configurações", tasks: [
                            {id: 'sw1', label: 'Ativar Windows & Office 365', checked: false},
                            {id: 'sw2', label: 'Configurar E-mail (Outlook/Spark)', checked: false},
                            {id: 'sw3', label: 'Instalar TOTVS Protheus / MES', checked: false},
                            {id: 'sw4', label: 'Mapeamento de Redes (Z:, P:, S:)', checked: false},
                            {id: 'sw5', label: 'Instalar Impressoras de Rede/Setor', checked: false},
                            {id: 'sw6', label: 'Configurar IP Fixo no Servidor (MAC)', checked: false}
                        ]},
                        final: { title: "Entrega Final", tasks: [
                            {id: 'f1', label: 'Validar Desempenho Geral', checked: false},
                            {id: 'f2', label: 'Colar Etiqueta de Ativo/ID', checked: false},
                            {id: 'f3', label: 'Restaurar Backup de Navegador/Arquivos', checked: false}
                        ]}
                    }
                };
            } else {
                return {
                    meta,
                    items: {
                        zebra: { title: "Manutenção Zebra", tasks: [
                            {id: 'z1', label: 'Limpeza da Cabeça de Impressão', checked: false},
                            {id: 'z2', label: 'Limpeza do Rolete de Tração', checked: false},
                            {id: 'z3', label: 'Calibração de Sensor de Etiqueta', checked: false},
                            {id: 'z4', label: 'Teste de Impressão (Qualidade)', checked: false},
                            {id: 'z5', label: 'Verificação de Cabos/Conectividade', checked: false}
                        ]}
                    }
                };
            }
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTickets, setActiveTickets] = useState([]);
            const [currentTicket, setCurrentTicket] = useState(null);

            useEffect(() => {
                const unsub = db.collection('tickets').onSnapshot(s => setActiveTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if(e.target.id.value === "01001071") { setCurrentUser("Inacio"); setView('checklist-dashboard'); }
            };

            const createTicket = async (type) => {
                const template = getFullTemplate(type, currentUser);
                const visualId = `${type === 'formatacao' ? 'F' : 'Z'}-${Math.floor(1000 + Math.random() * 9000)}`;
                const doc = await db.collection('tickets').add({ visualId, type, data: template, createdAt: new Date().toISOString() });
                setCurrentTicket({ id: doc.id, visualId, type, data: template });
                setView('active-check');
            };

            const toggleTask = (sectionKey, taskId) => {
                const newData = {...currentTicket.data};
                newData.items[sectionKey].tasks = newData.items[sectionKey].tasks.map(t => t.id === taskId ? {...t, checked: !t.checked} : t);
                setCurrentTicket({...currentTicket, data: newData});
                db.collection('tickets').doc(currentTicket.id).update({ data: newData });
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900 p-4">
                    <div className="bg-white p-8 rounded-2xl w-full max-w-sm">
                        <h1 className="text-2xl font-bold mb-6 text-center">INFRA STOCK</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input name="id" placeholder="ID Matrícula" className="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-brand-500" required />
                            <button className="w-full bg-brand-600 text-white p-3 rounded-lg font-bold">Entrar</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-slate-50">
                    {/* Sidebar Simples */}
                    <aside className="w-64 bg-slate-900 text-white p-6 hidden md:block">
                        <div className="text-xl font-bold mb-10">STOCKPRO</div>
                        <nav className="space-y-4">
                            <button onClick={() => setView('checklist-dashboard')} className="w-full text-left p-2 hover:bg-slate-800 rounded">Checklists</button>
                            <button className="w-full text-left p-2 hover:bg-slate-800 rounded opacity-50">Estoque (Em breve)</button>
                        </nav>
                    </aside>

                    <main className="flex-1 p-6 md:p-10">
                        {/* LISTA DE TICKETS */}
                        {view === 'checklist-dashboard' && (
                            <div className="max-w-5xl mx-auto">
                                <h2 className="text-2xl font-bold mb-8">Gerenciamento de Checklists</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                                    <button onClick={() => createTicket('formatacao')} className="p-6 bg-brand-600 text-white rounded-xl shadow-lg hover:scale-[1.01] transition-all text-left">
                                        <div className="text-sm font-bold uppercase opacity-80 mb-1">Novo Procedimento</div>
                                        <h3 className="text-xl font-bold uppercase tracking-tight">Formatação Completa</h3>
                                    </button>
                                    <button onClick={() => createTicket('zebra')} className="p-6 bg-slate-800 text-white rounded-xl shadow-lg hover:scale-[1.01] transition-all text-left">
                                        <div className="text-sm font-bold uppercase opacity-80 mb-1">Novo Procedimento</div>
                                        <h3 className="text-xl font-bold uppercase tracking-tight">Manutenção Zebra</h3>
                                    </button>
                                </div>

                                <h3 className="font-bold text-slate-500 mb-4 uppercase text-xs tracking-widest">Chamados Ativos</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeTickets.map(t => (
                                        <div key={t.id} onClick={() => {setCurrentTicket(t); setView('active-check');}} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:border-brand-500 transition-all">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="bg-brand-50 text-brand-700 px-2 py-1 rounded text-[10px] font-bold">#{t.visualId}</span>
                                                <button onClick={(e) => {e.stopPropagation(); db.collection('tickets').doc(t.id).delete();}} className="text-slate-300 hover:text-red-500">Excluir</button>
                                            </div>
                                            <h4 className="font-bold text-slate-800 truncate">{t.data.meta.maquina || "Aguardando ID..."}</h4>
                                            <p className="text-xs text-slate-400 mt-1">{t.type === 'formatacao' ? '💻 PC/Notebook' : '🖨️ Impressora'}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* EXECUÇÃO DO CHECKLIST (ITENS REAIS AQUI) */}
                        {view === 'active-check' && currentTicket && (
                            <div className="max-w-3xl mx-auto pb-20">
                                <button onClick={() => setView('checklist-dashboard')} className="text-brand-600 font-bold mb-6 block">← Voltar para Lista</button>
                                
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="p-6 border-b bg-slate-50">
                                        <h2 className="text-xl font-bold">Procedimento #{currentTicket.visualId}</h2>
                                        <div className="grid grid-cols-2 gap-4 mt-4">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase">Nome da Máquina</label>
                                                <input value={currentTicket.data.meta.maquina} onChange={(e) => {
                                                    const d = {...currentTicket.data}; d.meta.maquina = e.target.value;
                                                    setCurrentTicket({...currentTicket, data: d});
                                                    db.collection('tickets').doc(currentTicket.id).update({data: d});
                                                }} className="w-full border-b bg-transparent py-1 outline-none focus:border-brand-500" placeholder="Ex: NB-TI-01" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-400 uppercase">Etiqueta Ativo</label>
                                                <input value={currentTicket.data.meta.ativo} onChange={(e) => {
                                                    const d = {...currentTicket.data}; d.meta.ativo = e.target.value;
                                                    setCurrentTicket({...currentTicket, data: d});
                                                    db.collection('tickets').doc(currentTicket.id).update({data: d});
                                                }} className="w-full border-b bg-transparent py-1 outline-none focus:border-brand-500" placeholder="Ex: 005432" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-6 space-y-8">
                                        {Object.entries(currentTicket.data.items).map(([sectionKey, section]) => (
                                            <div key={sectionKey}>
                                                <h4 className="text-xs font-bold text-brand-600 uppercase mb-4 tracking-wider">{section.title}</h4>
                                                <div className="space-y-2">
                                                    {section.tasks.map(task => (
                                                        <label key={task.id} className="flex items-center gap-4 p-4 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors">
                                                            <input type="checkbox" checked={task.checked} onChange={() => toggleTask(sectionKey, task.id)} className="w-5 h-5 rounded text-brand-600 border-slate-300 focus:ring-brand-500" />
                                                            <span className={`text-sm font-medium ${task.checked ? 'text-slate-400 line-through' : 'text-slate-700'}`}>{task.label}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="p-6 bg-slate-50 border-t flex gap-3">
                                        <button onClick={() => window.print()} className="flex-1 bg-white border border-slate-300 p-3 rounded-lg font-bold text-sm">Imprimir Relatório</button>
                                        <button onClick={() => setView('checklist-dashboard')} className="flex-1 bg-brand-600 text-white p-3 rounded-lg font-bold text-sm">Salvar e Fechar</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

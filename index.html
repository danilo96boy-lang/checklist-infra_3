<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INFRA SYS | Enterprise Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb' } }
                }
            }
        }
    </script>

    <style>
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect } = React;
        const EMAIL_DESTINO = "infra@cobrecom.com.br";

        // --- ICONS ---
        const Icons = {
            Box: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            Plus: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
            ArrowUp: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m5 12 7-7 7 7M12 19V5"/></svg>,
            ArrowDown: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m19 12-7 7-7-7M12 5v14"/></svg>,
            Trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        };

        // --- COMPONENTES UI ---
        const Card = ({ children, className = "" }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm ${className}`}>{children}</div>;
        const Input = (props) => <input {...props} className="w-full h-10 px-3 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 outline-none" />;

        // --- COMPONENTE ESTOQUE ESTILO APPSHEET ---
        const InventoryModule = ({ user }) => {
            const [activeTab, setActiveTab] = useState('saldos'); // saldos, entradas, saidas
            const [products, setProducts] = useState([]);
            const [move, setMove] = useState({ prodId: '', qty: 1, person: '', badge: '' });

            useEffect(() => {
                return db.collection('inventory_official').onSnapshot(s => setProducts(s.docs.map(d => ({id: d.id, ...d.data()}))));
            }, []);

            const handleMovement = async (type) => {
                const p = products.find(x => x.id === move.prodId);
                if (!p) return alert("Selecione o produto");

                const newQty = type === 'ENTRADA' ? (p.currentQuantity || 0) + Number(move.qty) : (p.currentQuantity || 0) - Number(move.qty);
                if (newQty < 0) return alert("Estoque insuficiente!");

                await db.collection('inventory_official').doc(p.id).update({ currentQuantity: newQty });
                
                if (type === 'SAIDA') {
                    const sub = `[SAÍDA ESTOQUE] ${p.name}`;
                    const body = `BAIXA DE MATERIAL\nItem: ${p.name}\nQtd: ${move.qty}\nRetirado por: ${move.person}\nCrachá: ${move.badge}\nResponsável: ${user.name}`;
                    window.location.href = `mailto:${EMAIL_DESTINO}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
                }
                setMove({ prodId: '', qty: 1, person: '', badge: '' });
                alert("Registrado com sucesso!");
            };

            return (
                <div className="p-4 md:p-8 space-y-6 fade-in max-w-6xl mx-auto">
                    {/* Dashboards Rápidos */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <Card className="p-4 border-l-4 border-brand-500">
                            <div className="text-[10px] font-bold text-slate-500 uppercase">Total Itens</div>
                            <div className="text-2xl font-bold">{products.length}</div>
                        </Card>
                        <Card className="p-4 border-l-4 border-red-500">
                            <div className="text-[10px] font-bold text-slate-500 uppercase">Estoque Crítico</div>
                            <div className="text-2xl font-bold text-red-500">{products.filter(x => x.currentQuantity <= x.minQuantity).length}</div>
                        </Card>
                    </div>

                    {/* Navegação por Abas Estilo AppSheet */}
                    <div className="flex border-b dark:border-slate-800">
                        <button onClick={() => setActiveTab('saldos')} className={`px-6 py-3 text-sm font-bold transition-all ${activeTab === 'saldos' ? 'text-brand-500 border-b-2 border-brand-500' : 'text-slate-400'}`}>SALDOS</button>
                        <button onClick={() => setActiveTab('entradas')} className={`px-6 py-3 text-sm font-bold transition-all ${activeTab === 'entradas' ? 'text-brand-500 border-b-2 border-brand-500' : 'text-slate-400'}`}>ENTRADAS</button>
                        <button onClick={() => setActiveTab('saidas')} className={`px-6 py-3 text-sm font-bold transition-all ${activeTab === 'saidas' ? 'text-brand-500 border-b-2 border-brand-500' : 'text-slate-400'}`}>SAÍDAS</button>
                    </div>

                    {/* Conteúdo das Abas */}
                    <Card className="p-0 overflow-hidden">
                        {activeTab === 'saldos' && (
                            <div className="overflow-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 dark:bg-slate-800 border-b dark:border-slate-700">
                                        <tr>
                                            <th className="p-4 uppercase text-[10px] text-slate-500">Produto</th>
                                            <th className="p-4 uppercase text-[10px] text-slate-500 text-center">Mínimo</th>
                                            <th className="p-4 uppercase text-[10px] text-slate-500 text-right">Saldo</th>
                                            <th className="p-4 w-10"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y dark:divide-slate-800">
                                        {products.map(p => (
                                            <tr key={p.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                                                <td className="p-4 font-semibold">{p.name}</td>
                                                <td className="p-4 text-center text-slate-400">{p.minQuantity || 0}</td>
                                                <td className={`p-4 text-right font-bold ${p.currentQuantity <= p.minQuantity ? 'text-red-500' : 'text-emerald-500'}`}>{p.currentQuantity || 0}</td>
                                                <td className="p-4 text-right">
                                                    <button onClick={() => db.collection('inventory_official').doc(p.id).delete()} className="text-slate-300 hover:text-red-500">{Icons.Trash}</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="p-4 bg-slate-50 dark:bg-slate-800/50 border-t dark:border-slate-800">
                                    <button onClick={() => {
                                        const n = prompt("Nome do produto:");
                                        const m = prompt("Estoque mínimo:");
                                        if(n) db.collection('inventory_official').add({name: n, minQuantity: Number(m), currentQuantity: 0});
                                    }} className="text-brand-500 text-xs font-bold flex items-center gap-2"> {Icons.Plus} CADASTRAR NOVO ITEM NOVO</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'entradas' && (
                            <div className="p-6 max-w-md mx-auto space-y-4">
                                <h3 className="font-bold flex items-center gap-2">{Icons.ArrowUp} Registrar Entrada</h3>
                                <select className="w-full h-10 border rounded-lg dark:bg-slate-950 px-2" value={move.prodId} onChange={e => setMove({...move, prodId: e.target.value})}>
                                    <option value="">Selecionar Item...</option>
                                    {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                                <Input type="number" placeholder="Quantidade" value={move.qty} onChange={e => setMove({...move, qty: e.target.value})} />
                                <button onClick={() => handleMovement('ENTRADA')} className="w-full py-3 bg-emerald-600 text-white rounded-lg font-bold">CONFIRMAR ENTRADA</button>
                            </div>
                        )}

                        {activeTab === 'saidas' && (
                            <div className="p-6 max-w-md mx-auto space-y-4">
                                <h3 className="font-bold flex items-center gap-2 text-red-500">{Icons.ArrowDown} Registrar Saída (Baixa)</h3>
                                <select className="w-full h-10 border rounded-lg dark:bg-slate-950 px-2" value={move.prodId} onChange={e => setMove({...move, prodId: e.target.value})}>
                                    <option value="">Selecionar Item...</option>
                                    {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                                <Input type="number" placeholder="Quantidade" value={move.qty} onChange={e => setMove({...move, qty: e.target.value})} />
                                <Input placeholder="Nome de quem pegou" value={move.person} onChange={e => setMove({...move, person: e.target.value})} />
                                <Input placeholder="Número do Crachá" value={move.badge} onChange={e => setMove({...move, badge: e.target.value})} />
                                <button onClick={() => handleMovement('SAIDA')} className="w-full py-3 bg-red-600 text-white rounded-lg font-bold">CONFIRMAR SAÍDA & EMAIL</button>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const MainApp = () => {
            const [view, setView] = useState('login');
            const [user, setUser] = useState(null);

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-950">
                    <Card className="w-full max-w-sm p-8 text-center space-y-6">
                        <h1 className="text-2xl font-bold tracking-tighter">INFRA SYS</h1>
                        <form onSubmit={(e) => { e.preventDefault(); setUser({name: e.target.id.value}); setView('inventory'); }} className="space-y-4">
                            <Input name="id" placeholder="Sua Matrícula" required />
                            <button className="w-full py-3 bg-brand-600 text-white rounded-lg font-bold">ENTRAR NO SISTEMA</button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-slate-400 hidden md:flex flex-col border-r border-slate-800">
                        <div className="p-6 text-white font-bold border-b border-slate-800">INFRA SYSTEM</div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setView('dashboard_checklist')} className={`w-full flex p-3 rounded-lg ${view === 'dashboard_checklist' ? 'bg-brand-600 text-white' : ''}`}>Checklists</button>
                            <button onClick={() => setView('inventory')} className={`w-full flex p-3 rounded-lg ${view === 'inventory' ? 'bg-brand-600 text-white' : ''}`}>Estoque</button>
                        </nav>
                        <div className="p-4 text-xs border-t border-slate-800">{user.name} | <button onClick={() => setView('login')} className="text-red-400">Sair</button></div>
                    </aside>
                    <main className="flex-1 overflow-auto bg-slate-50 dark:bg-slate-950">
                        {view === 'inventory' && <InventoryModule user={user} />}
                        {view === 'dashboard_checklist' && <div className="p-20 text-center text-slate-400">Módulo de Checklist Integrado.</div>}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
    </script>
</body>
</html>

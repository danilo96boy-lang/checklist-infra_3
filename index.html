        // --- TEMPLATES TÉCNICOS COM ESTADO 'PENDING' | 'DONE' | 'NA' ---
        const createTask = (id, label) => ({ id, label, status: 'pending' });

        const getTemplate = (type, tecnicoName) => {
            const meta = {

                        createTask('f_prev_4', 'Aplicação de limpa contato nos slots')

                        createTask('f_prep_2', 'Backup de arquivos locais do usuário'),
                        createTask('f_prep_3', 'Backup de certificados e chave Office/Win'),

                    ]},
                    sistema: { title: "3. Sistema Operacional & Drivers", icon: "Server", tasks: [
                        createTask('f_sis_1', 'Instalação limpa do Windows/SO padrão'),
                        createTask('f_sis_2', 'Ingresso correto no Domínio corporativo'),
                        createTask('f_sis_3', 'Configuração de Proxy / DNS corporativo'),
                        createTask('f_sis_4', 'Ajuste de Hosts / WINS'),
                        createTask('f_sis_5', 'Atualização completa de Drivers e BIOS')
                    ]},
                    seguranca: { title: "4. Segurança & Agentes", icon: "Server", tasks: [
                        createTask('f_sec_1', 'Instalação e registro do agente Wazuh'),
                        createTask('f_sec_2', 'Instalação e vacina ESET Antivirus'),
                        createTask('f_sec_3', 'Instalação VNC + Regras de Firewall ativas'),
                        createTask('f_sec_4', 'Aplicação de GPOs e restrições locais')

                    configuracao: { title: "5. Configuração do Usuário", icon: "Server", tasks: [
                        createTask('f_conf_1', 'Ativação oficial do Windows e Office'),
                        createTask('f_conf_2', 'Plano de energia em Alto Desempenho'),
                        createTask('f_conf_3', 'Configuração de conta e perfil no Outlook'),
                        createTask('f_conf_4', 'Configuração do mensageiro interno Spark'),
                        createTask('f_conf_5', 'Instalação e teste de impressoras do setor'),
                        createTask('f_conf_6', 'Mapeamento de unidades de rede compartilhadas'),
                        createTask('f_conf_7', 'Reserva de IP Fixo via MAC no DHCP (se aplicável)')
                    ]},

                        createTask('f_app_1', 'TOTVS Protheus / SmartClient instalado'),
                        createTask('f_app_2', 'TOTVS-MES / Aplicações de Fábrica'),
                        createTask('f_app_3', 'Softwares específicos do departamento')
                    ]},
                    finalizacao: { title: "7. Validação & Liberação", icon: "Server", tasks: [

        // --- COMPONENTES UI BÁSICOS ---
        const Button = ({ children, variant = 'primary', className = "", ...props }) => {
            const variants = {
                primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow border border-transparent',
                secondary: 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700',
                danger: 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 dark:bg-red-900/20 dark:border-red-900/40 dark:text-red-400',
                ghost: 'bg-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
            };
            return <button {...props} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${className}`}>{children}</button>;

        const Card = ({ children, className = "", noPadding = false, ...props }) => (

        );

        const Input = (props) => <input {...props} className={`w-full h-9 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all ${props.className || ''}`} />;

            const colors = {
                slate: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400',
                blue: 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',
                green: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
                amber: 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300'
            };
            return <span className={`px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider ${colors[color]}`}>{children}</span>;
        };

        // --- CÁLCULO DE PROGRESSO (IGNORA N/A) ---
        const calculateProgress = (items) => {
            let totalApplicable = 0;
            let completed = 0;
            let naCount = 0;
            let pendingCount = 0;

            Object.values(items || {}).forEach(group => {
                group.tasks.forEach(t => {
                    const status = t.status !== undefined ? t.status : (t.checked ? 'done' : 'pending');
                    if (status === 'na') {
                        naCount++;
                    } else if (status === 'done') {
                        totalApplicable++;
                        completed++;
                    } else {
                        totalApplicable++;
                        pendingCount++;
                    }
                });
            });

            const percent = totalApplicable === 0 ? 100 : Math.round((completed / totalApplicable) * 100);
            return { percent, completed, totalApplicable, naCount, pendingCount };
        };

        // --- TELAS ---
        const LoginScreen = ({ onLogin, users }) => {
            const [id, setId] = useState('');
            const [pass, setPass] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const user = users.find(u => u.id === id.trim() && u.pass === pass.trim());
                if (user) onLogin(user); else setError('Credenciais inválidas. Verifique matrícula e senha.');
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950 p-4">

                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
                            </div>
                            <h1 className="text-xl font-bold text-slate-900 dark:text-white tracking-tight">Bancada de TI</h1>
                            <p className="text-xs text-slate-500 mt-1">Checklist de Liberação Técnica & Ativos</p>
                        </div>
                        <form onSubmit={handleSubmit} className="p-8 space-y-4">

                                <Input value={id} onChange={e => setId(e.target.value)} placeholder="0100xxxx" autoFocus />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5 ml-1">Senha de Bancada</label>
                                <Input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••" />
                            </div>
                            {error && <div className="text-red-500 text-xs font-medium text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg">{error}</div>}
                            <Button type="submit" className="w-full h-11 text-base mt-2">Iniciar Sessão de Bancada</Button>
                        </form>
                        <div className="bg-slate-50 dark:bg-slate-950/50 p-4 text-center border-t border-slate-100 dark:border-slate-800">
                            <p className="text-[10px] text-slate-400 font-mono">CONTROLE TÉCNICO DE ATIVOS • COBRECOM</p>
                        </div>
                    </div>
                </div>
            );
        };

        const ConfigModal = ({ onClose, users, currentUser }) => {
            const [newUser, setNewUser] = useState({ id: '', name: '', pass: '' });
            const [filter, setFilter] = useState('');
            const [saving, setSaving] = useState(false);

            const handleAddUser = async (e) => {
                e.preventDefault();
                const id = newUser.id.trim();
                const name = newUser.name.trim();
                const pass = newUser.pass.trim();

                if (!id || !name || !pass) return alert("Preencha todos os campos do técnico.");
                if (users.some(u => u.id.toLowerCase() === id.toLowerCase())) return alert("Essa matrícula já está cadastrada.");

                setSaving(true);
                try {
                    await db.collection('users').add({ id, name, pass });
                    setNewUser({ id: '', name: '', pass: '' });
                } catch (err) {
                    alert("Erro ao cadastrar: " + err.message);
                } finally {
                    setSaving(false);
                }
            };

            const handleDeleteUser = async (user) => {
                if (user.id === currentUser.id) return alert("Você não pode remover a si mesmo da equipe enquanto estiver logado.");
                if (users.length <= 1) return alert("A bancada precisa manter ao menos um técnico cadastrado.");
                if (confirm(`Remover o técnico ${user.name} (${user.id}) da equipe de bancada?`)) {
                    await db.collection('users').doc(user.docId).delete();
                }
            };

            const filteredUsers = users.filter(u => u.name.toLowerCase().includes(filter.toLowerCase()) || u.id.toLowerCase().includes(filter.toLowerCase()));

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                    <Card className="w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden" noPadding>
                        <div className="p-4 px-6 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                            <div>
                                <h2 className="font-bold flex items-center gap-2 text-slate-800 dark:text-slate-100">
                                    {Icons.Settings} Equipe Técnica de Bancada
                                </h2>

                            </div>
                            <button onClick={onClose} className="text-2xl leading-none text-slate-400 hover:text-slate-600 transition-colors">&times;</button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto grid md:grid-cols-5 gap-6">
                            <div className="md:col-span-2 border-b md:border-b-0 md:border-r border-slate-100 dark:border-slate-800 md:pr-6 pb-6 md:pb-0">
                                <h3 className="text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider flex items-center gap-1.5">
                                    {Icons.Plus} Adicionar Técnico
                                </h3>
                                <form onSubmit={handleAddUser} className="space-y-3">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-500 mb-1">Matrícula</label>
                                        <Input placeholder="Ex: 01001999" value={newUser.id} onChange={e => setNewUser({...newUser, id: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-500 mb-1">Nome Completo</label>
                                        <Input placeholder="Ex: Marcelo Silva" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-500 mb-1">Senha de Acesso</label>
                                        <Input type="password" placeholder="••••" value={newUser.pass} onChange={e => setNewUser({...newUser, pass: e.target.value})} />
                                    </div>
                                    <Button type="submit" disabled={saving} className="w-full mt-2">
                                        {saving ? "Salvando..." : "Cadastrar Técnico"}
                                    </Button>
                                </form>
                            </div>

                            <div className="md:col-span-3 flex flex-col">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="text-xs font-bold uppercase text-slate-500 tracking-wider">Técnicos Ativos ({users.length})</h3>
                                    <input type="text" placeholder="Filtrar..." value={filter} onChange={e => setFilter(e.target.value)} className="text-xs px-2.5 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 outline-none w-36" />
                                </div>
                                <div className="space-y-2 max-h-[340px] overflow-y-auto pr-1">
                                    {filteredUsers.map(u => {
                                        const isCurrent = u.id === currentUser.id;
                                        return (
                                            <div key={u.docId || u.id} className="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800/80 rounded-lg border border-slate-200/70 dark:border-slate-700">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-full bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-bold flex items-center justify-center text-xs">
                                                        {u.name ? u.name.charAt(0).toUpperCase() : '?'}
                                                    </div>
                                                    <div>
                                                        <div className="font-semibold text-sm text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                                            {u.name}
                                                            {isCurrent && <span className="text-[10px] font-bold bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 px-1.5 py-0.2 rounded">Você</span>}
                                                        </div>
                                                        <div className="text-[11px] text-slate-400 font-mono">ID: {u.id}</div>
                                                    </div>
                                                </div>
                                                {!isCurrent && (
                                                    <button onClick={() => handleDeleteUser(u)} title="Remover da bancada" className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition-colors">
                                                        {Icons.Trash}
                                                    </button>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        // --- TELA DE EXECUÇÃO DO CHECKLIST ---
        const ActiveChecklist = ({ item, onUpdate, onBack, onRequestFinish }) => {
            if (!item) return null;
            const { data } = item;

            const handleMeta = (field, value) => {
                onUpdate({ ...data, meta: { ...data.meta, [field]: value } });
            };

            // Alternar Tri-State: pending -> done -> na -> pending
            const toggleTaskStatus = (sectionKey, taskId) => {
                const newData = { ...data };
                const currentTasks = newData.items[sectionKey].tasks;
                const updatedTasks = currentTasks.map(task => {
                    if (task.id === taskId) {
                        const curStatus = task.status !== undefined ? task.status : (task.checked ? 'done' : 'pending');
                        let nextStatus = 'done';
                        if (curStatus === 'pending') nextStatus = 'done';
                        else if (curStatus === 'done') nextStatus = 'na';
                        else nextStatus = 'pending';

                        return { ...task, status: nextStatus, checked: nextStatus === 'done' };
                    }
                    return task;
                });
                newData.items[sectionKey] = { ...newData.items[sectionKey], tasks: updatedTasks };
                onUpdate(newData);
            };

            // Marcar todas da seção como FEITO
            const setSectionAll = (sectionKey, status) => {
                const newData = { ...data };
                const updatedTasks = newData.items[sectionKey].tasks.map(t => ({
                    ...t,
                    status,
                    checked: status === 'done'
                }));
                newData.items[sectionKey] = { ...newData.items[sectionKey], tasks: updatedTasks };
                onUpdate(newData);
            };

            const stats = calculateProgress(data.items);

            return (
                <div className="flex flex-col h-full overflow-hidden bg-slate-100 dark:bg-slate-950 relative">
                    {/* Barra Superior */}
                    <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-sm z-10 shrink-0">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="p-2 -ml-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500">{Icons.ChevronLeft}</button>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h2 className="text-lg font-bold text-slate-800 dark:text-white leading-none font-mono">#{item.visualId}</h2>
                                    <Badge color={item.type === 'formatacao' ? 'blue' : 'amber'}>
                                        {item.type === 'formatacao' ? 'Preparação PC' : 'Zebra Térmica'}
                                    </Badge>
                                </div>
                                <p className="text-xs text-slate-500 mt-1">Iniciado em {new Date(item.createdAt).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-5">
                            <div className="text-right hidden sm:block">
                                <div className="flex items-center gap-2">
                                    <span className="text-xs font-bold text-brand-600 block">{stats.percent}% Concluído</span>
                                    {stats.naCount > 0 && <span className="text-[10px] text-slate-400">({stats.naCount} N/A)</span>}
                                </div>
                                <div className="w-36 h-2 bg-slate-100 dark:bg-slate-800 rounded-full mt-1 overflow-hidden">
                                    <div className={`h-full transition-all duration-500 ${stats.percent === 100 ? 'bg-emerald-500' : 'bg-brand-600'}`} style={{ width: `${stats.percent}%` }}></div>
                                </div>
                            </div>
                            <Button onClick={onRequestFinish} variant={stats.percent === 100 ? 'primary' : 'secondary'}>
                                {stats.percent === 100 ? 'Liberar Equipamento' : 'Revisar & Assinar'}
                            </Button>
                        </div>
                    </div>

                    {/* Conteúdo Scrollável */}
                    <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                        {/* Ficha de Identificação do Ativo */}
                        <Card noPadding className="border-l-4 border-l-brand-600">
                            <div className="p-4 px-6 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex justify-between items-center">
                                <h3 className="text-xs font-bold uppercase text-slate-600 dark:text-slate-300 tracking-wider">
                                    Identificação do Equipamento em Bancada
                                </h3>
                                <span className="text-[11px] font-mono text-slate-400">Preenchimento de Inventário</span>
                            </div>
                            <div className="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Patrimônio / Service Tag</label>
                                    <Input placeholder="Ex: PAT-01492" value={data.meta.patrimonio || ''} onChange={e => handleMeta('patrimonio', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Hostname / Nome da Máquina</label>
                                    <Input placeholder="Ex: TI-NOTE-04" value={data.meta.hostname || ''} onChange={e => handleMeta('hostname', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Hardware / Specs (RAM, SSD, CPU)</label>
                                    <Input placeholder="Ex: i5 11th / 16GB / 512GB SSD" value={data.meta.specs || ''} onChange={e => handleMeta('specs', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Endereço IP / MAC</label>
                                    <Input placeholder="Ex: 192.168.1.105" value={data.meta.rede || ''} onChange={e => handleMeta('rede', e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-wider">Técnico Responsável</label>
                                    <Input value={data.meta.tecnico || ''} onChange={e => handleMeta('tecnico', e.target.value)} />
                                </div>
                            </div>
                        </Card>

                        {/* Grupos do Checklist */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-12">
                            {Object.entries(data.items).map(([groupKey, group]) => {
                                const groupStats = calculateProgress({ [groupKey]: group });
                                return (
                                    <Card key={groupKey} noPadding className="overflow-hidden h-fit">
                                        <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <div className="text-brand-500">{Icons[group.icon]}</div>
                                                <h3 className="font-bold text-slate-700 dark:text-slate-200 text-xs uppercase tracking-wider">{group.title}</h3>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <button 
                                                    onClick={() => setSectionAll(groupKey, 'done')} 
                                                    title="Marcar todas como concluídas" 
                                                    className="text-[10px] font-bold uppercase px-2 py-1 bg-brand-50 hover:bg-brand-100 text-brand-700 dark:bg-brand-900/30 dark:text-brand-300 rounded flex items-center gap-1 transition-colors"
                                                >
                                                    {Icons.CheckAll} Todos OK
                                                </button>
                                                <button 
                                                    onClick={() => setSectionAll(groupKey, 'na')} 
                                                    title="Marcar todas como Não se Aplica" 
                                                    className="text-[10px] font-bold uppercase px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-300 rounded transition-colors"
                                                >
                                                    N/A
                                                </button>
                                            </div>
                                        </div>
                                        <div className="divide-y divide-slate-50 dark:divide-slate-800/50">
                                            {group.tasks.map(task => {
                                                const taskStatus = task.status !== undefined ? task.status : (task.checked ? 'done' : 'pending');
                                                return (
                                                    <div 
                                                        key={task.id} 
                                                        onClick={() => toggleTaskStatus(groupKey, task.id)}
                                                        className="flex items-center justify-between p-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800/60 cursor-pointer select-none transition-colors"
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-5 h-5 rounded flex items-center justify-center transition-all ${
                                                                taskStatus === 'done' ? 'bg-emerald-600 text-white' :
                                                                taskStatus === 'na' ? 'bg-slate-300 dark:bg-slate-700 text-slate-600 dark:text-slate-300' :
                                                                'border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'
                                                            }`}>
                                                                {taskStatus === 'done' && Icons.Check}
                                                                {taskStatus === 'na' && <span className="text-[10px] font-bold">✕</span>}
                                                            </div>
                                                            <span className={`text-sm ${
                                                                taskStatus === 'done' ? 'text-slate-400 dark:text-slate-500 line-through' :
                                                                taskStatus === 'na' ? 'text-slate-400 italic' :
                                                                'text-slate-700 dark:text-slate-200 font-medium'
                                                            }`}>
                                                                {task.label}
                                                            </span>
                                                        </div>
                                                        <span className={`text-[10px] font-mono uppercase font-bold px-1.5 py-0.5 rounded ${
                                                            taskStatus === 'done' ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300' :
                                                                taskStatus === 'na' ? 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400' :
                                                                'bg-amber-50 text-amber-600 dark:bg-amber-950/40 dark:text-amber-300'
                                                        }`}>
                                                            {taskStatus === 'done' ? 'FEITO' : taskStatus === 'na' ? 'N/A' : 'PENDENTE'}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // --- TELA DE REVISÃO E FICHA DE LIBERAÇÃO ---
        const ReceiptView = ({ item, onBack, onArchive, logo, currentUser }) => {
            const [obs, setObs] = useState('');
            const meta = item.data.meta;
            const identificador = meta.hostname || meta.patrimonio || "SEM IDENTIFICAÇÃO";
            const stats = calculateProgress(item.data.items);
            const statusGlobal = stats.percent === 100 ? "LIBERADO" : "PENDENTE";

            const pendingList = [];
            const categorySummary = Object.values(item.data.items).map(group => {
                const total = group.tasks.length;
                const doneCount = group.tasks.filter(t => (t.status || (t.checked ? 'done' : 'pending')) === 'done').length;
                const naCount = group.tasks.filter(t => t.status === 'na').length;
                const isOk = (doneCount + naCount) === total;

                group.tasks.forEach(t => {
                    const st = t.status || (t.checked ? 'done' : 'pending');
                    if (st === 'pending') pendingList.push(`- [${group.title}] ${t.label}`);
                });

                return { title: group.title, status: isOk ? "OK" : "PENDENTE", naCount };
            });

            const handleSendEmail = () => {
                const subject = `[${statusGlobal}] Liberação de Bancada #${item.visualId} - ${identificador}`;
                const body = `FICHA DE LIBERAÇÃO TÉCNICA - BANCADA DE TI\n----------------------------------------\nID PROCESSO: #${item.visualId}\nHOSTNAME: ${meta.hostname || 'N/A'}\nPATRIMÔNIO: ${meta.patrimonio || 'N/A'}\nHARDWARE: ${meta.specs || 'N/A'}\nIP/REDE: ${meta.rede || 'N/A'}\nTÉCNICO: ${meta.tecnico}\nDATA LIBERAÇÃO: ${new Date().toLocaleDateString()}\nCONFORMIDADE TÉCNICA: ${stats.percent}%\n----------------------------------------\nRESUMO POR ETAPA:\n${categorySummary.map(c => `[${c.status}] ${c.title} ${c.naCount > 0 ? `(${c.naCount} N/A)` : ''}`).join('\n')}\n----------------------------------------\nOBSERVAÇÕES DE BANCADA:\n${obs || "Nenhuma observação técnica registrada."}\n\nGerado via Controle de Bancada Infra`;
                
                window.location.href = `mailto:${EMAIL_DESTINO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                
                setTimeout(() => {
                    if(confirm("E-mail disparado? Clique em OK para arquivar o equipamento como concluído.")) onArchive(item);
                }, 1000);
            };

            return (
                <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-950 overflow-auto p-4 md:p-8">
                    <div className="max-w-4xl mx-auto w-full space-y-6 fade-in no-print">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 cursor-pointer" onClick={onBack}>
                                {Icons.ChevronLeft} <span className="font-bold text-sm">Voltar ao Checklist</span>
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 dark:text-white">Ficha de Liberação Técnica</h1>
                        </div>

                        <Card className="grid md:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Observações Técnicas de Bancada</label>
                                    <textarea value={obs} onChange={e => setObs(e.target.value)} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm h-36 resize-none focus:ring-2 focus:ring-brand-500/20 outline-none" placeholder="Ex: Substituído pente de 8GB por 16GB. Bateria trocada. Licença OEM vinculada à conta corporativa..."></textarea>
                                </div>
                            </div>
                            <div className="flex flex-col justify-center gap-3 border-l border-slate-100 dark:border-slate-800 pl-6">
                                <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300">Ações de Finalização</h3>
                                <Button className="w-full justify-start" onClick={() => window.print()} variant="secondary">
                                    {Icons.Printer} Imprimir Espelho / Etiqueta de Bancada
                                </Button>
                                <Button className="w-full justify-start" onClick={handleSendEmail}>
                                    {Icons.Mail} Enviar Notificação & Liberar para Estoque
                                </Button>
                            </div>
                        </Card>
                    </div>

                    {/* FOLHA DE IMPRESSÃO / ESPELHO DE BANCADA */}
                    <div id="receipt-area" className="hidden bg-white text-black font-sans text-xs border border-gray-300 p-0">
                        <div className="flex justify-between items-center p-6 border-b-2 border-black">
                            <div className="flex items-center gap-4">
                                {logo && <img src={logo} className="h-10 object-contain" />}
                                <div>
                                    <h1 className="text-xl font-bold tracking-tighter uppercase">Ficha Técnica de Liberação</h1>
                                    <p className="text-[10px] uppercase tracking-widest text-gray-500">Departamento de TI • Bancada de Infraestrutura</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-2xl font-mono font-bold">#{item.visualId || 'PEND'}</div>
                                <div className="text-[10px] font-bold">{new Date().toLocaleDateString()}</div>
                            </div>
                        </div>

                        <div className="grid grid-cols-4 border-b border-black">
                            <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Hostname</span><span className="font-bold text-sm block truncate">{meta.hostname || 'N/A'}</span></div>
                            <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Patrimônio</span><span className="font-bold text-sm block truncate">{meta.patrimonio || 'N/A'}</span></div>
                            <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Hardware / Specs</span><span className="text-[11px] block truncate">{meta.specs || 'N/A'}</span></div>
                            <div className={`p-3 text-center flex flex-col justify-center ${stats.percent === 100 ? 'bg-gray-100' : 'bg-gray-200'}`}>
                                <span className="block text-[9px] font-bold uppercase text-gray-500">Status</span>
                                <span className="font-bold text-sm">{statusGlobal} ({stats.percent}%)</span>
                            </div>
                        </div>

                        <div className="p-6 flex gap-8">
                            <div className="w-1/2">
                                <h3 className="font-bold uppercase text-[10px] mb-2 border-b border-black pb-1">Etapas de Qualidade Técnica</h3>
                                <table className="w-full text-left border-collapse">
                                    <tbody>
                                        {categorySummary.map((cat, i) => (
                                            <tr key={i} className="border-b border-dotted border-gray-400">
                                                <td className="py-1.5 font-medium">{cat.title}</td>
                                                <td className="py-1.5 text-right font-mono font-bold">{cat.status === 'OK' ? 'CONFORME' : 'PENDENTE'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="w-1/2 flex flex-col gap-4">
                                {pendingList.length > 0 && (
                                    <div className="border border-black p-2 bg-gray-50">
                                        <h3 className="font-bold uppercase text-[9px] mb-1">Pendências Não Realizadas</h3>
                                        <ul className="list-disc list-inside text-[10px] space-y-0.5">{pendingList.map((p, i) => <li key={i} className="truncate">{p.replace('- ', '')}</li>)}</ul>
                                    </div>
                                )}
                                <div>
                                    <h3 className="font-bold uppercase text-[10px] mb-1 border-b border-black pb-1">Observações do Técnico</h3>
                                    <p className="text-[10px] leading-relaxed italic h-20">{obs || "Equipamento revisado e pronto para entrega ao estoque/usuário."}</p>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 px-6 pb-6 pt-4 flex justify-between gap-12">
                            <div className="w-1/2 text-center"><div className="border-t border-black pt-1"></div><p className="text-[9px] font-bold uppercase">Técnico Responsável: {meta.tecnico}</p></div>
                            <div className="w-1/2 text-center"><div className="border-t border-black pt-1"></div><p className="text-[9px] font-bold uppercase">Conferido e Liberado para Produção</p></div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD DE BANCADA ---
        const Dashboard = ({ activeItems, onNewItem, onOpenItem, onDeleteItem, historyCount }) => {
            const formatCount = activeItems.filter(t => t.type === 'formatacao').length;
            const zebraCount = activeItems.filter(t => t.type !== 'formatacao').length;

            return (
                <div className="p-6 md:p-10 space-y-8 fade-in">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Bancada de Infraestrutura</h2>
                        <p className="text-slate-500 text-sm">Controle operacional de equipamentos em preparação e manutenções técnicas.</p>
                    </div>
                    
                    {/* CARDS DE STATUS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="flex items-center justify-between p-5 border-l-4 border-l-brand-500">
                            <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Em Bancada Hoje</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{activeItems.length}</h3></div>
                            <div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-xl text-brand-600">{Icons.Layout}</div>
                        </Card>
                        <Card className="flex items-center justify-between p-5 border-l-4 border-l-emerald-500">
                            <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Total Já Liberados</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{historyCount}</h3></div>
                            <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl text-emerald-600">{Icons.History}</div>
                        </Card>
                        <Card className="flex items-center justify-between p-5 border-l-4 border-l-indigo-500">
                            <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Computadores / PCs</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{formatCount}</h3></div>
                            <div className="bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl text-indigo-600">{Icons.Server}</div>
                        </Card>
                    </div>

                    {/* BOTÕES DE NOVO PROCESSO */}
                    <div className="flex flex-col md:flex-row gap-4">
                        <button onClick={() => onNewItem('formatacao')} className="flex-1 bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white p-4 rounded-xl shadow-lg shadow-brand-500/20 transition-all flex items-center justify-between group">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-white/20 rounded-lg backdrop-blur-sm">{Icons.Plus}</div>
                                <div className="text-left"><span className="block font-bold">Nova Preparação de Computador</span><span className="text-xs opacity-80">Formatação, backup, domínio e drivers</span></div>
                            </div>
                        </button>
                        <button onClick={() => onNewItem('zebra')} className="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-500 p-4 rounded-xl shadow-sm hover:shadow-md transition-all flex items-center justify-between group">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 group-hover:text-brand-500">{Icons.Printer}</div>
                                <div className="text-left"><span className="block font-bold text-slate-700 dark:text-slate-200">Manutenção de Zebra</span><span className="text-xs text-slate-500">Limpeza térmica e calibração de sensor</span></div>
                            </div>
                        </button>
                    </div>

                    {/* LISTA DE EQUIPAMENTOS NA BANCADA */}
                    <div>
                        <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">{Icons.Server} Equipamentos em Andamento na Bancada</h3>
                        {activeItems.length === 0 ? (
                            <div className="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-12 text-center">
                                <p className="text-slate-400 font-medium">Bancada vazia no momento.</p>
                                <p className="text-xs text-slate-500 mt-1">Inicie um novo equipamento nos botões acima.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {activeItems.map(item => {
                                    const stats = calculateProgress(item.data.items);
                                    const idDisplay = item.data.meta.hostname || item.data.meta.patrimonio || "Sem Identificação";
                                    
                                    return (
                                        <div key={item.id} onClick={() => onOpenItem(item.id)} className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 hover:shadow-lg hover:border-brand-400 dark:hover:border-brand-500 transition-all cursor-pointer relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                            <div className="flex justify-between items-start mb-3">
                                                <Badge color={item.type === 'formatacao' ? 'blue' : 'amber'}>
                                                    {item.type === 'formatacao' ? 'Computador' : 'Zebra'}
                                                </Badge>
                                                <span className="text-xs font-mono font-bold text-slate-400">#{item.visualId}</span>
                                            </div>
                                            <h4 className="font-bold text-slate-800 dark:text-white text-base truncate mb-1">{idDisplay}</h4>
                                            <p className="text-xs text-slate-500 mb-4 flex items-center gap-1">{Icons.User} {item.data.meta.tecnico || 'Técnico Não Definido'}</p>
                                            
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                    <div className={`h-full ${stats.percent === 100 ? 'bg-emerald-500' : 'bg-brand-500'}`} style={{ width: `${stats.percent}%` }}></div>
                                                </div>
                                                <span className="text-xs font-bold text-brand-600">{stats.percent}%</span>
                                            </div>
                                            <button onClick={(e) => onDeleteItem(e, item.id)} className="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition-colors opacity-0 group-hover:opacity-100">{Icons.Trash}</button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- HISTÓRICO COM EXPORTAÇÃO CSV ---
        const HistoryView = ({ history }) => {
            const [search, setSearch] = useState('');
            const filtered = history.filter(h => 
                (h.ativo || '').toLowerCase().includes(search.toLowerCase()) || 
                (h.tecnico || '').toLowerCase().includes(search.toLowerCase()) || 
                (h.visualId && h.visualId.toLowerCase().includes(search.toLowerCase())) ||
                (h.patrimonio && h.patrimonio.toLowerCase().includes(search.toLowerCase()))
            );

            const exportCSV = () => {
                if (filtered.length === 0) return alert("Nenhum registro para exportar.");
                
                const headers = ["ID", "Data", "Tipo", "Hostname/Ativo", "Patrimônio", "Técnico", "Status"];
                const rows = filtered.map(h => [
                    h.visualId,
                    new Date(h.date).toLocaleDateString(),
                    h.type === 'formatacao' ? 'Computador' : 'Zebra',
                    `"${h.ativo || ''}"`,
                    `"${h.patrimonio || ''}"`,
                    `"${h.tecnico || ''}"`,
                    "Liberado"
                ]);

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `historico_bancada_infra_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="p-6 md:p-10 h-full flex flex-col fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Registro de Equipamentos Liberados</h2>
                            <p className="text-slate-500 text-sm">Histórico completo de equipamentos configurados e testados.</p>
                        </div>
                        <div className="flex items-center gap-3 w-full md:w-auto">
                            <div className="relative flex-1 md:flex-initial">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">{Icons.Search}</div>
                                <Input placeholder="Buscar Host, Patrimônio, ID..." value={search} onChange={e => setSearch(e.target.value)} className="pl-10 w-full md:w-64" />
                            </div>
                            <Button onClick={exportCSV} variant="secondary" className="whitespace-nowrap">
                                {Icons.Download} Exportar Planilha
                            </Button>
                        </div>
                    </div>
                    
                    <Card className="flex-1 overflow-hidden flex flex-col" noPadding>
                        <div className="overflow-auto flex-1">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 dark:bg-slate-800 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th className="px-6 py-3">ID Bancada</th>
                                        <th className="px-6 py-3">Data</th>
                                        <th className="px-6 py-3">Tipo</th>
                                        <th className="px-6 py-3">Hostname / Ativo</th>
                                        <th className="px-6 py-3">Patrimônio</th>
                                        <th className="px-6 py-3">Técnico</th>
                                        <th className="px-6 py-3 text-right">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {filtered.map((h, i) => (
                                        <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            <td className="px-6 py-3 font-mono text-xs font-bold text-slate-500">#{h.visualId}</td>
                                            <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{new Date(h.date).toLocaleDateString()}</td>
                                            <td className="px-6 py-3"><Badge color={h.type === 'formatacao' ? 'blue' : 'amber'}>{h.type === 'formatacao' ? 'Computador' : 'Zebra'}</Badge></td>
                                            <td className="px-6 py-3 font-medium text-slate-800 dark:text-white">{h.ativo || 'N/A'}</td>
                                            <td className="px-6 py-3 font-mono text-xs text-slate-600 dark:text-slate-400">{h.patrimonio || 'N/A'}</td>
                                            <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{h.tecnico}</td>
                                            <td className="px-6 py-3 text-right"><span className="text-emerald-600 dark:text-emerald-400 text-xs font-bold bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-full">Liberado</span></td>
                                        </tr>
                                    ))}
                                    {filtered.length === 0 && <tr><td colSpan="7" className="text-center py-8 text-slate-400">Nenhum equipamento registrado.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        // --- COMPONENTE RAIZ (APP) ---
        const App = () => {
            const [view, setView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [users, setUsers] = useState([]);
            const [activeItems, setActiveItems] = useState([]);
            const [history, setHistory] = useState([]);
            const [logo, setLogo] = useState('');
            const [currentItemId, setCurrentItemId] = useState(null);
            const [darkMode, setDarkMode] = useState(true);
            const [showConfig, setShowConfig] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const savedTheme = localStorage.getItem('sa_theme'); 
                if (savedTheme !== null) setDarkMode(JSON.parse(savedTheme));
                
                const savedLogo = localStorage.getItem('sa_logo'); if (savedLogo) setLogo(savedLogo);
                const savedUser = localStorage.getItem('sa_user_session'); 
                if (savedUser) { 
                    const parsed = JSON.parse(savedUser);
                    setCurrentUser(parsed); 
                    setView('dashboard'); 
                }

                // Sincronização em tempo real de equipamentos em bancada
                const unsubItems = db.collection('tickets').onSnapshot(snap => 
                    setActiveItems(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)))
                );
                const unsubHistory = db.collection('history').orderBy('date', 'desc').limit(100).onSnapshot(snap => 
                    setHistory(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })))
                );

                // Carregamento de técnicos com seeding inicial
                const unsubUsers = db.collection('users').onSnapshot(async snap => {
                    if (snap.empty) {
                        const batch = db.batch();
                        DEFAULT_TEAM.forEach(u => {
                            const newDoc = db.collection('users').doc();
                            batch.set(newDoc, u);
                        });
                        await batch.commit();
                    } else {
                        const userList = snap.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                        setUsers(userList);

                        if (savedUser) {
                            const sessionUser = JSON.parse(savedUser);
                            const exists = userList.some(u => u.id === sessionUser.id);
                            if (!exists) handleLogout();
                        }
                    }
                });

                return () => { unsubItems(); unsubHistory(); unsubUsers(); };
            }, []);

            useEffect(() => { 
                if (darkMode) document.documentElement.classList.add('dark'); 
                else document.documentElement.classList.remove('dark'); 
                localStorage.setItem('sa_theme', JSON.stringify(darkMode)); 
            }, [darkMode]);

            const handleLogin = (user) => { 
                setCurrentUser(user); 
                localStorage.setItem('sa_user_session', JSON.stringify(user)); 
                setView('dashboard'); 
            };

            const handleLogout = () => { 
                setCurrentUser(null); 
                localStorage.removeItem('sa_user_session'); 
                setView('login'); 
            };
            
            const handleCreateItem = async (type) => {
                const prefix = type === 'formatacao' ? 'PC' : 'ZB';
                const counterRef = db.collection('counters').doc(type);
                try {
                    await db.runTransaction(async (t) => {
                        const doc = await t.get(counterRef);
                        const nextSeq = doc.exists ? doc.data().current + 1 : 1001;
                        t.set(counterRef, { current: nextSeq }, { merge: true });
                        const newRef = db.collection('tickets').doc();
                        t.set(newRef, { visualId: `${prefix}-${nextSeq}`, type, data: getTemplate(type, currentUser?.name), createdAt: new Date().toISOString() });
                        setCurrentItemId(newRef.id);
                        setView('checklist');
                    });
                } catch (e) { alert("Erro de comunicação com o banco."); }
            };

            const handleUpdateItem = (newData) => { 
                if (currentItemId) db.collection('tickets').doc(currentItemId).update({ data: newData }); 
            };
            
            const handleArchive = (item) => {
                if(!item) return;
                db.collection('history').add({ 
                    visualId: item.visualId, 
                    type: item.type, 
                    date: new Date().toISOString(), 
                    tecnico: item.data.meta.tecnico, 
                    ativo: item.data.meta.hostname || "N/A", 
                    patrimonio: item.data.meta.patrimonio || "N/A",
                    data: item.data 
                }).then(() => db.collection('tickets').doc(item.id).delete())
                  .then(() => { setCurrentItemId(null); setView('dashboard'); });
            };
            
            const handleDeleteActive = (e, id) => { 
                e.stopPropagation(); 
                if(confirm("Deseja cancelar o processo deste equipamento na bancada?")) db.collection('tickets').doc(id).delete(); 
            };

            const handleLogoUpload = (e) => { 
                const f = e.target.files[0]; 
                if(f) { 
                    const r = new FileReader(); 
                    r.onloadend = () => { setLogo(r.result); localStorage.setItem('sa_logo', r.result); }; 
                    r.readAsDataURL(f); 
                }
            };

            if (view === 'login') return <LoginScreen onLogin={handleLogin} users={users} />;

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200">
                    {/* BARRA LATERAL (DESKTOP) */}
                    <aside className="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col border-r border-slate-800 z-20 shrink-0">
                        <div className="h-16 flex items-center gap-3 px-6 font-bold text-white tracking-wide border-b border-slate-800">
                            <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
                            </div>
                            BANCADA INFRA
                        </div>
                        <nav className="flex-1 py-6 px-3 space-y-1">
                            <button onClick={() => setView('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm ${view === 'dashboard' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}>
                                {Icons.Layout} Bancada de Trabalho
                            </button>
                            <button onClick={() => setView('history')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm ${view === 'history' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}>
                                {Icons.History} Ativos Liberados
                            </button>
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="flex items-center gap-3 mb-4 px-2">
                                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">
                                    {currentUser?.name?.charAt(0) || 'T'}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-sm font-bold text-white truncate">{currentUser?.name}</p>
                                    <p className="text-xs text-slate-500 font-mono">Técnico de Bancada</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <button title="Alternar tema" onClick={() => setDarkMode(!darkMode)} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-yellow-400 transition-colors flex justify-center">{darkMode ? Icons.Sun : Icons.Moon}</button>
                                <button title="Gerenciar Equipe" onClick={() => setShowConfig(true)} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors flex justify-center">{Icons.Settings}</button>
                                <button title="Encerrar Sessão" onClick={handleLogout} className="p-2 rounded bg-red-900/20 hover:bg-red-900/40 text-red-400 transition-colors flex justify-center">{Icons.LogOut}</button>
                            </div>
                            <div className="mt-4 pt-4 border-t border-slate-800 text-center">
                                <p className="text-[10px] text-slate-600 cursor-pointer hover:text-slate-400" onClick={() => fileInputRef.current.click()}>Alterar Logo do Relatório</p>
                                <input type="file" ref={fileInputRef} onChange={handleLogoUpload} className="hidden" accept="image/*" />
                            </div>
                        </div>
                    </aside>

                    {/* ÁREA PRINCIPAL */}
                    <main className="flex-1 flex flex-col min-w-0 bg-slate-100 dark:bg-slate-950">
                        {/* Topbar Mobile */}
                        <div className="md:hidden h-16 bg-slate-900 text-white flex items-center justify-between px-4 shrink-0">
                            <span className="font-bold tracking-tight">BANCADA INFRA</span>
                            <div className="flex gap-2">
                                <button onClick={() => setShowConfig(true)} className="p-2">{Icons.Settings}</button>
                                <button onClick={() => setView('dashboard')} className="p-2">{Icons.Layout}</button>
                                <button onClick={handleLogout} className="p-2">{Icons.LogOut}</button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-auto relative">
                            {showConfig && <ConfigModal onClose={() => setShowConfig(false)} users={users} currentUser={currentUser} />}
                            {view === 'dashboard' && <Dashboard activeItems={activeItems} onNewItem={handleCreateItem} onOpenItem={(id) => { setCurrentItemId(id); setView('checklist'); }} onDeleteItem={handleDeleteActive} historyCount={history.length} />}
                            {view === 'checklist' && <ActiveChecklist item={activeItems.find(t => t.id === currentItemId)} onUpdate={handleUpdateItem} onBack={() => setView('dashboard')} onRequestFinish={() => setView('receipt')} />}
                            {view === 'receipt' && <ReceiptView item={activeItems.find(t => t.id === currentItemId)} onBack={() => setView('checklist')} onArchive={handleArchive} logo={logo} currentUser={currentUser} />}
                            {view === 'history' && <HistoryView history={history} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

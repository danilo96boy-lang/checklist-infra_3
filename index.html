            // Usa o protocolo MECARD: é super compacto (poucos pontos na etiqueta térmica)
            // e faz a câmera nativa do iPhone e Android abrir na hora um cartão na tela mostrando ATIVO, NOME e SETOR!
            var buildDesktopQRPayload = function(item) {
                if (!item) return 'MECARD:N:S/ATIVO;ORG:COBRECOM;;';
                var ativo = (item.ativo || 'S/ATIVO').toString().trim().toUpperCase().replace(/[;:]/g, '');
                var nome = (item.nome || '-').toString().trim().toUpperCase().replace(/[;:]/g, '');
                var setor = (item.setor || '-').toString().trim().toUpperCase().replace(/[;:]/g, '');
                return "MECARD:N:" + ativo + " - " + nome + ";ORG:SETOR " + setor + ";NOTE:ATIVO " + ativo + ";;";
            };

            var generateQRDataURL = function(text) {
                try {
                    if (typeof qrcode === 'undefined') return '';
                    var qr = qrcode(0, 'L');
                    qr.addData(text || 'COBRECOM');
                    qr.make();
                    return qr.createDataURL(8, 2);
                } catch (e) {
                    return '';
                }
            };

            var generateQRSVG = function(text) {
                try {
                    if (typeof qrcode === 'undefined') return '';
                    var qr = qrcode(0, 'L');
                    qr.addData(text || 'COBRECOM');
                    qr.make();
                    return '<img src="' + qr.createDataURL(8, 2) + '" style="width:11mm !important; height:11mm !important; display:block !important; image-rendering:pixelated !important;" />';
                } catch (e) {
                    return '';
                }
            };

            // Gerador de código ZPL Nativo para Zebra ZD220 (203 DPI = 8 dots/mm)
            var generateZPLCode = function(itemsArray, offsetTopMm, offsetLeftMm) {
                var rowItems = [];
                if (itemsArray.length === 1) {
                    rowItems = [itemsArray[0], itemsArray[0], itemsArray[0]];
                } else {
                    rowItems = [itemsArray[0] || null, itemsArray[1] || null, itemsArray[2] || null];
                }

                var dpmm = 8;
                var shiftY = Math.round(parseFloat(offsetTopMm !== undefined ? offsetTopMm : '0') * dpmm);
                var shiftX = Math.round(parseFloat(offsetLeftMm !== undefined ? offsetLeftMm : '4') * dpmm);
                var colX = [16 + shiftX, 280 + shiftX, 544 + shiftX];

                var zpl = "^XA\n^CI28\n^PW800\n^LL160\n^LH0,0\n";

                rowItems.forEach(function(item, idx) {
                    if (!item) return;
                    var x = Math.max(0, colX[idx]);
                    var y = Math.max(0, 8 + shiftY);

                    var ativo = (item.ativo || 'S/ ATIVO').substring(0, 14);
                    var nome = (item.nome || '-').substring(0, 32);
                    var setor = (item.setor || '-').substring(0, 18);
                    var qrPayload = buildDesktopQRPayload(item);

                    zpl += "^FO" + x + "," + y + "^A0N,16,16^FB240,1,0,C^FDCOBRECOM TI^FS\n";
                    zpl += "^FO" + (x + 10) + "," + (y + 19) + "^GB220,2,2^FS\n";
                    zpl += "^FO" + (x + 10) + "," + (y + 24) + "^BQN,2,3^FDLA," + qrPayload + "^FS\n";
                    zpl += "^FO" + (x + 98) + "," + (y + 25) + "^A0N,18,18^FD" + ativo + "^FS\n";
                    zpl += "^FO" + (x + 98) + "," + (y + 44) + "^A0N,13,13^FB142,2,0,L^FD" + nome + "^FS\n";
                    zpl += "^FO" + (x + 98) + "," + (y + 78) + "^A0N,13,13^FB142,1,0,L^FD" + setor + "^FS\n";
                });

                zpl += "^XZ";
                return zpl;
            };

                                { id: 'r_9', label: 'GUIAS E PATCH CORDS', checked: false, manual: 'VERIFICAR PATCH CORDS SOLTOS, FORÇADOS NAS PONTAS OU OBSTRUINDO A SAÍDA DE AR FRONTAL DOS EQUIPAMENTOS. REACOMODAR NOS GUIAS DE CABOS.' },

                            ]

            var Button = function(props) {
                var variant = props.variant || 'primary';
                var variants = {
                    primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow border border-transparent',
                    secondary: 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700',
                    success: 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm border border-transparent',
                    danger: 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 dark:bg-red-900/20 dark:border-red-900/40 dark:text-red-400',
                    ghost: 'bg-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800',
                    google: 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 shadow-sm'
                };
                var cls = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 " + (variants[variant] || variants.primary) + " " + (props.className || '');
                return <button {...props} className={cls}>{props.children}</button>;
            };

            var Card = function(props) {
                var pad = props.noPadding ? '' : 'p-6';
                var cls = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm flex flex-col " + pad + " " + (props.className || '');
                return <div className={cls}>{props.children}</div>;
            };

            var Input = function(props) {
                var cls = "w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all " + (props.className || '');
                return <input {...props} className={cls} />;
            };

            var Badge = function(props) {
                var color = props.color || 'slate';
                var colors = {
                    slate: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400',
                    blue: 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',
                    green: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
                    amber: 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
                    indigo: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300'
                };
                return <span className={"px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider " + (colors[color] || colors.slate)}>{props.children}</span>;
            };

            var calcProgress = function(items) {
                if (!items || typeof items !== 'object') return 0;
                var total = 0, done = 0;
                Object.keys(items).forEach(function(k) {
                    var group = items[k];
                    if (group && Array.isArray(group.tasks)) {
                        group.tasks.forEach(function(t) {
                            total++;
                            if (t && t.checked) done++;
                        });
                    }
                });
                return total === 0 ? 0 : Math.round((done / total) * 100);
            };
            
            var InlineEdit = function(props) {
                var valState = useState(props.value || '');
                var val = valState[0], setVal = valState[1];
                useEffect(function() { setVal(props.value || ''); }, [props.value]);

                return (
                    <input 
                        value={val}
                        onChange={function(e) { setVal(e.target.value.toUpperCase()); }}
                        onBlur={function() { if(val !== props.value) props.onSave(val.toUpperCase()); }}
                        className={"bg-transparent focus:outline-none w-full text-ellipsis uppercase " + (props.className || '')}
                        title="Clique para editar este título"
                    />
                );
            };

            var DesktopControlView = function(props) {
                var desktops = props.desktops || [];
                var currentUser = props.currentUser;

                var formState = useState({ id: null, nome: '', setor: '', mac: '', ativo: '' });
                var form = formState[0], setForm = formState[1];

                var searchState = useState('');
                var search = searchState[0], setSearch = searchState[1];

                var heightState = useState(localStorage.getItem('zd_label_height_v8') || '2.0');
                var labelHeight = heightState[0], setLabelHeight = heightState[1];

                var topOffsetState = useState(localStorage.getItem('zd_offset_top_v8') || '0');
                var offsetTop = topOffsetState[0], setOffsetTop = topOffsetState[1];

                var leftOffsetState = useState(localStorage.getItem('zd_offset_left_v8') || '4');
                var offsetLeft = leftOffsetState[0], setOffsetLeft = leftOffsetState[1];

                var queueState = useState([]);
                var printQueue = queueState[0], setPrintQueue = queueState[1];

                var previewItemState = useState(null);
                var previewItem = previewItemState[0], setPreviewItem = previewItemState[1];

                var zplModalState = useState(null);
                var zplModalCode = zplModalState[0], setZplModalCode = zplModalState[1];

                var viewModeState = useState('folders');
                var viewMode = viewModeState[0], setViewMode = viewModeState[1];

                var openSectorFoldersState = useState({});
                var openSectorFolders = openSectorFoldersState[0], setOpenSectorFolders = openSectorFoldersState[1];

                var handleHeightChange = function(val) {
                    setLabelHeight(val);
                    localStorage.setItem('zd_label_height_v8', val);
                };

                var handleTopOffsetChange = function(val) {
                    setOffsetTop(val);
                    localStorage.setItem('zd_offset_top_v8', val);
                };

                var handleLeftOffsetChange = function(val) {
                    setOffsetLeft(val);
                    localStorage.setItem('zd_offset_left_v8', val);
                };

                var formatMac = function(val) {
                    var clean = val.replace(/[^a-fA-F0-9]/g, '').toUpperCase().slice(0, 12);
                    var parts = clean.match(/.{1,2}/g) || [];
                    return parts.join(':');
                };

                var normalizeSectorName = function(rawSector) {
                    var s = (rawSector || '').trim().toUpperCase();
                    if (!s) return 'SEM SETOR';
                    var compact = s.replace(/[\.\-\s]/g, '');
                    if (compact === 'TI' || compact === 'TECNOLOGIADAINFORMACAO' || compact === 'INFRATI') return 'TI';
                    if (compact === 'RH' || compact === 'RECURSOSHUMANOS') return 'RH';
                    return s;
                };

                var triggerPrint = function(items) {
                    printZebraZD220Labels(items, labelHeight, offsetTop, offsetLeft);
                };

                var handleExportExcel = function(itemsToExport, customName) {
                    if (!itemsToExport || itemsToExport.length === 0) {
                        alert("Não há registros para exportar.");
                        return;
                    }

                    var headers = ["ATIVO", "NOME / HOSTNAME", "SETOR", "ENDERECO MAC", "ATUALIZADO POR", "DATA ATUALIZACAO"];
                    var rows = itemsToExport.map(function(item) {
                        var dateFormatted = item.updatedAt ? new Date(item.updatedAt).toLocaleDateString('pt-BR') : (item.createdAt ? new Date(item.createdAt).toLocaleDateString('pt-BR') : '-');
                        var cols = [
                            item.ativo || '',
                            item.nome || '',
                            normalizeSectorName(item.setor),
                            item.mac || '',
                            item.updatedBy || 'TI',
                            dateFormatted
                        ];
                        return cols.map(function(val) {
                            var cleanVal = String(val).replace(/"/g, '""');
                            return '"' + cleanVal + '"';
                        }).join(';');
                    });

                    var csvContent = "\uFEFF" + headers.join(';') + "\r\n" + rows.join("\r\n");
                    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    var url = URL.createObjectURL(blob);
                    var link = document.createElement('a');
                    var dateSlug = new Date().toISOString().split('T')[0];
                    var fileSlug = (customName || 'GERAL').replace(/[^a-zA-Z0-9_-]/g, '_').toUpperCase();
                    link.setAttribute('href', url);
                    link.setAttribute('download', 'CONTROLE_DESKTOPS_' + fileSlug + '_' + dateSlug + '.csv');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                };

                var handleSave = function(shouldPrintAfter) {
                    if (!form.nome.trim() && !form.ativo.trim()) {
                        alert("Preencha pelo menos o Nome ou a identificação do Ativo.");
                        return;
                    }

                    var normalizedSetor = normalizeSectorName(form.setor);

                    var payload = {
                        nome: (form.nome || '').trim().toUpperCase(),
                        setor: normalizedSetor === 'SEM SETOR' ? '' : normalizedSetor,
                        mac: (form.mac || '').trim().toUpperCase(),
                        ativo: (form.ativo || '').trim().toUpperCase(),
                        updatedAt: new Date().toISOString(),
                        updatedBy: currentUser ? currentUser.name : 'TI'
                    };

                    var promise;
                    if (form.id) {
                        promise = db.collection('desktops').doc(form.id).update(payload);
                    } else {
                        payload.createdAt = new Date().toISOString();
                        promise = db.collection('desktops').add(payload);
                    }

                    promise.then(function() {
                        setOpenSectorFolders(function(prev) {
                            return Object.assign({}, prev, { [normalizedSetor]: true });
                        });
                        if (shouldPrintAfter) {
                            triggerPrint([payload]);
                        }
                        setForm({ id: null, nome: '', setor: '', mac: '', ativo: '' });
                    }).catch(function(err) {
                        alert("Erro ao salvar cadastro: " + err.message);
                    });
                };

                var handleEdit = function(item) {
                    setForm({
                        id: item.id,
                        nome: item.nome || '',
                        setor: item.setor || '',
                        mac: item.mac || '',
                        ativo: item.ativo || ''
                    });
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                var handleDelete = function(id, nome) {
                    if (confirm("Deseja remover o desktop " + (nome || '') + " do controle?")) {
                        db.collection('desktops').doc(id).delete();
                    }
                };

                var toggleQueueItem = function(item) {
                    var exists = printQueue.some(function(q) { return q.id === item.id; });
                    if (exists) {
                        setPrintQueue(printQueue.filter(function(q) { return q.id !== item.id; }));
                    } else {
                        if (printQueue.length >= 3) {
                            alert("A fila da carreira comporta 3 etiquetas. Imprima ou limpe a fila atual.");
                            return;
                        }
                        setPrintQueue(printQueue.concat([item]));
                    }
                };

                var toggleSectorFolder = function(sectorKey) {
                    setOpenSectorFolders(function(prev) {
                        return Object.assign({}, prev, { [sectorKey]: !prev[sectorKey] });
                    });
                };

                var filtered = desktops.filter(function(d) {
                    var q = search.toLowerCase();
                    var secNorm = normalizeSectorName(d.setor).toLowerCase();
                    return (d.nome || '').toLowerCase().indexOf(q) !== -1 ||
                           (d.setor || '').toLowerCase().indexOf(q) !== -1 ||
                           secNorm.indexOf(q) !== -1 ||
                           (d.mac || '').toLowerCase().indexOf(q) !== -1 ||
                           (d.ativo || '').toLowerCase().indexOf(q) !== -1;
                });

                var sectorGroupsMap = {};
                filtered.forEach(function(item) {
                    var secKey = normalizeSectorName(item.setor);
                    if (!sectorGroupsMap[secKey]) sectorGroupsMap[secKey] = [];
                    sectorGroupsMap[secKey].push(item);
                });

                var sortedSectors = Object.keys(sectorGroupsMap).sort(function(a, b) {
                    if (a === 'SEM SETOR') return 1;
                    if (b === 'SEM SETOR') return -1;
                    return a.localeCompare(b);
                });

                var existingSectorsList = [];
                desktops.forEach(function(d) {
                    var s = normalizeSectorName(d.setor);
                    if (s !== 'SEM SETOR' && existingSectorsList.indexOf(s) === -1) {
                        existingSectorsList.push(s);
                    }
                });
                existingSectorsList.sort();

                var handleExpandCollapseAll = function(expand) {
                    var nextMap = {};
                    sortedSectors.forEach(function(sec) { nextMap[sec] = expand; });
                    setOpenSectorFolders(nextMap);
                };

                var activePreviewData = previewItem || (form.nome || form.ativo || form.setor ? form : {
                    nome: 'DESKTOP-01',
                    setor: 'ENGENHARIA',
                    ativo: 'DT-0042'
                });

                var previewQrUrl = generateQRDataURL(buildDesktopQRPayload(activePreviewData));

                var renderDesktopRow = function(item) {
                    var isQueued = printQueue.some(function(q) { return q.id === item.id; });
                    var thumbQr = generateQRDataURL(buildDesktopQRPayload(item));
                    var displaySector = normalizeSectorName(item.setor);
                    return (
                        <tr 
                            key={item.id} 
                            onMouseEnter={function() { setPreviewItem(item); }}
                            onMouseLeave={function() { setPreviewItem(null); }}
                            className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors"
                        >
                            <td className="px-4 py-3">
                                <div className="flex items-center gap-3">
                                    <img src={thumbQr} alt="QR" className="w-8 h-8 rounded bg-white p-0.5 border border-slate-200 shrink-0" />
                                    <span className="font-mono font-bold text-brand-600 dark:text-brand-400 uppercase">
                                        {item.ativo || 'S/ ATIVO'}
                                    </span>
                                </div>
                            </td>
                            <td className="px-4 py-3 font-semibold text-slate-800 dark:text-white uppercase">{item.nome || '-'}</td>
                            <td className="px-4 py-3">
                                <Badge color="blue">{displaySector}</Badge>
                            </td>
                            <td className="px-4 py-3 font-mono text-xs text-slate-500 dark:text-slate-400">{item.mac || '-'}</td>
                            <td className="px-4 py-3 text-right">
                                <div className="flex items-center justify-end gap-2">
                                    <button
                                        type="button"
                                        onClick={function() { triggerPrint([item]); }}
                                        className="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all"
                                        title="Imprimir 3 etiquetas desta máquina na ZD220"
                                    >
                                        {Icons.Printer} Imprimir
                                    </button>
                                    <button
                                        type="button"
                                        onClick={function() { toggleQueueItem(item); }}
                                        className={"px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition-all " + (isQueued ? "bg-amber-500/20 border-amber-500 text-amber-400" : "border-slate-200 dark:border-slate-700 text-slate-500 hover:text-slate-800 dark:hover:text-white")}
                                        title="Adicionar à fila para imprimir 3 computadores diferentes na mesma carreira"
                                    >
                                        {isQueued ? '✓ Na Fila' : '+ Fila'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={function() { handleEdit(item); }}
                                        className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-brand-500 hover:border-brand-500 transition-colors"
                                        title="Editar cadastro"
                                    >
                                        {Icons.Edit}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={function() { handleDelete(item.id, item.nome || item.ativo); }}
                                        className="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-red-500 hover:border-red-500 transition-colors"
                                        title="Excluir cadastro"
                                    >
                                        {Icons.Trash}
                                    </button>
                                </div>
                            </td>
                        </tr>
                    );
                };

                return (
                    <div className="h-full w-full bg-slate-100 dark:bg-slate-950 flex flex-col p-4 md:p-10 fade-in overflow-auto">
                        <div className="max-w-6xl mx-auto w-full space-y-6 pb-12">
                            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2 uppercase">
                                        {Icons.Monitor} Controle de Desktop's
                                    </h2>
                                    <p className="text-slate-500 text-sm">Organização por pastas de setor, exportação Excel e impressão Zebra ZD220.</p>
                                </div>

                                <div className="flex flex-wrap items-center gap-3 bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-[10px] font-bold uppercase text-slate-400">Medida:</span>
                                        <select 
                                            value={labelHeight} 
                                            onChange={function(e) { handleHeightChange(e.target.value); }}
                                            className="bg-slate-100 dark:bg-slate-800 text-xs font-bold px-2 py-1 rounded border border-slate-200 dark:border-slate-700 outline-none"
                                        >
                                            <option value="2.0">3.0 x 2.0 cm (Régua)</option>
                                            <option value="1.5">3.0 x 1.5 cm</option>
                                            <option value="2.5">3.0 x 2.5 cm</option>
                                            <option value="3.0">3.0 x 3.0 cm</option>
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-[10px] font-bold uppercase text-slate-400" title="Aceita negativos (ex: -10 para subir) e positivos (para descer)">Posição Topo (mm):</span>
                                        <input 
                                            type="number" 
                                            step="0.5"
                                            value={offsetTop} 
                                            onChange={function(e) { handleTopOffsetChange(e.target.value); }}
                                            className="w-14 bg-slate-100 dark:bg-slate-800 text-xs font-mono font-bold px-2 py-1 rounded border border-slate-200 dark:border-slate-700 outline-none text-center"
                                        />
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                        <span className="text-[10px] font-bold uppercase text-slate-400" title="Margem esquerda do liner (padrão 4mm)">Margem Esq (mm):</span>
                                        <input 
                                            type="number" 
                                            step="0.5"
                                            value={offsetLeft} 
                                            onChange={function(e) { handleLeftOffsetChange(e.target.value); }}
                                            className="w-14 bg-slate-100 dark:bg-slate-800 text-xs font-mono font-bold px-2 py-1 rounded border border-slate-200 dark:border-slate-700 outline-none text-center"
                                        />
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                                <Card className="lg:col-span-7">
                                    <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
                                        <h3 className="font-bold text-sm uppercase tracking-wider text-slate-700 dark:text-slate-200">
                                            {form.id ? 'Editar Cadastro de Desktop' : 'Novo Cadastro de Desktop'}
                                        </h3>
                                        {form.id && (
                                            <button 
                                                type="button" 
                                                onClick={function() { setForm({ id: null, nome: '', setor: '', mac: '', ativo: '' }); }}
                                                className="text-xs text-brand-500 hover:underline font-semibold"
                                            >
                                                Cancelar Edição
                                            </button>
                                        )}
                                    </div>

                                    <form className="space-y-4" onSubmit={function(e){ e.preventDefault(); handleSave(false); }}>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Ativo / Identificador</label>
                                                <Input 
                                                    placeholder="EX: DT-0042" 
                                                    value={form.ativo}
                                                    onChange={function(e) { setForm(Object.assign({}, form, { ativo: e.target.value.toUpperCase() })); }}
                                                    className="uppercase font-mono font-bold" 
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Nome (Usuário / Hostname)</label>
                                                <Input 
                                                    placeholder="EX: DESKTOP-01" 
                                                    value={form.nome}
                                                    onChange={function(e) { setForm(Object.assign({}, form, { nome: e.target.value.toUpperCase() })); }}
                                                    className="uppercase" 
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Setor (Define a Pasta)</label>
                                                <Input 
                                                    list="sector-suggestions"
                                                    placeholder="EX: TI, ENGENHARIA, RH..." 
                                                    value={form.setor}
                                                    onChange={function(e) { setForm(Object.assign({}, form, { setor: e.target.value.toUpperCase() })); }}
                                                    className="uppercase" 
                                                />
                                                <datalist id="sector-suggestions">
                                                    {existingSectorsList.map(function(sec) {
                                                        return <option key={sec} value={sec} />;
                                                    })}
                                                </datalist>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Endereço MAC (Apenas Controle Interno)</label>
                                                <Input 
                                                    placeholder="EX: 00:1B:44:11:3A:B7" 
                                                    value={form.mac}
                                                    onChange={function(e) { setForm(Object.assign({}, form, { mac: formatMac(e.target.value) })); }}
                                                    className="uppercase font-mono" 
                                                />
                                            </div>
                                        </div>

                                        <div className="pt-3 flex flex-wrap items-center gap-3 border-t border-slate-100 dark:border-slate-800">
                                            <Button type="submit" className="text-xs flex-1 sm:flex-none">
                                                {Icons.Save} {form.id ? 'Atualizar Cadastro' : 'Salvar Cadastro'}
                                            </Button>
                                            <Button 
                                                type="button" 
                                                variant="success" 
                                                onClick={function() { handleSave(true); }}
                                                className="text-xs flex-1 sm:flex-none"
                                            >
                                                {Icons.Printer} {form.id ? 'Atualizar & Imprimir (ZD220)' : 'Salvar & Imprimir (ZD220)'}
                                            </Button>
                                            {(form.nome || form.ativo) && (
                                                <Button 
                                                    type="button" 
                                                    variant="secondary" 
                                                    onClick={function() { triggerPrint([form]); }}
                                                    className="text-xs w-full sm:w-auto"
                                                    title="Imprimir sem salvar novamente"
                                                >
                                                    {Icons.QrCode} Testar Impressão
                                                </Button>
                                            )}
                                        </div>
                                    </form>
                                </Card>

                                <Card className="lg:col-span-5 bg-slate-50/60 dark:bg-slate-900/90">
                                    <div className="flex items-center justify-between mb-3">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                            {Icons.QrCode} Prévia da Bobina ZD220 (10cm)
                                        </span>
                                        <div className="flex items-center gap-2">
                                            <button 
                                                type="button"
                                                onClick={function() {
                                                    var targetItems = printQueue.length > 0 ? printQueue : [activePreviewData];
                                                    setZplModalCode(generateZPLCode(targetItems, offsetTop, offsetLeft));
                                                }}
                                                className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 hover:text-white border border-slate-700"
                                                title="Ver código ZPL nativo para Zebra"
                                            >
                                                ZPL
                                            </button>
                                            <Badge color="blue">3x 3.0x{labelHeight}cm</Badge>
                                        </div>
                                    </div>

                                    <div className="p-3 bg-slate-950 rounded-xl border border-dashed border-slate-800 overflow-x-auto">
                                        <div className="grid grid-cols-3 gap-2 min-w-[340px]">
                                            {[0, 1, 2].map(function(idx) {
                                                var slotItem = printQueue.length > 0 ? printQueue[idx] : activePreviewData;
                                                if (!slotItem) {
                                                    return (
                                                        <div key={idx} className="bg-slate-900/40 border border-dashed border-slate-700 rounded p-2 h-16 flex items-center justify-center text-[10px] text-slate-400">
                                                            Etiqueta {idx + 1} Vazia
                                                        </div>
                                                    );
                                                }
                                                var slotQr = printQueue.length > 0 
                                                    ? generateQRDataURL(buildDesktopQRPayload(slotItem))
                                                    : previewQrUrl;

                                                return (
                                                    <div key={idx} className="bg-white text-black rounded-md shadow-sm p-1.5 flex flex-col justify-between overflow-hidden">
                                                        <div className="text-[6.5px] font-black text-center border-b border-black pb-0.5 mb-1 tracking-wider leading-none">
                                                            COBRECOM TI
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            <img src={slotQr} alt="QR" className="w-8 h-8 object-contain shrink-0" />
                                                            <div className="min-w-0 flex-1 leading-tight space-y-0.5">
                                                                <div className="text-[8.5px] font-mono font-black truncate">{slotItem.ativo || 'S/ ATIVO'}</div>
                                                                <div className="text-[6px] font-bold uppercase break-all leading-[1.05] line-clamp-2">{slotItem.nome || '-'}</div>
                                                                <div className="text-[6px] truncate uppercase text-slate-700">{slotItem.setor || '-'}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {printQueue.length > 0 && (
                                        <div className="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                                            <span className="text-xs font-semibold text-brand-500">
                                                Fila personalizada: {printQueue.length}/3 selecionadas
                                            </span>
                                            <div className="flex gap-2">
                                                <Button variant="ghost" className="text-xs py-1 px-2" onClick={function() { setPrintQueue([]); }}>
                                                    Limpar
                                                </Button>
                                                <Button variant="primary" className="text-xs py-1.5 px-3" onClick={function() { triggerPrint(printQueue); }}>
                                                    {Icons.Printer} Imprimir Fila ({printQueue.length})
                                                </Button>
                                            </div>
                                        </div>
                                    )}
                                </Card>
                            </div>

                            {zplModalCode && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
                                    <Card className="w-full max-w-lg bg-slate-900 border-slate-700" noPadding>
                                        <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                                            <h3 className="font-bold text-white text-sm">Código ZPL Nativo (ZD220 - 203dpi)</h3>
                                            <button onClick={function() { setZplModalCode(null); }} className="text-2xl leading-none text-slate-400 hover:text-white">&times;</button>
                                        </div>
                                        <div className="p-4 space-y-3">
                                            <textarea readOnly value={zplModalCode} className="w-full h-48 p-3 bg-slate-950 text-emerald-400 font-mono text-xs rounded-lg border border-slate-800 outline-none" />
                                            <div className="flex justify-end gap-2">
                                                <Button variant="secondary" className="text-xs" onClick={function() { navigator.clipboard.writeText(zplModalCode); alert("Código ZPL copiado!"); }}>
                                                    {Icons.Copy} Copiar ZPL
                                                </Button>
                                                <Button className="text-xs" onClick={function() { setZplModalCode(null); }}>Fechar</Button>
                                            </div>
                                        </div>
                                    </Card>
                                </div>
                            )}

                            <Card noPadding className="overflow-hidden">
                                <div className="p-4 md:px-6 border-b border-slate-200 dark:border-slate-800 flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-slate-50/50 dark:bg-slate-800/30">
                                    <div className="flex flex-wrap items-center gap-3">
                                        <div>
                                            <h3 className="font-bold text-slate-800 dark:text-white text-sm uppercase tracking-wider flex items-center gap-2">
                                                {Icons.Folder} Pastas por Setor ({sortedSectors.length} Setores • {filtered.length} Máquinas)
                                            </h3>
                                            <p className="text-xs text-slate-500">Equipamentos segregados automaticamente pelo setor vinculado.</p>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2">
                                        <div className="flex items-center bg-slate-200/70 dark:bg-slate-800 p-1 rounded-lg border border-slate-300/60 dark:border-slate-700">
                                            <button
                                                type="button"
                                                onClick={function() { setViewMode('folders'); }}
                                                className={"px-2.5 py-1 rounded-md text-xs font-bold flex items-center gap-1.5 transition-all " + (viewMode === 'folders' ? "bg-brand-600 text-white shadow-sm" : "text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white")}
                                            >
                                                {Icons.Folder} Pastas
                                            </button>
                                            <button
                                                type="button"
                                                onClick={function() { setViewMode('list'); }}
                                                className={"px-2.5 py-1 rounded-md text-xs font-bold flex items-center gap-1.5 transition-all " + (viewMode === 'list' ? "bg-brand-600 text-white shadow-sm" : "text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white")}
                                            >
                                                {Icons.List} Lista Geral
                                            </button>
                                        </div>

                                        {viewMode === 'folders' && sortedSectors.length > 0 && (
                                            <div className="flex items-center gap-1">
                                                <button
                                                    type="button"
                                                    onClick={function() { handleExpandCollapseAll(true); }}
                                                    className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-[11px] font-semibold text-slate-600 dark:text-slate-300 hover:border-brand-500 transition-colors"
                                                >
                                                    Abrir Todas
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={function() { handleExpandCollapseAll(false); }}
                                                    className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-[11px] font-semibold text-slate-600 dark:text-slate-300 hover:border-brand-500 transition-colors"
                                                >
                                                    Fechar Todas
                                                </button>
                                            </div>
                                        )}

                                        <Button 
                                            type="button" 
                                            variant="success" 
                                            onClick={function() { handleExportExcel(filtered, search ? 'FILTRADO' : 'TODOS_SETORES'); }}
                                            className="text-xs py-2 px-3"
                                            title="Exportar planilha Excel (.csv) com os registros listados"
                                        >
                                            {Icons.Download} Exportar Excel ({filtered.length})
                                        </Button>

                                        <div className="relative w-full sm:w-64">
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">{Icons.Search}</div>
                                            <Input 
                                                placeholder="Buscar Setor, Nome, Ativo..." 
                                                value={search} 
                                                onChange={function(e) { setSearch(e.target.value); }} 
                                                className="pl-10" 
                                            />
                                        </div>
                                    </div>
                                </div>

                                {viewMode === 'folders' ? (
                                    <div className="p-4 md:p-6 space-y-3 bg-slate-100/50 dark:bg-slate-950/40">
                                        {sortedSectors.length === 0 ? (
                                            <div className="text-center py-10 text-slate-400">
                                                Nenhum desktop encontrado. Cadastre um equipamento acima informando o Setor (ex: TI) para criar a pasta automaticamente.
                                            </div>
                                        ) : (
                                            sortedSectors.map(function(sectorName) {
                                                var sectorItems = sectorGroupsMap[sectorName] || [];
                                                var isOpen = search.trim() !== '' ? true : !!openSectorFolders[sectorName];

                                                return (
                                                    <div key={sectorName} className="border border-slate-200 dark:border-slate-800 rounded-xl bg-white dark:bg-slate-900 overflow-hidden shadow-sm transition-all">
                                                        <div 
                                                            onClick={function() { toggleSectorFolder(sectorName); }}
                                                            className={"px-4 py-3.5 flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none transition-colors " + (isOpen ? "bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800" : "hover:bg-slate-50 dark:hover:bg-slate-800/40")}
                                                        >
                                                            <div className="flex items-center gap-3">
                                                                <div className={"p-2 rounded-lg transition-colors " + (isOpen ? "bg-amber-500/20 text-amber-400" : "bg-brand-500/10 text-brand-500")}>
                                                                    {Icons.Folder}
                                                                </div>
                                                                <div>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="font-bold text-sm text-slate-800 dark:text-white uppercase tracking-wide">
                                                                            PASTA: SETOR {sectorName}
                                                                        </span>
                                                                        <Badge color={isOpen ? "amber" : "blue"}>
                                                                            {sectorItems.length} {sectorItems.length === 1 ? 'Desktop' : 'Desktops'}
                                                                        </Badge>
                                                                    </div>
                                                                    <p className="text-[11px] text-slate-400">
                                                                        Clique para {isOpen ? 'recolher' : 'abrir e visualizar'} os equipamentos vinculados ao setor {sectorName}
                                                                    </p>
                                                                </div>
                                                            </div>

                                                            <div className="flex items-center gap-2" onClick={function(e) { e.stopPropagation(); }}>
                                                                <button
                                                                    type="button"
                                                                    onClick={function() {
                                                                        setForm(Object.assign({}, form, { setor: sectorName === 'SEM SETOR' ? '' : sectorName }));
                                                                        window.scrollTo({ top: 0, behavior: 'smooth' });
                                                                    }}
                                                                    className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-brand-500 text-[11px] font-semibold text-slate-600 dark:text-slate-300 flex items-center gap-1 transition-colors"
                                                                    title={"Cadastrar novo desktop direto no setor " + sectorName}
                                                                >
                                                                    {Icons.Plus} Novo neste Setor
                                                                </button>
                                                                <button
                                                                    type="button"
                                                                    onClick={function() { handleExportExcel(sectorItems, 'SETOR_' + sectorName); }}
                                                                    className="px-2.5 py-1.5 rounded-lg bg-emerald-600/15 hover:bg-emerald-600 text-emerald-500 hover:text-white border border-emerald-500/30 text-[11px] font-bold flex items-center gap-1.5 transition-all"
                                                                    title={"Exportar planilha Excel apenas do setor " + sectorName}
                                                                >
                                                                    {Icons.Download} Excel Setor
                                                                </button>
                                                                <div 
                                                                    onClick={function() { toggleSectorFolder(sectorName); }}
                                                                    className={"p-1.5 text-slate-400 transition-transform duration-200 " + (isOpen ? "rotate-180 text-white" : "")}
                                                                >
                                                                    {Icons.ChevronDown}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {isOpen && (
                                                            <div className="overflow-x-auto fade-in">
                                                                <table className="w-full text-sm text-left min-w-[750px]">
                                                                    <thead className="bg-slate-50/70 dark:bg-slate-900 text-[10px] font-bold text-slate-400 uppercase border-b border-slate-100 dark:border-slate-800">
                                                                        <tr>
                                                                            <th className="px-4 py-2.5">QR / Ativo</th>
                                                                            <th className="px-4 py-2.5">Nome / Usuário</th>
                                                                            <th className="px-4 py-2.5">Setor</th>
                                                                            <th className="px-4 py-2.5">Endereço MAC</th>
                                                                            <th className="px-4 py-2.5 text-right">Ações / Impressão ZD220</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800/70">
                                                                        {sectorItems.map(renderDesktopRow)}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left min-w-[750px]">
                                            <thead className="bg-slate-50 dark:bg-slate-800/70 text-[11px] font-bold text-slate-500 uppercase border-b border-slate-200 dark:border-slate-800">
                                                <tr>
                                                    <th className="px-4 py-3">QR / Ativo</th>
                                                    <th className="px-4 py-3">Nome / Usuário</th>
                                                    <th className="px-4 py-3">Setor</th>
                                                    <th className="px-4 py-3">Endereço MAC</th>
                                                    <th className="px-4 py-3 text-right">Ações / Impressão ZD220</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                                {filtered.map(renderDesktopRow)}
                                                {filtered.length === 0 && (
                                                    <tr>
                                                        <td colSpan="5" className="text-center py-10 text-slate-400">
                                                            Nenhum desktop encontrado. Cadastre um equipamento acima para gerar etiquetas.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </Card>
                        </div>
                    </div>
                );
            };

            var TaskItem = function(props) {
                var task = props.task;
                var onToggle = props.onToggle;
                var showObsField = props.showObsField;
                var onObsChange = props.onObsChange;

                var openState = useState(false);
                var isOpen = openState[0], setIsOpen = openState[1];
                var copiedState = useState(false);
                var copied = copiedState[0], setCopied = copiedState[1];

                var copyToClipboard = function(e, text) {
                    e.stopPropagation();
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text);
                        setCopied(true);
                        setTimeout(function() { setCopied(false); }, 1500);
                    }
                };

                return (
                    <div className="p-3 px-4 hover:bg-slate-50 dark:bg-slate-800/60 transition-colors select-none">
                        <div className="flex items-start gap-3">
                            <div 
                                onClick={onToggle}
                                className={"mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 cursor-pointer transition-all duration-200 " + (task.checked ? 'bg-brand-600 border-brand-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800')}
                            >
                                {task.checked && <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path d="M5 13l4 4L19 7" /></svg>}
                            </div>

                            <div className="flex-1">
                                <div className="flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <span 
                                            onClick={onToggle}
                                            className={"text-sm font-semibold cursor-pointer uppercase " + (task.checked ? 'text-slate-400 line-through' : 'text-slate-800 dark:text-slate-200')}
                                        >
                                            {task.label}
                                        </span>
                                        
                                        {task.checked && task.checkedBy && (
                                            <span 
                                                className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 flex items-center gap-1 uppercase" 
                                                title={"Preenchido por " + task.checkedBy}
                                            >
                                                {Icons.User} {task.checkedBy.split(' ')[0]}
                                            </span>
                                        )}
                                    </div>
                                    
                                    {task.manual && (
                                        <button 
                                            type="button"
                                            onClick={function() { setIsOpen(!isOpen); }} 
                                            className={"text-[11px] font-medium flex items-center gap-1 px-2 py-0.5 rounded transition-colors " + (isOpen ? "bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300" : "bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-600")}
                                        >
                                            {Icons.BookOpen} <span>{isOpen ? 'FECHAR' : 'MANUAL'}</span>
                                        </button>
                                    )}
                                </div>

                                {showObsField && (
                                    <div className="mt-2 pl-0 sm:pl-0 w-full flex">
                                        <input 
                                            type="text" 
                                            value={task.obs || ''} 
                                            onChange={function(e) { onObsChange(e.target.value.toUpperCase()); }} 
                                            placeholder="Adicionar observação sobre este item..." 
                                            className="w-full bg-transparent border-b border-slate-200 dark:border-slate-700/50 text-[10px] text-slate-500 dark:text-slate-400 focus:outline-none focus:border-brand-500 transition-colors uppercase placeholder-slate-300 dark:placeholder-slate-600 pb-1"
                                        />
                                    </div>
                                )}

                                {isOpen && task.manual && (
                                    <div className="mt-2.5 p-3 rounded-lg bg-blue-50/70 dark:bg-slate-950/70 border border-blue-100 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 fade-in">
                                        <div className="flex items-start gap-2">
                                            <div className="text-brand-500 shrink-0 mt-0.5 font-bold">ℹ</div>
                                            <div className="space-y-2 flex-1">
                                                <p className="leading-relaxed whitespace-pre-line font-sans uppercase">{task.manual}</p>
                                                
                                                {task.copyText && (
                                                    <div className="pt-1 flex items-center gap-2">
                                                        <span className="text-[10px] uppercase font-bold text-slate-400">Comando / Parâmetro:</span>
                                                        <button 
                                                            type="button"
                                                            onClick={function(e) { copyToClipboard(e, task.copyText); }}
                                                            className="px-2 py-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded text-[11px] font-mono font-bold text-brand-600 dark:text-brand-400 hover:border-brand-500 flex items-center gap-1.5 transition-all shadow-sm"
                                                        >
                                                            {Icons.Copy}
                                                            <span>{task.copyText}</span>
                                                            {copied && <span className="text-[9px] text-emerald-600 font-sans">✓ Copiado!</span>}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            var ActiveChecklist = function(props) {
                var ticket = props.ticket;
                var onUpdate = props.onUpdate;
                var onBack = props.onBack;
                var onForceSave = props.onForceSave;
                var onRequestFinish = props.onRequestFinish;
                var currentUser = props.currentUser; 

                if (!ticket || !ticket.data) return null;
                var data = ticket.data;
                var meta = data.meta || {};
                var items = data.items || {};

                var handleMeta = function(field, value) {
                    var newMeta = Object.assign({}, meta, { [field]: value.toUpperCase() });
                    onUpdate(Object.assign({}, data, { meta: newMeta }));
                };

                var handleCheck = function(section, taskId) {
                    var newData = Object.assign({}, data);
                    var sec = newData.items && newData.items[section];
                    if (!sec || !Array.isArray(sec.tasks)) return;
                    sec.tasks = sec.tasks.map(function(t) {
                        if (t.id === taskId) {
                            var isNowChecked = !t.checked;
                            return Object.assign({}, t, { 
                                checked: isNowChecked,
                                checkedBy: isNowChecked ? (currentUser ? currentUser.name : 'TÉCNICO') : null 
                            });
                        }
                        return t;
                    });
                    onUpdate(newData);
                };

                var handleObs = function(section, taskId, text) {
                    var newData = Object.assign({}, data);
                    var sec = newData.items && newData.items[section];
                    if (!sec || !Array.isArray(sec.tasks)) return;
                    sec.tasks = sec.tasks.map(function(t) {
                        return t.id === taskId ? Object.assign({}, t, { obs: text }) : t;
                    });
                    onUpdate(newData);
                };

                var progress = calcProgress(items);
                
                var handleLocalRequestFinish = function() {
                    if (ticket.type === 'diario' && progress < 100) {
                        alert("Bloqueio de Segurança: O Check Diário exige que TODAS as áreas da TI concluam as suas verificações (100%) antes de ser finalizado e enviado.");
                        return;
                    }
                    onRequestFinish();
                };

                var leftKeys = ['preventivas', 'root', 'preparacao', 'sistema'];
                var rightKeys = ['usuario', 'configuracao', 'apps', 'seguranca', 'entrega'];

                var renderCategoryCard = function(key) {
                    var group = items[key];
                    if (!group) return null;
                    
                    var groupTasks = group.tasks || [];
                    var groupTotal = groupTasks.length;
                    var groupChecked = groupTasks.filter(function(t) { return t.checked; }).length;
                    var isGroupDone = groupTotal > 0 && groupTotal === groupChecked;

                    return (
                        <Card key={key} noPadding className={"overflow-hidden h-fit transition-all duration-300 " + (isGroupDone ? "opacity-60 bg-slate-50 dark:bg-slate-900/50 border-emerald-200 dark:border-emerald-900/30" : "")}>
                            <div className={"px-4 py-3 border-b flex items-center gap-2 " + (isGroupDone ? "bg-emerald-50 dark:bg-emerald-900/10 border-emerald-200 dark:border-emerald-900/30" : "bg-slate-50 dark:bg-slate-800/50 border-slate-100 dark:border-slate-800")}>
                                <div className={isGroupDone ? "text-emerald-500" : "text-brand-500"}>
                                    {isGroupDone ? Icons.Check : (Icons[group.icon] || Icons.Server)}
                                </div>
                                <div className="flex-1 flex items-center justify-between">
                                    <InlineEdit 
                                        value={group.title}
                                        onSave={function(newVal) {
                                            var newData = Object.assign({}, data);
                                            if(newData.items[key]) {
                                                newData.items[key].title = newVal.toUpperCase();
                                                onUpdate(newData);
                                                if (ticket.type === 'diario' && props.onGlobalTitleChange) {
                                                    props.onGlobalTitleChange(key, newVal.toUpperCase());
                                                }
                                            }
                                        }}
                                        className={"font-bold text-xs uppercase tracking-wider border-b border-transparent focus:border-brand-500 transition-colors " + (isGroupDone ? "text-emerald-800 dark:text-emerald-400" : "text-slate-700 dark:text-slate-200")}
                                    />
                                    <span className={"text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ml-2 " + (isGroupDone ? "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400" : "bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400")}>
                                        {groupChecked}/{groupTotal}
                                    </span>
                                </div>
                            </div>
                            <div className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                {groupTasks.map(function(task) {
                                    return (
                                        <TaskItem 
                                            key={task.id} 
                                            task={task} 
                                            onToggle={function() { handleCheck(key, task.id); }} 
                                            showObsField={ticket.type === 'diario'}
                                            onObsChange={function(text) { handleObs(key, task.id, text); }}
                                        />
                                    );
                                })}
                            </div>
                        </Card>
                    );
                };

                return (
                    <div className="flex flex-col h-full overflow-hidden bg-slate-100 dark:bg-slate-950 relative">
                        <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-sm z-10 shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={onBack} className="p-2 -ml-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500">{Icons.ChevronLeft}</button>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h2 className="text-lg font-bold text-slate-800 dark:text-white leading-none">#{ticket.visualId}</h2>
                                        <Badge color={ticket.type === 'formatacao' ? 'blue' : ticket.type === 'diario' ? 'green' : ticket.type === 'rack' ? 'indigo' : 'amber'}>
                                            {ticket.type === 'formatacao' ? 'Formatação PC' : ticket.type === 'diario' ? 'Check Diário' : ticket.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                        </Badge>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1">Registrado a {new Date(ticket.createdAt || Date.now()).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="text-right hidden sm:block">
                                    <span className="text-xs font-bold text-brand-600 block">{progress}% Completo</span>
                                    <div className="w-32 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full mt-1 overflow-hidden">
                                        <div className={"h-full transition-all duration-500 " + (progress === 100 ? "bg-emerald-500" : "bg-brand-600")} style={{width: progress + '%'}}></div>
                                    </div>
                                </div>
                                <Button onClick={onForceSave} variant="secondary" className="text-xs sm:text-sm">
                                    {Icons.Save} Salvar e Voltar
                                </Button>
                                <Button onClick={handleLocalRequestFinish} variant={progress === 100 ? "primary" : "secondary"} className="text-xs sm:text-sm">
                                    {progress === 100 ? 'Finalizar' : 'Revisar Status'}
                                </Button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                            <Card className="grid grid-cols-1 md:grid-cols-3 gap-6" noPadding>
                                <div className="p-6 col-span-full grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">DATA</label>
                                        <Input type="date" value={meta.data || ''} onChange={function(e) { handleMeta('data', e.target.value); }} />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">ATIVO / DEPARTAMENTO</label>
                                        <Input placeholder="EX: PAT-01020" value={meta.ativo || ''} onChange={function(e) { handleMeta('ativo', e.target.value); }} className="uppercase" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">MÁQUINA / FINALIDADE</label>
                                        <Input placeholder="EX: CORP-PC-01" value={meta.maquina || ''} onChange={function(e) { handleMeta('maquina', e.target.value); }} className="uppercase" />
                                    </div>
                                </div>
                            </Card>

                            {ticket.type === 'formatacao' ? (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-12">
                                    <div className="space-y-6">{leftKeys.map(renderCategoryCard)}</div>
                                    <div className="space-y-6">{rightKeys.map(renderCategoryCard)}</div>
                                </div>
                            ) : (
                                <div className={"grid gap-6 pb-12 " + (Object.keys(items).length >= 3 ? "grid-cols-1 lg:grid-cols-3" : "grid-cols-1 md:grid-cols-2")}>
                                    {Object.keys(items).map(renderCategoryCard)}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            var ReceiptView = function(props) {

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCKPRO & INFRA CHECKLIST | Enterprise Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-print-color-adjust: exact; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC10F9wJuw36E0zz00ou2-t2-7TXtEjUl8",
            authDomain: "checklist-infra.firebaseapp.com",
            projectId: "checklist-infra",
            storageBucket: "checklist-infra.firebasestorage.app",
            messagingSenderId: "456261856462",
            appId: "1:456261856462:web:f90da7a62c8a08d072349f"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect, useRef } = React;

        const EMAIL_DESTINO = "infra@cobrecom.com.br";

        const Icons = {
            Layout: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            Check: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            History: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/></svg>,
            Server: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>,
            Trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            ChevronLeft: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        };

        // --- TEMPLATE COM TODOS OS ITENS DE REDE, SEGURANÇA E BACKUP ---
        const getTemplate = (type, user) => {
            const meta = { tecnico: user, data: new Date().toISOString().split('T')[0], maquina: '', ativo: '' };
            if (type === 'formatacao') {
                return {
                    meta,
                    items: {
                        preventivas: { title: "Preventivas", icon: "Server", tasks: [
                            { id: 'f_p1', label: 'Limpeza interna', checked: false }, 
                            { id: 'f_p2', label: 'Pasta térmica', checked: false }, 
                            { id: 'f_p3', label: 'Limpeza memórias', checked: false }, 
                            { id: 'f_p4', label: 'Limpa contato', checked: false }
                        ]},
                        preparacao: { title: "Backup & Preparação", icon: "Server", tasks: [
                            { id: 'f_b1', label: 'Backup Arquivos (User Profile)', checked: false }, 
                            { id: 'f_b2', label: 'Backup Navegador (Senhas/Favoritos)', checked: false }, 
                            { id: 'f_b3', label: 'Backup Outlook (PST/Sign)', checked: false }, 
                            { id: 'f_b4', label: 'Backup Spark (Histórico)', checked: false },
                            { id: 'f_b5', label: 'Chave Office/Windows', checked: false }
                        ]},
                        sistema: { title: "Sistema & Rede", icon: "Server", tasks: [
                            { id: 'f_s1', label: 'Formatação/Instalação Win', checked: false }, 
                            { id: 'f_s2', label: 'Ingressar Domínio', checked: false }, 
                            { id: 'f_s3', label: 'Proxy/DNS', checked: false }, 
                            { id: 'f_s4', label: 'WINS/Hosts', checked: false }, 
                            { id: 'f_s5', label: 'Drivers (Página Oficial)', checked: false },
                            { id: 'f_s6', label: 'IP Fixo (Reserva MAC)', checked: false }
                        ]},
                        seguranca: { title: "Segurança", icon: "Server", tasks: [
                            { id: 'f_sec1', label: 'Wazuh Agent', checked: false }, 
                            { id: 'f_sec2', label: 'ESET Antivirus', checked: false }, 
                            { id: 'f_sec3', label: 'VNC + Firewall Exception', checked: false }, 
                            { id: 'f_sec4', label: 'GPEDIT/Permissões', checked: false }
                        ]},
                        apps: { title: "Configurações & Apps", icon: "Server", tasks: [
                            { id: 'f_a1', label: 'Ativar Win/Office', checked: false }, 
                            { id: 'f_a2', label: 'Config. Email (Outlook)', checked: false }, 
                            { id: 'f_a3', label: 'Impressoras', checked: false }, 
                            { id: 'f_a4', label: 'Mapeamento de Rede', checked: false },
                            { id: 'f_a5', label: 'TOTVS Protheus / MES', checked: false },
                            { id: 'f_a6', label: 'Etiqueta de Ativo', checked: false }
                        ]}
                    }
                };
            } else {
                return {
                    meta,
                    items: {
                        inspecao: { title: "Inspeção Zebra", icon: "Check", tasks: [
                            { id: 'z_1', label: 'Limpeza Rolete', checked: false }, 
                            { id: 'z_2', label: 'Limpeza Cabeça Impressão', checked: false }, 
                            { id: 'z_3', label: 'Calibração Sensores', checked: false }, 
                            { id: 'z_4', label: 'Teste Qualidade de Impressão', checked: false }
                        ]}
                    }
                };
            }
        };

        const Card = ({ children, className = "", noPadding = false }) => <div className={`bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm ${noPadding ? '' : 'p-6'} ${className}`}>{children}</div>;
        const Button = ({ children, onClick, variant = "primary" }) => {
            const styles = variant === "primary" ? "bg-brand-600 text-white hover:bg-brand-700" : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700";
            return <button onClick={onClick} className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${styles}`}>{children}</button>;
        };

        const App = () => {
            const [view, setView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTickets, setActiveTickets] = useState([]);
            const [history, setHistory] = useState([]);
            const [currentTicketId, setCurrentTicketId] = useState(null);
            const [darkMode, setDarkMode] = useState(true);

            useEffect(() => {
                const unsubT = db.collection('tickets').onSnapshot(s => setActiveTickets(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubH = db.collection('history').orderBy('date', 'desc').limit(20).onSnapshot(s => setHistory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsubT(); unsubH(); };
            }, []);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            const handleLogin = (e) => {
                e.preventDefault();
                const id = e.target.id.value;
                if(id === "01001071") { setCurrentUser("Inacio"); setView('dashboard'); }
            };

            const handleCreate = async (type) => {
                const prefix = type === 'formatacao' ? 'F' : 'Z';
                const counterRef = db.collection('counters').doc(type);
                await db.runTransaction(async (t) => {
                    const doc = await t.get(counterRef);
                    const next = doc.exists ? doc.data().current + 1 : 1001;
                    t.set(counterRef, { current: next }, { merge: true });
                    const newRef = db.collection('tickets').doc();
                    const template = getTemplate(type, currentUser);
                    t.set(newRef, { visualId: `${prefix}-${next}`, type, data: template, createdAt: new Date().toISOString() });
                    setCurrentTicketId(newRef.id); setView('checklist');
                });
            };

            const toggleSection = (sectionKey, ticket) => {
                const newData = {...ticket.data};
                const section = newData.items[sectionKey];
                const allChecked = section.tasks.every(t => t.checked);
                section.tasks = section.tasks.map(t => ({...t, checked: !allChecked}));
                db.collection('tickets').doc(ticket.id).update({ data: newData });
            };

            const toggleTask = (sectionKey, taskId, ticket) => {
                const newData = {...ticket.data};
                newData.items[sectionKey].tasks = newData.items[sectionKey].tasks.map(t => t.id === taskId ? {...t, checked: !t.checked} : t);
                db.collection('tickets').doc(ticket.id).update({ data: newData });
            };

            const handleArchive = (ticket) => {
                db.collection('history').add({ 
                    visualId: ticket.visualId, date: new Date().toISOString(), tecnico: ticket.data.meta.tecnico, 
                    ativo: ticket.data.meta.maquina || "N/A", type: ticket.type 
                }).then(() => db.collection('tickets').doc(ticket.id).delete())
                  .then(() => { setView('dashboard'); setCurrentTicketId(null); });
            };

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-900">
                    <Card className="w-80 text-center">
                        <h1 className="text-2xl font-bold mb-6 text-brand-600">INFRA SYSTEM</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input name="id" placeholder="Matrícula" className="w-full p-3 rounded-lg border dark:bg-slate-800 outline-none focus:ring-2 focus:ring-brand-500" required />
                            <button className="w-full bg-brand-600 text-white p-3 rounded-lg font-bold">Entrar</button>
                        </form>
                    </Card>
                </div>
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR */}
                    <aside className="w-64 bg-slate-900 text-slate-400 p-4 space-y-2 hidden md:flex flex-col no-print">
                        <div className="text-white font-bold text-xl mb-8 px-2 tracking-tighter">COBRECOM TI</div>
                        <button onClick={() => setView('dashboard')} className={`w-full flex items-center gap-3 p-3 rounded-lg ${view === 'dashboard' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-slate-800'}`}>{Icons.Layout} Dashboard</button>
                        <button onClick={() => setView('history')} className={`w-full flex items-center gap-3 p-3 rounded-lg ${view === 'history' ? 'bg-brand-600 text-white shadow-lg' : 'hover:bg-slate-800'}`}>{Icons.History} Histórico</button>
                        <div className="flex-1"></div>
                        <div className="p-2 border-t border-slate-800 text-xs flex justify-between items-center">
                            <span>{currentUser}</span>
                            <button onClick={() => setDarkMode(!darkMode)}>{darkMode ? "🌙" : "☀️"}</button>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-auto p-4 md:p-10 bg-slate-50 dark:bg-slate-950">
                        {view === 'dashboard' && (
                            <div className="max-w-5xl mx-auto space-y-8 fade-in">
                                <div className="flex gap-4">
                                    <button onClick={() => handleCreate('formatacao')} className="flex-1 p-8 bg-brand-600 text-white rounded-2xl shadow-xl hover:scale-[1.02] transition-all text-left">
                                        <h3 className="text-xl font-bold mb-1">Nova Formatação</h3>
                                        <p className="text-sm opacity-80">Checklist completo de infraestrutura</p>
                                    </button>
                                    <button onClick={() => handleCreate('zebra')} className="flex-1 p-8 bg-slate-800 text-white rounded-2xl shadow-xl hover:scale-[1.02] transition-all text-left">
                                        <h3 className="text-xl font-bold mb-1">Manutenção Zebra</h3>
                                        <p className="text-sm opacity-80">Limpeza e testes de etiquetas</p>
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeTickets.map(t => (
                                        <Card key={t.id} className="cursor-pointer hover:border-brand-500 relative group" onClick={() => { setCurrentTicketId(t.id); setView('checklist'); }}>
                                            <div className="flex justify-between items-start mb-4">
                                                <span className="text-[10px] font-bold bg-brand-50 text-brand-700 px-2 py-1 rounded">#{t.visualId}</span>
                                                <button onClick={(e) => { e.stopPropagation(); db.collection('tickets').doc(t.id).delete(); }} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100">{Icons.Trash}</button>
                                            </div>
                                            <h4 className="font-bold text-lg">{t.data.meta.maquina || "Ativo Pendente"}</h4>
                                            <p className="text-xs text-slate-500 mt-2">{t.type === 'formatacao' ? '💻 Computador' : '🖨️ Impressora'}</p>
                                        </Card>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'checklist' && activeTickets.find(t => t.id === currentTicketId) && (() => {
                            const t = activeTickets.find(t => t.id === currentTicketId);
                            return (
                                <div className="max-w-4xl mx-auto space-y-6 fade-in pb-20">
                                    <div className="flex justify-between items-center">
                                        <button onClick={() => setView('dashboard')} className="flex items-center gap-2 font-bold text-brand-600">{Icons.ChevronLeft} VOLTAR</button>
                                        <h2 className="text-xl font-bold">Protocolo {t.visualId}</h2>
                                    </div>

                                    <Card className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Nome da Máquina</label>
                                        <input value={t.data.meta.maquina} onChange={(e) => {
                                            const d = {...t.data}; d.meta.maquina = e.target.value;
                                            db.collection('tickets').doc(t.id).update({ data: d });
                                        }} className="w-full bg-transparent border-b p-1 outline-none focus:border-brand-500" placeholder="Ex: NB-TI-01" /></div>
                                        <div><label className="text-[10px] font-bold text-slate-400 uppercase">Etiqueta Ativo</label>
                                        <input value={t.data.meta.ativo} onChange={(e) => {
                                            const d = {...t.data}; d.meta.ativo = e.target.value;
                                            db.collection('tickets').doc(t.id).update({ data: d });
                                        }} className="w-full bg-transparent border-b p-1 outline-none focus:border-brand-500" placeholder="Ex: 005432" /></div>
                                    </Card>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {Object.entries(t.data.items).map(([key, section]) => (
                                            <Card key={key} noPadding className="overflow-hidden">
                                                <div className="p-3 bg-slate-50 dark:bg-slate-800 border-b flex justify-between items-center">
                                                    <h4 className="text-xs font-bold uppercase text-slate-500">{section.title}</h4>
                                                    <button onClick={() => toggleSection(key, t)} className="text-[9px] font-black bg-brand-100 text-brand-700 px-2 py-0.5 rounded">CHECK ALL</button>
                                                </div>
                                                <div className="divide-y dark:divide-slate-800">
                                                    {section.tasks.map(task => (
                                                        <label key={task.id} className="flex items-center gap-3 p-3 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer transition-colors">
                                                            <input type="checkbox" checked={task.checked} onChange={() => toggleTask(key, task.id, t)} className="w-4 h-4 rounded text-brand-600" />
                                                            <span className={`text-sm ${task.checked ? 'text-slate-400 line-through' : ''}`}>{task.label}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </Card>
                                        ))}
                                    </div>
                                    <div className="flex gap-4">
                                        <Button onClick={() => window.print()} variant="secondary">Imprimir Relatório</Button>
                                        <Button onClick={() => handleArchive(t)}>Finalizar e Arquivar</Button>
                                    </div>
                                </div>
                            );
                        })()}

                        {view === 'history' && (
                            <div className="max-w-5xl mx-auto fade-in">
                                <h2 className="text-2xl font-bold mb-6">Últimos Atendimentos</h2>
                                <Card noPadding>
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] font-bold uppercase text-slate-500">
                                            <tr><th className="p-4">ID</th><th className="p-4">Data</th><th className="p-4">Ativo</th><th className="p-4">Técnico</th></tr>
                                        </thead>
                                        <tbody className="divide-y dark:divide-slate-800">
                                            {history.map(h => (
                                                <tr key={h.id}>
                                                    <td className="p-4 font-mono text-xs">#{h.visualId}</td>
                                                    <td className="p-4">{new Date(h.date).toLocaleDateString()}</td>
                                                    <td className="p-4 font-bold">{h.ativo}</td>
                                                    <td className="p-4 uppercase text-[10px]">{h.tecnico}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </Card>
                            </div>
                        )}
                    </main>

                    {/* ÁREA DE IMPRESSÃO OCULTA */}
                    <div id="receipt-area" className="hidden p-10 bg-white text-black">
                        <div className="flex justify-between border-b-4 border-black pb-4 mb-6">
                            <h1 className="text-3xl font-black uppercase">Relatório Técnico</h1>
                            <div className="text-right font-bold tracking-tighter">COBRECOM TI</div>
                        </div>
                        <div className="grid grid-cols-3 gap-10 mb-10 text-xs uppercase font-bold">
                            <div><span>Ativo:</span><br/><span className="text-xl">---</span></div>
                            <div><span>Técnico:</span><br/><span className="text-xl">---</span></div>
                            <div><span>Data:</span><br/><span className="text-xl">{new Date().toLocaleDateString()}</span></div>
                        </div>
                        <div className="border-2 border-black p-4 h-40 italic text-sm">Observações Técnicas...</div>
                        <div className="mt-32 flex justify-between text-[10px] font-black uppercase tracking-widest px-10">
                            <div className="border-t-2 border-black pt-2 w-48 text-center">Assinatura do Técnico</div>
                            <div className="border-t-2 border-black pt-2 w-48 text-center">Validação do Usuário</div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

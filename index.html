            var Button = function(props) {
                var variant = props.variant || 'primary';
                var variants = {
                    primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow border border-transparent',
                    secondary: 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700',
                    danger: 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 dark:bg-red-900/20 dark:border-red-900/40 dark:text-red-400',
                    ghost: 'bg-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800',
                    google: 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 shadow-sm'
                };
                var cls = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 " + (variants[variant] || variants.primary) + " " + (props.className || '');
                return <button {...props} className={cls}>{props.children}</button>;
            };

            var Card = function(props) {
                var pad = props.noPadding ? '' : 'p-6';
                var cls = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm " + pad + " " + (props.className || '');
                return <div className={cls}>{props.children}</div>;
            };

            var Input = function(props) {
                var cls = "w-full h-10 px-3 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all " + (props.className || '');
                return <input {...props} className={cls} />;
            };

            var Badge = function(props) {
                var color = props.color || 'slate';
                var colors = {
                    slate: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400',
                    blue: 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',
                    green: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300',
                    amber: 'bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300',
                    indigo: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-300'
                };
                return <span className={"px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider " + (colors[color] || colors.slate)}>{props.children}</span>;
            };

            var calcProgress = function(items) {
                if (!items || typeof items !== 'object') return 0;
                var total = 0, done = 0;
                Object.keys(items).forEach(function(k) {
                    var group = items[k];
                    if (group && Array.isArray(group.tasks)) {
                        group.tasks.forEach(function(t) {
                            total++;
                            if (t && t.checked) done++;
                        });
                    }
                });
                return total === 0 ? 0 : Math.round((done / total) * 100);
            };
            
            var InlineEdit = function(props) {
                var valState = useState(props.value || '');
                var val = valState[0], setVal = valState[1];
                useEffect(function() { setVal(props.value || ''); }, [props.value]);

                return (
                    <input 
                        value={val}
                        onChange={function(e) { setVal(e.target.value.toUpperCase()); }}
                        onBlur={function() { if(val !== props.value) props.onSave(val.toUpperCase()); }}
                        className={"bg-transparent focus:outline-none w-full text-ellipsis uppercase " + (props.className || '')}
                        title="Clique para editar este título"
                    />
                );
            };

            var TaskItem = function(props) {
                var task = props.task;
                var onToggle = props.onToggle;
                var openState = useState(false);
                var isOpen = openState[0], setIsOpen = openState[1];
                var copiedState = useState(false);
                var copied = copiedState[0], setCopied = copiedState[1];

                var copyToClipboard = function(e, text) {
                    e.stopPropagation();
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text);
                        setCopied(true);
                        setTimeout(function() { setCopied(false); }, 1500);
                    }
                };

                return (
                    <div className="p-3 px-4 hover:bg-slate-50 dark:bg-slate-800/60 transition-colors select-none">
                        <div className="flex items-start gap-3">
                            <div 
                                onClick={onToggle}
                                className={"mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 cursor-pointer transition-all duration-200 " + (task.checked ? 'bg-brand-600 border-brand-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800')}
                            >
                                {task.checked && <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path d="M5 13l4 4L19 7" /></svg>}
                            </div>

                            <div className="flex-1">
                                <div className="flex items-center justify-between gap-2">
                                    <span 
                                        onClick={onToggle}
                                        className={"text-sm font-semibold cursor-pointer uppercase " + (task.checked ? 'text-slate-400 line-through' : 'text-slate-800 dark:text-slate-200')}
                                    >
                                        {task.label}
                                    </span>
                                    
                                    {task.manual && (
                                        <button 
                                            type="button"
                                            onClick={function() { setIsOpen(!isOpen); }} 
                                            className={"text-[11px] font-medium flex items-center gap-1 px-2 py-0.5 rounded transition-colors " + (isOpen ? "bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300" : "bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-600")}
                                        >
                                            {Icons.BookOpen} <span>{isOpen ? 'FECHAR' : 'MANUAL'}</span>
                                        </button>
                                    )}
                                </div>

                                {isOpen && task.manual && (
                                    <div className="mt-2.5 p-3 rounded-lg bg-blue-50/70 dark:bg-slate-950/70 border border-blue-100 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 fade-in">
                                        <div className="flex items-start gap-2">
                                            <div className="text-brand-500 shrink-0 mt-0.5 font-bold">ℹ</div>
                                            <div className="space-y-2 flex-1">
                                                <p className="leading-relaxed whitespace-pre-line font-sans uppercase">{task.manual}</p>
                                                
                                                {task.copyText && (
                                                    <div className="pt-1 flex items-center gap-2">
                                                        <span className="text-[10px] uppercase font-bold text-slate-400">Comando / Parâmetro:</span>
                                                        <button 
                                                            type="button"
                                                            onClick={function(e) { copyToClipboard(e, task.copyText); }}
                                                            className="px-2 py-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded text-[11px] font-mono font-bold text-brand-600 dark:text-brand-400 hover:border-brand-500 flex items-center gap-1.5 transition-all shadow-sm"
                                                        >
                                                            {Icons.Copy}
                                                            <span>{task.copyText}</span>
                                                            {copied && <span className="text-[9px] text-emerald-600 font-sans">✓ Copiado!</span>}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            var ActiveChecklist = function(props) {
                var ticket = props.ticket;
                var onUpdate = props.onUpdate;
                var onBack = props.onBack;
                var onForceSave = props.onForceSave;
                var onRequestFinish = props.onRequestFinish;

                if (!ticket || !ticket.data) return null;
                var data = ticket.data;
                var meta = data.meta || {};
                var items = data.items || {};

                var handleMeta = function(field, value) {
                    var newMeta = Object.assign({}, meta, { [field]: value.toUpperCase() });
                    onUpdate(Object.assign({}, data, { meta: newMeta }));
                };

                var handleCheck = function(section, taskId) {
                    var newData = Object.assign({}, data);
                    var sec = newData.items && newData.items[section];
                    if (!sec || !Array.isArray(sec.tasks)) return;
                    sec.tasks = sec.tasks.map(function(t) {
                        return t.id === taskId ? Object.assign({}, t, { checked: !t.checked }) : t;
                    });
                    onUpdate(newData);
                };

                var progress = calcProgress(items);
                
                var handleLocalRequestFinish = function() {
                    if (ticket.type === 'diario' && progress < 100) {
                        alert("Bloqueio de Segurança: O Check Diário exige que TODAS as áreas da TI concluam suas verificações (100%) antes de ser finalizado e enviado.");
                        return;
                    }
                    onRequestFinish();
                };

                var leftKeys = ['preventivas', 'root', 'preparacao', 'sistema'];
                var rightKeys = ['usuario', 'configuracao', 'apps', 'seguranca', 'entrega'];

                var renderCategoryCard = function(key) {
                    var group = items[key];
                    if (!group) return null;
                    
                    var groupTasks = group.tasks || [];
                    var groupTotal = groupTasks.length;
                    var groupChecked = groupTasks.filter(function(t) { return t.checked; }).length;
                    var isGroupDone = groupTotal > 0 && groupTotal === groupChecked;

                    return (
                        <Card key={key} noPadding className={"overflow-hidden h-fit transition-all duration-300 " + (isGroupDone ? "opacity-60 bg-slate-50 dark:bg-slate-900/50 border-emerald-200 dark:border-emerald-900/30" : "")}>
                            <div className={"px-4 py-3 border-b flex items-center gap-2 " + (isGroupDone ? "bg-emerald-50 dark:bg-emerald-900/10 border-emerald-200 dark:border-emerald-900/30" : "bg-slate-50 dark:bg-slate-800/50 border-slate-100 dark:border-slate-800")}>
                                <div className={isGroupDone ? "text-emerald-500" : "text-brand-500"}>
                                    {isGroupDone ? Icons.Check : (Icons[group.icon] || Icons.Server)}
                                </div>
                                <div className="flex-1 flex items-center justify-between">
                                    <InlineEdit 
                                        value={group.title}
                                        onSave={function(newVal) {
                                            var newData = Object.assign({}, data);
                                            if(newData.items[key]) {
                                                newData.items[key].title = newVal.toUpperCase();
                                                onUpdate(newData);
                                                if (ticket.type === 'diario' && props.onGlobalTitleChange) {
                                                    props.onGlobalTitleChange(key, newVal.toUpperCase());
                                                }
                                            }
                                        }}
                                        className={"font-bold text-xs uppercase tracking-wider border-b border-transparent focus:border-brand-500 transition-colors " + (isGroupDone ? "text-emerald-800 dark:text-emerald-400" : "text-slate-700 dark:text-slate-200")}
                                    />
                                    <span className={"text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ml-2 " + (isGroupDone ? "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400" : "bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400")}>
                                        {groupChecked}/{groupTotal}
                                    </span>
                                </div>
                            </div>
                            <div className="divide-y divide-slate-100 dark:divide-slate-800/60">
                                {groupTasks.map(function(task) {
                                    return (
                                        <TaskItem 
                                            key={task.id} 
                                            task={task} 
                                            onToggle={function() { handleCheck(key, task.id); }} 
                                        />
                                    );
                                })}
                            </div>
                        </Card>
                    );
                };

                return (
                    <div className="flex flex-col h-full overflow-hidden bg-slate-100 dark:bg-slate-950 relative">
                        <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-sm z-10 shrink-0">
                            <div className="flex items-center gap-4">
                                <button onClick={onBack} className="p-2 -ml-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500">{Icons.ChevronLeft}</button>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h2 className="text-lg font-bold text-slate-800 dark:text-white leading-none">#{ticket.visualId}</h2>
                                        <Badge color={ticket.type === 'formatacao' ? 'blue' : ticket.type === 'diario' ? 'green' : ticket.type === 'rack' ? 'indigo' : 'amber'}>
                                            {ticket.type === 'formatacao' ? 'Formatação PC' : ticket.type === 'diario' ? 'Check Diário' : ticket.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                        </Badge>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-1">Registrado em {new Date(ticket.createdAt || Date.now()).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="text-right hidden sm:block">
                                    <span className="text-xs font-bold text-brand-600 block">{progress}% Completo</span>
                                    <div className="w-32 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full mt-1 overflow-hidden">
                                        <div className={"h-full transition-all duration-500 " + (progress === 100 ? "bg-emerald-500" : "bg-brand-600")} style={{width: progress + '%'}}></div>
                                    </div>
                                </div>
                                <Button onClick={onForceSave} variant="secondary" className="text-xs sm:text-sm">
                                    {Icons.Save} Salvar e Voltar
                                </Button>
                                <Button onClick={handleLocalRequestFinish} variant={progress === 100 ? "primary" : "secondary"} className="text-xs sm:text-sm">
                                    {progress === 100 ? 'Finalizar' : 'Revisar Status'}
                                </Button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                            <Card className="grid grid-cols-1 md:grid-cols-3 gap-6" noPadding>
                                <div className="p-6 col-span-full grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">DATA</label>
                                        <Input type="date" value={meta.data || ''} onChange={function(e) { handleMeta('data', e.target.value); }} />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">ATIVO / DEPARTAMENTO</label>
                                        <Input placeholder="EX: PAT-01020" value={meta.ativo || ''} onChange={function(e) { handleMeta('ativo', e.target.value); }} className="uppercase" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">MÁQUINA / FINALIDADE</label>
                                        <Input placeholder="EX: CORP-PC-01" value={meta.maquina || ''} onChange={function(e) { handleMeta('maquina', e.target.value); }} className="uppercase" />
                                    </div>
                                </div>
                            </Card>

                            {ticket.type === 'formatacao' ? (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-12">
                                    <div className="space-y-6">{leftKeys.map(renderCategoryCard)}</div>
                                    <div className="space-y-6">{rightKeys.map(renderCategoryCard)}</div>
                                </div>
                            ) : (
                                <div className={"grid gap-6 pb-12 " + (Object.keys(items).length >= 3 ? "grid-cols-1 lg:grid-cols-3" : "grid-cols-1 md:grid-cols-2")}>
                                    {Object.keys(items).map(renderCategoryCard)}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            var ReceiptView = function(props) {
                var ticket = props.ticket;
                var onBack = props.onBack;
                var onArchive = props.onArchive;
                var onRevertHistory = props.onRevertHistory;
                var logo = props.logo;
                var isHistory = props.isHistory;
                var obsState = useState(ticket && ticket.data && ticket.data.obs ? ticket.data.obs : (ticket && ticket.obs ? ticket.obs : ''));
                var obs = obsState[0], setObs = obsState[1];

                if (!ticket || !ticket.data) return null;
                var meta = ticket.data.meta || {};
                var items = ticket.data.items || {};
                var identificador = meta.maquina || meta.ativo || "N/A";
                
                var totalTasks = 0, checkedTasks = 0;
                var pendingList = [];
                var categorySummary = Object.keys(items).map(function(k) {
                    var group = items[k];
                    var tasks = group.tasks || [];
                    var total = tasks.length;
                    var checked = tasks.filter(function(t) { return t.checked; }).length;
                    tasks.forEach(function(t) { if (!t.checked) pendingList.push("- [" + group.title + "] " + t.label); });
                    totalTasks += total;
                    checkedTasks += checked;
                    return { title: group.title, status: checked === total ? "OK" : "PENDENTE" };
                });
                var percent = totalTasks === 0 ? 0 : Math.round((checkedTasks / totalTasks) * 100);
                var statusGlobal = percent === 100 ? "CONCLUÍDO" : "PARCIAL";

                var handleSendOutlook = function() {
                    var checklistFormatted = Object.keys(items).map(function(k) {
                        var group = items[k];
                        var tasksText = (group.tasks || []).map(function(t) {
                            return "   " + (t.checked ? "[X]" : "[ ]") + " " + t.label;
                        }).join("\n");
                        return "• " + group.title + "\n" + tasksText;
                    }).join("\n\n");

                    var pendingFormatted = pendingList.length > 0 ? pendingList.join("\n") : "Nenhuma pendência.";

                    var subject = "[" + statusGlobal + "] Relatório Técnico #" + ticket.visualId + " - " + identificador;
                    var body = 
                        "========================================\n" +
                        "            RELATÓRIO TÉCNICO - INFRA HUB\n" +
                        "========================================\n\n" +
                        "ID DO REGISTRO: #" + ticket.visualId + "\n" +
                        "DATA: " + new Date(ticket.createdAt || ticket.date || Date.now()).toLocaleDateString() + "\n" +
                        "TÉCNICO RESPONSÁVEL: " + (meta.tecnico || 'N/A') + "\n" +
                        "ATIVO / DEPARTAMENTO: " + (meta.ativo || 'N/A') + "\n" +
                        "MÁQUINA / FINALIDADE: " + identificador + "\n" +
                        "STATUS GLOBAL: " + statusGlobal + " (" + percent + "% CONCLUÍDO)\n\n" +
                        "----------------------------------------\n" +
                        "DETALHAMENTO DO CHECKLIST:\n" +
                        "----------------------------------------\n\n" +
                        checklistFormatted + "\n\n" +
                        "----------------------------------------\n" +
                        "PENDÊNCIAS:\n" +
                        "----------------------------------------\n" +
                        pendingFormatted + "\n\n" +
                        "----------------------------------------\n" +
                        "OBSERVAÇÕES FINAIS:\n" +
                        "----------------------------------------\n" +
                        (obs || "Sem observações adicionais.") + "\n\n" +
                        "========================================\n" +
                        "Gerado automaticamente via Infra Hub Cobrecom";

                    window.location.href = "mailto:" + EMAIL_DESTINO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
                    setTimeout(function() {
                        if (confirm("E-mail aberto? Clique OK para arquivar.")) onArchive(Object.assign({}, ticket, { data: Object.assign({}, ticket.data, { obs: obs }) }));
                    }, 1000);
                };

                return (
                    <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-950 overflow-auto p-4 md:p-8">
                        <div className="max-w-4xl mx-auto w-full space-y-6 fade-in no-print">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2 text-slate-500 hover:text-slate-700 cursor-pointer" onClick={onBack}>
                                    {Icons.ChevronLeft} <span className="font-bold text-sm">Voltar</span>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white">{isHistory ? 'Visualização do Relatório' : 'Revisão & Entrega'}</h1>
                            </div>

                            <Card className="grid md:grid-cols-2 gap-6">
                                <div className="space-y-4">
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Observações Finais</label>
                                    <textarea readOnly={isHistory} value={obs} onChange={function(e) { setObs(e.target.value.toUpperCase()); }} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm h-32 resize-none focus:ring-2 focus:ring-brand-500/20 outline-none uppercase" placeholder="DETALHES ADICIONAIS, PEÇAS TROCADAS, ETC..."></textarea>
                                </div>
                                <div className="flex flex-col justify-center gap-3 border-l border-slate-100 dark:border-slate-800 pl-6">
                                    <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300">Ações {isHistory ? 'do Relatório' : 'de Encerramento'}</h3>
                                    <Button className="w-full justify-start" onClick={function() { window.print(); }} variant="secondary">{Icons.Printer} Imprimir Relatório</Button>
                                    {isHistory ? (
                                        <Button className="w-full justify-start bg-amber-600 hover:bg-amber-700 text-white" onClick={function() { if(onRevertHistory) onRevertHistory(ticket); }}>{Icons.Refresh} Retornar para Ativos</Button>
                                    ) : (
                                        <Button className="w-full justify-start" onClick={handleSendOutlook}>{Icons.Mail} Enviar E-mail & Arquivar</Button>
                                    )}
                                </div>
                            </Card>
                        </div>

                        <div id="receipt-area" className="hidden print:block bg-white text-black font-sans text-xs border border-gray-300 p-0">
                            <div className="flex justify-between items-center p-6 border-b-2 border-black">
                                <div className="flex items-center gap-4">{logo && <img src={logo} className="h-10 object-contain" />}<div><h1 className="text-xl font-bold tracking-tighter uppercase">Relatório Técnico</h1><p className="text-[10px] uppercase tracking-widest text-gray-500">Departamento de TI • Infraestrutura</p></div></div>
                                <div className="text-right"><div className="text-2xl font-mono font-bold">#{ticket.visualId || 'PEND'}</div><div className="text-[10px] font-bold">{new Date(ticket.createdAt || ticket.date || Date.now()).toLocaleDateString()}</div></div>
                            </div>
                            <div className="grid grid-cols-4 border-b border-black">
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Ativo</span><span className="font-bold text-sm block truncate uppercase">{meta.ativo || 'N/A'}</span></div>
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Máquina</span><span className="font-bold text-sm block truncate uppercase">{identificador}</span></div>
                                <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Técnico</span><span className="font-bold uppercase truncate">{meta.tecnico}</span></div>
                                <div className={"p-3 text-center flex flex-col justify-center " + (percent === 100 ? 'bg-gray-100' : 'bg-gray-200')}><span className="block text-[9px] font-bold uppercase text-gray-500">Status</span><span className="font-bold text-sm">{statusGlobal}</span></div>
                            </div>
                            <div className="p-6 flex gap-8">
                                <div className="w-1/2"><h3 className="font-bold uppercase text-[10px] mb-2 border-b border-black pb-1">Checklist</h3><table className="w-full text-left border-collapse"><tbody>{categorySummary.map(function(cat, i) { return (<tr key={i} className="border-b border-dotted border-gray-400"><td className="py-1.5 font-medium uppercase">{cat.title}</td><td className="py-1.5 text-right font-mono font-bold">{cat.status === 'OK' ? 'OK' : '⚠'}</td></tr>); })}</tbody></table></div>
                                <div className="w-1/2 flex flex-col gap-4">
                                    {pendingList.length > 0 && (<div className="border border-black p-2 bg-gray-50"><h3 className="font-bold uppercase text-[9px] mb-1">Pendências</h3><ul className="list-disc list-inside text-[10px] space-y-0.5">{pendingList.map(function(p, i) { return <li key={i} className="truncate uppercase">{p.replace('- ', '')}</li>; })}</ul></div>)}
                                    <div><h3 className="font-bold uppercase text-[10px] mb-1 border-b border-black pb-1">Observações</h3><p className="text-[10px] leading-relaxed italic h-16 uppercase">{obs || "Sem observações adicionais."}</p></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            var Dashboard = function(props) {
                var activeTickets = props.activeTickets || [];
                var onOpenTicket = props.onOpenTicket;
                var onDeleteTicket = props.onDeleteTicket;
                var historyCount = props.historyCount || 0;
                var formatCount = activeTickets.filter(function(t) { return t.type === 'formatacao'; }).length;

                return (
                    <div className="p-6 md:p-10 space-y-8 fade-in">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Visão Geral</h2>
                            <p className="text-slate-500 text-sm">Monitoramento de atividades de infraestrutura em tempo real.</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-brand-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Registos Ativos</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{activeTickets.length}</h3></div>
                                <div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-xl text-brand-600">{Icons.Layout}</div>
                            </Card>
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-emerald-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Total de Operações</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{historyCount}</h3></div>
                                <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl text-emerald-600">{Icons.History}</div>
                            </Card>
                            <Card className="flex items-center justify-between p-5 border-l-4 border-l-indigo-500">
                                <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Formatações PC</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{formatCount}</h3></div>
                                <div className="bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl text-indigo-600">{Icons.Server}</div>
                            </Card>
                        </div>

                        <div>
                            <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">{Icons.Server} Painel de Execução</h3>
                            {activeTickets.length === 0 ? (
                                <div className="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-12 text-center">
                                    <p className="text-slate-400 font-medium">Nenhum checklist em andamento.</p>
                                    <p className="text-xs text-slate-500 mt-1">Utilize o menu lateral para iniciar uma atividade.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {activeTickets.map(function(ticket) {
                                        var meta = (ticket.data && ticket.data.meta) || {};
                                        var pct = calcProgress(ticket.data && ticket.data.items);
                                        var nomeAtivo = (meta.maquina || meta.ativo || "Sem Identificação").toUpperCase();
                                        
                                        return (
                                            <div key={ticket.id} onClick={function() { onOpenTicket(ticket.id); }} className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 hover:shadow-lg hover:border-brand-400 dark:hover:border-brand-500 transition-all cursor-pointer relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div className="flex items-center gap-2">
                                                        <Badge color={ticket.type === 'formatacao' ? 'blue' : ticket.type === 'diario' ? 'green' : ticket.type === 'rack' ? 'indigo' : 'amber'}>
                                                            {ticket.type === 'formatacao' ? 'Formatação' : ticket.type === 'diario' ? 'Diário' : ticket.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                                        </Badge>
                                                        <span className="text-[9px] font-bold uppercase text-slate-400 flex items-center gap-1">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span> Em Execução
                                                        </span>
                                                    </div>
                                                    <span className="text-xs font-mono font-bold text-slate-400">#{ticket.visualId}</span>
                                                </div>
                                                <h4 className="font-bold text-slate-800 dark:text-white text-lg truncate mb-1 uppercase">{nomeAtivo}</h4>
                                                <p className="text-xs text-slate-500 mb-4 flex items-center gap-1 uppercase">{Icons.User} {meta.tecnico || 'Técnico'}</p>
                                                
                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                        <div className={"h-full " + (pct === 100 ? "bg-emerald-500" : "bg-brand-500")} style={{width: pct + '%'}}></div>
                                                    </div>
                                                    <span className="text-xs font-bold text-brand-600">{pct}%</span>
                                                </div>
                                                <button onClick={function(e) { onDeleteTicket(e, ticket.id); }} className="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition-colors opacity-0 group-hover:opacity-100" title="Excluir registo">{Icons.Trash}</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            var HistoryView = function(props) {
                var history = props.history || [];
                var onOpenHistory = props.onOpenHistory;
                var searchState = useState('');
                var search = searchState[0], setSearch = searchState[1];

                var filtered = history.filter(function(h) {
                    var s = search.toLowerCase();
                    var at = (h.ativo || '').toLowerCase();
                    var tc = (h.tecnico || '').toLowerCase();
                    var vid = (h.visualId || '').toLowerCase();
                    return at.indexOf(s) !== -1 || tc.indexOf(s) !== -1 || vid.indexOf(s) !== -1;
                });

                return (
                    <div className="p-6 md:p-10 h-full flex flex-col fade-in">
                        <div className="flex justify-between items-end mb-6">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Histórico de Operações</h2>
                                <p className="text-slate-500 text-sm">Registro auditável de todas as atividades concluídas.</p>

                            <div className="relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">{Icons.Search}</div>
                                <Input placeholder="Buscar por ID, Ativo..." value={search} onChange={function(e) { setSearch(e.target.value); }} className="pl-10 w-64" />
                            </div>
                        </div>
                        
                        <Card className="flex-1 overflow-hidden flex flex-col" noPadding>
                            <div className="overflow-auto flex-1">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-slate-50 dark:bg-slate-800 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                                        <tr>
                                            <th className="px-6 py-3">ID</th>
                                            <th className="px-6 py-3">Data</th>
                                            <th className="px-6 py-3">Tipo</th>
                                            <th className="px-6 py-3">Ativo</th>
                                            <th className="px-6 py-3">Técnico</th>
                                            <th className="px-6 py-3 text-right">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {filtered.map(function(h, i) {
                                            return (
                                                <tr key={i} onClick={function() { if (onOpenHistory) onOpenHistory(h); }} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer">
                                                    <td className="px-6 py-3 font-mono text-xs font-bold text-slate-500">#{h.visualId}</td>
                                                    <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{new Date(h.date || Date.now()).toLocaleDateString()}</td>
                                                    <td className="px-6 py-3">
                                                        <Badge color={h.type === 'formatacao' ? 'blue' : h.type === 'diario' ? 'green' : h.type === 'rack' ? 'indigo' : 'amber'}>
                                                            {h.type === 'formatacao' ? 'Formatação' : h.type === 'diario' ? 'Diário' : h.type === 'rack' ? 'Rack/Switch' : 'Zebra'}
                                                        </Badge>
                                                    </td>
                                                    <td className="px-6 py-3 font-medium text-slate-800 dark:text-white uppercase">{h.ativo || 'N/A'}</td>
                                                    <td className="px-6 py-3 text-slate-600 dark:text-slate-400 uppercase">{h.tecnico || 'N/A'}</td>
                                                    <td className="px-6 py-3 text-right"><span className="text-emerald-600 dark:text-emerald-400 text-xs font-bold bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-full">Concluído</span></td>
                                                </tr>
                                            );
                                        })}
                                        {filtered.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-slate-400">Nenhum registro encontrado.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </Card>
                    </div>
                );
            };

            var KanbanView = function(props) {
                var tasks = props.tasks || [];
                var users = props.users || [];
                var currentUser = props.currentUser;
                var onSaveTask = props.onSaveTask;
                var onDeleteTask = props.onDeleteTask;
                var onMoveTask = props.onMoveTask;
                var onUpdateTask = props.onUpdateTask;
                var onReorderTask = props.onReorderTask;

                var modalState = useState(false);
                var isModalOpen = modalState[0], setIsModalOpen = modalState[1];
                
                var formState = useState({ title: '', assignee: users[0] ? users[0].name : 'DANILO', priority: 'Média', status: 'a_fazer' });
                var form = formState[0], setForm = formState[1];

                var editState = useState(null);
                var editingTask = editState[0], setEditingTask = editState[1];
                
                var commentState = useState('');
                var newComment = commentState[0], setNewComment = commentState[1];

                var handleDropOnCol = function(e, colId) {
                    e.preventDefault();
                    var draggedId = e.dataTransfer.getData('taskId');
                    if (draggedId) {
                        onReorderTask(draggedId, null, colId);
                    }
                };

                var handleCreate = function(e) {
                    e.preventDefault();
                    if (!form.title.trim()) return;
                    var seq = Math.floor(100 + Math.random() * 900);
                    var newTask = {
                        code: 'SCRUM-' + seq,
                        title: form.title.trim().toUpperCase(),
                        description: '',
                        assignee: form.assignee,
                        priority: form.priority,
                        status: form.status,
                        comments: [],
                        createdAt: new Date().toISOString()
                    };
                    onSaveTask(newTask);
                    setForm({ title: '', assignee: users[0] ? users[0].name : 'DANILO', priority: 'Média', status: 'a_fazer' });
                    setIsModalOpen(false);
                };

                var handleCloseSprint = function() {
                    var completed = tasks.filter(function(t) { return t.status === 'concluido'; });
                    if (completed.length === 0) {
                        return alert("Não há tarefas na coluna 'Concluído' para arquivar.");
                    }
                    
                    if (confirm("Encerrar Sprint atual?\n\nIsto limpará o quadro e arquivará " + completed.length + " tarefa(s) concluída(s).")) {
                        var batch = db.batch();
                        completed.forEach(function(t) {
                            var ref = db.collection('kanban_tasks').doc(t.id);
                            batch.update(ref, { archived: true, archivedAt: new Date().toISOString() });
                        });
                        batch.commit().then(function() {
                            // Sucesso (Firebase atualiza a view em tempo real)
                        }).catch(function(err) {
                            alert("Erro ao arquivar: " + err.message);
                        });
                    }
                };

                var columns = [
                    { id: 'a_fazer', title: 'A Fazer' },
                    { id: 'em_andamento', title: 'Em Andamento' },
                    { id: 'impedimentos', title: 'Impedimentos' },
                    { id: 'concluido', title: 'Concluído' }
                ];

                return (
                    <div className="p-6 md:p-10 h-full flex flex-col fade-in overflow-x-auto bg-jira-bg">
                        <div className="flex justify-between items-center mb-6 shrink-0">
                            <div>
                                <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                    {Icons.Kanban} Quadro Kanban (Tarefas TI)
                                </h2>
                            </div>
                            <Button onClick={handleCloseSprint} className="bg-brand-600 hover:bg-brand-500 text-xs sm:text-sm shadow-lg shadow-brand-500/20">
                                {Icons.Archive} Encerrar Sprint
                            </Button>
                        </div>

                        <div className="flex gap-4 flex-1 pb-4 min-w-[1000px]">
                            {columns.map(function(col) {
                                var colTasks = tasks.filter(function(t) { return t.status === col.id; });
                                return (
                                    <div key={col.id} 
                                         onDragOver={function(e) { e.preventDefault(); }}
                                         onDrop={function(e) { handleDropOnCol(e, col.id); }}
                                         className="bg-jira-col rounded-xl p-3 flex flex-col w-[280px] min-w-[280px] h-full max-h-[calc(100vh-180px)] border border-slate-800/50">
                                        <div className="flex items-center gap-3 mb-4 shrink-0 px-1 pt-1">
                                            <h3 className="text-xs font-bold uppercase tracking-wider text-jira-subtext">{col.title}</h3>
                                            <span className="bg-jira-card text-jira-text px-2 py-0.5 rounded text-[10px] font-bold">{colTasks.length}</span>
                                        </div>

                                        <div className="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                                            {colTasks.map(function(task) {
                                                var initials = '';
                                                var avatarBg = 'bg-slate-600 text-white';
                                                
                                                if (!task.assignee || task.assignee.trim() === '') {
                                                    avatarBg = 'bg-transparent border border-slate-500 text-slate-500';
                                                    initials = <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
                                                } else {
                                                    var nameUpper = task.assignee.toUpperCase();
                                                    if (nameUpper.indexOf('DANILO') !== -1) { initials = 'DI'; avatarBg = 'bg-orange-600 text-white'; }
                                                    else if (nameUpper.indexOf('KAUAN') !== -1) { initials = 'KF'; avatarBg = 'bg-blue-600 text-white'; }
                                                    else if (nameUpper.indexOf('OUTRO') !== -1) { initials = 'O'; avatarBg = 'bg-red-600 text-white'; }
                                                    else { initials = task.assignee.substring(0, 2).toUpperCase(); avatarBg = 'bg-indigo-600 text-white'; }
                                                }

                                                var priorityIcon = null;
                                                if (task.priority === 'Alta') {
                                                    priorityIcon = <div className="text-red-500 font-black text-lg leading-none" title="Alta">=</div>;
                                                } else if (task.priority === 'Média') {
                                                    priorityIcon = <div className="text-orange-500 font-black text-lg leading-none" title="Média">=</div>;
                                                } else {
                                                    priorityIcon = <div className="text-blue-500 font-black text-lg leading-none" title="Baixa">-</div>;
                                                }
                                                
                                                var commentCount = task.comments ? task.comments.length : 0;
                                                
                                                return (
                                                    <div key={task.id} 
                                                         draggable={true}
                                                         onDragStart={function(e) { 
                                                             e.dataTransfer.setData('taskId', task.id); 
                                                             e.stopPropagation(); 
                                                         }}
                                                         onDragOver={function(e) { 
                                                             e.preventDefault(); 
                                                             e.stopPropagation(); 
                                                             e.currentTarget.style.borderTop = '2px solid #3b82f6';
                                                         }}
                                                         onDragLeave={function(e) { 
                                                             e.currentTarget.style.borderTop = '';
                                                         }}
                                                         onDrop={function(e) {
                                                             e.preventDefault();
                                                             e.stopPropagation();
                                                             e.currentTarget.style.borderTop = '';
                                                             var draggedId = e.dataTransfer.getData('taskId');
                                                             if (draggedId && draggedId !== task.id) {
                                                                 onReorderTask(draggedId, task.id, col.id);
                                                             }
                                                         }}
                                                         onClick={function() { setEditingTask(task); }} 
                                                         className="bg-jira-card hover:bg-jira-cardHover transition-colors p-3 rounded-lg shadow-sm group flex flex-col gap-3 relative cursor-grab active:cursor-grabbing border border-transparent">
                                                        <h4 className="text-[13px] text-jira-text leading-snug uppercase">{task.title}</h4>

                                                        <div className="flex justify-between items-center mt-1">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-4 h-4 bg-blue-600 rounded flex items-center justify-center">
                                                                    <svg className="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path d="M5 13l4 4L19 7" /></svg>
                                                                </div>
                                                                <span className="text-[11px] font-bold text-jira-subtext">{task.code}</span>
                                                                {commentCount > 0 && (
                                                                    <div className="flex items-center gap-1 text-slate-500 ml-1" title="Comentários">
                                                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                                                        <span className="text-[10px] font-bold">{commentCount}</span>
                                                                    </div>
                                                                )}
                                                            </div>

                                                            <div className="flex items-center gap-2">
                                                                {priorityIcon}
                                                                <div className={"w-6 h-6 rounded-full flex items-center justify-center text-[9px] font-bold shadow-sm " + avatarBg} title={task.assignee || 'Não atribuído'}>
                                                                    {initials}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="absolute top-2 right-2 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity bg-jira-cardHover rounded shadow-sm p-1">
                                                            {col.id !== 'a_fazer' && (
                                                                <button onClick={function(e) {
                                                                    e.stopPropagation();
                                                                    var prev = col.id === 'em_andamento' ? 'a_fazer' : col.id === 'impedimentos' ? 'em_andamento' : 'impedimentos';
                                                                    onMoveTask(task.id, prev);
                                                                }} className="p-1 hover:bg-slate-700 text-slate-400 hover:text-white rounded" title="Recuar">{Icons.ArrowLeft}</button>
                                                            )}
                                                            {col.id !== 'concluido' && (
                                                                <button onClick={function(e) {
                                                                    e.stopPropagation();
                                                                    var next = col.id === 'a_fazer' ? 'em_andamento' : col.id === 'em_andamento' ? 'impedimentos' : 'concluido';
                                                                    onMoveTask(task.id, next);
                                                                }} className="p-1 hover:bg-slate-700 text-slate-400 hover:text-white rounded" title="Avançar">{Icons.ArrowRight}</button>
                                                            )}
                                                            <button onClick={function(e) { e.stopPropagation(); onDeleteTask(task.id); }} className="p-1 hover:bg-red-900/50 text-slate-400 hover:text-red-400 rounded" title="Excluir">{Icons.Trash}</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <div className="mt-2 pt-2 shrink-0">
                                            <button onClick={function() { setForm(Object.assign({}, form, {status: col.id})); setIsModalOpen(true); }} className="flex items-center gap-2 text-jira-subtext hover:text-white hover:bg-jira-cardHover w-full px-2 py-1.5 rounded transition-colors text-xs font-semibold">
                                                {Icons.Plus} <span>Criar</span>
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {isModalOpen && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
                                <Card className="w-full max-w-md bg-jira-bg border-slate-700" noPadding>
                                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-jira-col">
                                        <h3 className="font-bold text-slate-200 text-sm">Criar Tarefa</h3>
                                        <button onClick={function() { setIsModalOpen(false); }} className="text-2xl leading-none text-slate-400 hover:text-white">&times;</button>
                                    </div>
                                    <form onSubmit={handleCreate} className="p-6 space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Título da Tarefa</label>
                                            <Input value={form.title} onChange={function(e) { setForm(Object.assign({}, form, { title: e.target.value.toUpperCase() })); }} placeholder="EX: SUBSTITUIR SWITCH RACK 02" className="bg-jira-card border-slate-700 text-white uppercase" autoFocus />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Responsável</label>
                                                <select value={form.assignee} onChange={function(e) { setForm(Object.assign({}, form, { assignee: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500">
                                                    <option value="">Não Atribuído</option>
                                                    {users.map(function(u) { return <option key={u.id} value={u.name}>{u.name}</option>; })}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Prioridade</label>
                                                <select value={form.priority} onChange={function(e) { setForm(Object.assign({}, form, { priority: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500">
                                                    <option value="Baixa">Baixa</option>
                                                    <option value="Média">Média</option>
                                                    <option value="Alta">Alta</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Coluna Inicial</label>
                                            <select value={form.status} onChange={function(e) { setForm(Object.assign({}, form, { status: e.target.value })); }} className="w-full h-10 px-3 bg-jira-card border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500">
                                                <option value="a_fazer">A Fazer</option>
                                                <option value="em_andamento">Em Andamento</option>
                                                <option value="impedimentos">Impedimentos</option>
                                                <option value="concluido">Concluído</option>
                                            </select>
                                        </div>
                                        <div className="pt-2 flex justify-end gap-2">
                                            <Button type="button" variant="secondary" onClick={function() { setIsModalOpen(false); }} className="bg-transparent border-none text-slate-400 hover:bg-slate-800">Cancelar</Button>
                                            <Button type="submit" className="bg-brand-600 hover:bg-brand-500">Criar</Button>
                                        </div>
                                    </form>
                                </Card>
                            </div>
                        )}

                        {editingTask && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
                                <Card className="w-full max-w-3xl bg-[#1D2125] border-slate-700 max-h-[90vh] flex flex-col shadow-2xl" noPadding>
                                    <div className="p-4 border-b border-slate-800 flex justify-between items-center bg-[#161A1D]">
                                        <div className="flex items-center gap-3">
                                            <span className="text-[10px] font-mono font-bold bg-blue-600 px-2 py-1 rounded text-white">{editingTask.code}</span>
                                            <h3 className="font-bold text-slate-200 text-sm">Editar Cartão</h3>
                                        </div>
                                        <button onClick={function() { setEditingTask(null); }} className="text-2xl leading-none text-slate-400 hover:text-white">&times;</button>
                                    </div>
                                    
                                    <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Título</label>
                                                <Input value={editingTask.title} onChange={function(e) { setEditingTask(Object.assign({}, editingTask, {title: e.target.value.toUpperCase()})); }} className="bg-[#22272B] border-slate-700 text-white font-semibold uppercase" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Descrição detalhada</label>
                                                <textarea rows="3" value={editingTask.description || ''} onChange={function(e) { setEditingTask(Object.assign({}, editingTask, {description: e.target.value.toUpperCase()})); }} className="w-full p-3 bg-[#22272B] border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500 uppercase" placeholder="ADICIONE INSTRUÇÕES, LINKS OU CONTEXTO PARA ESTA TAREFA..."></textarea>
                                            </div>
                                            <div className="grid grid-cols-3 gap-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Status</label>
                                                    <select value={editingTask.status} onChange={function(e) { setEditingTask(Object.assign({}, editingTask, {status: e.target.value})); }} className="w-full h-10 px-3 bg-[#22272B] border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none">
                                                        <option value="a_fazer">A Fazer</option>
                                                        <option value="em_andamento">Em Andamento</option>
                                                        <option value="impedimentos">Impedimentos</option>
                                                        <option value="concluido">Concluído</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Responsável</label>
                                                    <select value={editingTask.assignee} onChange={function(e) { setEditingTask(Object.assign({}, editingTask, {assignee: e.target.value})); }} className="w-full h-10 px-3 bg-[#22272B] border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none">
                                                        <option value="">Não Atribuído</option>
                                                        {users.map(function(u) { return <option key={u.id} value={u.name}>{u.name}</option>; })}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Prioridade</label>
                                                    <select value={editingTask.priority} onChange={function(e) { setEditingTask(Object.assign({}, editingTask, {priority: e.target.value})); }} className="w-full h-10 px-3 bg-[#22272B] border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none">
                                                        <option value="Baixa">Baixa</option>
                                                        <option value="Média">Média</option>
                                                        <option value="Alta">Alta</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-800 pt-6">
                                            <h4 className="text-sm font-bold text-slate-300 mb-4 flex items-center gap-2">{Icons.BookOpen} Comentários e Atividade</h4>
                                            
                                            <div className="space-y-3 mb-5">
                                                {(editingTask.comments || []).map(function(c, i) {
                                                    var isMe = currentUser && c.author === currentUser.name;
                                                    return (
                                                        <div key={i} className={"p-3 rounded-lg border flex flex-col gap-1 " + (isMe ? "bg-brand-900/10 border-brand-800/30 ml-4" : "bg-[#22272B] border-slate-800 mr-4")}>
                                                            <div className="flex justify-between items-center">
                                                                <span className={"text-xs font-bold " + (isMe ? "text-brand-400" : "text-slate-400")}>{c.author}</span>
                                                                <span className="text-[10px] text-slate-500">{new Date(c.createdAt).toLocaleString()}</span>
                                                            </div>
                                                            <p className="text-sm text-slate-300 whitespace-pre-wrap uppercase">{c.text}</p>
                                                        </div>
                                                    );
                                                })}
                                                {(!editingTask.comments || editingTask.comments.length === 0) && (
                                                    <div className="text-center p-4 text-xs text-slate-500 italic bg-[#161A1D] rounded-lg">Nenhum comentário. Seja o primeiro a adicionar notas a esta tarefa.</div>
                                                )}
                                            </div>
                                            
                                            <div className="flex items-start gap-3">
                                                <div className="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs font-bold shrink-0 mt-1 shadow-sm">
                                                    {currentUser && currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U'}
                                                </div>
                                                <textarea value={newComment} onChange={function(e) { setNewComment(e.target.value.toUpperCase()); }} rows="2" className="flex-1 p-2.5 bg-[#22272B] border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-brand-500 placeholder-slate-500 resize-none uppercase" placeholder="ESCREVA UM COMENTÁRIO..."></textarea>
                                                <Button onClick={function() {
                                                    if(!newComment.trim()) return;
                                                    var commentObj = {
                                                        id: 'c_' + Date.now(),
                                                        author: currentUser ? currentUser.name : 'Técnico',
                                                        text: newComment.trim().toUpperCase(),
                                                        createdAt: new Date().toISOString()
                                                    };
                                                    var updatedComments = (editingTask.comments || []).concat([commentObj]);
                                                    var updatedTask = Object.assign({}, editingTask, { comments: updatedComments });
                                                    setEditingTask(updatedTask);
                                                    onUpdateTask(updatedTask.id, { comments: updatedComments });
                                                    setNewComment('');
                                                }} className="shrink-0 h-10 mt-1 px-5">Enviar</Button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-4 border-t border-slate-800 bg-[#161A1D] flex justify-end gap-2 shrink-0">
                                        <Button variant="secondary" onClick={function() { setEditingTask(null); }} className="bg-transparent border-none text-slate-400 hover:bg-slate-800">Cancelar</Button>
                                        <Button onClick={function() {
                                            var updates = {
                                                title: editingTask.title.toUpperCase(),
                                                description: (editingTask.description || '').toUpperCase(),
                                                status: editingTask.status,
                                                assignee: editingTask.assignee,
                                                priority: editingTask.priority
                                            };
                                            onUpdateTask(editingTask.id, updates);
                                            setEditingTask(null);
                                        }} className="bg-brand-600 hover:bg-brand-500">Salvar Cartão</Button>
                                    </div>
                                </Card>
                            </div>
                        )}
                    </div>
                );
            };

            var ConfigModal = function(props) {
                var onClose = props.onClose;
                var users = props.users || [];
                var currentUser = props.currentUser;
                
                var globalTitulos = props.globalTitulos || {col1: '', col2: '', col3: ''};
                var titulosState = useState(globalTitulos);
                var titulos = titulosState[0], setTitulos = titulosState[1];

                var userState = useState({ id: '', name: '', pass: '' });
                var newUser = userState[0], setNewUser = userState[1];
                var filterState = useState('');
                var filter = filterState[0], setFilter = filterState[1];
                var savingState = useState(false);
                var saving = savingState[0], setSaving = savingState[1];

                var handleAddUser = function(e) {
                    e.preventDefault();
                    var cleanId = (newUser.id || '').trim();
                    var cleanName = (newUser.name || '').trim().toUpperCase();
                    if (!cleanId || !cleanName) return alert("Preencha a Matrícula e o Nome.");
                    if (users.some(function(u) { return (u.id || '').toLowerCase() === cleanId.toLowerCase(); })) {
                        return alert("Matrícula já cadastrada.");
                    }

                    setSaving(true);
                    db.collection('users').add({ id: cleanId, name: cleanName })
                        .then(function() { setNewUser({ id: '', name: '', pass: '' }); })
                        .catch(function(err) { alert("Erro: " + err.message); })
                        .finally(function() { setSaving(false); });
                };

                var handleDeleteUser = function(user) {
                    if (currentUser && user.id === currentUser.id) return alert("Você não pode remover seu próprio usuário.");
                    if (confirm("Remover técnico " + user.name + "?")) {
                        db.collection('users').doc(user.docId).delete();
                    }
                };
                
                var handleSaveTitulos = function(e) {
                    e.preventDefault();
                    setSaving(true);
                    var formattedTitulos = {
                        col1: (titulos.col1 || '').toUpperCase(),
                        col2: (titulos.col2 || '').toUpperCase(),
                        col3: (titulos.col3 || '').toUpperCase()
                    };
                    db.collection('settings').doc('titulos').set(formattedTitulos)
                        .then(function() { alert("Títulos atualizados com sucesso!"); })
                        .catch(function(err) { alert("Erro ao atualizar: " + err.message); })
                        .finally(function() { setSaving(false); });
                };

                var list = users.filter(function(u) {
                    return (u.name || '').toLowerCase().indexOf(filter.toLowerCase()) !== -1 ||
                           (u.id || '').toLowerCase().indexOf(filter.toLowerCase()) !== -1;
                });

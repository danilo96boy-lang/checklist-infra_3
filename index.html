                                                {Icons.ChevronDown}
                                            </div>
                                        </div>
                                        
                                        {openFolders.checklists && (
                                            <div className="mt-1 ml-4 pl-2 border-l border-slate-800 space-y-0.5 fade-in">
                                                <button onClick={() => handleCreateTicket('diario')} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-emerald-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-emerald-500/50 group-hover:text-emerald-400">{Icons.Check}</span> Check Diário
                                                </button>
                                                <button onClick={() => handleCreateTicket('rack')} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-indigo-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-indigo-500/50 group-hover:text-indigo-400">{Icons.Server}</span> Rack Fábrica
                                                </button>
                                                <button onClick={() => handleCreateTicket('formatacao')} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-brand-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-brand-500/50 group-hover:text-brand-400">{Icons.Copy}</span> Formatação PC
                                                </button>
                                                <button onClick={() => handleCreateTicket('zebra')} className="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-400 hover:text-amber-400 hover:bg-slate-800/50 group truncate">
                                                    <span className="text-amber-500/50 group-hover:text-amber-400">{Icons.Printer}</span> Manutenção Zebra
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {customFolders.map((f) => {
                                        var isOpen = !!openFolders[f.id];
                                        return (
                                            <div key={f.id} className="space-y-1 mb-1">
                                                <div onClick={() => toggleFolder(f.id)} className={"w-full flex items-center justify-between px-3 py-2 rounded-lg transition-colors font-medium text-xs text-slate-300 hover:bg-slate-800 cursor-pointer group " + (isOpen ? 'bg-slate-800/60 text-white' : '')}>
                                                    <div className="flex items-center gap-2.5 truncate">
                                                        <span className={isOpen ? "text-amber-400" : "text-slate-500"}>{Icons.Folder}</span> 
                                                        <span className="truncate font-semibold">{f.title}</span>
                                                    </div>
                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <button onClick={(e) => handleDeleteFolder(e, f.id)} className="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-0.5" title="Excluir Pasta">{Icons.Trash}</button>
                                                        <div className={"transition-transform duration-200 text-slate-500 " + (isOpen ? 'rotate-180' : '')}>{Icons.ChevronDown}</div>
                                                    </div>
                                                </div>
                                                
                                                {isOpen && (
                                                    <div className="mt-1 ml-4 pl-2 border-l border-slate-800 space-y-0.5 fade-in">
                                                        {(f.links || []).map((l) => (
                                                            <div key={l.id} className="flex items-center justify-between group px-2 py-1 rounded text-[11px] text-slate-400 hover:text-white hover:bg-slate-800/50">
                                                                <div onClick={() => handleOpenLink(l.url)} className="flex items-center gap-2 truncate cursor-pointer flex-1" title={l.url}>
                                                                    <span className="text-slate-500 group-hover:text-brand-400">{Icons.ExternalLink}</span>
                                                                    <span className="truncate">{l.label}</span>
                                                                </div>
                                                                <button onClick={(e) => handleDeleteLink(e, f.id, l.id)} className="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-0.5 shrink-0" title="Remover link">{Icons.Trash}</button>
                                                            </div>
                                                        ))}
                                                        <button onClick={() => handleAddLink(f.id)} className="w-full text-left flex items-center gap-1.5 px-2 py-1 text-[10px] text-slate-500 hover:text-brand-400 font-semibold">
                                                            {Icons.Plus} <span>Adicionar Link</span>
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </nav>
                            </div>

                            <div className="p-4 border-t border-slate-800 shrink-0">
                                <div className="flex items-center gap-3 mb-4 px-2">
                                    <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white shrink-0">
                                        {currentUser && currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U'}
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="text-sm font-bold text-white truncate">{currentUser ? currentUser.name : ''}</p>
                                        <p className="text-xs text-slate-500 font-mono">ID: {currentUser ? currentUser.id : ''}</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-2">
                                    <button title="Alternar tema" onClick={() => setDarkMode(!darkMode)} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-yellow-400 transition-colors flex justify-center">{darkMode ? Icons.Sun : Icons.Moon}</button>
                                    <button title="Configurações" onClick={() => setShowConfig(true)} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors flex justify-center">{Icons.Settings}</button>
                                    <button title="Sair" onClick={handleLogout} className="p-2 rounded bg-red-900/20 hover:bg-red-900/40 text-red-400 transition-colors flex justify-center">{Icons.LogOut}</button>
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 flex flex-col min-w-0 bg-slate-100 dark:bg-slate-950">
                            <div className="md:hidden h-16 bg-slate-900 text-white flex items-center justify-between px-4 shrink-0">
                                <span className="font-bold">INFRA CHECK</span>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConfig(true)} className="p-2">{Icons.Settings}</button>
                                    <button onClick={() => setView('dashboard')} className="p-2">{Icons.Layout}</button>
                                    <button onClick={handleLogout} className="p-2">{Icons.LogOut}</button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-auto relative">
                                {showConfig && <ConfigModal onClose={() => setShowConfig(false)} users={users} currentUser={currentUser} globalTitulos={globalTitulos} />}
                                {view === 'dashboard' && <Dashboard activeTickets={activeTickets} onOpenTicket={(id) => { setCurrentTicketId(id); setView('checklist'); }} onDeleteTicket={handleDeleteActive} historyCount={history.length} />}
                                {view === 'kanban' && <KanbanView tasks={kanbanTasks} users={users} onSaveTask={handleSaveKanbanTask} onDeleteTask={handleDeleteKanbanTask} onMoveTask={handleMoveKanbanTask} />}
                                {view === 'checklist' && <ActiveChecklist ticket={currentTicketData} onUpdate={handleUpdateTicket} onBack={handleBackFromChecklist} onForceSave={handleForceSaveChecklist} onRequestFinish={handleRequestFinish} onGlobalTitleChange={handleGlobalTitleChange} />}
                                {view === 'receipt' && <ReceiptView ticket={currentTicketData} onBack={() => setView('checklist')} onArchive={handleArchive} logo={logo} />}
                                {view === 'history' && <HistoryView history={history} />}
                            </div>
                        </main>
                    </div>
                );
            };

            var root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML = '<div style="padding:40px;color:#ef4444;font-family:sans-serif;"><h3>Erro Crítico</h3><pre>' + err.message + '</pre></div>';
        }
    </script>
</body>
</html>

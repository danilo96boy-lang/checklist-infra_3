            var cls = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 " + (variants[variant] || variants.primary) + " " + (props.className || '');

        };

        var Badge = function(props) {
            var color = props.color || 'slate';

                blue: 'bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300',

            };
            return <span className={"px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider " + (colors[color] || colors.slate)}>{props.children}</span>;
        };

        var calcProgress = function(items) {
            if (!items || typeof items !== 'object') return 0;
            var total = 0, done = 0;
            Object.keys(items).forEach(function(k) {
                var group = items[k];
                if (group && Array.isArray(group.tasks)) {
                    group.tasks.forEach(function(t) {
                        total++;
                        if (t && t.checked) done++;
                    });
                }
            });
            return total === 0 ? 0 : Math.round((done / total) * 100);
        };

        var LoginScreen = function(props) {
            var onLogin = props.onLogin;
            var users = props.users || [];
            var idState = useState('');
            var id = idState[0], setId = idState[1];
            var passState = useState('');
            var pass = passState[0], setPass = passState[1];
            var errState = useState('');
            var error = errState[0], setError = errState[1];

            var handleSubmit = function(e) {
                e.preventDefault();
                var cleanId = (id || '').trim();
                var cleanPass = (pass || '').trim();
                var found = users.find(function(u) { return u.id === cleanId && u.pass === cleanPass; });
                if (found) onLogin(found);
                else setError('Credenciais inválidas. Verifique matrícula e senha.');
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950 p-4">

                            </div>
                            <h1 className="text-xl font-bold text-slate-900 dark:text-white">Infra Checklist</h1>
                            <p className="text-sm text-slate-500 mt-1">Manual Operacional de Formatação • Cobrecom</p>
                        </div>
                        <form onSubmit={handleSubmit} className="p-8 space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5 ml-1">Matrícula / ID</label>
                                <Input value={id} onChange={function(e) { setId(e.target.value); }} placeholder="0100xxxx" autoFocus />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-1.5 ml-1">Senha</label>
                                <Input type="password" value={pass} onChange={function(e) { setPass(e.target.value); }} placeholder="••••" />
                            </div>
                            {error && <div className="text-red-500 text-xs font-medium text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg">{error}</div>}
                            <Button type="submit" className="w-full h-11 text-base mt-2">Acessar Checklist</Button>
                        </form>
                        <div className="bg-slate-50 dark:bg-slate-950/50 p-4 text-center border-t border-slate-100 dark:border-slate-800">
                            <p className="text-[10px] text-slate-400 font-mono">POP FORMATAÇÃO W10 • TI COBRECOM</p>
                        </div>
                    </div>
                </div>
            );
        };

        var ConfigModal = function(props) {
            var onClose = props.onClose;
            var users = props.users || [];
            var currentUser = props.currentUser;
            var userState = useState({ id: '', name: '', pass: '' });
            var newUser = userState[0], setNewUser = userState[1];
            var filterState = useState('');
            var filter = filterState[0], setFilter = filterState[1];
            var savingState = useState(false);
            var saving = savingState[0], setSaving = savingState[1];

            var handleAddUser = function(e) {
                e.preventDefault();
                var cleanId = (newUser.id || '').trim();
                var cleanName = (newUser.name || '').trim();
                var cleanPass = (newUser.pass || '').trim();
                if (!cleanId || !cleanName || !cleanPass) return alert("Preencha todos os campos.");
                if (users.some(function(u) { return (u.id || '').toLowerCase() === cleanId.toLowerCase(); })) {
                    return alert("Matrícula já cadastrada.");
                }

                setSaving(true);
                db.collection('users').add({ id: cleanId, name: cleanName, pass: cleanPass })
                    .then(function() { setNewUser({ id: '', name: '', pass: '' }); })
                    .catch(function(err) { alert("Erro: " + err.message); })
                    .finally(function() { setSaving(false); });
            };

            var handleDeleteUser = function(user) {
                if (currentUser && user.id === currentUser.id) return alert("Você não pode remover seu próprio usuário conectado.");
                if (confirm("Remover técnico " + user.name + "?")) {
                    db.collection('users').doc(user.docId).delete();
                }
            };

            var list = users.filter(function(u) {
                return (u.name || '').toLowerCase().indexOf(filter.toLowerCase()) !== -1 ||
                       (u.id || '').toLowerCase().indexOf(filter.toLowerCase()) !== -1;
            });

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm fade-in">
                    <Card className="w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden" noPadding>
                        <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                            <h2 className="font-bold flex items-center gap-2 text-slate-700 dark:text-slate-200">{Icons.Settings} Gestão da Equipe Técnica</h2>
                            <button onClick={onClose} className="text-2xl leading-none text-slate-400 hover:text-slate-600">&times;</button>
                        </div>
                        <div className="p-6 overflow-y-auto grid md:grid-cols-2 gap-6">
                            <div>
                                <h3 className="text-xs font-bold uppercase text-slate-500 mb-4 tracking-wider">Novo Técnico</h3>
                                <form onSubmit={handleAddUser} className="space-y-3">
                                    <Input placeholder="Matrícula / ID" value={newUser.id} onChange={function(e) { setNewUser(Object.assign({}, newUser, { id: e.target.value })); }} />
                                    <Input placeholder="Nome Completo" value={newUser.name} onChange={function(e) { setNewUser(Object.assign({}, newUser, { name: e.target.value })); }} />
                                    <Input type="password" placeholder="Senha" value={newUser.pass} onChange={function(e) { setNewUser(Object.assign({}, newUser, { pass: e.target.value })); }} />
                                    <Button type="submit" disabled={saving} className="w-full">{Icons.Plus} Cadastrar</Button>
                                </form>
                            </div>
                            <div>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-xs font-bold uppercase text-slate-500 tracking-wider">Técnicos Habilitados</h3>
                                    <input placeholder="Buscar..." value={filter} onChange={function(e) { setFilter(e.target.value); }} className="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 outline-none w-28" />
                                </div>
                                <div className="space-y-2 max-h-[250px] overflow-y-auto pr-1">
                                    {list.map(function(u) {
                                        var isMe = currentUser && u.id === currentUser.id;
                                        return (
                                            <div key={u.docId || u.id} className="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700">
                                                <div>
                                                    <div className="font-semibold text-sm text-slate-700 dark:text-slate-200">{u.name}</div>
                                                    <div className="text-[10px] text-slate-400 font-mono">{u.id}</div>
                                                </div>
                                                {!isMe && (
                                                    <button onClick={function() { handleDeleteUser(u); }} className="text-slate-400 hover:text-red-500 transition-colors p-1">{Icons.Trash}</button>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        // --- COMPONENTE DO ITEM DO CHECKLIST COM O MANUAL EMBUTIDO ---
        var TaskItem = function(props) {
            var task = props.task;
            var onToggle = props.onToggle;
            var openState = useState(false);
            var isOpen = openState[0], setIsOpen = openState[1];
            var copiedState = useState(false);
            var copied = copiedState[0], setCopied = copiedState[1];

            var copyToClipboard = function(e, text) {
                e.stopPropagation();
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text);
                    setCopied(true);
                    setTimeout(function() { setCopied(false); }, 1500);
                }
            };

            return (
                <div className="p-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors select-none">
                    <div className="flex items-start gap-3">
                        <div 
                            onClick={onToggle}
                            className={"mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 cursor-pointer transition-all duration-200 " + (task.checked ? 'bg-brand-600 border-brand-600' : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800')}
                        >
                            {task.checked && <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path d="M5 13l4 4L19 7" /></svg>}
                        </div>

                        <div className="flex-1">
                            <div className="flex items-center justify-between gap-2">
                                <span 
                                    onClick={onToggle}
                                    className={"text-sm font-semibold cursor-pointer " + (task.checked ? 'text-slate-400 line-through' : 'text-slate-800 dark:text-slate-200')}
                                >
                                    {task.label}
                                </span>
                                
                                {task.manual && (
                                    <button 
                                        type="button"
                                        onClick={function() { setIsOpen(!isOpen); }} 
                                        className={"text-[11px] font-medium flex items-center gap-1 px-2 py-0.5 rounded transition-colors " + (isOpen ? "bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300" : "bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-brand-600")}
                                    >
                                        {Icons.BookOpen} <span>{isOpen ? 'Fechar' : 'Manual'}</span>
                                    </button>
                                )}
                            </div>

                            {isOpen && task.manual && (
                                <div className="mt-2.5 p-3 rounded-lg bg-blue-50/70 dark:bg-slate-950/70 border border-blue-100 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 fade-in">
                                    <div className="flex items-start gap-2">
                                        <div className="text-brand-500 shrink-0 mt-0.5 font-bold">ℹ</div>
                                        <div className="space-y-2 flex-1">
                                            <p className="leading-relaxed whitespace-pre-line font-sans">{task.manual}</p>
                                            
                                            {task.copyText && (
                                                <div className="pt-1 flex items-center gap-2">
                                                    <span className="text-[10px] uppercase font-bold text-slate-400">Comando / Parâmetro:</span>
                                                    <button 
                                                        type="button"
                                                        onClick={function(e) { copyToClipboard(e, task.copyText); }}
                                                        className="px-2 py-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded text-[11px] font-mono font-bold text-brand-600 dark:text-brand-400 hover:border-brand-500 flex items-center gap-1.5 transition-all shadow-sm"
                                                    >
                                                        {Icons.Copy}
                                                        <span>{task.copyText}</span>
                                                        {copied && <span className="text-[9px] text-emerald-600 font-sans">✓ Copiado!</span>}
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        var ActiveChecklist = function(props) {
            var ticket = props.ticket;
            var onUpdate = props.onUpdate;
            var onBack = props.onBack;
            var onRequestFinish = props.onRequestFinish;

            if (!ticket || !ticket.data) return null;
            var data = ticket.data;
            var meta = data.meta || {};
            var items = data.items || {};

            var handleMeta = function(field, value) {
                var newMeta = Object.assign({}, meta);
                newMeta[field] = value;
                onUpdate(Object.assign({}, data, { meta: newMeta }));
            };

            var handleCheck = function(section, taskId) {
                var newData = Object.assign({}, data);
                var sec = newData.items && newData.items[section];
                if (!sec || !Array.isArray(sec.tasks)) return;
                sec.tasks = sec.tasks.map(function(t) {
                    return t.id === taskId ? Object.assign({}, t, { checked: !t.checked }) : t;
                });
                onUpdate(newData);
            };

            var progress = calcProgress(items);

            var leftKeys = ['entrega', 'seguranca', 'sistema', 'preventivas'];
            var rightKeys = ['configuracao', 'preparacao', 'apps'];

            var renderCategoryCard = function(key) {
                var group = items[key];
                if (!group) return null;
                return (
                    <Card key={key} noPadding className="overflow-hidden h-fit">
                        <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 flex items-center gap-2">
                            <div className="text-brand-500">{Icons[group.icon] || Icons.Server}</div>
                            <h3 className="font-bold text-slate-700 dark:text-slate-200 text-xs uppercase tracking-wider">{group.title}</h3>
                        </div>
                        <div className="divide-y divide-slate-100 dark:divide-slate-800/60">
                            {(group.tasks || []).map(function(task) {
                                return (
                                    <TaskItem 
                                        key={task.id} 
                                        task={task} 
                                        onToggle={function() { handleCheck(key, task.id); }} 
                                    />
                                );
                            })}
                        </div>
                    </Card>
                );
            };

            return (
                <div className="flex flex-col h-full overflow-hidden bg-slate-100 dark:bg-slate-950 relative">
                    <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 p-4 px-6 flex justify-between items-center shadow-sm z-10 shrink-0">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="p-2 -ml-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg text-slate-500">{Icons.ChevronLeft}</button>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h2 className="text-lg font-bold text-slate-800 dark:text-white leading-none">#{ticket.visualId}</h2>
                                    <Badge color={ticket.type === 'formatacao' ? 'blue' : 'amber'}>
                                        {ticket.type === 'formatacao' ? 'Formatação PC' : 'Zebra'}
                                    </Badge>
                                </div>
                                <p className="text-xs text-slate-500 mt-1">Criado em {new Date(ticket.createdAt || Date.now()).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right hidden sm:block">
                                <span className="text-xs font-bold text-brand-600 block">{progress}% Completo</span>
                                <div className="w-32 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full mt-1 overflow-hidden">
                                    <div className={"h-full transition-all duration-500 " + (progress === 100 ? "bg-emerald-500" : "bg-brand-600")} style={{width: progress + '%'}}></div>
                                </div>
                            </div>
                            <Button onClick={onRequestFinish} variant={progress === 100 ? 'primary' : 'secondary'}>
                                {progress === 100 ? 'Finalizar' : 'Revisar'}
                            </Button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                        {/* CABEÇALHO IDÊNTICO À IMAGEM: DATA | ATIVO | MAQUINA */}
                        <Card className="grid grid-cols-1 md:grid-cols-3 gap-6" noPadding>
                            <div className="p-6 col-span-full grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">DATA</label>
                                    <Input type="date" value={meta.data || ''} onChange={function(e) { handleMeta('data', e.target.value); }} />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">ATIVO</label>
                                    <Input placeholder="Ex: PAT-01020" value={meta.ativo || ''} onChange={function(e) { handleMeta('ativo', e.target.value); }} />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1.5 tracking-wider">MAQUINA</label>
                                    <Input placeholder="Ex: CORP-PC-01" value={meta.maquina || ''} onChange={function(e) { handleMeta('maquina', e.target.value); }} />
                                </div>
                            </div>
                        </Card>

                        {/* DISTRIBUIÇÃO EM 2 COLUNAS IDÊNTICA À FOTO */}
                        {ticket.type === 'formatacao' ? (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-12">
                                <div className="space-y-6">
                                    {leftKeys.map(renderCategoryCard)}
                                </div>
                                <div className="space-y-6">
                                    {rightKeys.map(renderCategoryCard)}
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-12">
                                {Object.keys(items).map(renderCategoryCard)}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        var ReceiptView = function(props) {
            var ticket = props.ticket;
            var onBack = props.onBack;
            var onArchive = props.onArchive;
            var logo = props.logo;

            if (!ticket || !ticket.data) return null;
            var obsState = useState('');
            var obs = obsState[0], setObs = obsState[1];
            var meta = ticket.data.meta || {};
            var items = ticket.data.items || {};
            var identificador = meta.maquina || meta.ativo || "N/A";
            
            var totalTasks = 0, checkedTasks = 0;
            var pendingList = [];
            var categorySummary = Object.keys(items).map(function(k) {
                var group = items[k];
                var tasks = group.tasks || [];
                var total = tasks.length;
                var checked = tasks.filter(function(t) { return t.checked; }).length;
                tasks.forEach(function(t) { if (!t.checked) pendingList.push("- [" + group.title + "] " + t.label); });
                totalTasks += total;
                checkedTasks += checked;
                return { title: group.title, status: checked === total ? "OK" : "PENDENTE" };
            });
            var percent = totalTasks === 0 ? 0 : Math.round((checkedTasks / totalTasks) * 100);
            var statusGlobal = percent === 100 ? "CONCLUÍDO" : "PARCIAL";

            var handleSendOutlook = function() {
                var subject = "[" + statusGlobal + "] Checklist #" + ticket.visualId + " - " + identificador;
                var body = "RELATÓRIO TÉCNICO\n----------------------------------------\nID: #" + ticket.visualId + "\nATIVO: " + (meta.ativo || 'N/A') + "\nMÁQUINA: " + identificador + "\nSTATUS: " + statusGlobal + "\nTÉCNICO: " + (meta.tecnico || 'N/A') + "\nDATA: " + new Date().toLocaleDateString() + "\n----------------------------------------\nRESUMO:\n" + categorySummary.map(function(c) { return "[" + c.status + "] " + c.title; }).join('\n') + "\n----------------------------------------\nOBSERVAÇÕES:\n" + (obs || "Sem observações.") + "\n\nGerado via InfraChecklist Cobrecom";
                window.location.href = "mailto:" + EMAIL_DESTINO + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
                setTimeout(function() {
                    if (confirm("E-mail aberto? Clique OK para arquivar.")) onArchive(ticket);
                }, 1000);
            };

            return (
                <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-950 overflow-auto p-4 md:p-8">
                    <div className="max-w-4xl mx-auto w-full space-y-6 fade-in no-print">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2 text-slate-500 hover:text-slate-700 cursor-pointer" onClick={onBack}>
                                {Icons.ChevronLeft} <span className="font-bold text-sm">Voltar à Edição</span>
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800 dark:text-white">Revisão & Entrega</h1>
                        </div>

                        <Card className="grid md:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-2">Observações Finais</label>
                                <textarea value={obs} onChange={function(e) { setObs(e.target.value); }} className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm h-32 resize-none focus:ring-2 focus:ring-brand-500/20 outline-none" placeholder="Detalhes adicionais, peças trocadas, etc..."></textarea>
                            </div>
                            <div className="flex flex-col justify-center gap-3 border-l border-slate-100 dark:border-slate-800 pl-6">
                                <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300">Ações de Encerramento</h3>
                                <Button className="w-full justify-start" onClick={function() { window.print(); }} variant="secondary">{Icons.Printer} Imprimir Relatório</Button>
                                <Button className="w-full justify-start" onClick={handleSendOutlook}>{Icons.Mail} Enviar E-mail & Arquivar</Button>
                            </div>
                        </Card>
                    </div>

                    <div id="receipt-area" className="hidden bg-white text-black font-sans text-xs border border-gray-300 p-0">
                        <div className="flex justify-between items-center p-6 border-b-2 border-black">
                            <div className="flex items-center gap-4">{logo && <img src={logo} className="h-10 object-contain" />}<div><h1 className="text-xl font-bold tracking-tighter uppercase">Relatório Técnico</h1><p className="text-[10px] uppercase tracking-widest text-gray-500">Departamento de TI • Infraestrutura</p></div></div>
                            <div className="text-right"><div className="text-2xl font-mono font-bold">#{ticket.visualId || 'PEND'}</div><div className="text-[10px] font-bold">{new Date().toLocaleDateString()}</div></div>
                        </div>
                        <div className="grid grid-cols-4 border-b border-black">
                            <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Ativo</span><span className="font-bold text-sm block truncate">{meta.ativo || 'N/A'}</span></div>
                            <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Máquina</span><span className="font-bold text-sm block truncate">{identificador}</span></div>
                            <div className="p-3 border-r border-black"><span className="block text-[9px] font-bold uppercase text-gray-500">Técnico</span><span className="font-bold uppercase truncate">{meta.tecnico}</span></div>
                            <div className={"p-3 text-center flex flex-col justify-center " + (percent === 100 ? 'bg-gray-100' : 'bg-gray-200')}><span className="block text-[9px] font-bold uppercase text-gray-500">Status</span><span className="font-bold text-sm">{statusGlobal}</span></div>
                        </div>
                        <div className="p-6 flex gap-8">
                            <div className="w-1/2"><h3 className="font-bold uppercase text-[10px] mb-2 border-b border-black pb-1">Checklist</h3><table className="w-full text-left border-collapse"><tbody>{categorySummary.map(function(cat, i) { return (<tr key={i} className="border-b border-dotted border-gray-400"><td className="py-1.5 font-medium">{cat.title}</td><td className="py-1.5 text-right font-mono font-bold">{cat.status === 'OK' ? 'OK' : '⚠'}</td></tr>); })}</tbody></table></div>
                            <div className="w-1/2 flex flex-col gap-4">
                                {pendingList.length > 0 && (<div className="border border-black p-2 bg-gray-50"><h3 className="font-bold uppercase text-[9px] mb-1">Pendências</h3><ul className="list-disc list-inside text-[10px] space-y-0.5">{pendingList.map(function(p, i) { return <li key={i} className="truncate">{p.replace('- ', '')}</li>; })}</ul></div>)}
                                <div><h3 className="font-bold uppercase text-[10px] mb-1 border-b border-black pb-1">Observações</h3><p className="text-[10px] leading-relaxed italic h-16">{obs || "Sem observações adicionais."}</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        var Dashboard = function(props) {
            var activeTickets = props.activeTickets || [];
            var onNewTicket = props.onNewTicket;
            var onOpenTicket = props.onOpenTicket;
            var onDeleteTicket = props.onDeleteTicket;
            var historyCount = props.historyCount || 0;

            var formatCount = activeTickets.filter(function(t) { return t.type === 'formatacao'; }).length;

            return (
                <div className="p-6 md:p-10 space-y-8 fade-in">
                    <div>
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Visão Geral</h2>
                        <p className="text-slate-500 text-sm">Monitoramento de atividades de infraestrutura em tempo real.</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="flex items-center justify-between p-5 border-l-4 border-l-brand-500">
                            <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Chamados Abertos</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{activeTickets.length}</h3></div>
                            <div className="bg-brand-50 dark:bg-brand-900/20 p-3 rounded-xl text-brand-600">{Icons.Layout}</div>
                        </Card>
                        <Card className="flex items-center justify-between p-5 border-l-4 border-l-emerald-500">
                            <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Histórico Total</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{historyCount}</h3></div>
                            <div className="bg-emerald-50 dark:bg-emerald-900/20 p-3 rounded-xl text-emerald-600">{Icons.History}</div>
                        </Card>
                        <Card className="flex items-center justify-between p-5 border-l-4 border-l-indigo-500">
                            <div><p className="text-slate-500 text-xs uppercase font-bold tracking-wider">Formatações</p><h3 className="text-3xl font-bold text-slate-800 dark:text-white mt-1">{formatCount}</h3></div>
                            <div className="bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-xl text-indigo-600">{Icons.Server}</div>
                        </Card>
                    </div>

                    <div className="flex flex-col md:flex-row gap-4">
                        <button onClick={function() { onNewTicket('formatacao'); }} className="flex-1 bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white p-4 rounded-xl shadow-lg shadow-brand-500/20 transition-all flex items-center justify-between group">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-white/20 rounded-lg backdrop-blur-sm">{Icons.Plus}</div>
                                <div className="text-left"><span className="block font-bold">Nova Formatação</span><span className="text-xs opacity-80">Checklist com manual interativo integrado</span></div>
                            </div>
                        </button>
                        <button onClick={function() { onNewTicket('zebra'); }} className="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-500 p-4 rounded-xl shadow-sm hover:shadow-md transition-all flex items-center justify-between group">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 group-hover:text-brand-500">{Icons.Printer}</div>
                                <div className="text-left"><span className="block font-bold text-slate-700 dark:text-slate-200">Manutenção Zebra</span><span className="text-xs text-slate-500">Impressoras térmicas</span></div>
                            </div>
                        </button>
                    </div>

                    <div>
                        <h3 className="text-lg font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">{Icons.Server} Fila de Atendimento</h3>
                        {activeTickets.length === 0 ? (
                            <div className="border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-12 text-center">
                                <p className="text-slate-400 font-medium">Nenhum chamado ativo no momento.</p>
                                <p className="text-xs text-slate-500 mt-1">Inicie um novo atendimento acima.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {activeTickets.map(function(ticket) {
                                    var meta = (ticket.data && ticket.data.meta) || {};
                                    var pct = calcProgress(ticket.data && ticket.data.items);
                                    var nomeAtivo = meta.maquina || meta.ativo || "Sem Identificação";
                                    
                                    return (
                                        <div key={ticket.id} onClick={function() { onOpenTicket(ticket.id); }} className="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-5 hover:shadow-lg hover:border-brand-400 dark:hover:border-brand-500 transition-all cursor-pointer relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-1 h-full bg-brand-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                            <div className="flex justify-between items-start mb-3">
                                                <Badge color={ticket.type === 'formatacao' ? 'blue' : 'amber'}>{ticket.type}</Badge>
                                                <span className="text-xs font-mono font-bold text-slate-400">#{ticket.visualId}</span>
                                            </div>
                                            <h4 className="font-bold text-slate-800 dark:text-white text-lg truncate mb-1">{nomeAtivo}</h4>
                                            <p className="text-xs text-slate-500 mb-4 flex items-center gap-1">{Icons.User} {meta.tecnico || 'Técnico'}</p>
                                            
                                            <div className="flex items-center gap-3">
                                                <div className="flex-1 h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                    <div className={"h-full " + (pct === 100 ? "bg-emerald-500" : "bg-brand-500")} style={{width: pct + '%'}}></div>
                                                </div>
                                                <span className="text-xs font-bold text-brand-600">{pct}%</span>
                                            </div>
                                            <button onClick={function(e) { onDeleteTicket(e, ticket.id); }} className="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition-colors opacity-0 group-hover:opacity-100">{Icons.Trash}</button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        var HistoryView = function(props) {
            var history = props.history || [];
            var searchState = useState('');
            var search = searchState[0], setSearch = searchState[1];

            var filtered = history.filter(function(h) {
                return (h.ativo || '').toLowerCase().indexOf(search.toLowerCase()) !== -1 ||
                       (h.tecnico || '').toLowerCase().indexOf(search.toLowerCase()) !== -1 ||
                       (h.visualId && h.visualId.toLowerCase().indexOf(search.toLowerCase()) !== -1);
            });

            return (
                <div className="p-6 md:p-10 h-full flex flex-col fade-in">
                    <div className="flex justify-between items-end mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white">Histórico de Atendimentos</h2>
                            <p className="text-slate-500 text-sm">Registro auditável de todas as manutenções.</p>
                        </div>
                        <div className="relative">
                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">{Icons.Search}</div>
                            <Input placeholder="Buscar por ID, Ativo..." value={search} onChange={function(e) { setSearch(e.target.value); }} className="pl-10 w-64" />
                        </div>
                    </div>
                    
                    <Card className="flex-1 overflow-hidden flex flex-col" noPadding>
                        <div className="overflow-auto flex-1">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 dark:bg-slate-800 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th className="px-6 py-3">ID</th>
                                        <th className="px-6 py-3">Data</th>
                                        <th className="px-6 py-3">Tipo</th>
                                        <th className="px-6 py-3">Ativo</th>
                                        <th className="px-6 py-3">Técnico</th>
                                        <th className="px-6 py-3 text-right">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {filtered.map(function(h, i) {
                                        return (
                                            <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                <td className="px-6 py-3 font-mono text-xs font-bold text-slate-500">#{h.visualId}</td>
                                                <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{new Date(h.date || Date.now()).toLocaleDateString()}</td>
                                                <td className="px-6 py-3"><Badge color={h.type === 'formatacao' ? 'blue' : 'amber'}>{h.type}</Badge></td>
                                                <td className="px-6 py-3 font-medium text-slate-800 dark:text-white">{h.ativo || 'N/A'}</td>
                                                <td className="px-6 py-3 text-slate-600 dark:text-slate-400">{h.tecnico || 'N/A'}</td>
                                                <td className="px-6 py-3 text-right"><span className="text-emerald-600 dark:text-emerald-400 text-xs font-bold bg-emerald-50 dark:bg-emerald-900/20 px-2 py-0.5 rounded-full">Concluído</span></td>
                                            </tr>
                                        );
                                    })}
                                    {filtered.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-slate-400">Nenhum registro encontrado.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        var App = function() {
            var viewState = useState('login');
            var view = viewState[0], setView = viewState[1];
            var userState = useState(null);
            var currentUser = userState[0], setCurrentUser = userState[1];
            var usersState = useState(DEFAULT_TEAM);
            var users = usersState[0], setUsers = usersState[1];
            var ticketsState = useState([]);
            var activeTickets = ticketsState[0], setActiveTickets = ticketsState[1];
            var historyState = useState([]);
            var history = historyState[0], setHistory = historyState[1];
            var logoState = useState('');
            var logo = logoState[0], setLogo = logoState[1];
            var curTicketState = useState(null);
            var currentTicketId = curTicketState[0], setCurrentTicketId = curTicketState[1];
            var darkState = useState(true);
            var darkMode = darkState[0], setDarkMode = darkState[1];
            var cfgState = useState(false);
            var showConfig = cfgState[0], setShowConfig = cfgState[1];
            var fileInputRef = useRef(null);

            useEffect(function() {
                try {
                    var savedTheme = localStorage.getItem('sa_theme'); 
                    if (savedTheme !== null) setDarkMode(JSON.parse(savedTheme));
                    var savedLogo = localStorage.getItem('sa_logo'); 
                    if (savedLogo) setLogo(savedLogo);
                    var savedUser = localStorage.getItem('sa_user_session'); 
                    if (savedUser) { 
                        var parsed = JSON.parse(savedUser);
                        if (parsed && parsed.id) {
                            setCurrentUser(parsed); 
                            setView('dashboard'); 
                        }
                    }
                } catch(e) {
                    localStorage.removeItem('sa_user_session');
                }

                var unsubTickets = db.collection('tickets').onSnapshot(function(snap) {
                    var list = snap.docs.map(function(doc) {
                        return Object.assign({ id: doc.id }, doc.data());
                    }).filter(function(t) {
                        return t && t.data && t.data.items;
                    });
                    list.sort(function(a,b) { return new Date(b.createdAt || 0) - new Date(a.createdAt || 0); });
                    setActiveTickets(list);
                });

                var unsubHistory = db.collection('history').orderBy('date', 'desc').limit(50).onSnapshot(function(snap) {
                    setHistory(snap.docs.map(function(doc) { return Object.assign({ id: doc.id }, doc.data()); }));
                });

                var unsubUsers = db.collection('users').onSnapshot(function(snap) {
                    if (snap.empty) {
                        DEFAULT_TEAM.forEach(function(u) { db.collection('users').add(u); });
                    } else {
                        setUsers(snap.docs.map(function(doc) { return Object.assign({ docId: doc.id }, doc.data()); }));
                    }
                });

                return function() { unsubTickets(); unsubHistory(); unsubUsers(); };
            }, []);

            useEffect(function() { 
                if (darkMode) document.documentElement.classList.add('dark'); 
                else document.documentElement.classList.remove('dark'); 
                localStorage.setItem('sa_theme', JSON.stringify(darkMode)); 
            }, [darkMode]);

            var handleLogin = function(user) { 
                setCurrentUser(user); 
                localStorage.setItem('sa_user_session', JSON.stringify(user)); 
                setView('dashboard'); 
            };

            var handleLogout = function() { 
                setCurrentUser(null); 
                localStorage.removeItem('sa_user_session'); 
                setView('login'); 
            };
            
            var handleCreateTicket = function(type) {
                var prefix = type === 'formatacao' ? 'F' : 'Z';
                var seq = Math.floor(1000 + Math.random() * 9000);
                var newTicket = {
                    visualId: prefix + '-' + seq,
                    type: type,
                    data: getTemplate(type, currentUser ? currentUser.name : ''),
                    createdAt: new Date().toISOString()
                };
                db.collection('tickets').add(newTicket).then(function(docRef) {
                    setCurrentTicketId(docRef.id);
                    setView('checklist');
                }).catch(function(err) {
                    alert("Erro ao abrir chamado: " + err.message);
                });
            };

            var handleUpdateTicket = function(newData) { 
                if (currentTicketId) db.collection('tickets').doc(currentTicketId).update({ data: newData }); 
            };
            
            var handleArchive = function(ticket) {
                if (!ticket) return;
                var meta = (ticket.data && ticket.data.meta) || {};
                db.collection('history').add({ 
                    visualId: ticket.visualId, 
                    type: ticket.type, 
                    date: new Date().toISOString(), 
                    tecnico: meta.tecnico || 'N/A', 
                    ativo: meta.ativo || meta.maquina || "N/A", 
                    data: ticket.data 
                }).then(function() {
                    return db.collection('tickets').doc(ticket.id).delete();
                }).then(function() {
                    setCurrentTicketId(null);
                    setView('dashboard');
                });
            };
            
            var handleDeleteActive = function(e, id) { 
                e.stopPropagation(); 
                if (confirm("Cancelar chamado?")) db.collection('tickets').doc(id).delete(); 
            };

            var handleLogoUpload = function(e) { 
                var f = e.target.files && e.target.files[0]; 
                if (f) { 
                    var r = new FileReader(); 
                    r.onloadend = function() { 
                        setLogo(r.result); 
                        localStorage.setItem('sa_logo', r.result); 
                    }; 
                    r.readAsDataURL(f); 
                }
            };

            if (view === 'login') return <LoginScreen onLogin={handleLogin} users={users} />;

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-200">
                    <aside className="w-64 bg-slate-900 text-slate-300 hidden md:flex flex-col border-r border-slate-800 z-20 shrink-0">
                        <div className="h-16 flex items-center gap-3 px-6 font-bold text-white tracking-wide border-b border-slate-800">
                            <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            INFRA CHECK
                        </div>
                        <nav className="flex-1 py-6 px-3 space-y-1">
                            <button onClick={function() { setView('dashboard'); }} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'dashboard' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                {Icons.Layout} Dashboard
                            </button>
                            <button onClick={function() { setView('history'); }} className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors font-medium text-sm " + (view === 'history' ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/20' : 'hover:bg-slate-800 text-slate-400 hover:text-white')}>
                                {Icons.History} Histórico
                            </button>
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="flex items-center gap-3 mb-4 px-2">
                                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">
                                    {currentUser && currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U'}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-sm font-bold text-white truncate">{currentUser ? currentUser.name : ''}</p>
                                    <p className="text-xs text-slate-500 font-mono">ID: {currentUser ? currentUser.id : ''}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <button title="Alternar tema" onClick={function() { setDarkMode(!darkMode); }} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-yellow-400 transition-colors flex justify-center">{darkMode ? Icons.Sun : Icons.Moon}</button>
                                <button title="Gerenciar Equipe" onClick={function() { setShowConfig(true); }} className="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-colors flex justify-center">{Icons.Settings}</button>
                                <button title="Sair" onClick={handleLogout} className="p-2 rounded bg-red-900/20 hover:bg-red-900/40 text-red-400 transition-colors flex justify-center">{Icons.LogOut}</button>
                            </div>
                            <div className="mt-4 pt-4 border-t border-slate-800 text-center">
                                <p className="text-[10px] text-slate-600 cursor-pointer hover:text-slate-400" onClick={function() { if (fileInputRef.current) fileInputRef.current.click(); }}>Alterar Logo</p>
                                <input type="file" ref={fileInputRef} onChange={handleLogoUpload} className="hidden" accept="image/*" />
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 bg-slate-100 dark:bg-slate-950">
                        <div className="md:hidden h-16 bg-slate-900 text-white flex items-center justify-between px-4 shrink-0">
                            <span className="font-bold">INFRA CHECK</span>
                            <div className="flex gap-2">
                                <button onClick={function() { setShowConfig(true); }} className="p-2">{Icons.Settings}</button>
                                <button onClick={function() { setView('dashboard'); }} className="p-2">{Icons.Layout}</button>
                                <button onClick={handleLogout} className="p-2">{Icons.LogOut}</button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-auto relative">
                            {showConfig && <ConfigModal onClose={function() { setShowConfig(false); }} users={users} currentUser={currentUser} />}
                            {view === 'dashboard' && <Dashboard activeTickets={activeTickets} onNewTicket={handleCreateTicket} onOpenTicket={function(id) { setCurrentTicketId(id); setView('checklist'); }} onDeleteTicket={handleDeleteActive} historyCount={history.length} />}
                            {view === 'checklist' && <ActiveChecklist ticket={activeTickets.find(function(t) { return t.id === currentTicketId; })} onUpdate={handleUpdateTicket} onBack={function() { setView('dashboard'); }} onRequestFinish={function() { setView('receipt'); }} />}
                            {view === 'receipt' && <ReceiptView ticket={activeTickets.find(function(t) { return t.id === currentTicketId; })} onBack={function() { setView('checklist'); }} onArchive={handleArchive} logo={logo} />}
                            {view === 'history' && <HistoryView history={history} />}
                        </div>
                    </main>
                </div>
            );
        };

        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
